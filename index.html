}

/* The Dashboard's top (feedback #19, "more sleek, multi-dimensional"): the
   week in four numbers, the last eight weeks as one line per direction, and
   every direction against every stage as a grid that opens the map on that
   slice. Below it, the rows stay for detail.

   Colour: the lines and the grid's row marks are direction hues (identity);
   counts are grey, because a number is not an instruction. Shape doubles the
   hue (dirMark) so the lines part for someone who cannot tell the hues apart. */
const DASH_WEEKS = 8;
const sentOn = j => listOf(j,'events').filter(e=>e.kind==='sent').map(e=>String(e.on).slice(0,10)).sort()[0] || j.date_applied || '';
function dashTop(p){
  const jobs=p.jobs, tracks=p.profile.tracks||[], multi=tracks.length>1, T=today(), W=DASH_WEEKS;
  const ids = multi ? tracks.map(t=>t.id) : [''];
  const idOf = j => multi ? dirKey(j) : '';
  // Rolling 7-day windows ending today: index W-1 is the last seven days.
  const wk = d => { const n=dayDiff(String(d).slice(0,10), T); return n>=0 && n<W*7 ? W-1-Math.floor(n/7) : -1; };
  const dayAgo = n => new Date(Date.parse(T)-n*86400000).toISOString().slice(0,10);
  const S={}; ids.forEach(id=>S[id]={ sent:Array(W).fill(0), back:Array(W).fill(0) });
  jobs.forEach(j=>{ const s=S[idOf(j)]; if(!s) return;
    const so=sentOn(j); if(so){ const w=wk(so); if(w>=0) s.sent[w]++; }
    listOf(j,'events').forEach(e=>{ if(e.kind==='reply'){ const w=wk(e.on); if(w>=0) s.back[w]++; } }); });
  const sum=(k,w)=>ids.reduce((n,id)=>n+S[id][k][w],0);
  const sentAll=jobs.filter(j=>sentOn(j)).length;
  const backAll=jobs.filter(j=>stOf(j)==='live'||listOf(j,'events').some(e=>e.kind==='reply')).length;
  const waiting=jobs.filter(j=>isOpen(j)&&stOf(j)==='new').length;
  const delta=(a,b)=>a===b?'same as the week before':`${a>b?'up':'down'} from ${b} the week before`;
  const tile=(n,l,sub)=>`<div class="dstat"><div class="num">${n}</div><div class="dl">${l}</div><div class="ds">${sub}</div></div>`;
  const stats=`<div class="dstats">
    ${tile(sum('sent',W-1),'sent this week',delta(sum('sent',W-1),sum('sent',W-2)))}
    ${tile(sum('back',W-1),'replies this week',delta(sum('back',W-1),sum('back',W-2)))}
    ${tile(sentAll?Math.round(backAll/sentAll*100)+'%':'—','reply rate',sentAll?`${backAll} of ${sentAll} sent, ever`:'nothing sent yet')}
    ${tile(waiting,'waiting on you','scored, not yet decided')}</div>`;

  // ── eight weeks, one line per direction ──
  const VW=560, VH=210, L=34, R=118, Tp=14, B=28, pw=VW-L-R, ph=VH-Tp-B;
  const max=Math.max(1,...ids.flatMap(id=>S[id].sent)), step=Math.max(1,Math.round(niceStep(max)||1)),   // counts: whole steps only
    top=Math.ceil(max/step)*step;
  const X=i=>L+i*pw/(W-1), Y=v=>Tp+ph-(v/top)*ph;
  const col=id=>multi?`var(--dir-${dirIdx(id)})`:'var(--text)';
  const lab=id=>multi?dirLabel(id):'All directions';
  let g='';
  for(let v=0; v<=top+1e-9; v+=step) g+=`<line x1="${L}" x2="${L+pw}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--hair)" stroke-width="1"/>
    <text x="${L-8}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" class="dax">${+v.toFixed(1)}</text>`;
  for(let i=0;i<W;i++) g+=`<text x="${X(i).toFixed(1)}" y="${VH-8}" text-anchor="middle" class="dax">${i===W-1?'this wk':mmdd(dayAgo((W-1-i)*7+6))}</text>`;
  // Direct labels at the line ends, nudged apart so two equal lines do not overprint.
  const ends=ids.map(id=>({id,y:Y(S[id].sent[W-1])})).sort((a,b)=>a.y-b.y);
  for(let k=1;k<ends.length;k++) if(ends[k].y-ends[k-1].y<13) ends[k].y=ends[k-1].y+13;
  ids.forEach(id=>{
    const s=S[id], pts=s.sent.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    g+=`<polyline points="${pts}" fill="none" stroke="${col(id)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.sent.forEach((v,i)=>{
      const tip=`${lab(id)} · week to ${mmdd(dayAgo((W-1-i)*7))}: ${v} sent${s.back[i]?`, ${s.back[i]} ${s.back[i]===1?'reply':'replies'}`:''}`;
      if(s.back[i]) g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="8" fill="none" stroke="${col(id)}" stroke-width="1.6"/>`;
      // The point in the direction's own shape, as on the map: two lines on the
      // same count still part by shape where their colours overlap.
      const sh=multi?dirShape(id):'circle', px=X(i), py=Y(v);
      g+= sh==='circle' ? `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="${col(id)}" stroke="var(--panel)" stroke-width="2" data-tip="${esc(tip)}"/>`
        : `<path d="${shapePath(sh,px,py,4.4)}" fill="${col(id)}" stroke="var(--panel)" stroke-width="1.5" stroke-linejoin="round" data-tip="${esc(tip)}"/>`;
      g+=`
        <circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="12" fill="transparent" data-tip="${esc(tip)}"/>`;
    });
    const e=ends.find(x=>x.id===id);
    g+=`<text x="${L+pw+10}" y="${(e.y+4).toFixed(1)}" class="dlab">${esc(lab(id).length>14?lab(id).slice(0,13)+'…':lab(id))}</text>`;
  });
  const anySent=ids.some(id=>S[id].sent.some(Boolean));
  const chart=`<div class="dpane"><div class="dch"><b>Sent each week</b><span>last ${W} weeks · a ring means a reply came that week</span></div>
    ${multi?`<div class="dleg">${ids.map(id=>`<span>${dirMark(id)}${esc(lab(id))}</span>`).join('')}</div>`:''}
    ${anySent?`<div class="dchart"><svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Applications sent per week for the last ${W} weeks">${g}</svg><div class="maptip" id="dTip" hidden></div></div>`
      :`<p class="hint" style="margin:18px 0">Nothing sent in the last ${W} weeks. Each application you mark sent draws a point here.</p>`}</div>`;

  // ── every direction against every stage ──
  const COLS=[['To decide',['decide','cold']],['Waiting',['sent']],['Overdue',['due']],['Replied',['live']],['Closed',['closed']]];
  const K=mapItems(true).map(x=>dotKeys(x.j));
  const cnt=(id,st)=>K.filter(k=>(!multi||k.dir===id)&&st.includes(k.st)).length;
  const cmax=Math.max(1,...ids.flatMap(id=>COLS.map(([,st])=>cnt(id,st))));
  const cell=(id,c)=>{ const n=cnt(id,c[1]), a=n?Math.round(8+34*n/cmax):0;
    return `<button class="dcell" ${n?'':'disabled'} data-dd="${esc(id)}" data-ds="${c[1].join(',')}" data-dl="${esc(lab(id)+' · '+c[0])}"
      style="${n?`background:color-mix(in srgb, var(--text) ${a}%, transparent)`:''}" title="${n?`Show these ${n} on the map`:'None'}"><span class="num">${n||'·'}</span></button>`; };
  const grid=`<div class="dpane"><div class="dch"><b>Where everything stands</b><span>by direction · click a number to see those on the map</span></div>
    <div class="dgrid" style="grid-template-columns:minmax(0,1.4fr) repeat(${COLS.length},minmax(0,1fr))">
      <span></span>${COLS.map(c=>`<span class="dgh">${c[0]}</span>`).join('')}
      ${ids.map(id=>`<button class="dgr" ${multi?`data-dd="${esc(id)}" data-dl="${esc(lab(id))}"`:'disabled'} title="${multi?'Show this direction on the map':''}">${dirMark(id)}<span>${esc(lab(id))}</span></button>${COLS.map(c=>cell(id,c)).join('')}`).join('')}
    </div></div>`;

  return `${stats}<div class="dpanes">${chart}${grid}</div>`;
}

function renderDash(){
  const p=P(), jobs=p.jobs;
  if(!jobs.length) return `<div class="empty">${artSvg('woman','empty-art')}<b>Nothing to summarise yet</b>
    Find some roles and this fills in: what is in the pipeline, how fresh it is, and what you have been doing.</div>`;

  const cnt=st=>jobs.filter(j=>stOf(j)===st).length;
  const nNew=cnt('new'), nSent=cnt('sent'), nLive=cnt('live'), nClosed=cnt('closed');
  const dated=jobs.filter(j=>ageOf(j)!==null);
  const week=dated.filter(j=>ageOf(j)<=7).length;
  const fortnight=dated.filter(j=>ageOf(j)<=14).length;
  const stale=dated.filter(j=>ageOf(j)>60).length;
  const undated=jobs.length-dated.length;
  const goingSoon=jobs.filter(j=>!hasHistory(j)&&j.added)
    .filter(j=>{const left=KEEP_UNTOUCHED_DAYS-dayDiff(j.added,today()); return left>=0&&left<=2;}).length;

  const feed=[];
  jobs.forEach((j,i)=>listOf(j,'events').forEach(e=>feed.push({on:e.on,kind:e.kind,text:e.text,j,i})));
  feed.sort((a,b)=>String(b.on).localeCompare(String(a.on)));



  const pct=n=>jobs.length?Math.round(n/jobs.length*100)+'%':'—';
  const go=(tab,label)=>`<button class="btn-sm" data-dashgo="${tab}">${label}</button>`;
  const stageRow=(n,title,sub,share,acc,tab,label)=>rowCard({acc, rank:n, quiet:!n, title, sub, facts:[['share',share,'quiet']], acts:go(tab,label)});
  /* The rail counts To decide for the direction that is open; this page counts
     every row. Say so, and give the open direction's number, so the two can be
     reconciled by eye instead of looking like one of them is wrong. */
  const nDir=jobs.filter(j=>isOpen(j)&&stOf(j)==='new'&&inDir(j,p)).length;
  const nCold=jobs.filter(j=>chOf(j)==='cold').length;
  const nDirs=(p.profile.tracks||[]).length;
  const bar=[[nNew,'To decide','var(--muted)'],[nSent,'Sent','var(--awaiting)'],[nLive,'In conversation','var(--go)'],[nClosed,'Closed','var(--dim)']];
  const funnel=`<div class="pbar" role="img" aria-label="${bar.map(([n,l])=>`${n} ${l}`).join(', ')}">${
      bar.filter(b=>b[0]).map(([n,l,c])=>`<i style="flex:${n};background:${c}" title="${n} ${l}"></i>`).join('')}</div>
    <div class="pbar-l">${bar.map(([n,l,c])=>`<span><i style="background:${c}"></i>${n} ${l}</span>`).join('')}</div>`;
  return `${dashTop(p)}${sectOf('','Pipeline',`Where everything stands, across ${nDirs>1?`all ${nDirs} directions`:'every row'}${nCold?` and the ${nCold} compan${nCold===1?'y':'ies'} to approach`:''}. A live conversation is worth more than any number of new rows.`,jobs.length,
      funnel
      + stageRow(nNew,'To decide',nDirs>1?`Waiting on you in every direction · ${nDir} in the one open now`:'Scored and waiting on you',pct(nNew),'','unapplied','Open')
      + stageRow(nSent,'Sent','Applied; the next move is theirs',pct(nSent),nSent?'awaiting':'','applied','Open')
      + stageRow(nLive,'In conversation','Someone replied',pct(nLive),nLive?'go':'','applied','Open')
      + stageRow(nClosed,'Closed','Answered no, or ran out',pct(nClosed),'','applied','Open'))}
    ${byDirection(p)}
    ${sectOf('','Freshness','How old the board has got. A stale posting is usually filled however well it scores.',1,
      rowCard({ rank:week, title:'Posted this week', sub:`${undated} undated · untouched rows are cleared ${KEEP_UNTOUCHED_DAYS} days after they arrive${PURGED?` · ${PURGED} went on this load`:''}${goingSoon?` · ${goingSoon} due to go within two days — act on one to keep it`:''}`,
        facts:[['last 14 days',fortnight,''],['over 60 days',stale,stale?'quiet':'quiet']] }))}
    ${sectOf('','Recent activity','Everything you have logged, newest first, across every job.',feed.length,
      feed.slice(0,14).map(e=>rowCard({ title:`${esc(e.j.company||'—')} <span style="color:var(--muted)">· ${esc(e.j.title||'')}</span>`, sub:esc(e.text||''),
        facts:[['on',esc(mmdd(e.on)),'quiet'],['what',esc(e.kind),'']], acts:`<button class="btn-sm" data-act="goto" data-i="${e.i}">Open</button>` })).join(''))
    }${feed.length?'':`<div class="empty">Nothing logged yet. Marking a job applied, or logging a note on one, writes its first line here.</div>`}`;
}

  const unappliedCount=p.jobs.filter(j=>isOpen(j)&&stOf(j)==='new'&&inDir(j,p)).length;
  const appliedCount=p.jobs.filter(j=>stOf(j)==='sent'||stOf(j)==='live').length;
  const appliedDue=p.jobs.some(isDue);

  /* On our keys the first click reads the free corpus and the paid boards are a
     second, separate one. With an own Apify token there is no credit of ours to

    ${[['unapplied','viewDecide','list','To decide',`${unappliedCount} waiting · ${doneToday} of ${DAY_FLOOR} sent today`],

       ['you','viewYou','user','You','profile, CVs, analytics']].map(([t,id,icn,lab,sub])=>{

  const prof=P().profile;
  const d=modal(`<div class="eyebrow">New direction</div>

  const run=async()=>{
    const v=d.querySelector('#tIn').value.trim();

    d.querySelector('#tGo').disabled=true;

/* ═══ the work model ═══
   What a person values at work and where they would thrive -- measured the way
   the research says it can be, not as either/or labels:
     1. Values: pick the 3 that matter most and the 2 that matter least, from 14.
        Choosing, not rating 1-5, because on a scale everything comes out
        "important" (Combrinck 2024; Chi et al. 2018 tie that flat profile to
        career indecision, the very thing people come here with). A value can
        be marked non-negotiable.
     2. Culture: 18 plain descriptions of a workplace, each sorted into must
        have / good / don't mind / avoid -- a profile, as in the Organizational
        Culture Profile (O'Reilly, Chatman & Caldwell 1991), where fit is a
        person's profile compared with the organisation's on the SAME items.
        "Must have" is capped at 5 for the same reason as above.
   Stored on the profile (profile.work), which the row sync carries in extras.
   Only workSummary() -- plain sentences -- is ever sent to the AI; the raw
   choices stay in the account. */
const WORK_VALUES = [
  ['income','Good pay'], ['security','Security and stability'], ['autonomy','Deciding how I work'],
  ['challenge','Challenging work'], ['creativity','Room to create'], ['variety','Variety, not routine'],
  ['people','Good people to work with'], ['manager','A supportive manager'], ['flexibility','Flexible hours or place'],
  ['recognition','Recognition and status'], ['purpose','Work that does good'], ['learning','Learning and growing'],
  ['achievement','Seeing what I achieved'], ['home','Staying close to home'],
];
const CULTURE_ITEMS = [
  ['trust','You are trusted to decide things yourself'], ['careful','Careful, by-the-book work where details matter'],
  ['caring','People look out for each other'], ['results','Results are what count'], ['new','Always trying something new'],
  ['calm','Calm and predictable'], ['deadlines','Fast, with tight deadlines'], ['team','Working closely as a team'],
  ['solo','Mostly working on your own'], ['roles','Clear roles and a clear boss'], ['flat','Flat: anyone can speak up'],
  ['competitive','Competitive: the best get ahead'], ['fair','Fair, open pay and decisions'], ['mentor','Mentoring and room to learn'],
  ['cause','The work serves a cause or a community'], ['field','Out in the field, travelling, meeting people'],
  ['remote','Remote or flexible hours'], ['craft','Creative freedom: your own style shows'],
];
const CULTURE_SORTS = [['must','Must have'],['good','Good'],['','Don’t mind'],['avoid','Avoid']];
const MUST_MAX = 5;
function workOf(pr){
  const w=(pr&&pr.work&&typeof pr.work==='object')?pr.work:{};
  const ok=k=>WORK_VALUES.some(v=>v[0]===k), okC=k=>CULTURE_ITEMS.some(c=>c[0]===k);
  const v=w.values||{};
  return {
    values: { top:(v.top||[]).filter(ok).slice(0,3), bottom:(v.bottom||[]).filter(ok).slice(0,2), must:(v.must||[]).filter(ok) },
    culture: Object.fromEntries(Object.entries(w.culture||{}).filter(([k,s])=>okC(k)&&['must','good','avoid'].includes(s))),
  };
}
const workSet = pr => { const w=workOf(pr); return w.values.top.length>0 || Object.keys(w.culture).length>0; };
const labelOf = (list,k) => (list.find(x=>x[0]===k)||[k,k])[1];
/* The plain sentences the person sees and the AI gets. */
function workSummary(pr){
  const lc=t=>t.charAt(0).toLowerCase()+t.slice(1);   // "Deciding how I work" -> "deciding how I work", not "i"
  const w=workOf(pr), out=[], L=k=>lc(labelOf(WORK_VALUES,k)), C=k=>lc(labelOf(CULTURE_ITEMS,k));
  if(w.values.top.length) out.push('Matters most: '+w.values.top.map(k=>L(k)+(w.values.must.includes(k)?' (non-negotiable)':'')).join(', '));
  if(w.values.bottom.length) out.push('Matters least: '+w.values.bottom.map(L).join(', '));
  const by=s=>Object.entries(w.culture).filter(([,x])=>x===s).map(([k])=>C(k));
  if(by('must').length) out.push('Must have: '+by('must').join('; '));
  if(by('good').length) out.push('Would like: '+by('good').join('; '));
  if(by('avoid').length) out.push('Avoid: '+by('avoid').join('; '));
  return out;
}

function workModelDialog(){
  const p=P(); if(!p) return;
  const prof=p.profile, w=workOf(prof);
  track('workmodel_open');
  const d=modal(`<div class="eyebrow">Your work model</div>
    <h2 style="margin:6px 0 4px">What matters to you, and where you would thrive</h2>
    <p style="color:var(--muted);font-size:12px;margin:0 0 12px">About two minutes. It decides which companies we suggest and how we explain them. Only a plain summary of it is ever sent to the AI.</p>
    <div id="wmBody"></div>
    <div class="btn-row" style="margin-top:14px"><button class="btn-go btn-sm" id="wmSave">Save</button>
      <button class="btn-sm" onclick="this.closest('.modal').remove()">Cancel</button></div>`);
  const draw=()=>{
    const stepTop=w.values.top.length<3;
    d.querySelector('#wmBody').innerHTML=`
      <div class="eyebrow">1 · ${stepTop?`Tap the 3 that matter most to you (${w.values.top.length}/3)`:`Now the 2 that matter least (${w.values.bottom.length}/2)`}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">${WORK_VALUES.map(([k,lab])=>{
        const top=w.values.top.includes(k), bot=w.values.bottom.includes(k);
        return `<button type="button" class="pill2 ${top?'go':bot?'due':''}" data-wv="${k}" style="cursor:pointer;padding:6px 10px">${esc(lab)}${top?' ↑':bot?' ↓':''}</button>`;
      }).join('')}</div>
      ${w.values.top.length?`<div class="hint" style="margin-bottom:6px">Any you could not do without? ${w.values.top.map(k=>
        `<label style="margin-right:10px;cursor:pointer"><input type="checkbox" data-must="${k}" ${w.values.must.includes(k)?'checked':''}> ${esc(labelOf(WORK_VALUES,k))}</label>`).join('')}</div>`:''}
      <div class="eyebrow" style="margin-top:16px">2 · Sort each one — "must have" at most ${MUST_MAX}</div>
      <div style="margin-top:6px">${CULTURE_ITEMS.map(([k,lab])=>`<div class="pfact" style="align-items:center;flex-wrap:wrap;gap:6px">
        <span style="flex:1 1 230px">${esc(lab)}</span>
        <div class="segs">${CULTURE_SORTS.map(([s,sl])=>`<button type="button" class="seg ${(w.culture[k]||'')===s?'on':''}" data-cs="${k}:${s}">${esc(sl)}</button>`).join('')}</div></div>`).join('')}</div>
      <div class="hint" id="wmMsg"></div>`;
    d.querySelectorAll('[data-wv]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.wv, V=w.values;
      if(V.top.includes(k)){ V.top=V.top.filter(x=>x!==k); V.must=V.must.filter(x=>x!==k); }
      else if(V.bottom.includes(k)) V.bottom=V.bottom.filter(x=>x!==k);
      else if(V.top.length<3) V.top.push(k);
      else if(V.bottom.length<2) V.bottom.push(k);
      draw();
    });
    d.querySelectorAll('[data-must]').forEach(c=>c.onchange=()=>{ const k=c.dataset.must;
      w.values.must = c.checked ? [...new Set(w.values.must.concat(k))] : w.values.must.filter(x=>x!==k); });
    d.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{
      const [k,s]=b.dataset.cs.split(':');
      if(s==='must' && w.culture[k]!=='must' && Object.values(w.culture).filter(x=>x==='must').length>=MUST_MAX){
        d.querySelector('#wmMsg').textContent=`"Must have" is full at ${MUST_MAX} — move one to "Good" first. If everything is a must, nothing is.`; return; }
      if(s) w.culture[k]=s; else delete w.culture[k];
      draw();
    });
  };
  draw();
  d.querySelector('#wmSave').onclick=async()=>{
    prof.work=w;
    track('workmodel_saved',{ top:w.values.top.length, bottom:w.values.bottom.length, must:w.values.must.length, sorted:Object.keys(w.culture).length });
    d.remove(); await save(); render();
  };
}

/* ═══ companies ═══
   Work that is never advertised is reached through a company and, best of all,
   through someone who already works there. This is the front door for it: the
   companies worth approaching, with the warm path into each one first.

   The person's own LinkedIn connections are the network. LinkedIn lets anyone
   download them (Settings → Data privacy → Get a copy of your data →
   Connections), and the file is read in THIS browser and kept here: those are
   other people's names, and nothing about them is uploaded or shared.
   ponytail: per browser, so a second device needs the file again; keep it in
   the account only if people ask for that. */
const connKey = () => 'triage:conns:' + ((USER && USER.id) || 'local');
function loadConns(){ try{ return JSON.parse(localStorage.getItem(connKey())||'[]'); }catch(e){ return []; } }
function saveConns(list){ try{ localStorage.setItem(connKey(), JSON.stringify(list)); return true; }catch(e){ return false; } }
/* "Acme Technologies Pvt. Ltd." and "ACME" are one employer. */
const CO_SUFFIX = /\b(pvt|private|ltd|limited|llp|llc|inc|corp|corporation|co|company|the|india|technologies|technology|tech|solutions|services|group|global|international|consulting)\b/g;
const normCo = s => String(s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').replace(CO_SUFFIX,' ').replace(/\s+/g,' ').trim();
/* LinkedIn's Connections.csv: a few lines of notes, then a header row with
   First Name, Last Name, URL, Email Address, Company, Position, Connected On.
   Email is dropped on purpose -- it is rarely there and never needed. */
function parseConnections(text){
  const rows = parseCSV(text);
  const h = rows.findIndex(r => r.some(c=>/^\s*first name\s*$/i.test(c)) && r.some(c=>/^\s*company\s*$/i.test(c)));
  if(h < 0) return null;
  const col = n => rows[h].findIndex(c => c.trim().toLowerCase() === n);
  const [fn, ln, url, co, pos, on] = ['first name','last name','url','company','position','connected on'].map(col);
  return rows.slice(h+1).map(r => ({ n: [r[fn],r[ln]].filter(Boolean).join(' ').trim(), c: (r[co]||'').trim(),
    p: (r[pos]||'').trim(), u: /^https?:\/\//.test(r[url]||'') ? r[url].trim() : '', d: (r[on]||'').trim() }))
    .filter(x => x.n && x.c);
}
/* Who the person knows at a company. */
function warmFor(company, conns){
  const k = normCo(company); if(!k) return [];
  return conns.filter(x => normCo(x.c) === k);
}
/* Companies in the network worth a look for this direction: more people there,
   and people whose job titles share words with the direction, rank higher. */
function networkCompanies(conns, trk, skip){
  const words = new Set([].concat(trk.titles||[], [trk.label||'']).join(' ').toLowerCase().split(/[^a-z]+/).filter(w=>w.length>3));
  const by = new Map();
  conns.forEach(x => { const k = normCo(x.c); if(!k || skip.has(k)) return; if(!by.has(k)) by.set(k, { name:x.c, people:[] }); by.get(k).people.push(x); });
  return [...by.values()].map(g => ({ ...g, score: g.people.length + 2*g.people.filter(x => String(x.p).toLowerCase().split(/[^a-z]+/).some(w => words.has(w))).length }))
    .sort((a,b) => b.score - a.score);
}

/* What a company is doing now and how it works, from what it publishes.
   The server fetches the public pages (company_pulse); one AI call here reads
   them. Two rules keep it honest:
     - a "how they work" item is kept only if its quote is really in the text
       that was fetched -- a model that invents a quote loses the item;
     - nothing is read that is not free and allowed (no LinkedIn, X, Facebook).
   Kept on the company row as j.pulse (text) and j.site, which jobRow carries in
   extras. Weekly is often enough: a company's news does not move daily. */
const PULSE_STALE_DAYS = 7;
/* Output limits on these calls are deliberately generous. The model's hidden
   reasoning is counted against the same limit as its reply, so a "short
   answer" call capped at 40 or 700 tokens came back with no reply at all
   (measured 2026-10-17: 40 failed, 400 answered). Only tokens actually
   produced are charged, so a high cap costs nothing extra. */
const pulseOf = j => { try{ return j && j.pulse ? JSON.parse(j.pulse) : null; }catch(e){ return null; } };
const pulseStale = j => { const p=pulseOf(j); return !p || !p.at || dayDiff(p.at, today()) >= PULSE_STALE_DAYS; };
/* How well a company's observed ways of working fit the person's sorts:
   their musts count double, goods once, anything they avoid heavily against. */
function cultureFit(pulse, pr){
  if(!pulse || !(pulse.culture||[]).length) return null;
  const c=workOf(pr).culture; let s=0;
  pulse.culture.forEach(x=>{ const v=c[x.k]; s += v==='must'?2 : v==='good'?1 : v==='avoid'?-3 : 0; });
  return s;
}
async function pulseCompany(i, quiet){
  const p=P(), j=p&&p.jobs[i]; if(!j) return;
  const say=t=>{ if(!quiet) setInfo(t); };
  try{
    if(!j.site){
      say('Finding '+j.company+'’s website…');
      const ans=String(await claude(`What is the official website of the organisation "${j.company}"${j.location?` (${j.location})`:''}? Reply with the bare domain only, e.g. example.org -- or the single word unknown if you are not sure. Never guess.`, 600)||'').trim().toLowerCase();
      const dom=(ans.match(/[a-z0-9-]+(\.[a-z0-9-]+)+/)||[])[0];
      if(!dom || /unknown/.test(ans)){ j.pulse=JSON.stringify({ at:today(), error:'no website found — add it' }); await save(); render(); return; }
      j.site=dom;
    }
    say('Reading what '+j.company+' has published…');
    const raw=await hosted('company_pulse',{ company:j.company, site:j.site });
    const src=[raw.about&&`ABOUT: ${raw.about}`,
      raw.careers&&`CAREERS PAGE: ${raw.careers.text}`,
      ...(raw.news||[]).map(n=>`NEWS ${n.date} (${n.source||'news'}): ${n.title}`),
      ...(raw.blog||[]).map(n=>`BLOG ${n.date}: ${n.title} — ${n.text}`),
      ...(raw.youtube||[]).map(n=>`YOUTUBE ${n.date}: ${n.title}`),
      ...(raw.telegram||[]).map(n=>`TELEGRAM ${n.date}: ${n.title}`)].filter(Boolean).join('\n').slice(0,6000);
    let r={ now:[], culture:[], activity:'unknown', summary:'' };
    const trk=(p.profile.tracks||[]).find(t=>t.id===p.track)||{};
    const forWhom=[trk.label, (trk.titles||[]).slice(0,5).join(', '), p.profile.headline].filter(Boolean).join(' — ');
    if(src.trim()){
      const txt=await claude(`Read what one organisation has published recently and report ONLY what the text says.

ORGANISATION: ${j.company}
TODAY: ${today()}
TEXT:
${src}

WAYS OF WORKING to look for (use these keys only): ${CULTURE_ITEMS.map(([k,l])=>k+'='+l).join('; ')}

Return ONLY JSON:
{"now":[{"what":"something happening now that would make them need help or hire: hiring, a new programme, a campaign, an event, funding -- max 14 words","when":"YYYY-MM-DD or month","source":"news|blog|careers|youtube|telegram","fits":"true ONLY when it is an opening, project or need that this person could fill: ${forWhom}"}],
 "culture":[{"k":"exactly one of: ${CULTURE_ITEMS.map(c=>c[0]).join('|')} -- the organisation's own value names are NOT keys; map each to the nearest key","quote":"the EXACT words from the text that show it, max 15 words"}],
 "activity":"weekly|monthly|quiet|unknown -- how often they publish, judged from the dates",
 "summary":"one line, max 20 words: what they are doing now"}
Rules: at most 3 "now" items, newest first, nothing older than 60 days. Ignore any item that is about something else sharing the name (news searches match words, not organisations). A culture item needs an exact quote from the TEXT; if none, leave it out. Never use outside knowledge.`, TOK_CAP);
      const d=grabJSON(txt)||{};
      const flat=src.toLowerCase().replace(/\s+/g,' ');
      // What fits this person first: a Legal Executive opening tells them the
      // place is hiring, but it is not theirs to apply for.
      r={ now:(d.now||[]).filter(x=>x&&x.what).map(x=>({ ...x, fits: x.fits===true||x.fits==='true' }))
            .sort((a,b)=>b.fits-a.fits).slice(0,3),
          // A quote that is not really in the fetched text is dropped, item and all.
          culture:(d.culture||[]).filter(x=>x && CULTURE_ITEMS.some(c=>c[0]===x.k) && x.quote && flat.includes(String(x.quote).toLowerCase().replace(/\s+/g,' ').slice(0,60))).slice(0,6),
          activity:['weekly','monthly','quiet'].includes(d.activity)?d.activity:'unknown', summary:String(d.summary||'').slice(0,200) };
    }
    j.pulse=JSON.stringify({ at:today(), site:raw.site, verified:!!raw.verified, socials:raw.socials||{}, careers:raw.careers?raw.careers.url:null, ...r });
    track('pulse_read',{ now:r.now.length, culture:r.culture.length, verified:!!raw.verified });
    await save(); render(); say('');
  }catch(e){
    if(e.message==='NEEDKEY'){ keyDialog(()=>pulseCompany(i)); return; }
    j.pulse=JSON.stringify({ at:today(), error:e.message }); await save(); render();
  }
}
/* The card's account of it. */
function pulseHtml(j, pr){
  const p=pulseOf(j); if(!p) return '';
  if(p.error) return `<div class="ct-meta" style="color:var(--due)">${esc(p.error)}</div>`;
  const c=workOf(pr).culture, mark=k=>c[k]==='must'||c[k]==='good'?' ✓':c[k]==='avoid'?' ✗':'';
  const soc=Object.entries(p.socials||{}).filter(([,u])=>u).map(([k,u])=>`<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener">${esc(k)}</a>`).join(' · ');

    <div class="ct-meta">${p.site?`<a class="lnk" href="${esc(/^https?:/.test(p.site)?p.site:'https://'+p.site)}" target="_blank" rel="noopener">website</a>${p.verified?'':' (unconfirmed)'}`:''}${soc?' · '+soc:''}${p.careers?` · <a class="lnk" href="${esc(p.careers)}" target="_blank" rel="noopener">careers page</a>`:''} · ${esc(p.activity==='unknown'?'activity unknown':'posts '+p.activity)} · checked ${esc(p.at)}</div>`;

/* ═══ be found ═══
   Many roles are filled without a posting: a recruiter searches Naukri's CV
   database or LinkedIn by keyword, location and experience, and calls whoever
   comes up. So the person has to be FINDABLE, not only finding -- and the
   words to be findable by are the ones recruiters use in their own adverts.

   searchTerms reads real postings for a direction out of the shared corpus and
   counts the two- and three-word phrases that recur across them, then checks
   each against the person's own CV. Counted, not guessed: an AI never invents
   the vocabulary, it only writes the headline afterwards, from these terms and
   the CV. A term the CV does not back is shown as a gap, never as something to
   claim. */
const TERM_STOP = new Set(('a an the and or of to in on for with at by from as is are be will you your we our us this that these those it its '
  + 'who what which when where how all any can may must should would could also not no more most other such than then there their them they '
  + 'about across into over under within through per via etc including include includes based new well work working job jobs role roles team teams '
  + 'experience years year ability able strong good excellent great skills skill knowledge understanding required requirement requirements '
  + 'preferred plus nice candidate candidates position responsibilities responsibility qualifications qualification apply application applications '
  + 'opportunity opportunities company organisation organization looking join help support ensure provide using use used make making take '
  + 'equal employer employment gender race religion disability veteran status national origin regard without consideration please salary '
  + 'benefits benefit day days time full part remote office location based hours one two three first high level highly per month annum lpa rs '
  + 'pte ltd pvt llc inc ea ll ve re don li ul div class span br nbsp amp').split(/\s+/));
/* Phrases every advert uses whatever the field. Counted, they top every list
   and say nothing a recruiter would search for. */
const TERM_DROP = new Set(['originally posted','posted on himalayas','end to end','cross functional','fast paced','track record','attention to detail',
  'ad hoc','follow up','long term','short term','related field','subject matter','duties as assigned','only shortlisted','problem solving',
  'communication skills','written and verbal','verbal communication','written communication','interpersonal skills','team player','self starter',
  'go to market','day to day','best practices','key responsibilities','job description','job summary','what you','you will','we are',
  'ea license','content intro','class content intro','fast paced environment','high quality','real time','well as','as well']);
/* Is this posting really in the direction? search_index matches loosely --
   "festival programmer" returned cooks and clinic staff -- so a posting counts
   only when its title holds a whole direction title, or two of its words. */
function titleFits(postTitle, titles){
  const t=' '+String(postTitle||'').toLowerCase().replace(/[^a-z0-9+#\s]/g,' ').replace(/\s+/g,' ')+' ';
  return titles.some(x=>{
    const w=String(x||'').toLowerCase().replace(/[^a-z0-9+#\s]/g,' ').split(/\s+/).filter(v=>v.length>2 && !TERM_STOP.has(v));
    if(!w.length) return false;
    if(t.includes(' '+w.join(' ')+' ')) return true;
    return w.length>1 && w.filter(v=>t.includes(' '+v+' ')).length>=2;
  });
}
function searchTerms(postings, cvText, minShare){
  const cv = ' ' + String(cvText||'').toLowerCase().replace(/[^a-z0-9+#.\s]/g,' ').replace(/\s+/g,' ') + ' ';
  const n = postings.length, seen = new Map(), titles = new Map();
  postings.forEach(p => {
    const t = String(p.title||'').toLowerCase().replace(/&[a-z#0-9]+;/g,'/').replace(/\(.*?\)|[-–|,/].*$/g,'').replace(/\b(senior|sr|junior|jr|lead|principal|associate|assistant|intern|trainee|i{1,3})\b\.?/g,'').replace(/\s+/g,' ').trim();
    if(t) titles.set(t, (titles.get(t)||0)+1);
    /* Phrases never cross a sentence, a comma or a list item: run together,
       "After Effects. Motion graphics" counted "effects motion graphics". */
    const segs = String(p.description||'').replace(/<\/?(li|p|br|div|h\d|ul|ol|tr|td)[^>]*>/gi,' . ').replace(/<[^>]*>/g,' ')
      .toLowerCase().replace(/&[a-z#0-9]+;/g,' ').split(/[.,;:!?()\n|•·]+(?=\s|$)|[,;:!?()\n|•·]+/);
    const mine = new Set();
    for(const seg of segs){
    const words = seg.replace(/[^a-z0-9+#.\s]/g,' ').split(/\s+/).map(w=>w.replace(/^\.+|\.+$/g,'')).filter(Boolean);
    for(let i=0;i<words.length;i++) for(const k of [2,3]){
      const g = words.slice(i,i+k); if(g.length<k) continue;
      if(TERM_STOP.has(g[0]) || TERM_STOP.has(g[k-1]) || g.some(w=>w.length<2 || /^\d+$/.test(w))) continue;
      const gs=g.join(' '); if(!TERM_DROP.has(gs)) mine.add(gs);
    }
    }
    mine.forEach(g => seen.set(g, (seen.get(g)||0)+1));
  });
  const floor = Math.max(3, Math.ceil(n*(minShare||0.12)));
  let terms = [...seen].filter(([,c]) => c>=floor).sort((a,b)=>b[1]-a[1]);
  /* A three-word phrase is kept only when it is one unit -- its two-word
     halves almost never appear without it, as in "adobe premiere pro" -- and
     then the halves go. Otherwise it is two phrases side by side, and goes. */
  const cnt = new Map(terms), drop = new Set();
  terms.forEach(([g,c]) => {
    const w = g.split(' '); if(w.length!==3) return;
    const halves = [w.slice(0,2).join(' '), w.slice(1).join(' ')];
    if(halves.every(h => !cnt.has(h) || c >= 0.9*cnt.get(h))) halves.forEach(h => drop.add(h));
    else drop.add(g);
  });
  terms = terms.filter(([g]) => !drop.has(g));
  return {
    postings: n,
    // Backed when the CV has the phrase, or every word of it ("Adobe Premiere"
    // and "edited in Premiere Pro" both back "premiere pro").
    terms: terms.slice(0,18).map(([g,c]) => ({ term:g, share:Math.round(100*c/n),
      have: cv.includes(' '+g+' ') || g.split(' ').every(w => cv.includes(' '+w+' ')) })),
    // A bare "manager" or "admin" is not a title anyone searches for.
    titles: [...titles].filter(([t]) => t.includes(' ')).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([t,c]) => ({ title:t, n:c })),
  };
}

/* ═══ the map ═══
   Fit up, reachability across: where every job and company sits, and the
   centre of the app. ONE plane with everything on it -- every direction,
   waiting and applied alike. The key beside it is how a slice is picked out:
   hover a line of it (a stage, an age, a direction, a kind of work) and only
   those dots stay lit; click it and the map zooms to them.
   Scroll zooms about the pointer. Drag a box and the map BECOMES that box: the axes rescale to it, and the
   step is added to the trail above the map. Click any step in the trail, or
   the zoom-out button, to go back up -- a timeline, on two axes. A dot is a
   decision: clicking it opens it in the pane beside the map, with its one
   action. The list under the map is exactly what is in view. */
let ZOOM = [];                  // the trail: [{f0,f1,r0,r1}], innermost last
let KEYOPEN = (()=>{ try{ return localStorage.getItem('triage:mapkey')==='1'; }catch(e){ return false; } })();   // the key beside the map, remembered
const FULL = { f0:0, f1:100, r0:0, r1:100 };
let MAPSEL = null;              // a Key line clicked: {a,v,l,frame} -- the map shows only that class
let BASE = FULL;                // the frame with no zoom: the whole plane, or on a phone where the jobs are
const DOMAIN = () => ZOOM[ZOOM.length-1] || (MAPSEL && MAPSEL.frame) || BASE;
/* The frame that fits a set of jobs, padded, never narrower than 12 points. */
function fitFrame(js){
  if(!js.length) return FULL;
  const fs=js.map(fitOf), rs=js.map(reachOf), pad=6, wide=(lo,hi)=>{ let a0=Math.max(0,lo-pad), b0=Math.min(100,hi+pad);
    if(b0-a0<12){ const m=(a0+b0)/2; a0=Math.max(0,Math.min(88,m-6)); b0=a0+12; } return [a0,b0]; };
  const [f0,f1]=wide(Math.min(...fs),Math.max(...fs)), [r0,r1]=wide(Math.min(...rs),Math.max(...rs));
  return { f0, f1, r0, r1 };
}
/* Click a Key line (or a Dashboard direction): the map BECOMES that class --
   only its dots, framed to fit -- and stays so until another line is picked
   or "Everything" is. Hover still only lights; a click is a choice. */
function selectClass(a,v,l,more){
  // v may be a list (a column of the Dashboard's grid: "to decide" is two
  // stages), and `more` narrows it by a second class: {a,v}.
  const has=(k,a1,v1)=>Array.isArray(v1)?v1.includes(k[a1]):k[a1]===v1;
  const test=k=>has(k,a,v) && (!more || has(k,more.a,more.v));
  const js=mapItems(true).filter(x=>test(dotKeys(x.j))).map(x=>x.j); if(!js.length) return false;
  MAPSEL={ a, v, l, test, frame:fitFrame(js) }; ZOOM=[]; return true;
}
const isFull = D => D.f0===0 && D.f1===100 && D.r0===0 && D.r1===100;

/* The occupation families. First match wins, so the specific come before the
   general. Matched on the title, and for a company on its reasons too. Each
   pattern anchors only at the START of a word, so a stem ("fundrais",
   "journalis") matches the longer words built on it. */
const FAMILIES = [
  ['journalism','Journalism and editorial',/\b(journalis|reporter|correspondent|sub.?editor|editorial|critic|newsroom)/],
  ['film','Film, TV and video',/\b(film|video|editor|editing|post.?production|cinematograph|documentar|producer|director|motion|vfx|animator|animation)/],
  ['fundraising','Fundraising, grants and CSR',/\b(fundrais|grant|csr|donor|philanthrop)/],
  ['writing','Writing and content',/\b(content|copywrit|writer|writing|blog|technical writ|storytell)/],
  ['design','Design and UX',/\b(designer|design|ux|ui|illustrat|art director|graphic)/],
  ['arts','Arts, culture and festivals',/\b(curator|curatorial|gallery|museum|festival|arts?\b|programmer \(arts|cultural|theatre|music)/],
  ['marketing','Marketing, brand and social',/\b(marketing|brand|seo|social media|community manager|growth|campaign|performance market)/],
  ['comms','PR and communications',/\b(communications?|pr\b|public relations|media relations|spokes)/],
  ['sales','Sales and business development',/\b(sales|business development|account (executive|manager)|bd\b|partnerships?)/],
  ['support','Customer support and success',/\b(customer (support|success|service)|support executive|helpdesk)/],
  ['nonprofit','Nonprofit programmes and development',/\b(programme|program officer|ngo|nonprofit|non.profit|development sector|m&e|monitoring|evaluation|field officer|community)/],
  ['research','Research and policy',/\b(research|policy|analyst \(policy|social scien)/],
  ['education','Education and teaching',/\b(teacher|teaching|lecturer|professor|faculty|tutor|curriculum|instructional|education|trainer|academic)/],
  ['ops','Operations and administration',/\b(operations|ops\b|admin|office manager|executive assistant|coordinator|chief of staff)/],
  ['people','HR and recruitment',/\b(hr\b|human resources|recruit|talent|people (partner|ops))/],
  ['finance','Finance, accounting and banking',/\b(finance|financial|account(ant|ing)|audit|tax|bank|credit|insurance|treasury)/],
  ['product','Product and project management',/\b(product (manager|owner)|project manager|program manager|scrum|pmo)/],
  ['data','Data and AI',/\b(data|analytics|machine learning|ml\b|ai\b|artificial intelligence|automation|no.?code|llm)/],
  ['software','Software and IT',/\b(engineer|developer|software|devops|sre|cloud|security|qa\b|test|it support|backend|frontend|full.?stack)/],
  ['health','Health and care',/\b(nurse|doctor|medical|health|pharma|clinic|therap|counsel|psycholog|social worker)/],
  ['supply','Supply chain and logistics',/\b(supply chain|logistics|procurement|warehouse|fleet)/],
  ['engineering','Engineering and environment',/\b(civil|mechanical|electrical|manufactur|construction|architect|sustainab|environment|energy|agri|agro)/],
  ['legal','Legal and compliance',/\b(legal|lawyer|counsel|compliance|company secretary|paralegal)/],
];
function familyOf(j){
  const t=String((j.title||'')+' '+(chOf(j)!=='posted'?(j.description||''):'')).toLowerCase();
  for(const [k,,re] of FAMILIES) if(re.test(t)) return k;
  return 'other';
}
const familyLabel = k => (FAMILIES.find(f=>f[0]===k)||[k,'Other'])[1];
const familyShort = k => familyLabel(k).split(/[ ,]/)[0];   // "Film", "Nonprofit", "PR" -- for the map itself

/* Everything on the map: every scored job still open, and everything ever
   applied to (closed ones included -- they are history worth seeing). */
function mapItems(all){
  const p=P(); if(!p) return [];
  const L=p.jobs.map((j,i)=>({j,i})).filter(x=>isScored(x.j) &&
    (isOpen(x.j) || ['sent','live'].includes(stOf(x.j)) || (stOf(x.j)==='closed'&&x.j.date_applied)));
  return all || !MAPSEL ? L : L.filter(x=>MAPSEL.test(dotKeys(x.j)));
}
/* The classes the key picks out, per dot. Every one of them is also a data-
   attribute on the dot, so a hover in the key is one attribute comparison. */
function dotKeys(j){
  const st=stOf(j), ch=chOf(j), cold=ch==='cold', fb=freshBand(j);
  return { st: st==='new' ? (cold?'cold':'decide') : isDue(j) ? 'due' : st,
    fresh: st!=='new'||ch!=='posted' ? '' : fb<0 ? 'unknown' : String(fb),
    dir: dirKey(j), fam: familyOf(j), ch };
}
/* Which direction a dot is, by shape, since colour already says freshness.
   Shape AND colour, both by the direction's place in the profile, so a
   direction looks the same whichever one is picked; anything scored before
   jobs carried a direction counts as the picked one. Two cues, not one, so
   the directions still part for someone who cannot tell the hues apart. */
const DIR_SHAPES = ['circle','tri','dia','hex'];
const dirIdx = id => Math.max(0,(P().profile.tracks||[]).findIndex(t=>t.id===id)) % 4;
const dirColour = id => CV('--dir-'+dirIdx(id));
const dirKey = j => { const p=P(); return inDir(j,p) ? (p.track||'') : j.dir; };
const dirLabel = id => ((P().profile.tracks||[]).find(t=>t.id===id)||{}).label || 'Not tagged';
function dirShape(id){ return DIR_SHAPES[dirIdx(id)]; }
/* A direction's mark outside the map -- the same colour and shape as its dots,
   so a row, a card or a table line says which direction it belongs to the way
   the map does. Shown only when there is more than one direction to tell apart. */
function dirMark(id, title){
  const n=(P().profile.tracks||[]).length; if(n<2) return '';
  const sh=dirShape(id), c=`var(--dir-${dirIdx(id)})`;
  return `<svg class="dmark" width="12" height="12" viewBox="0 0 14 14" aria-hidden="true" style="color:${c}">${sh==='circle'
    ? '<circle cx="7" cy="7" r="5" fill="currentColor"/>' : `<path d="${shapePath(sh,7,7.6,4.8)}" fill="currentColor"/>`}${title?`<title>${esc(title)}</title>`:''}</svg>`;
}
/* An SVG path for a shape of radius r about (x,y). */
function shapePath(sh,x,y,r){
  const pts = n => [...Array(n)].map((_,k)=>{ const a=-Math.PI/2+(sh==='tri2'?Math.PI:0)+k*2*Math.PI/n; return `${(x+r*1.25*Math.cos(a)).toFixed(1)},${(y+r*1.25*Math.sin(a)).toFixed(1)}`; });
  return 'M'+(sh==='dia'?pts(4):sh==='hex'?pts(6):pts(3)).join('L')+'Z';
}
const inDomain = (j,D) => { const f=fitOf(j), r=reachOf(j); return f>=D.f0&&f<=D.f1&&r>=D.r0&&r<=D.r1; };
/* A dot's colour. Once applied to, it says what the job needs next, by the
   colour law. Before that, a posting is coloured by how fresh it is -- one hue,
   most vivid when newest -- and a company to approach keeps its own colour and
   shape, since it has no posting to age. No date known: a hollow grey ring. */
const FRESH_BANDS = [[3,'0–3 days'],[10,'4–10 days'],[21,'11–21 days'],[Infinity,'22+ days · closing soon']];
const freshBand = j => { const a=ageOf(j); return a===null ? -1 : FRESH_BANDS.findIndex(([max])=>a<=max); };
function dotColour(j){
  const st=stOf(j);
  if(st!=='new') return st==='live'?CV('--go') : isDue(j)?CV('--due') : st==='sent'?CV('--awaiting') : CV('--closed');
  if(chOf(j)==='cold') return CV('--cold');
  return dirColour(dirKey(j));
}
/* How solid a waiting job's dot is: freshest nearly solid, oldest a ghost.
   The outline stays full strength, so an old dot is faint but never lost. */
const FRESH_FILL = [.95,.68,.42,.2];
/* Grid steps that read as round numbers at any zoom. */
const niceStep = span => { const raw=span/4, p=Math.pow(10,Math.floor(Math.log10(raw))); const m=raw/p; return (m<1.5?1:m<3.5?2.5:m<7.5?5:10)*p; };

function plotSVG(){

      else { const x=plotXY(D.f0,vv).x;

        g+=`<text x="${x}" y="${PL.y+PL.h+15*PLK}" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="${9*PLK}" fill="${cDim}">${vv}</text>`; }

  }

    g+=`<text class="quadlabel" x="${PL.x+6}" y="${PL.y+14}">DREAM / LONG ODDS</text>`;

  }

  g+=`<text x="${PL.x+PL.w/2}" y="${PL.y+PL.h+34*PLK}" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="${10*PLK}" fill="${cAxis}">REACHABILITY</text>`;
  if(BOX){ const a=plotXY(BOX.f1,BOX.r0), b=plotXY(BOX.f0,BOX.r1);
    g+=`<rect x="${a.x}" y="${a.y}" width="${b.x-a.x}" height="${b.y-a.y}" fill="${cText}" fill-opacity=".06" stroke="${cText}" stroke-width="1" stroke-dasharray="4 3"/>`; }
  {

    });

/* The key: every class the map can pick out, counted over what is in view.
   [group, [[attr, value, swatch html, label]]] -- empty lines are left out. */
function mapKey(inView){
  const p=P(), n=(a,v)=>inView.filter(x=>x.k[a]===v).length;
  const dot=c=>`<i style="background:${c}"></i>`, sq=`<i class="sq"></i>`, ring=`<i class="hollow"></i>`;
  const tracks=p.profile.tracks||[];
  const fams=[...new Set(inView.map(x=>x.k.fam))].sort((a,b)=>n('fam',b)-n('fam',a));
  return [
    ['Where it stands', [['st','decide',dot('var(--muted)'),'To decide (colour = direction)'],['st','cold',sq,'Company to approach'],
      ['st','due',dot('var(--due)'),'Overdue — chase it'],['st','sent',dot('var(--awaiting)'),'Applied, waiting on them'],
      ['st','live',dot('var(--go)'),'In conversation'],['st','closed',dot('var(--closed)'),'Closed']]],
    ['Posted (how solid)', FRESH_BANDS.map(([,l],b)=>['fresh',String(b),`<i style="background:var(--text);opacity:${FRESH_FILL[b]};outline:1.5px solid var(--text);outline-offset:-1.5px"></i>`,l]).concat([['fresh','unknown',ring,'Date unknown']])],
    tracks.length>1 ? ['Direction', [p.track,...tracks.map(t=>t.id).filter(t=>t!==p.track)].map(id=>['dir',id,
      dirMark(id),
      dirLabel(id)+(id===p.track?' (picked)':'')])] : null,
    ['Kind of work', fams.map(f=>['fam',f,'',familyLabel(f)])],
    ['Kind of opportunity', Object.keys(OPP).map(c=>['ch',c,'',OPP[c].key])],
  ].filter(Boolean).map(([g,L])=>[g,L.map(([a,v,sw,l])=>({a,v,sw,l,n:n(a,v)})).filter(x=>x.n)]).filter(([,L])=>L.length);
}

/* The map's whole view: trail, plot with its key, and what is in view. */
function renderMap(){
  sizePlot();
  /* The newcomer looks over the edge of the map, on a tile tab, until the person
     has sent their first application. A first-times beat, so it ends there. */
  const p0=P(), peek = p0 && !p0.jobs.some(j=>stOf(j)!=='new')
    ? `<div class="map-peek" aria-hidden="true">${artSvg('boy','peek-fig')}</div>` : '';
  const D=DOMAIN(), items=mapItems().map(x=>({...x,k:dotKeys(x.j)}));
  const inView=items.filter(x=>inDomain(x.j,D)).sort((a,b)=>rankOf(b.j)-rankOf(a.j));
  // The key counts every class, chosen or not, so another line can always be picked.
  const keyItems=(MAPSEL ? mapItems(true) : mapItems()).map(x=>({...x,k:dotKeys(x.j)})).filter(x=>MAPSEL||inDomain(x.j,D));
  const r=v=>Math.round(v);
  const crumbs=[[PHONE()?'Where your jobs are':'Everything', -1]].concat(MAPSEL?[[MAPSEL.l, 0]]:[])
    .concat(ZOOM.map((z,k)=>[`fit ${r(z.f0)}–${r(z.f1)} · reach ${r(z.r0)}–${r(z.r1)}`, k+1]));
  return `<div class="plotwrap">${peek}
    <div class="plothead" style="flex-wrap:wrap;gap:8px">
      <nav class="trail" aria-label="Where you are on the map">${crumbs.map(([t,k],n)=>
        n===crumbs.length-1 ? `<b>${esc(t)}</b>` : `<a href="#" class="lnk" data-crumb="${k}">${esc(t)}</a> ›`).join(' ')}</nav>
      <div class="spacer"></div>
      <button class="btn-sm" id="mapOut" ${ZOOM.length||MAPSEL?'':'disabled'} title="Back up one step">${ZOOM.length||!MAPSEL?'Zoom out':'Show everything'}</button>
      <button class="btn-sm" data-findmore title="Search the boards for more">Find more work</button>
    </div>
    <div class="mapstage${KEYOPEN?' keyon':''}">
      <svg class="plot" id="plot" viewBox="0 0 ${PLW} 420" preserveAspectRatio="xMidYMid meet">${plotSVG()}</svg>
      <button class="keytab${KEYOPEN?' on':''}" id="keyTab" aria-expanded="${KEYOPEN}" title="What the dots mean — hover a line to pick those out; click to keep it open">Key</button>
      <div class="mapkey" id="mapKey" ${KEYOPEN?'':'hidden'}>${MAPSEL?`<button class="kz kall" data-kall>Show everything again</button>`:''}${mapKey(keyItems).map(([g,L])=>`<div class="kg"><div class="kgh">${g}</div>${
        L.map(x=>{ const on=MAPSEL&&MAPSEL.a===x.a&&MAPSEL.v===String(x.v);
          return `<button class="kz${on?' on':''}" data-hk="${x.a}:${esc(x.v)}" aria-pressed="${!!on}" title="${on?'Showing only these — click again for everything':'Show only these'}">${x.sw}<span>${esc(x.l)}</span><b class="num">${x.n}</b></button>`; }).join('')}</div>`).join('')}</div>
      <div class="maptip" id="mapTip" hidden></div>
    </div>
    <p class="hint" style="margin:6px 0 0">${PHONE()?'Pinch to zoom, drag to move once zoomed, double-tap to step back. Tap a dot to decide on it.'
      :'Scroll to zoom where the pointer is. Drag a box to zoom into it. Click a dot to decide on it.'}</p></div>
    ${!inView.length&&items.length?'<p class="hint" style="margin:8px 0 0">Nothing in this part of the map. Zoom out.</p>':''}`;
}

let BOX = null, WHEEL_T = null;
  // the box being dragged, in plot units
function bindPlot(){
  document.querySelectorAll('[data-crumb]').forEach(a=>a.onclick=e=>{ e.preventDefault(); const k=+a.dataset.crumb;
    if(k<0) MAPSEL=null;
    ZOOM = k<=0 ? [] : ZOOM.slice(0,k); render(); });
  const ka=document.querySelector('[data-kall]'); if(ka) ka.onclick=()=>{ MAPSEL=null; ZOOM=[]; render(); };
  const out=$('#mapOut'); if(out) out.onclick=()=>{ if(ZOOM.length) ZOOM.pop(); else MAPSEL=null; render(); };
  document.querySelectorAll('[data-mapsel]').forEach(r=>r.onclick=e=>{ if(e.target.closest('button')) return;
    const j=P().jobs[+r.dataset.mapsel]; if(j){ SEL_JOB=keyOf(j); render(); } });
  const svg=$('#plot'); if(!svg) return;
  /* Hover a dot: what it is, beside it. Hover a direction in the legend: its
     dots stay, the rest fade. Neither does anything a click does not already. */
  const tip=$('#mapTip'), wrap=svg.closest('.plotwrap');
  svg.addEventListener('mouseover',ev=>{
    const d=ev.target.closest('.dot'); if(!d||!tip) return;
    const j=P().jobs[+d.dataset.idx]; if(!j) return;
    const age=ageOf(j);
    tip.innerHTML=`<b>${esc(j.title)}</b><span>${esc(j.company)}${j.location?' · '+esc(j.location):''}</span>
      <span class="num">fit ${fitOf(j)} · reach ${reachOf(j)}</span>
      <span>${OPP[chOf(j)].one||(age===null?'posting date unknown':age<1?'posted today':`posted ${age} day${age===1?'':'s'} ago`)}${(P().profile.tracks||[]).length>1?' · '+esc(dirLabel(dirKey(j))):''}</span>`;
    tip.hidden=false;
    const a=d.getBoundingClientRect(), w=wrap.getBoundingClientRect();
    const left=Math.min(a.left-w.left+a.width/2+12, w.width-tip.offsetWidth-8);
    tip.style.left=Math.max(8,left)+'px'; tip.style.top=Math.max(8,a.top-w.top-tip.offsetHeight-6)+'px';
  });
  svg.addEventListener('mouseout',ev=>{ if(ev.target.closest('.dot') && tip) tip.hidden=true; });
  /* The key opens on hover over its tab and closes a moment after the pointer
     leaves both; a click pins it open (remembered) or unpins it. */
  { const kt=$('#keyTab'), kp=$('#mapKey'); let t=null;
    const peek=on=>{ clearTimeout(t); if(KEYOPEN) return;
      if(on) kp.hidden=false; else t=setTimeout(()=>{ if(!KEYOPEN) kp.hidden=true; svg.classList.remove('hl'); },250); };
    if(kt&&kp){ [kt,kp].forEach(el=>{ el.addEventListener('mouseenter',()=>peek(true)); el.addEventListener('mouseleave',()=>peek(false)); }); } }
  const kt=$('#keyTab'); if(kt) kt.onclick=()=>{ KEYOPEN=!KEYOPEN; try{ localStorage.setItem('triage:mapkey',KEYOPEN?'1':'0'); }catch(e){}
    $('#mapKey').hidden=!KEYOPEN; kt.classList.toggle('on',KEYOPEN); kt.setAttribute('aria-expanded',KEYOPEN); svg.closest('.mapstage').classList.toggle('keyon',KEYOPEN); };
  document.querySelectorAll('[data-hk]').forEach(k=>{
    const c=k.dataset.hk.indexOf(':'), a=k.dataset.hk.slice(0,c), v=k.dataset.hk.slice(c+1);
    k.onmouseenter=()=>{ svg.classList.add('hl'); svg.querySelectorAll('.dot').forEach(d=>d.classList.toggle('lit', d.dataset[a]===v)); };
    k.onmouseleave=()=>svg.classList.remove('hl');
    k.onclick=()=>{
      if(MAPSEL && MAPSEL.a===a && MAPSEL.v===v){ MAPSEL=null; ZOOM=[]; return render(); }   // the chosen line again: back to everything
      if(selectClass(a,v,k.querySelector('span').textContent)){ track('map_key_pick',{ by:a });
        if(window.innerWidth<=900) KEYOPEN=false;          // on a phone the key sits over the map: put it away
        render(); } };
  });
  let start=null;
  const toPlot=ev=>{ const pt=svg.createSVGPoint(); const t=ev.touches?ev.touches[0]:(ev.changedTouches?ev.changedTouches[0]:ev);
    pt.x=t.clientX; pt.y=t.clientY; const m=svg.getScreenCTM(); if(!m) return null;
    const q=pt.matrixTransform(m.inverse()), D=DOMAIN();
    const rx=Math.max(0,Math.min(1,(q.x-PL.x)/PL.w)), fy=Math.max(0,Math.min(1,1-(q.y-PL.y)/PL.h));
    return { r:D.r0+rx*(D.r1-D.r0), f:D.f0+fy*(D.f1-D.f0) }; };
  const down=ev=>{ if(ev.target.closest('.dot,.fam')) return; const p=toPlot(ev); if(!p) return; start=p; ev.preventDefault(); };
  const move=ev=>{ if(!start) return; const p=toPlot(ev); if(!p) return;
    BOX={f0:Math.min(start.f,p.f),f1:Math.max(start.f,p.f),r0:Math.min(start.r,p.r),r1:Math.max(start.r,p.r)}; svg.innerHTML=plotSVG(); };
  const up=()=>{ if(!start) return; start=null;
    const D=DOMAIN(), b=BOX; BOX=null;
    // A box too small to mean anything is a click on empty map, not a zoom.
    if(b && (b.f1-b.f0)>(D.f1-D.f0)*0.06 && (b.r1-b.r0)>(D.r1-D.r0)*0.06){ ZOOM.push(b); track('map_zoom',{ depth:ZOOM.length }); }
    render(); };
  svg.addEventListener('mousedown',down);
  window.onmousemove=move; window.onmouseup=up;
  /* Touch (feedback #17): two fingers pinch about their midpoint; one finger
     pans once the map is zoomed in (at the base frame it scrolls the page);
     a double tap on empty map steps back out. A gesture is one step on the
     trail, like a run of scrolling, and the list catches up when it ends. */
  const zoomedIn=()=>ZOOM.length>0;
  svg.classList.toggle('zoomed', zoomedIn());
  const toPlotD=(x,y,D)=>{ const pt=svg.createSVGPoint(); pt.x=x; pt.y=y; const m=svg.getScreenCTM(); if(!m) return null;
    const q=pt.matrixTransform(m.inverse());
    return { r:D.r0+((q.x-PL.x)/PL.w)*(D.r1-D.r0), f:D.f0+(1-(q.y-PL.y)/PL.h)*(D.f1-D.f0) }; };
  const clampSpan=(lo,hi)=>{ let w=Math.max(3,Math.min(100,hi-lo)), a=Math.max(0,Math.min(100-w,lo)); return [a,a+w]; };
  const setGesture=z=>{ const top=ZOOM[ZOOM.length-1]; if(top && top.wheel) ZOOM.pop();
    const full=z.f1-z.f0>=99.9 && z.r1-z.r0>=99.9; if(!(full && !ZOOM.length)) ZOOM.push({...z, wheel:true});
    svg.innerHTML=plotSVG(); };
  let G=null, lastTap=0;
  svg.addEventListener('touchstart',ev=>{
    const T=ev.touches, D=DOMAIN();
    if(T.length===2){
      const mx=(T[0].clientX+T[1].clientX)/2, my=(T[0].clientY+T[1].clientY)/2;
      G={ kind:'pinch', D, d0:Math.hypot(T[0].clientX-T[1].clientX, T[0].clientY-T[1].clientY)||1, p:toPlotD(mx,my,D) };
      ev.preventDefault();
    } else if(T.length===1 && zoomedIn() && !ev.target.closest('.dot')){
      G={ kind:'pan', D, p:toPlotD(T[0].clientX,T[0].clientY,D) };
    } else G=null;
  },{passive:false});
  svg.addEventListener('touchmove',ev=>{
    if(!G || !G.p) return; const T=ev.touches; ev.preventDefault();
    if(G.kind==='pinch' && T.length===2){
      const d=Math.hypot(T[0].clientX-T[1].clientX, T[0].clientY-T[1].clientY)||1, k=G.d0/d, D=G.D, p=G.p;
      const [f0,f1]=clampSpan(p.f-(p.f-D.f0)*k, p.f+(D.f1-p.f)*k), [r0,r1]=clampSpan(p.r-(p.r-D.r0)*k, p.r+(D.r1-p.r)*k);
      setGesture({f0,f1,r0,r1});
    } else if(G.kind==='pan' && T.length===1){
      const q=toPlotD(T[0].clientX,T[0].clientY,G.D); if(!q) return;
      const df=G.p.f-q.f, dr=G.p.r-q.r, D=G.D;
      const [f0,f1]=clampSpan(D.f0+df, D.f1+df), [r0,r1]=clampSpan(D.r0+dr, D.r1+dr);
      setGesture({f0,f1,r0,r1});
    }
  },{passive:false});
  svg.addEventListener('touchend',ev=>{
    if(G && ev.touches.length===0){ const kind=G.kind; G=null; track(kind==='pinch'?'map_pinch':'map_pan',{}); return render(); }
    if(ev.touches.length) return;
    // A double tap on empty map: one step back out.
    const now=Date.now(); if(!ev.target.closest('.dot') && now-lastTap<320){ lastTap=0; ev.preventDefault();
      if(ZOOM.length) ZOOM.pop(); else MAPSEL=null; return render(); }
    lastTap=now;
  });
  /* Scroll zooms about the pointer: the point under it stays put. A run of
     scrolling is ONE step on the trail (the top step is replaced while it is a
     wheel step), and the list under the map catches up once scrolling stops. */
  svg.addEventListener('wheel',ev=>{
    const p=toPlot(ev); if(!p) return; ev.preventDefault();
    const D=DOMAIN(), k=Math.exp(Math.max(-60,Math.min(60,ev.deltaY))*0.004);
    const span=(lo,hi,c)=>{ let s=Math.max(3,Math.min(100,(hi-lo)*k)), a=c-(c-lo)*s/(hi-lo); a=Math.max(0,Math.min(100-s,a)); return [a,a+s]; };
    const [f0,f1]=span(D.f0,D.f1,p.f), [r0,r1]=span(D.r0,D.r1,p.r);
    const top=ZOOM[ZOOM.length-1];
    if(top && top.wheel) ZOOM.pop();
    if(!(f1-f0>=99.9 && r1-r0>=99.9 && !ZOOM.length)) ZOOM.push({f0,f1,r0,r1,wheel:true});
    svg.innerHTML=plotSVG();
    clearTimeout(WHEEL_T); WHEEL_T=setTimeout(()=>{ track('map_wheel',{}); render(); },350);
  },{passive:false});
  svg.addEventListener('dblclick',ev=>{ if(ev.target.closest('.dot')) return; if(ZOOM.length){ ZOOM.pop(); render(); } });
  svg.addEventListener('click',ev=>{
    if(!ev.target.classList.contains('dot')) return;
    const j=P().jobs[parseInt(ev.target.dataset.idx,10)]; if(!j) return;
    SEL_JOB=keyOf(j); track('map_pick',{}); render();
  });
}

/* ═══ backup, restore, and sharing ═══
   Everything lives in this browser's storage, which is durable but not
   permanent — clearing site data wipes it, and there is no server copy. So a
   real export matters more here than it would in a hosted app.

   Keys are deliberately kept OUT of the data backup and given their own file.
   A data backup is the thing you keep and pass around; credentials are not, and
   bundling them together is how a key ends up somewhere it shouldn't be. */

function downloadFile(name, text, mime){
  const b=new Blob([text],{type:mime||'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

async function exportBackup(){
  const payload={
    kind:"triage-backup", version:3, exported:today(),
    profiles:DB.profiles, current:DB.current
  };
  downloadFile(`triage-backup-${today()}.json`, JSON.stringify(payload,null,1));
}

async function importBackup(text, mode){
  let d; try{ d=JSON.parse(text); }catch(e){ throw new Error("That isn't a valid backup file."); }
  if(d.kind!=="triage-backup"||!d.profiles) throw new Error("That JSON isn't a triage backup.");
  const incoming=Object.keys(d.profiles).length;
  if(mode==='replace'){ DB.profiles=d.profiles; DB.current=d.current||Object.keys(d.profiles)[0]||null; }
  else {
    // Merge: keep both sides. Colliding ids get a fresh one rather than
    // silently overwriting someone's work.
    Object.entries(d.profiles).forEach(([id,prof])=>{
      const key = DB.profiles[id] ? id+'_'+Math.random().toString(36).slice(2,6) : id;
      DB.profiles[key]=prof;
    });
    if(!DB.current) DB.current=Object.keys(DB.profiles)[0]||null;
  }
  await save();
  return incoming;
}

async function exportKeys(){
  if(!KEY && !APIFY){ alert("No keys saved yet \u2014 nothing to export."); return; }
  modal(`<div class="eyebrow">Send keys to a friend</div>

    <p style="color:var(--muted);font-size:13px;margin:0 0 10px">It holds your ${esc((LLM[PROV]||{}).label||PROV)} key${APIFY?' and your Apify token':''}. Anyone who has it can spend money on your account.</p>
    <p class="hint" style="margin-bottom:14px">Only send it to someone you'd hand your card to, over a channel you trust. If it ever leaks, rotate both keys immediately \u2014 that's the only fix. The safer option is to let them use their own keys, which costs them nothing to set up.</p>
    <div class="btn-row">
      <button class="btn-go btn-sm" id="kdl">I understand \u2014 download it</button>
      <button class="btn-sm" onclick="this.closest('.modal').remove()">Cancel</button></div>`)
    .querySelector('#kdl').onclick=function(){
      downloadFile('triage-keys.json', JSON.stringify({kind:"triage-keys",prov:PROV,key:KEY,apify:APIFY},null,1));
      this.closest('.modal').remove();
    };
}

async function importKeys(text){
  let d; try{ d=JSON.parse(text); }catch(e){ throw new Error("That isn't a valid keys file."); }
  if(d.kind!=="triage-keys") throw new Error("That JSON isn't a triage keys file.");
  if(d.prov) { PROV=d.prov; await put('triage:prov',PROV); }
  if(d.key)  { KEY=d.key;   await put('triage:key',KEY); }
  if(d.apify){ APIFY=d.apify; await put('triage:apify',APIFY); }
  return true;
}

/* ═══ shared bits ═══ */
function modal(html){
  const d=document.createElement('div'); d.className='modal';
  d.innerHTML=`<div class="box">${html}</div>`;
  d.addEventListener('click',e=>{ if(e.target===d) d.remove(); });
  document.body.appendChild(d); return d;
}
function hookDrop(dropEl,inputEl,handler){
  if(!dropEl) return;
  dropEl.onclick=()=>inputEl.click();
  inputEl.onchange=e=>{ const f=e.target.files[0]; if(f) readFile(f,handler); inputEl.value=''; };
  ['dragenter','dragover'].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.remove('over');}));
  dropEl.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) readFile(f,handler); });
}
function readFile(file,cb){
  if(/\.pdf$/i.test(file.name) || file.type==='application/pdf'){
    pdfText(file).then(t=>cb(t,file.name), e=>cb('',file.name,
      /scan|connection/.test(e.message) ? e : new Error(`Couldn't read that PDF (${e.message}). Try exporting it again, or paste your CV instead.`)));
    return;
  }
  const r=new FileReader(); r.onload=()=>cb(String(r.result),file.name); r.readAsText(file);
}

/* A PDF CV, read to plain text in the browser: nothing is uploaded to read it.
   pdf.js is fetched only the first time someone picks a PDF. A scanned CV is
   an image with no text layer, so it comes back empty and says so. */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function pdfText(file){
  await loadScript(PDFJS+'pdf.min.js');
  const lib=window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
  const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){
    const {items}=await (await doc.getPage(i)).getTextContent();
    pages.push(items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('').replace(/[ \t]+\n/g,'\n'));
  }
  const text=pages.join('\n\n').trim();
  if(!text) throw new Error("That PDF has no selectable text — it's probably a scan. Paste your CV instead.");
  return text;
}

async function onCsv(text){
  const rows=parseCSV(text);
  const info=$('#csvInfo');
  if(rows.length<2){ if(info) info.innerHTML='<span class="err">That file has no rows.</span>'; return; }
  const head=rows[0].map(h=>String(h).trim().toLowerCase()); const idx={};
  head.forEach((h,i)=>idx[h]=i);
  if(idx.title===undefined){ if(info) info.innerHTML='<span class="err">No "title" column. Needs at least title and company.</span>'; return; }
  let list=rows.slice(1).map(r=>{ const j=blank();
    COLS.forEach(c=>{ if(idx[c]!==undefined) j[c]=String(r[idx[c]]==null?'':r[idx[c]]).trim(); });
    if(!j.status) j.status='New'; if(!j.channel) j.channel='posted'; return j; });

  // The starter template ships with placeholder rows. People import it before
  // clearing them, then wonder why the app is recommending 'Example Corp'.
  // Drop them on the way in rather than letting them reach the scorer, which
  // costs a call to conclude what we can tell from the title.
  const isPlaceholder = j => {
    const blob=(j.title+' '+j.company).toLowerCase();
    return /delete me|example corp|example row|example cold target|somewhere you want to work|another company|^your city$/.test(blob);
  };
  const skipped = list.filter(isPlaceholder).length;
  list = list.filter(j=>!isPlaceholder(j));

  const added=addJobs(list);
  await save(); render();
  const i2=$('#csvInfo');
  if(i2){
    if(!list.length && skipped){
      i2.innerHTML='<span class="err">That was the blank template \u2014 only the example rows were in it. Replace them with real jobs, or use Search to pull some in.</span>';
    } else {
      i2.textContent=`${added} added \u00b7 ${list.length-added} already here`
        + (skipped?` \u00b7 ${skipped} example row${skipped>1?'s':''} skipped`:'');
    }
  }
  if(added) await autoScore();
}

/* Rendered into #tasks, which sits outside #root — render() replaces the whole
   of #root on every state change, and a toast that vanished mid-run would be
   worse than no toast at all. */
function renderTasks(){
  const el=$('#tasks'); if(!el) return;
  el.innerHTML=TASKS.map(t=>{
    const body=`<div class="tl">${t.state==='running'?'<span class="spin"></span> ':''}${esc(t.label)}</div>
    ${t.note?`<div class="tn">${esc(t.note)}</div>`:''}

      ${t.state==='done'&&(t.result||[]).length?`<button class="btn-go btn-sm" data-task-open="${t.id}">Review</button>`:''}
      ${(t.acts||[]).map((a,k)=>`<button class="btn-sm ${a.go?'btn-go':''}" data-task-act="${t.id}:${k}">${esc(a.label)}</button>`).join('')}
      ${t.undo?`<button class="btn-sm" data-task-undo="${t.id}">Undo</button>`:''}
      <button class="btn-sm" data-task-drop="${t.id}">${esc(t.dropLabel||'Dismiss')}</button></div>`}`;
    const cls=t.state==='done'?'done':t.state==='error'?'err':'';
    return t.art
      ? `<div class="task ${cls} art"><div class="task-art" aria-hidden="true">${artSvg(t.art,'task-fig')}</div><div class="task-main">${t.eyebrow?`<div class="eyebrow">${esc(t.eyebrow)}</div>`:''}${body}</div></div>`
      : `<div class="task ${cls}">${body}</div>`; }).join('');
  el.querySelectorAll('[data-task-open]').forEach(b=>b.onclick=()=>{
    const t=TASKS.find(x=>x.id===b.dataset.taskOpen); if(!t) return;
    dropTask(t.id); hrPick(t);
  });
  el.querySelectorAll('[data-task-undo]').forEach(b=>b.onclick=async()=>{
    const t=TASKS.find(x=>x.id===b.dataset.taskUndo); if(!t||!t.undo) return;
    dropTask(t.id); await t.undo();
  });
  el.querySelectorAll('[data-task-drop]').forEach(b=>b.onclick=()=>dropTask(b.dataset.taskDrop));
  el.querySelectorAll('[data-task-act]').forEach(b=>b.onclick=async()=>{
    const [id,k]=b.dataset.taskAct.split(':'), t=TASKS.find(x=>x.id===id);

    dropTask(id); await a.run();

}

/* ═══ the command surface ═══
   Every verb in the app in one typed list, so the sidebar stops being the only
   way to reach any of them. Each entry points at the control that already does
   the work rather than repeating it: one source of truth per verb, including
   the confirm dialogs several of them carry, and no way for a command to drift
   from the button it mirrors. A control inside a closed fold still fires -- a
   programmatic click does not care whether the element is visible. */
let PAL = null;   // null closed, else { q, sel }

function commands(){
  const list=[
    ['Go','Companies','#viewCompanies'], ['Go','To decide','#viewDecide'],
    ['Go','Applied','#viewApplied'], ['Go','Dashboard','#viewDash'],
    ['Find work', 'Search the job boards','#btnBoards'],
    /* Only exists while an offer is live, so most of the time this resolves to
       nothing -- which runCommand already answers honestly rather than failing
       silently, because a click on an absent control is the one case it checks. */
    ['Find work','Search live boards \u2014 '+BOARD_COST+' credits','#btnPaidBoards'],
    ['Find work','Suggest companies for me','#btnSuggest'],
    ['Find work','Pull a company I already know','#btnAts'],
    ['Find work','Add a job by hand','#btnPaste'],
    ['Find work','Add a company to approach','#btnCold'],
    ['Score','Score new jobs','#btnScore'],
    ['Score','Rescore everything','#btnRescore'],
    ['Profile','My profile','#btnProfile'],
    ['Profile','Add a direction','#btnAddTrack'],
    ['Profile','Be found by recruiters','#btnBeFound'],
    ['Profile','My work model','#btnWorkModel'],
    ['Profile','Switch profile','#btnSwitch'],
    ['Data', KEY?'Keys':'Set up keys','#btnKey'],
    ['Data','Backup & transfer','#btnData'],
    ['Data','Export CSV','#btnExport'],
    ['Data','Trim to top '+KEEP_TOP,'#btnTrim'],
    ['Data','Clear jobs','#btnClear'],
    ['View','Theme','#btnTheme'],
    ['View','Send feedback','#fbFab']
  ].map(x=>({ g:x[0], label:x[1], el:x[2] }));
  // The four views are state rather than controls, so these set it directly.
  [['To decide','unapplied'],['Applied','applied']]
    .forEach(v=>list.push({ g:'Go to', label:v[0], run:()=>{ TAB=v[1]; render(); } }));
  list.push({ g:'Go to', label:'Companies and people to approach', run:goApproach });
  list.push({ g:'Go to', label:'You', run:()=>{ TAB='you'; YOUSUB='me'; render(); } });
  list.push({ g:'Go to', label:'Analytics (dashboard)', run:()=>{ TAB='you'; YOUSUB='stats'; render(); } });
  // The map is To decide's layer now; "Map" opens it there.
  list.push({ g:'Go to', label:'Map', run:()=>{ TAB='unapplied'; MAPON=true; SEL_JOB=null; render(); window.scrollTo(0,0); } });
  list.push({ g:'Profile', label:'What I want', run:askWants });
  if(CLOUD&&USER){
    list.push({ g:'Account', label:'Credits', el:'#btnCredits' });
    list.push({ g:'Account', label:'Sign out', el:'#btnSignOut' });
  }
  return list;
}

/* Substring over the label and its group, which is enough for a list this
   size and never surprises anyone by matching something they cannot see. */
function palHits(){
  const q=String(PAL&&PAL.q||'').trim().toLowerCase();
  const all=commands();
  return q ? all.filter(c=>(c.label+' '+c.g).toLowerCase().includes(q)) : all;
}

function openPalette(){ PAL={q:'',sel:0}; renderPalette(); }
function closePalette(){ PAL=null; renderPalette(); }

function runCommand(n){
  const c=palHits()[n]; if(!c) return;
  closePalette();
  if(c.run) return c.run();
  const b=$(c.el);
  if(!b){ alert('That one is not available on this screen.'); return; }
  /* A click on a disabled button does not fire its handler, so dispatching
     into one would be a silent no-op -- the palette would look broken rather
     than busy. The disabled state is already the honest answer; say it. */
  if(b.disabled){ alert('Not right now \u2014 a run is already going. The toast in the corner says where it is up to.'); return; }
  b.click();
}

function renderPalette(){
  const el=$('#palette'); if(!el) return;
  if(!PAL){ el.innerHTML=''; return; }
  const hits=palHits();
  if(PAL.sel>=hits.length) PAL.sel=Math.max(0,hits.length-1);
  el.innerHTML=`<div class="palscrim"></div>
    <div class="palbox" role="dialog" aria-modal="true" aria-label="Commands">
      <input id="palIn" type="text" autocomplete="off" spellcheck="false"
        placeholder="What do you want to do?" value="${esc(PAL.q)}">
      <div class="pallist">${hits.length
        ? hits.map((c,n)=>`<button class="palrow${n===PAL.sel?' on':''}" data-pal="${n}">
            <span class="plab">${esc(c.label)}</span><span class="pgrp">${esc(c.g)}</span></button>`).join('')
        : '<div class="palnone">Nothing matches that.</div>'}</div>
      <div class="palfoot"><span class="kb">↑↓</span> move · <span class="kb">↵</span> run · <span class="kb">esc</span> close</div>
    </div>`;
  const inp=$('#palIn');
  inp.focus();
  // Caret to the end rather than the whole value selected, so the next
  // keystroke continues the query instead of replacing it.
  try{ inp.setSelectionRange(PAL.q.length, PAL.q.length); }catch(e){}
  inp.oninput=()=>{ PAL.q=inp.value; PAL.sel=0; renderPalette(); };
  inp.onkeydown=e=>{
    const n=palHits().length;
    if(e.key==='Escape'){ e.preventDefault(); closePalette(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); PAL.sel=Math.min(PAL.sel+1,n-1); renderPalette(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); PAL.sel=Math.max(PAL.sel-1,0); renderPalette(); }
    else if(e.key==='Enter'){ e.preventDefault(); runCommand(PAL.sel); }
  };
  el.querySelector('.palscrim').onclick=closePalette;
  el.querySelectorAll('[data-pal]').forEach(b=>
    b.onclick=()=>runCommand(parseInt(b.dataset.pal,10)));
}

/* Opened from the keyboard, or from the top bar -- a shortcut alone would make

  // The Dashboard's grid: a cell is a direction narrowed to a stage; a row head is the direction.

    if(ok){ TAB='unapplied'; MAPON=true; SEL_JOB=null; track('dash_grid',{ stage:st||'' }); render(); window.scrollTo(0,0); }
    return; }

});
document.addEventListener('keydown',e=>{
  if(VIEW!=='app') return;
  // A modal is a question only the person can answer; nothing goes over it.
  if(document.querySelector('.modal')) return;
  if((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K')){
    e.preventDefault();
    if(PAL) closePalette(); else openPalette();
    return;
  }
  if(PAL) return;                 // the palette's own input owns the rest
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const typing = !!(e.target && e.target.closest
                    && e.target.closest('input,textarea,select,[contenteditable]'));
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); return openPalette(); }
  /* Topmost first: the pane sits over the drawer, so that is what escape
     means while both are open. */
  if(e.key==='Escape' && SEL_JOB){ e.preventDefault(); SEL_JOB=null; return render(); }
  if(e.key==='Escape' && TOOLS){ e.preventDefault(); TOOLS=false; return render(); }
  /* Triage from the keyboard, the desktop's swipe deck: j/k walk the list,
     Enter does the row's one thing, s saves it, x says not interested and
     moves on. All three press the row's own buttons, so they log and undo
     exactly as a click does. */
  if(TAB==='unapplied' && SEL_JOB && ['Enter','s','x'].includes(e.key)){
    const row=document.querySelector('.qitem.sel'); if(!row) return;
    const b=row.querySelector(e.key==='Enter'?'.act-primary':e.key==='s'?'[data-act="save"]':'[data-act="close"]'); if(!b) return;
    e.preventDefault();
    if(e.key==='x'){ const rows=[...document.querySelectorAll('.qitem[data-jobidx]')], k=rows.indexOf(row), nx=rows[k+1]||rows[k-1];
      const nj=nx && P().jobs[+nx.dataset.jobidx]; b.click(); track('key_triage',{ key:'x' });
      return setTimeout(()=>{ if(nj && stOf(nj)==='new'){ SEL_JOB=keyOf(nj); render(); const el=document.querySelector('.qitem.sel'); if(el) el.scrollIntoView({block:'nearest'}); } },60); }
    track('key_triage',{ key:e.key }); return b.click();
  }
  if(e.key==='j' || (e.key==='ArrowDown' && SEL_JOB)){ e.preventDefault(); return moveSel(1); }
  if(e.key==='k' || (e.key==='ArrowUp'   && SEL_JOB)){ e.preventDefault(); return moveSel(-1); }
});

/* The next row down, read off the DOM rather than recomputed. The queue's
   order is the view's: four sections in a fixed priority, each sorted, some of
   them folded away and one of them capped. Working out "the next one" from the
   data would mean reproducing all of that here and keeping the copy in step
   forever. What is on screen is the order the person sees, so ask it. */
function moveSel(dir){
  const rows=[...document.querySelectorAll('.qitem[data-jobidx]')];
  if(!rows.length) return;
  const idx=rows.map(r=>parseInt(r.dataset.jobidx,10));
  const p=P(); if(!p) return;
  const at=SEL_JOB ? idx.findIndex(i=>p.jobs[i] && keyOf(p.jobs[i])===SEL_JOB) : -1;
  // Nothing selected yet: j starts at the top of the queue, k at the bottom.
  const next = at<0 ? (dir>0 ? 0 : idx.length-1)
                    : Math.max(0, Math.min(idx.length-1, at+dir));
  const j=p.jobs[idx[next]]; if(!j) return;
  SEL_JOB=keyOf(j);
  render();
  /* 'nearest' rather than 'center': walking a list should scroll only when the
     row would otherwise be off screen, not jump the page on every keystroke. */
  const el=document.querySelector('.qitem.sel');
  if(el) el.scrollIntoView({block:'nearest'});
}

function hrRow(c,i){
  return `<label class="ct-row" style="cursor:pointer;align-items:flex-start">
    <input type="checkbox" data-hr="${i}" checked style="margin-top:4px;width:auto">

      <div class="ct-nm">${esc(c.name||'(name unknown)')}

}

/* Runs the two-actor chain in findHrContacts and lets the person pick which

function hrDialog(i){

    <p class="hint" style="margin-bottom:12px">About a cent of Apify credit, and free for the rest of the week once a company has been looked up. If search finds nobody public at this company, it says so rather than spending more to keep looking — add a name by hand instead. It runs in the background — carry on working and you'll get a note in the corner when it's done.</p>
    <div class="btn-row"><button class="${saved&&(saved.list||[]).length?'':'btn-go '}btn-sm" id="hrGo">${saved&&(saved.list||[]).length?'Search again':'Search'}</button>
      <button class="btn-sm" onclick="this.closest('.modal').remove()">Cancel</button></div>`);
  d.querySelector('#hrGo').onclick=()=>{ d.remove(); startHrSearch(i, ctx); };
