/* Who the message is from. Identical in both drafters bar the heading and
   whether the skills line is worth the tokens. */
const senderBlock=(prof,raw,heading,skills)=>`${heading}
Name: ${prof.name}
Based in: ${prof.location||''}
In short: ${prof.headline||''}
Real strengths: ${(prof.strengths||[]).join('; ')}
${prof.unusual_combination?`What is rare about them: ${prof.unusual_combination}`:''}${skills?`
Skills: ${(prof.hard_skills||[]).join(', ')}`:''}

FULL PROFILE (source of truth — invent nothing beyond this):
${String(raw||'').slice(0,9000)}`;

/* Draft a message, show it, let them copy it. The two drafters below differ
   only in the prompt they build and the buttons they want beside Copy. */
async function draftMessage(o){
  const head=`<div class="eyebrow">${o.eyebrow}</div>
    <h2 style="margin:6px 0 14px">${o.head}</h2>`;
  const d=modal(head+`<p style="color:var(--muted)"><span class="spin"></span> Writing…</p>`);
  try{
    const txt=await claude(o.prompt, o.maxTok);
    d.querySelector('.box').innerHTML=head+`
      <textarea id="msgTxt" rows="${o.rows}">${esc(txt)}</textarea>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn-go btn-sm" id="msgCopy">Copy</button>
        ${(o.extras||[]).map(x=>`<button class="btn-sm" id="${x.id}">${x.label}</button>`).join('')}
        <button class="btn-sm" onclick="this.closest('.modal').remove()">Close</button></div>`;
    const box=()=>d.querySelector('#msgTxt');
    d.querySelector('#msgCopy').onclick=()=>{ box().select();
      navigator.clipboard.writeText(box().value).then(()=>{ d.querySelector('#msgCopy').textContent='Copied'; },()=>{}); };
    (o.extras||[]).forEach(x=>{ const b=d.querySelector('#'+x.id); if(b) b.onclick=()=>x.run(box().value, d); });
  }catch(e){
    d.remove();
    if(e.message==='NEEDKEY'){ keyDialog(o.retry); return; }
    modal(`<div class="eyebrow">${o.eyebrow}</div><p class="err">Couldn't write it. ${esc(e.message)}</p>
      <button class="btn-sm" onclick="this.closest('.modal').remove()">Close</button>`);
  }
}

async function draftPitch(i,isChase){
  const p=P(), j=p.jobs[i]; if(!j) return;
  const prof=p.profile;
  const cts=listOf(j,'contacts'), ev=listOf(j,'events');
  return draftMessage({
    eyebrow:'Outreach', head:`${esc(j.title)} · ${esc(j.company)}`, rows:10, maxTok:1000,
    retry:()=>draftPitch(i,isChase),
    extras:[{id:'msgSave', label:'Save to notes', run:async(text)=>{
      j.notes=(j.notes?j.notes+' | ':'')+text;
      j.pitch_sent='Drafted'; await save(); render(); }}],
    prompt:`Write a short cold outreach message for a job seeker.

${senderBlock(prof,p.raw,'WHO THEY ARE',true)}

TARGET COMPANY: ${j.company}
TARGET ROLE: ${j.title}
CONTEXT: ${String(j.description||'').slice(0,900)}

ADDRESSED TO: ${cts.length ? cts.map(c=>`${c.name||'(unnamed)'}${c.role?', '+c.role:''}`).join('; ') : 'nobody identified yet \u2014 keep it addressable to any reader'}

${isChase ? `THIS IS A FOLLOW-UP. They were contacted ${daysSilent(j)} days ago and have not replied.
Previous activity, most recent first:
${ev.slice(0,4).map(x=>`- ${x.on} ${x.kind}: ${x.text||''}`).join('\n')||'- no detail logged'}
Write a SHORT nudge: three sentences at most. Do not re-pitch from scratch and do not repeat the original message. Add one new thing \u2014 a relevant piece of work, a recent development at their company, or a sharper version of the offer. Be graceful, never wounded, and make it easy to ignore without awkwardness.` : ''}

CHANNEL: ${chOf(j)==='cold'
 ? 'COLD \u2014 there is NO job posting. This is an unsolicited approach to someone at the company. Do not refer to "the role", "this position", "the opening" or "your posting", because none exists. Open by making them want to reply, and make the ask a conversation, not an application.'
 : 'POSTED \u2014 there is a live job posting, so referring to the role directly is correct.'}

Rules:
- Maximum 5 sentences. A LinkedIn DM or short email, not a cover letter.
- Open with the single most specific concrete thing this person has actually built or run. No "I hope this finds you well", no "I am writing to express interest".
- Lead with whatever is rarest about them relative to other applicants for this role.
- Reference something specific about this company or role.
- End with a low-friction ask: a short call, or an offer to show something they've made. Never "please consider my application".
- Plain language. No buzzwords, no em-dashes, no "passionate about".
- Invent nothing not in the profile above.

Return only the message text.`});
}

/* One person, one LinkedIn InMail. Separate from draftPitch because that one
   addresses the job as a whole (or "nobody identified yet") — this always has
   exactly one named reader, so the opener can use their name and role directly
   instead of hedging. Nothing is sent from here: LinkedIn has no API for it, so
   this only produces text to paste into their own compose box. */
async function draftInmail(i,ci){
  const p=P(), j=p.jobs[i]; if(!j) return;
  const c=listOf(j,'contacts')[ci]; if(!c) return;
  const prof=p.profile;
  return draftMessage({
    eyebrow:'InMail draft', head:`${esc(c.name||'them')} · ${esc(j.company)}`, rows:8, maxTok:700,
    retry:()=>draftInmail(i,ci),
    extras: c.linkedin ? [{id:'msgOpen', label:'Open their profile',
      run:()=>window.open(c.linkedin,'_blank','noopener')}] : [],
    prompt:`Write a short LinkedIn InMail message from a job seeker to one specific person.

${senderBlock(prof,p.raw,"WHO IT'S FROM",false)}

WHO IT'S TO: ${c.name||'(name unknown)'}${c.role?', '+c.role:''} at ${j.company}

TARGET ROLE: ${j.title}
CONTEXT: ${String(j.description||'').slice(0,900)}

CHANNEL: ${chOf(j)==='cold'
 ? 'COLD — there is NO job posting. Do not refer to "the role" or "your posting" as if one exists. This is an unsolicited approach; make them want to reply.'
 : 'POSTED — there is a live posting, so referring to the role directly is correct. Mention that an application is going in (or already has), so this reads as a real signal, not a substitute for applying.'}

Rules:
- This is a LinkedIn InMail to someone they are not yet connected with — shorter than an email, no subject line, no formal greeting like "Dear".
- Maximum 4 sentences.
- Open by addressing them by first name, then the single most specific concrete thing this person (the sender) has actually built or run. No "I hope this finds you well", no "I am writing to express interest".
- Reference something specific about this company or role, and if they have a title suggesting they'd actually own hiring for this, say why you're reaching out to them specifically.
- End with a low-friction ask — a short call, or an offer to show something specific.
- Plain language. No buzzwords, no em-dashes, no "passionate about".
- Invent nothing not in the profile above.

Return only the message text.`});
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('button[data-act]'); if(!b) return;
  const i=parseInt(b.dataset.i,10), p=P(), j=p&&p.jobs[i]; if(!j) return;
  const a=b.dataset.act;
  if(a==='open')  return showJob(i);
  if(a==='pitch') return draftPitch(i,false);
  if(a==='chase') return draftPitch(i,true);
  if(a==='note')  return noteDialog(i);
  if(a==='sent'){ setStage(j,'sent'); logEvent(j,'sent',chOf(j)==='cold'?'reached out':'applied'); }
  if(a==='live'){ setStage(j,'live'); logEvent(j,'reply','they replied'); }
  if(a==='close'){ setStage(j,'closed'); logEvent(j,'closed','closed out'); }
  if(a==='reopen'){ setStage(j,'new'); j.follow_up_date=''; logEvent(j,'note','reopened'); }
  await save(); render();
});

/* ═══ sign in ═══
   Only ever reached when config.js is filled in. The copy is deliberate about
   what changes by having an account, because "your CV stays in your browser"
   stopped being true the moment this screen existed and pretending otherwise
   would be the dishonest kind of onboarding. */
let AUTH = { mode:'in', msg:'', err:'', busy:false, user:'', email:'', pass:'' };

/* Usernames are lowercase and narrow on purpose: they are an identifier people
   type, and a name that differs from another only by case or by a space is a
   support ticket waiting to happen. Mirrors the CHECK constraint in schema.sql. */
const USERNAME_RE = /^[a-z0-9_]{3,20}$/;

/* Two different questions. myUsername() is "has this account claimed a name",
   which gates the claim step below. userName() is "what do we call them on
   screen", which falls back to the email so a legacy account is not blank. */
function myUsername(){
  const m = USER && USER.user_metadata;
  return (m && m.username) || '';
}
function userName(){ return myUsername() || (USER && USER.email) || ''; }

function renderAuth(){
  const up = AUTH.mode==='up';
  $('#root').innerHTML=`
  <div class="onb">
    <div class="eyebrow">Job Triage</div>
    <p class="lede">${up?'Make an account':'Sign in'}</p>
    <p class="say">${up
      ? 'Your CV, your jobs and your notes are stored in the cloud so they follow you between devices. You can delete all of it, permanently, from inside the app.'
      : 'Welcome back.'}</p>
    <div class="card">
      <label class="lab">${up?'Username':'Username or email'}</label>
      <input id="auUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
             placeholder="${up?'3-20 characters: a-z, 0-9, underscore':'your username, or the email you signed up with'}" value="${esc(AUTH.user)}">
      ${up?`<label class="lab" style="margin-top:12px">Email</label>
      <input id="auEmail" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(AUTH.email)}">
      <p class="hint">Only ever used to reset your password. It is not shown to anyone else.</p>`:''}
      <label class="lab" style="margin-top:12px">Password</label>
      ${pwField('auPass', up?'new-password':'current-password', up?'At least 8 characters':'', AUTH.pass)}
      ${AUTH.err?`<p class="err">${esc(AUTH.err)}</p>`:''}
      ${AUTH.msg?`<p class="say" style="margin:10px 0 0;color:var(--good);font-size:13px">${esc(AUTH.msg)}</p>`:''}
      <div class="btn-row" style="margin-top:14px">
        <button class="btn-go" id="auGo" ${AUTH.busy?'disabled':''}>${AUTH.busy?'\u2026':(up?'Create account':'Sign in')}</button>
        <button class="btn-sm" id="auSwap">${up?'I already have one':'Make an account'}</button>
      </div>
      ${up?'':`<p class="say" style="margin:12px 0 0;font-size:12.5px"><a href="#" class="lnk" id="auReset">Forgot your password?</a></p>`}
    </div>
    <p class="say" style="margin-top:22px;font-size:12.5px">What is stored, and how to erase it, is set out in the <a class="lnk" href="PRIVACY.md" target="_blank" rel="noopener">privacy notice</a>. Your API keys are never uploaded \u2014 they stay in this browser.</p>
  </div>`;

  // Swapping mode or hitting an error re-renders the form, which would throw
  // away what was typed. Read it back into state before anything re-renders.
  const stash=()=>{
    AUTH.user=($('#auUser').value||'').trim().toLowerCase();
    if($('#auEmail')) AUTH.email=($('#auEmail').value||'').trim();
    AUTH.pass=$('#auPass').value||'';
  };
  const fail=m=>{ AUTH.busy=false; AUTH.err=m; renderAuth(); };

  const go=async ()=>{
    stash();
    const user=AUTH.user, pass=AUTH.pass, email=AUTH.email;
    if(!user||!pass) return fail(up?'Username and password, please.':'Fill both in, please.');
    // Only sign-up dictates the shape. Sign-in also accepts an email, because
    // accounts made before usernames existed have nothing else to type.
    if(up && !USERNAME_RE.test(user)) return fail('Usernames are 3-20 characters: lowercase letters, numbers or underscore.');
    if(up && !email) return fail('An email, so you can reset your password later.');
    if(up && pass.length<8) return fail('Passwords need to be at least 8 characters.');
    AUTH.busy=true; AUTH.err=''; AUTH.msg=''; renderAuth();

    try{
      if(up){
        const {data:free,error:e0}=await SB.rpc('username_available',{p_username:user});
        if(e0) throw e0;
        if(!free) return fail('That username is taken.');
        // The username rides along in user_metadata; a trigger on auth.users
        // claims it, which is the only moment that works when email
        // confirmation is on and sign-up returns no session.
        const {data,error}=await SB.auth.signUp({email,password:pass,options:{data:{username:user}}});
        if(error) throw error;
        if(!(data && data.session)){
          AUTH.busy=false; AUTH.pass='';
          AUTH.msg='Check your email to confirm the account, then sign in with your username.';
          AUTH.mode='in'; return renderAuth();
        }
      } else {
        // An '@' means they typed an email, which Supabase takes directly; no
        // lookup, and no way for this branch to confirm an address exists.
        let addr = user;
        if(!user.includes('@')){
          const {data,error:e1}=await SB.rpc('login_email',{p_username:user});
          if(e1) throw e1;
          addr = data;
        }
        // Same message however it failed, so this form does not become a way
        // to test which usernames or emails exist.
        const nope = 'That did not match. Check the username or email, and the password.';
        if(!addr) return fail(nope);
        const {error}=await SB.auth.signInWithPassword({email:addr,password:pass});
        if(error) return fail(nope);
      }
    }catch(e){
      return fail((e&&e.message)||'That did not work.');
    }
    AUTH.busy=false; AUTH.pass='';
  };

  $('#auGo').onclick=go;
  $('#auPass').onkeydown=e=>{ if(e.key==='Enter') go(); };
  $('#auSwap').onclick=()=>{ stash(); AUTH.mode=up?'in':'up'; AUTH.err=''; AUTH.msg=''; renderAuth(); };

  if($('#auReset')) $('#auReset').onclick=async e=>{
    e.preventDefault();
    stash();
    // Reset goes by email, not by username: the recovery link is sent to the
    // address on the account, and asking for it directly keeps this form from
    // answering "which email is behind this username".
    const addr=prompt('Which email is on the account?');
    if(!addr) return;
    try{ await SB.auth.resetPasswordForEmail(addr.trim(),{redirectTo:location.href}); }catch(err){}
    // Said the same way whether or not the address exists: telling a stranger
    // which emails have accounts here is not information worth giving away.
    AUTH.err=''; AUTH.msg='If that address has an account, a reset link is on its way.';
    renderAuth();
  };
}

/* Shown once, to accounts that pre-date usernames. They signed in with their
   email; they cannot sign in again without a name, so this is not skippable.
   It is deliberately not part of onboarding: onboarding is about the CV, and
   an account that already has jobs in it should not be sent back through it. */
let CLAIM = {user:'', err:'', busy:false};
function renderClaim(){
  $('#root').innerHTML=`
  <div class="onb">
    <div class="eyebrow">Job Triage</div>
    <p class="lede">Pick a username</p>
    <p class="say">Sign-in moved to usernames. Your account and everything in it is unchanged \u2014 this is the name you will type from now on instead of ${esc(USER&&USER.email||'your email')}.</p>
    <div class="card">
      <label class="lab">Username</label>
      <input id="clUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
             placeholder="3-20 characters: a-z, 0-9, underscore" value="${esc(CLAIM.user)}">
      <p class="hint">Lowercase letters, numbers and underscores. You cannot change it later, so pick one you will recognise.</p>
      ${CLAIM.err?`<p class="err">${esc(CLAIM.err)}</p>`:''}
      <div class="btn-row" style="margin-top:14px">
        <button class="btn-go" id="clGo" ${CLAIM.busy?'disabled':''}>${CLAIM.busy?'\u2026':'Use this name'}</button>
        <button class="btn-sm" id="clOut">Sign out</button>
      </div>
    </div>
  </div>`;
  const fail=m=>{ CLAIM.busy=false; CLAIM.err=m; renderClaim(); };
  const go=async()=>{
    CLAIM.user=($('#clUser').value||'').trim().toLowerCase();
    const u=CLAIM.user;
    if(!USERNAME_RE.test(u)) return fail('3-20 characters: lowercase letters, numbers or underscore.');
    CLAIM.busy=true; CLAIM.err=''; renderClaim();
    try{
      const {data:free,error:e0}=await SB.rpc('username_available',{p_username:u});
      if(e0) throw e0;
      if(!free) return fail('That username is taken.');
      const {error:e1}=await SB.rpc('claim_username',{p_username:u});
      if(e1) throw e1;
      // The row is what counts; this copies it onto the session so the rest of
      // the app can read it without another round trip.
      const {error:e2}=await SB.auth.updateUser({data:{username:u}});
      if(e2) throw e2;
      if(USER) USER.user_metadata=Object.assign({},USER.user_metadata,{username:u});
      CLAIM.busy=false; CLAIM.err=''; render();
    }catch(e){ return fail((e&&e.message)||'That did not work.'); }
  };
  $('#clGo').onclick=go;
  $('#clUser').onkeydown=e=>{ if(e.key==='Enter') go(); };
  $('#clOut').onclick=async()=>{
    try{ await SB.auth.signOut(); }catch(e){}
    USER=null; DB={profiles:{},current:null}; VIEW='onb'; render();
  };
}

/* #root is empty until the first render, and everything before it waits on the
   network: getSession, then the cloud read, then possibly a migration. That was
   a dark rectangle for as long as it all took, which reads as a broken page
   rather than a loading one. */
function splash(msg, sub){
  const r=$('#root'); if(!r) return;
  r.innerHTML=`<div class="onb">
    <div class="eyebrow">Job Triage</div>
    <p class="lede" style="margin-top:14px"><span class="spin"></span> ${esc(msg)}</p>
    ${sub?`<p class="say">${esc(sub)}</p>`:''}
  </div>`;
}

/* Landing from a "reset your password" email. Supabase has already put a
   recovery session in place by the time this runs, so the only thing left is
   to take the new password. Without this the link signed people in and showed
   them the app, with no way to actually change anything. */
let RECOVER = false;
function renderRecover(){
  $('#root').innerHTML=`
  <div class="onb">
    <div class="eyebrow">Job Triage</div>
    <p class="lede">Set a new password</p>
    <p class="say">You followed a reset link${USER&&USER.email?` for ${esc(USER.email)}`:''}. Pick something you will remember.</p>
    <div class="card">
      <label class="lab">New password</label>
      ${pwField('rcA','new-password','At least 8 characters')}
      <label class="lab" style="margin-top:12px">Type it again</label>
      ${pwField('rcB','new-password')}
      <p class="err" id="rcErr" style="display:none"></p>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn-go" id="rcGo">Save it</button>
      </div>
    </div>
  </div>`;
  const fail=m=>{ const e=$('#rcErr'); e.textContent=m; e.style.display='block'; $('#rcGo').disabled=false; };
  const go=async()=>{
    const a=$('#rcA').value, b=$('#rcB').value;
    if(a.length<8) return fail('Passwords need to be at least 8 characters.');
    if(a!==b)      return fail('Those two do not match.');
    $('#rcGo').disabled=true;
    try{
      const {error}=await SB.auth.updateUser({password:a});
      if(error) throw error;
    }catch(e){ return fail((e&&e.message)||'That did not work.'); }
    RECOVER=false;
    splash('Password changed. Loading your account\u2026');
    await afterAuth();
  };
  $('#rcGo').onclick=go;
  $('#rcB').onkeydown=e=>{ if(e.key==='Enter') go(); };
}

function render(){
  if(CLOUD && RECOVER && USER) return renderRecover();
  if(CLOUD && !USER) return renderAuth();
  if(CLOUD && USER && !myUsername()) return renderClaim();
  (VIEW==='app'&&P()) ? renderApp() : renderOnb();
}

/* Carries a browser-only setup into the account the first time someone signs
   in, so making an account does not read as having lost everything. Only ever
   fills an empty account — it must never overwrite what is already up there. */
async function migrateLocal(){
  try{
    if(await get('triage:db')) return;
    const local=await getLocal('triage:db');
    if(!local) return;
    const d=JSON.parse(local);
    if(!d || !d.profiles || !Object.keys(d.profiles).length) return;
    // This can be megabytes on a well-used tracker, and it is the slowest thing
    // that happens between signing in and seeing the app. Say so.
    const n=Object.values(d.profiles).reduce((a,p)=>a+((p.jobs||[]).length),0);
    splash('Moving your work into your account\u2026',
           `${n} job${n===1?'':'s'} from this browser. This only happens once.`);
    await put('triage:db', local);
    DB.profiles=d.profiles||{}; DB.current=d.current||null;
  }catch(e){}
}

async function afterAuth(){
  DB={profiles:{},current:null}; VIEW='onb';
  if(cloudNow()) splash('Loading your account\u2026');
  try{
    await afterAuthInner();
  }catch(e){
    // Reaching here with nothing on screen is the one outcome worth guarding
    // against. Whatever is on this device beats a page that never finishes.
    console.error('afterAuth failed:', e);
    try{
      const v=await getLocal('triage:db');
      if(v){ const d=JSON.parse(v); DB.profiles=d.profiles||{}; DB.current=d.current||null; }
    }catch(e2){}
    syncNote('Could not reach your account \u2014 showing what is on this device. '+((e&&e.message)||''));
  }
  // A DB.current pointing at an unusable record leaves the app with nothing to
  // draw. Log what was wrong -- it should not happen -- and move on rather than
  // stranding them on a screen that cannot render.
  if(DB.current && !usable(DB.profiles[DB.current])){
    console.warn('profile', DB.current, 'has no profile object; keys =',
                 Object.keys(DB.profiles[DB.current]||{}));
    DB.current = Object.keys(DB.profiles).find(id=>usable(DB.profiles[id])) || null;
  }
  if(DB.current&&usable(DB.profiles[DB.current])) VIEW='app';
  // After the profile resolves and before the first paint, so the list drawn is
  // the list that will still be there on the next load. Saved only if it bit.
  try{
    PURGED = purgeUntouched();
    if(PURGED) await save();
  }catch(e){ console.warn('retention pass failed:', e && e.message); }
  render();
  // After the render, not before: render() rebuilds #root and would wipe it.
  if(CLOUD_DOWN) syncNote('Could not reach your account just now — working from this device. Anything you change is saved here and will sync when you reload with a connection.');
}

async function afterAuthInner(){
  // user_metadata on a session minted before the name was claimed still says
  // there is none. The table is the truth; ask it once per sign-in.
  if(cloudNow() && !myUsername()){
    try{
      const {data}=await withTimeout(SB.rpc('my_username'), READ_MS, 'checking your username');
      if(data) USER.user_metadata=Object.assign({},USER.user_metadata,{username:data});
    }catch(e){ cloudDown(e); console.warn('my_username:', e && e.message); }
  }
  await load();
  if(cloudNow()) await migrateLocal();
}

async function boot(){
  if(CLOUD) splash('Starting\u2026');
  if(CLOUD){
    try{
      const {data}=await SB.auth.getSession();
      USER=(data&&data.session&&data.session.user)||null;
    }catch(e){ USER=null; }
    let last=USER?USER.id:null;
    SB.auth.onAuthStateChange((ev,sess)=>{
      const now=(sess&&sess.user)||null;
      if(ev==='PASSWORD_RECOVERY'){
        // Arrived from a reset email. Take the new password before anything else.
        USER=now; last=now?now.id:null; RECOVER=true; render(); return;
      }
      if((now?now.id:null)===last) return;      // token refreshes are not events
      last=now?now.id:null; USER=now; afterAuth();
    });
  }
  await afterAuth();
  if('serviceWorker' in navigator){
    // file:// has no service worker support and does not need one.
    if(location.protocol==='http:'||location.protocol==='https:'){
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  }
}
boot();
})();
</script>
