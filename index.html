    try{ list=await suggestCompanies(prof,trk,extra); }
    catch(e){
      d.querySelector('#sgGo').disabled=false;

      d.querySelector('#sgOut').innerHTML='<p class="err">'+esc(e.message)+'</p>'; return;
    }
    if(!list.length){
      d.querySelector('#sgGo').disabled=false;
      d.querySelector('#sgOut').innerHTML='<p class="err">Nothing came back. Try again, or add a steer.</p>'; return;
    }
    d.querySelector('#sgOut').innerHTML=`
      <div class="eyebrow" style="margin-top:18px">${list.length} companies · untick any you don't want</div>
      <div style="margin-top:8px;max-height:340px;overflow:auto">${list.map(companyRow).join('')}</div>
      <div class="btn-row" style="margin-top:14px">

  };
  d.querySelector('#sgGo').onclick=run;

async function addSuggested(list, checkHiring){
  const p=P(); if(!p||!list.length) return;
  busy=true; render();

  // Everything starts as a cold target. The ATS check below promotes whichever
  // ones turn out to be hiring, so the default is never wrong.
  const cold=list.map(c=>{
    const j=blank();
    j.company=c.name; j.title='Cold approach'; j.location=c.location||'';
    j.description=[c.why,c.overlap?('Your overlap: '+c.overlap):'',c.stage?('Stage: '+c.stage):'']
      .filter(Boolean).join(' — ');
    j.source='Suggested'; j.channel='cold'; j.stage='new';
    j.notes=c.odds?('Odds: '+c.odds):'';
    return j;
  });
  let added=addJobs(cold);
  await save(); render();

  if(!checkHiring){ busy=false; render(); setSearchInfo(`Added ${added} cold targets.`); await autoScore(); return; }

  try{
    const {found,misses}=await atsSearch(list.map(c=>c.name), setSearchInfo);
    let roles=0;
    for(const hit of found){
      await recordVelocity(hit.slug,hit.rows.length);
      const vel=velocityNote(hit.slug);
      const jobs=rowsFromAts(hit, vel);
      roles+=addJobs(jobs);
      // This company is advertising, so the placeholder cold row is redundant.
      const ci=p.jobs.findIndex(j=>j.channel==='cold'&&j.source==='Suggested'&&j.company===(hit.name||hit.slug));
      if(ci>=0 && jobs.length) p.jobs.splice(ci,1);
    }
    busy=false; await save(); render();
    setSearchInfo(`${found.length} of ${list.length} are hiring — ${roles} open roles pulled. `
      + `${misses.length} stay cold approaches.`);
    await autoScore();
  }catch(e){
    busy=false; await save(); render();
    setSearchInfo(`Added ${added} cold targets. Couldn't check hiring: ${e.message}`);
    await autoScore();
  }
}

/* ═══ assessing a direction the person names themselves ═══
   The generated tracks are the model's read on where someone could go. This is
   the inverse: the person says where they want to go, and gets an honest answer
   about what that would take. It is the more useful direction of the two,
   because ambition usually arrives before evidence, and the thing worth knowing
   is not "is this allowed" but "what specifically is missing". */
async function assessTrack(want, prof){
  const txt = await claude(`A person wants to know whether a particular kind of job is realistic for them.

THEIR PROFILE
Name: ${prof.name}
Based in: ${prof.location||'unspecified'}
Level: ${prof.seniority||'unspecified'}${prof.years_experience?` (~${prof.years_experience} years)`:''}
In short: ${prof.headline||''}
Fields: ${(prof.domains||[]).join('; ')}
Real strengths: ${(prof.strengths||[]).join('; ')}
Skills: ${(prof.hard_skills||[]).join(', ')}
${prof.unusual_combination?`What is rare about them: ${prof.unusual_combination}`:''}
Honest gaps: ${(prof.gaps||[]).join('; ')||'none stated'}

THE KIND OF JOB THEY ARE ASKING ABOUT: "${String(want).slice(0,200)}"

Return ONLY a JSON object, no preamble, no markdown fences:
{
 "id":"short-slug",
 "label":"the job family, named properly as the industry names it",
 "difficulty":"easy|moderate|moonshot",
 "why":"one sentence, max 20 words, on the fit",
 "verdict":"2-4 sentences. Straight assessment. What would actually happen if they applied for this tomorrow, and what the single biggest obstacle is.",
 "transfers":["3-6 things from their background that genuinely count toward this, stated concretely"],
 "missing":["2-5 things they would have to acquire, show, or work around - be specific about which, and say if any is a hard blocker"],
 "bridge":"one sentence: the shortest realistic path from where they are to this, or empty string if they are already there",
 "titles":["5-8 real job titles to search for"],
 "boards":["4-8 bare domains where this kind of job is actually posted"]
}

Difficulty means:
- "easy": they could get this now with what is already on their profile. Someone reading their CV would find it an unsurprising application.
- "moderate": a real step across. Winnable, but they would need to argue for it and would be competing against people with more direct experience.
- "moonshot": plausible but they would be an unusual hire. Worth a small number of well-aimed attempts, not a campaign.

Be honest rather than encouraging. If this is a bad idea for them, say so in the verdict and mark it moonshot - an inflated assessment wastes months of someone's life. If it is genuinely easy, say that too and do not manufacture obstacles.
If the request is vague, interpret it as the nearest real job family and name that in the label.
For boards: give the registries where this specific field posts, not general job sites. Bare domains, no protocol.
Use ONLY what is in the profile. Do not invent experience.`, 1600);
  const t = grabJSON(txt);
  t.id = (t.id||'custom')+'_'+Math.random().toString(36).slice(2,5);
  ['transfers','missing','titles','boards'].forEach(k=>{ if(!Array.isArray(t[k])) t[k]=[]; });
  t.boards = t.boards.map(b=>String(b).replace(/^https?:\/\//,'').replace(/\/.*$/,'').trim()).filter(Boolean);
  t.custom = true;
  return t;
}

function diffTag(d){
  return d==='moonshot' ? 'hard' : d==='easy' ? 'easy' : 'mid';
}

/* Shown after an assessment. The verdict is the point — the lists are supporting
   detail, so they sit under it rather than above. */
function trackVerdict(t){
  const chips=(arr,cls)=>arr.length
    ? `<div class="chips" style="margin-top:8px">${arr.map(x=>`<span class="chip ${cls}">${esc(x)}</span>`).join('')}</div>` : '';
  return `<div class="card" style="margin-top:14px">
    <div class="tl" style="font-size:16px;font-weight:500;display:flex;align-items:center;gap:9px">
      ${esc(t.label||'')} <span class="tag ${diffTag(t.difficulty)}">${esc(t.difficulty||'')}</span></div>
    ${t.verdict?`<p style="margin:10px 0 0;font-size:13.5px;line-height:1.55">${esc(t.verdict)}</p>`:''}
    ${t.transfers&&t.transfers.length?`<div class="eyebrow" style="margin-top:16px">What counts toward it</div>${chips(t.transfers,'g')}`:''}
    ${t.missing&&t.missing.length?`<div class="eyebrow" style="margin-top:14px">What you'd have to close</div>${chips(t.missing,'r')}`:''}
    ${t.bridge?`<div class="eyebrow" style="margin-top:14px">Shortest path</div><p style="margin:7px 0 0;color:var(--muted);font-size:13px">${esc(t.bridge)}</p>`:''}
    ${t.titles&&t.titles.length?`<div class="eyebrow" style="margin-top:14px">Search these titles</div>${chips(t.titles.slice(0,8),'')}`:''}
    ${t.boards&&t.boards.length?`<div class="eyebrow" style="margin-top:14px">On these boards</div>${chips(t.boards.slice(0,8),'')}`:''}
  </div>`;
}

/* ═══ scoring prompt, built from THIS person ═══ */
function sysPrompt(prof, track){
  const t = (prof.tracks||[]).find(x=>x.id===track) || prof.tracks[0] || {};
  return `You score job listings for one specific candidate. You will be given their profile and a batch of jobs.

CANDIDATE SNAPSHOT
Name: ${prof.name}
Based in: ${prof.location||'unspecified'}${prof.country?', '+prof.country:''}
Level: ${prof.seniority||'unspecified'}${prof.years_experience?` (~${prof.years_experience} years)`:''}
What they are: ${prof.headline||''}
Real strengths: ${(prof.strengths||[]).join('; ')}
${prof.unusual_combination?`What is rare about them: ${prof.unusual_combination}`:''}

THEY ARE TARGETING: ${t.label||'general roles'}${t.why?` — ${t.why}`:''}
Typical titles in this family: ${(t.titles||[]).join(', ')||'various'}

HONEST GAPS (they cannot claim these): ${(prof.gaps||[]).join('; ')||'none stated'}
ROLE SHAPES TO RULE OUT: ${(prof.wrong_shapes||[]).join('; ')||'none stated'}

TODAY'S DATE IS ${today()}. Use it for any date reasoning below.

Return ONLY a JSON object, no preamble, no markdown fences:
{"results":[{"id":"...","score":0,"reachability":0,"confidence":"high","reason":"...","flags":["..."],"posted":null}]}

For EACH job:
- id: exactly as given
- score: 0-100 FIT ONLY. How well does the described WORK match what this candidate can do and is targeting? Judge the work, not the title, and NOT whether they would win the process.
- reachability: 0-100, SEPARATELY. How likely is an application from THIS candidate to actually convert? Consider company prestige and applicant volume, whether credentials this candidate lacks are demanded, the seniority bar versus their level, signals of openness to non-traditional candidates, and company stage. A perfect-fit role at a famous employer scores HIGH on fit and LOW here.
- confidence: "high" (real job description) | "medium" (short snippet) | "low" (title and company only)
- reason: ONE sentence, max 20 words, specific. If fit and reachability diverge sharply, say why.
- flags: from this set only: ["strong_fit","seniority_too_high","seniority_too_low","credential_gated","wrong_role_shape","location_ineligible","thin_data","high_competition","non_traditional_friendly","rare_combination_fit"]
- posted: when the text carries evidence of WHEN it was posted, the window that evidence allows, as {"from":"YYYY-MM-DD","to":"YYYY-MM-DD"}. Otherwise null.

Rules:
- The candidate is based in ${prof.location||'their stated location'}. A role requiring presence somewhere else with no remote allowance scores below 20 on FIT and gets "location_ineligible".
- Do NOT lower the FIT score because of the gaps listed above. Gaps are a REACHABILITY consideration. Keep the two axes strictly separate.
- Any job matching the ruled-out role shapes scores below 20 on FIT and gets "wrong_role_shape", however appealing its title.
- A job that needs the candidate's rare combination of skills should score higher — flag "rare_combination_fit".
- Do not invent details. Inferring from a title alone means confidence "low" and flag "thin_data".
- Do not inflate. Most jobs are mediocre. The distribution should be wide on both axes.
- A job given to you with a "posted" value already has a real date from its source. Return posted null for it; do not restate or revise it.
- Evidence for posted means the text says something datable: an explicit date, "posted last week", an application deadline, an interview or start date, a named quarter or term. A window as wide as three months is a good answer when that is all the evidence supports. Widen the window rather than picking a date you cannot defend.
- The subject matter of a job is NOT evidence of its age. No datable statement means posted null. Guessing here is worse than useless, because it sorts a stale job to the top of the freshest list.
- posted "to" must never be later than today, and "from" never later than "to".
- One entry per input job. JSON object only.`;
}

/* ═══ jobs ═══ */
/* One way in for a posting date, so provenance and the sort key can never
   disagree. lo/hi collapse to the same day for an exact date; a window keeps
   both and sorts on the middle. Anything unparseable leaves the row undated,
   which the Freshest tab shows honestly rather than guessing at. */
function setPosted(j, when, src, hi){
  const lo=parseWhen(when);
  if(!lo) return false;
  const top=hi?parseWhen(hi):'';
  j.posted_lo=lo;
  j.posted_hi=(top&&top>=lo)?top:lo;
  j.posted=midDate(j.posted_lo,j.posted_hi);
  j.posted_src=src||'feed';
  return true;
}

function blank(){ const o={}; COLS.forEach(c=>o[c]=''); o.status='New'; o.pitch_sent='No'; o.channel='posted'; o.stage='new'; o.contacts='[]'; o.events='[]'; o.added=today(); return o; }
function keyOf(j){
  const u=String(j.url||'').trim();
  if(u && u!=='nan') return 'u:'+u.toLowerCase();
  return 't:'+[j.title,j.company,j.location].map(x=>String(x||'').trim().toLowerCase()).join('|');
}
function addJobs(list){
  const p=P(); if(!p) return 0;
  const seen=new Set(p.jobs.map(keyOf)); let n=0;
  list.forEach(j=>{ if(!String(j.title||'').trim()) return;
    const k=keyOf(j); if(seen.has(k)) return; seen.add(k); p.jobs.push(j); n++; });
  return n;
}
const isScored = j => String(j.ai_score||'').trim()!=='';
const fitOf   = j => { const v=parseFloat(j.ai_score); return isNaN(v)?0:Math.max(0,Math.min(100,v)); };
const reachOf = j => { const v=parseFloat(j.ai_reachability); return isNaN(v)?45:Math.max(0,Math.min(100,v)); };
function rankOf(j){
  const conf={high:1,medium:.9,low:.78}[String(j.ai_confidence||'low').toLowerCase()]||.78;
  return Math.pow(fitOf(j),0.65)*Math.pow(reachOf(j),0.35)*conf;
}
const isOpen = j => stOf(j)!=='closed';

/* ═══ trimming the list ═══
   A list that has been running for weeks fills with roles that were never
   worth an application, and scrolling past them is a tax on every session.
   So: keep the best, bin the rest.

   Two things are never binned, and the distinction matters more than the
   number 50. A row you have acted on is the ONLY record that you applied
   there, who you spoke to and what they said — that history exists nowhere
   else and no score justifies deleting it. And a row that was never scored
   has not been judged, so calling it "not top 50" would be a lie; it is
   probably something you pulled in five minutes ago. Both are protected, so
   the total kept can exceed 50, and the confirm says so plainly rather than
   quietly deleting something you would want back. */
const KEEP_TOP = 50;

/* ═══ retention ═══
   A tracker that only ever grows stops being a list of what to do and becomes
   an archive to scroll past. The rows safe to drop are the ones nothing ever
   happened to: they are not a record of anything, because there is nothing to
   record. Ten days is the window -- a posting you have not touched in that time
   is one you decided against without saying so, and the posting itself has
   probably gone.

   What is never dropped is anything carrying history. A row you applied to,
   messaged someone at, or logged a note against is the ONLY record that any of
   it happened, and it exists nowhere else -- the same reason trimPlan() refuses
   to bin it however badly it scores.

   isTouched() cannot be reused here. It counts any stage other than 'new' as
   touched, so a job closed on sight would be protected by it, which is exactly
   backwards: those are the rows this is for. */
const KEEP_UNTOUCHED_DAYS = 10;
const hasHistory = j =>
     String(j.pitch_sent||'').trim().toLowerCase()==='yes'
  || !!String(j.date_applied||'').trim()
  || listOf(j,'contacts').length>0
  || listOf(j,'events').length>0;
/* No 'added' means the row predates the field and its age cannot be known, so
   it is left alone rather than guessed at. */
const staleUntouched = j => !hasHistory(j) && !!j.added
  && dayDiff(j.added, today()) > KEEP_UNTOUCHED_DAYS;
let PURGED = 0;
function purgeUntouched(){
  const p=P(); if(!p||!p.jobs) return 0;
  const n=p.jobs.length;
  p.jobs=p.jobs.filter(j=>!staleUntouched(j));
  return n-p.jobs.length;
}
function isTouched(j){
  return stOf(j)!=='new'
      || String(j.pitch_sent||'').trim().toLowerCase()==='yes'
      || String(j.status||'').trim().toLowerCase()==='applied'
      || listOf(j,'contacts').length>0
      || listOf(j,'events').length>0;
}
function trimPlan(jobs){
  const safe=[], pool=[];
  (jobs||[]).forEach(j=>{ (isTouched(j)||!isScored(j) ? safe : pool).push(j); });
  // Rank decides. Age only breaks ties, and only now that rows carry one:
  // between two equally good roles, the fresher one is likelier to still exist.
  pool.sort((a,b)=>{
    const d=rankOf(b)-rankOf(a); if(d) return d;
    const x=ageOf(a), y=ageOf(b);
    if(x===null&&y===null) return 0;
    if(x===null) return 1;
    if(y===null) return -1;
    return x-y;
  });
  return { safe, best:pool.slice(0,KEEP_TOP), drop:pool.slice(KEEP_TOP) };
}
const chOf   = j => String(j.channel||'posted').trim().toLowerCase()==='cold' ? 'cold' : 'posted';
const stOf   = j => { const v=String(j.stage||'').trim().toLowerCase();
  if(STAGES.includes(v)) return v;
  // Rows imported before stages existed, or from the Python tracker.
  const s=String(j.status||'').trim().toLowerCase();
  if(s==='applied'||s==='contacted') return 'sent';
  if(s==='skipped'||s==='rejected'||s==='closed') return 'closed';
  return 'new'; };
const dayDiff = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
function isDue(j){
  if(stOf(j)!=='sent') return false;
  if(j.follow_up_date) return j.follow_up_date <= today();
  const t=j.last_touch||j.date_applied;
  return t ? dayDiff(t,today())>=FOLLOWUP_DAYS : false;
}
const daysSilent = j => { const t=j.last_touch||j.date_applied; return t?dayDiff(t,today()):0; };
const listOf = (j,k) => { try{ const v=JSON.parse(j[k]||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } };
const setList = (j,k,v) => { j[k]=JSON.stringify(v); };
function logEvent(j,kind,text){
  const ev=listOf(j,'events');
  ev.unshift({on:today(),kind,text:String(text||'').slice(0,400)});
  setList(j,'events',ev.slice(0,40));
  j.last_touch=today();
}
function setStage(j,st){
  j.stage=st;
  j.status = st==='sent' ? (chOf(j)==='cold'?'Contacted':'Applied')
           : st==='live' ? 'In conversation'
           : st==='closed' ? 'Closed' : 'New';
  if(st==='sent'){
    if(!j.date_applied) j.date_applied=today();
    const d=new Date(); d.setDate(d.getDate()+FOLLOWUP_DAYS);
    j.follow_up_date=d.toISOString().slice(0,10);
  }
  j.last_touch=today();
}

/* ═══ CSV ═══ */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else { if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=''; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=c; } }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.length && r.some(v=>String(v).trim()!==''));
}
function toCSV(rows,cols){
  const q=v=>{const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  return [cols.join(',')].concat(rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\n');
}

/* ═══ scoring run ═══ */
async function scoreBatch(batch, prof, track){
  const jobs = batch.map(b=>{
    const o={ id:String(b.i),
      title:String(b.j.title||''), company:String(b.j.company||''),
      location:String(b.j.location||''),
      description:String(b.j.description||'').slice(0,1100)||'(no description available)' };
    // Anything a feed already dated is stated, not asked about — the model is
    // the last and least reliable source here, never a second opinion.
    if(saneDate(b.j.posted)) o.posted=b.j.posted;
    return o;
  });
  const txt = await claude(sysPrompt(prof,track)+"\n\nJOBS TO SCORE:\n"+JSON.stringify(jobs), 1400);
  const parsed = grabJSON(txt);
  const items = Array.isArray(parsed)?parsed:(parsed.results||[]);
  const out={};
  items.forEach(it=>{ out[String(it.id)]={
    score:Math.max(0,Math.min(100,parseInt(it.score,10)||0)),
    reach:Math.max(0,Math.min(100,parseInt(it.reachability,10)||45)),
    conf:String(it.confidence||'low').toLowerCase(),
    reason:String(it.reason||'').slice(0,220),
    flags:(it.flags||[]).join(','),
    posted:it.posted&&typeof it.posted==='object'?it.posted:null }; });
  return out;
}

async function runScoring(all, auto){
  const p=P(); if(!p || busy) return;
  const targets = p.jobs.map((j,i)=>({j,i})).filter(b=> all || !isScored(b.j));
  if(!targets.length){ setInfo(all?'No jobs to score yet.':'Everything is already scored.'); return; }
  busy=true; render();
  const SIZE=6, total=targets.length; let done=0, failed=0;
  for(let i=0;i<targets.length;i+=SIZE){
    const batch=targets.slice(i,i+SIZE);
    try{
      const res=await scoreBatch(batch,p.profile,p.track);
      batch.forEach(b=>{ const r=res[String(b.i)]; if(!r) return;
        const j=p.jobs[b.i];
        j.ai_score=String(r.score); j.ai_reachability=String(r.reach);
        j.ai_confidence=r.conf; j.ai_reason=r.reason; j.ai_flags=r.flags;
        // Only ever fills a gap. A date from a feed outranks the model's
        // reading of the same posting, and re-scoring must not overwrite it.
        if(r.posted && !saneDate(j.posted)) setPosted(j, r.posted.from, 'est', r.posted.to); });
    }catch(e){
      if(e.message==='NEEDKEY'){
        busy=false;
        // Asked for: ask for the key. Ran on its own: say so and stay put.
        if(auto){ setInfo('Scoring needs an API key. Set one up under Data.'); render(); return; }
        render(); keyDialog(()=>runScoring(all)); return;
      }
      failed+=batch.length; console.error(e);
    }
    done+=batch.length;
    const bar=$('#progBar'); if(bar) bar.style.width=Math.round(done/total*100)+'%';
    setInfo(`${done} of ${total} done${failed?` · ${failed} failed`:''}`);
    await save();
  }
  busy=false;
  setInfo(failed?`Scored ${total-failed}. ${failed} failed — run again to retry them.`:`Scored ${total}.`);
  await save(); render();
}
/* ═══ auto-scoring ═══
   An unscored job is invisible to everything that matters here — it is not on
   the map, not in Work Today, not ranked. So the gap between pulling jobs in
   and scoring them was a step with no decision in it, which is the kind of
   step worth deleting.

   Three things stop it rather than surprising someone. It never opens the key
   dialog: a modal appearing on its own after a search is startling, and the
   message in the Score block says the same thing without seizing the page. It
   refuses above AUTO_MAX, because a 400-row CSV import should not silently
   start a long paid run — that is a decision, and the button is right there
   for it. And it can be turned off, since it does spend money, even if the
   amounts are small enough that most people will not care. */
const AUTO_MAX = 60;
async function autoScore(){
  if(!AUTO || busy) return;
  const p=P(); if(!p) return;
  const n=p.jobs.filter(j=>!isScored(j)).length;
  if(!n) return;
  // Anthropic works with no key inside the Claude viewer; DeepSeek never does.
  if(!KEY && PROV!=='anthropic'){
    setInfo(`${n} unscored \u2014 add a key and they will be scored automatically.`);
    return;
  }
  if(n>AUTO_MAX){
    setInfo(`${n} unscored \u2014 too many to score automatically. Use "Score new jobs" when you are ready.`);
    return;
  }
  await runScoring(false, true);
}

function setInfo(t){ const e=$('#scoreInfo'); if(e) e.textContent=t; }
function setSearchInfo(t){ const e=$('#searchInfo'); if(e) e.textContent=t; }

async function runBoards(trk, where){
  const p=P(); if(!p||busy) return;
  // Portals first, then any specialist registry the track named that is not
  // already one of them. A track with no registries of its own still searches.
  const boards=PORTALS.concat((trk.boards||[]).filter(b=>!PORTALS.includes(b)));
  const titles=(trk.titles||[]);
  if(!titles.length){ setSearchInfo("This track has no titles to search."); return; }
  const qs=buildBoardQueries(titles,boards,where);
  busy=true; render();
  try{
    // Pinned to the person's country so Google ranks for where they can
    // actually work. The location term in the query does the real narrowing;
    // this stops an Indian search coming back ordered for an American reader.
    // Empty on a profile extracted before country_code existed, which is the
    // old worldwide behaviour rather than a broken one.
    const jobs=await apifyBoardSearch(qs,p.profile.country_code||"",setSearchInfo);
    const n=addJobs(jobs);
    await save(); busy=false; render();
    setSearchInfo(n
      ? `Added ${n} from ${qs.length} searches.`
      : `Searched ${qs.length} boards, nothing new came back.`);
    await autoScore();
  }catch(e){
    busy=false; render();
    if(e.message==='NEEDAPIFY'){ keyDialog(()=>runBoards(trk,where)); return; }
    setSearchInfo(e.message);
  }
}

async function onProfileFile(text,name){
  if(!String(text||'').trim()){ ONB.step=0; ONB.error="That file came through empty."; render(); return; }
  ONB.raw=text; ONB.fileName=name||'profile.md'; ONB.step=1; ONB.parsed=null; ONB.error='';
  render();
  try{ ONB.parsed=await extractProfile(text); render(); }
  catch(e){
    ONB.step=0;
    if(e.message==='NEEDKEY'){
      ONB.error="Your file loaded fine — but this needs an Anthropic key to read it.";
      render(); keyDialog(()=>onProfileFile(text,name)); return;
    }
    ONB.error="Your file loaded, but reading it failed. "+e.message;
    render();
  }
}

const PL={x:56,y:20,w:544,h:340};
const plotXY=(f,r)=>({ x:PL.x+(r/100)*PL.w, y:PL.y+(1-f/100)*PL.h });

function plotSVG(){
  const p=P(), scored=p.jobs.filter(isScored);
  // Read once per draw rather than per element: this runs for every dot.
  const cGrid=CV('--line'), cDim=CV('--dim'), cAxis=CV('--muted'),
        cOn=CV('--signal'), cOff=CV('--plot-fade'), cCold=CV('--cold');
  let g='';
  for(let v=0;v<=100;v+=25){
    const y=PL.y+(1-v/100)*PL.h, x=PL.x+(v/100)*PL.w, mid=v===50;
    g+=`<line x1="${PL.x}" y1="${y}" x2="${PL.x+PL.w}" y2="${y}" stroke="${cGrid}" stroke-width="${mid?1:.5}" ${mid?'stroke-dasharray="3 3"':''}/>`;
    g+=`<line x1="${x}" y1="${PL.y}" x2="${x}" y2="${PL.y+PL.h}" stroke="${cGrid}" stroke-width="${mid?1:.5}" ${mid?'stroke-dasharray="3 3"':''}/>`;
    g+=`<text x="${PL.x-9}" y="${y+3.5}" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="${cDim}">${v}</text>`;
    g+=`<text x="${x}" y="${PL.y+PL.h+15}" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="${cDim}">${v}</text>`;
  }
  g+=`<text class="quadlabel" x="${PL.x+PL.w-6}" y="${PL.y+14}" text-anchor="end">APPLY TODAY</text>`;
  g+=`<text class="quadlabel" x="${PL.x+6}" y="${PL.y+14}">DREAM / LONG ODDS</text>`;
  g+=`<text class="quadlabel" x="${PL.x+PL.w-6}" y="${PL.y+PL.h-6}" text-anchor="end">EASY BUT WRONG</text>`;
  g+=`<text x="14" y="${PL.y+PL.h/2}" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="${cAxis}" transform="rotate(-90 14 ${PL.y+PL.h/2})">FIT</text>`;
  g+=`<text x="${PL.x+PL.w/2}" y="${PL.y+PL.h+34}" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="${cAxis}">REACHABILITY</text>`;
  if(RANGE){
    const a=plotXY(RANGE.f1,RANGE.r1), b=plotXY(RANGE.f0,RANGE.r0);
    g+=`<rect x="${Math.min(a.x,b.x)}" y="${Math.min(a.y,b.y)}" width="${Math.abs(b.x-a.x)}" height="${Math.abs(b.y-a.y)}" fill="${cOn}" fill-opacity=".07" stroke="${cOn}" stroke-width="1" stroke-dasharray="4 3"/>`;
  }
  scored.forEach(j=>{
    const f=fitOf(j), r=reachOf(j), pt=plotXY(f,r), open=isOpen(j);
    const inR=!RANGE||(f>=RANGE.f0&&f<=RANGE.f1&&r>=RANGE.r0&&r<=RANGE.r1);
    const col=!open?cDim:(inR?(chOf(j)==='cold'?cCold:cOn):cOff), rad=!open?3:(inR?5.5:3.5);
    // With a box drawn, everything outside it drops back hard so the selection
    // reads as the answer rather than as one more thing on a busy chart.
    const dim=RANGE&&!inR ? .28 : (inR&&open?.85:.5);
    const tip=`<title>${esc(j.title)} — ${esc(j.company)}
fit ${f} · reach ${r} · ${chOf(j)}</title>`;
    // Posted roles are circles, cold targets squares. Same axes, different action:
    // one you apply to, the other you have to start the conversation yourself.
    g += chOf(j)==='cold'
      ? `<rect class="dot" data-idx="${p.jobs.indexOf(j)}" x="${(pt.x-rad).toFixed(1)}" y="${(pt.y-rad).toFixed(1)}" width="${(rad*2).toFixed(1)}" height="${(rad*2).toFixed(1)}" fill="${col}" fill-opacity=".08" stroke="${col}" stroke-width="1.6" stroke-opacity="${RANGE&&!inR?.3:(inR&&open?.95:.5)}">${tip}</rect>`
      : `<circle class="dot" data-idx="${p.jobs.indexOf(j)}" cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="${rad}" fill="${col}" fill-opacity="${dim}" stroke="${col}" stroke-width="1" stroke-opacity="${RANGE&&!inR?.3:1}">${tip}</circle>`;
  });
  if(!scored.length) g+=`<text x="${PL.x+PL.w/2}" y="${PL.y+PL.h/2}" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="${cDim}">Nothing scored yet</text>`;
  return g;
}

function inRange(j){
  if(CHFILT!=='all' && chOf(j)!==CHFILT) return false;
  if(!RANGE) return true;
  const f=fitOf(j), r=reachOf(j);
  return f>=RANGE.f0&&f<=RANGE.f1&&r>=RANGE.r0&&r<=RANGE.r1;
}
function ranked(){ const p=P();
  return p.jobs.map((j,i)=>({j,i})).filter(x=>isScored(x.j)&&inRange(x.j)).sort((a,b)=>rankOf(b.j)-rankOf(a.j)); }

/* Newest first. Rows added before 'added' existed have no date, so index order
   stands in for it — the jobs array is append-only, so a higher index is always
   the later arrival. Dated rows sort above undated ones for the same reason. */
function byNewest(list){
  return list.slice().sort((a,b)=>{
    const da=a.j.added||'', db=b.j.added||'';
    if(da&&db&&da!==db) return db.localeCompare(da);
    if(da&&!db) return -1;
    if(!da&&db) return 1;
    return b.i-a.i;
  });
}
/* Freshest first. Rank says whether a job is worth doing; age says whether it
   is still there, and an eight-week-old posting is usually filled however well
   it scores. Undated rows sort last: not knowing when something was posted is
   not the same as it being old. */
function byPosted(list){
  return list.slice().sort((a,b)=>{
    const x=ageOf(a.j), y=ageOf(b.j);
    if(x===null&&y===null) return rankOf(b.j)-rankOf(a.j);
    if(x===null) return 1;
    if(y===null) return -1;
    return (x-y) || (rankOf(b.j)-rankOf(a.j));
  });
}
const sortList = rows => SORT==='new' ? byNewest(rows) : SORT==='posted' ? byPosted(rows) : rows;

function flagHtml(s){
  const good=['strong_fit','non_traditional_friendly','rare_combination_fit'];
  const bad=['wrong_role_shape','location_ineligible','credential_gated','seniority_too_high','seniority_too_low','high_competition'];
  return String(s||'').split(',').filter(Boolean).map(f=>
    `<span class="flag ${good.includes(f)?'g':bad.includes(f)?'r':''}">${esc(f.replace(/_/g,' '))}</span>`).join('');
}
function jobCard(j,i,hi){

  const cls = st==='live' ? 'st-live' : due ? 'st-due' : 'ch-'+ch;
  const stLabel = st==='sent' && due ? 'due' : st;
  const cts=listOf(j,'contacts'), ev=listOf(j,'events');
  const silent = daysSilent(j);
  return `<div class="job ${cls} ${st==='closed'?'done':''}">
    <div class="jrow"><div style="flex:1;min-width:0">
      <div class="jt">${esc(j.title||'(untitled)')}</div>
      <div class="jc">${esc(j.company||'\u2014')}${j.location?' \u00b7 '+esc(j.location):''}</div>
      <div class="flags" style="margin-top:7px">

        ${ageChip(j)}
        ${st==='sent'&&silent?`<span class="stage s-sent">${silent}d silent</span>`:''}
        ${cts.length?`<span class="stage">${cts.length} contact${cts.length>1?'s':''}</span>`:''}

        <div class="sm">fit ${f}</div>

    <div class="bar"><i style="width:${f}%;background:var(--${ch})"></i></div>
    <div class="bar"><i style="width:${r}%;background:var(--neutral)"></i></div>
    ${j.ai_reason?`<p class="jreason">${esc(j.ai_reason)}</p>`:''}
    ${j.ai_flags?`<div class="flags">${flagHtml(j.ai_flags)}</div>`:''}
    ${ev.length?`<div class="log"><span class="when">${esc(ev[0].on)}</span> \u00b7 <b>${esc(ev[0].kind)}</b> ${esc(ev[0].text).slice(0,120)}</div>`:''}
    <div class="jacts">

      ${st==='new'
        ? `<button class="btn-go btn-sm" data-act="pitch" data-i="${i}">${ch==='cold'?'Write the DM':'Draft outreach'}</button>
           <button class="btn-sm" data-act="sent" data-i="${i}">${ch==='cold'?'Mark contacted':'Mark applied'}</button>`
        : ''}
      ${st==='sent'
        ? `${due?`<button class="btn-go btn-sm" data-act="chase" data-i="${i}">Write the chase</button>`:''}
           <button class="btn-sm" data-act="live" data-i="${i}">They replied</button>`
        : ''}

/* ═══ the daily view ═══
   Ordered by what is actually worth doing, not by score. A live conversation
   beats ten new applications, and a chase that is three days overdue beats a
   fresh application, because the cost of losing it is already sunk. New work
   comes last on purpose — it is the most tempting and the least urgent. */
/* The single next action, worked out from state instead of left to the reader.
   Order matters: a person who owes someone a reply should be told that before
   they're told about a promising new listing. Returns null only when there is
   genuinely nothing to do. */
function nextStep(){
  const p=P(), jobs=p.jobs;
  if(!jobs.length) return {cls:'',h:'Nothing in the tracker yet',
    s:'Start with companies worth approaching — it works out who would want you, then checks which are hiring.',
    b:'Suggest companies for me', act:'suggest'};

  const unscored=jobs.filter(j=>!isScored(j)).length;
  if(unscored) return {cls:'',h:`${unscored} job${unscored>1?'s':''} not scored yet`,
    s:'Scoring reads each one against your background and rates fit and reachability separately.',
    b:'Score them', act:'score'};

  const due=jobs.filter(isDue).length;
  if(due) return {cls:'warn',h:`${due} follow-up${due>1?'s':''} overdue`,
    s:'These were sent over a week ago with no reply. A short nudge beats starting somewhere new.',
    b:'Open follow-ups', act:'follow'};

  const live=jobs.filter(j=>stOf(j)==='live').length;
  if(live) return {cls:'calm',h:`${live} live conversation${live>1?'s':''}`,
    s:'Someone is actually on the other end of these. They are worth more than anything else on the board.',
    b:'Open follow-ups', act:'follow'};

  const fresh=ranked().filter(x=>stOf(x.j)==='new'&&isOpen(x.j));
  if(fresh.length){ const t=fresh[0];
    return {cls:'',h:`${fresh.length} scored and untouched`,
      s:`Best of them: ${t.j.title}${t.j.company?' at '+t.j.company:''} — fit ${fitOf(t.j)}, reachability ${reachOf(t.j)}.`,
      b:'Open it', act:'job:'+t.i};
  }
  return {cls:'calm',h:'Clear for today',
    s:'Everything scored has been actioned or closed. Pull in more roles when you want the next batch.',
    b:'Find more jobs', act:'suggest'};
}

/* Fresh is under a fortnight, stale is over two months; in between is just
   how old most live postings are. The title says where the date came from,
   because an estimate and a feed date look identical otherwise. */
function ageChip(j){
  const n=ageOf(j); if(n===null) return '';
  const src=String(j.posted_src||'');
  const cls=n<=14?'hot':n>60?'stale':'';
  const how=src==='feed'?'stated by the source'
          :src==='page'?'read from the search result'
          :src==='est' ?'estimated from the description \u2014 treat as approximate'
          :'';
  return `<span class="stage s-age ${cls} ${src==='est'?'guess':''}" title="Posted ${esc(j.posted_lo===j.posted_hi?j.posted:j.posted_lo+' to '+j.posted_hi)}${how?' \u2014 '+how:''}">${esc(ageLabel(j))}</span>`;
}

/* Freshest first, which is the one ordering the rest of the app cannot give.
   Rank answers "is this worth doing", recency answers "is it still there" —
   an eight-week-old posting is usually filled or abandoned however well it
   scores. Undated rows are listed at the end rather than dropped: not knowing
   when something was posted is not the same as it being old. */
/* One section of job cards. Every list view renders these and had a private
   copy each. */
const sect=(cls,title,sub,rows)=>rows.length?`<div class="sect ${cls}">
    <div class="sect-h"><h3>${title}</h3><span class="ct">${rows.length}</span></div>
    <p class="sect-sub">${sub}</p>
    ${rows.map(x=>jobCard(x.j,x.i)).join('')}</div>`:'';

/* The same section, folded away: rows that are real but not what you came for
   -- under the bar, not yet scored, already closed. Reachable without being
   scrolled past. Capped, because a fold can hold hundreds. */
const foldSect=(key,title,sub,rows)=>rows.length?`<details class="fold" data-fold="${key}" ${FOLDS[key]?'open':''} style="margin-bottom:26px">
    <summary>${title}<span class="num" style="font-size:12px;color:var(--dim);margin-left:7px">${rows.length}</span></summary>
    <div class="foldbody">
      <p class="sect-sub">${sub}</p>
      ${rows.slice(0,LIST_CAP).map(x=>jobCard(x.j,x.i)).join('')}
      ${rows.length>LIST_CAP?`<p class="hint">${rows.length-LIST_CAP} more not shown. Narrow with the channel filter, or sort to bring what you want to the top.</p>`:''}
    </div></details>`:'';

/* ═══ Unapplied ═══
   Everything still to decide on, in the order worth deciding it. Two bands
   above the bar, because "worth doing" and "worth doing first" are different
   answers and a flat list of forty gives neither. Under the bar and not-yet-
   scored both fold away rather than vanish: a low score is a judgement, and an
   unscored row has not been judged at all.

   Honours the channel filter, which is right there in the header. Ignores the
   map's drag-selection on purpose -- a box drawn yesterday quietly shortening
   this list tomorrow morning is the kind of invisible state that makes a tool
   untrustworthy. */
const WORK_FIT=65, WORK_REACH=45, STRONG_FIT=75, STRONG_REACH=55;

function renderUnapplied(){
  const p=P();
  const mine=p.jobs.map((j,i)=>({j,i}))
    .filter(x=>isOpen(x.j) && stOf(x.j)==='new' && (CHFILT==='all'||chOf(x.j)===CHFILT));
  if(!mine.length) return `<div class="empty"><b>Nothing waiting</b>
    Everything here has been actioned or closed. Pull in more roles when you want the next batch.</div>`;

  const scored=mine.filter(x=>isScored(x.j));
  const unscored=mine.filter(x=>!isScored(x.j));
  const isStrong=x=>fitOf(x.j)>=STRONG_FIT&&reachOf(x.j)>=STRONG_REACH;
  const overBar=x=>fitOf(x.j)>=WORK_FIT&&reachOf(x.j)>=WORK_REACH;
  const strong=sortList(scored.filter(isStrong));
  const worth =sortList(scored.filter(x=>!isStrong(x)&&overBar(x)));
  const below =sortList(scored.filter(x=>!overBar(x)));

  return `<div class="listhead">
      <span style="color:var(--muted);font-size:12px">${mine.length} to decide on</span>
      <div class="spacer"></div>
      <span class="eyebrow">Sort</span>
      <div class="segs">
        <button class="seg ${SORT==='rank'?'on':''}" data-sort="rank">Best</button>
        <button class="seg ${SORT==='posted'?'on':''}" data-sort="posted">Recently posted</button>
        <button class="seg ${SORT==='new'?'on':''}" data-sort="new">Recently added</button>
      </div>
    </div>
    ${sect('live','Do these first',`Fit ${STRONG_FIT}+ and reachability ${STRONG_REACH}+. Good work you have a real chance at \u2014 start at the top and go down.`,strong)}
    ${sect('','Worth a shot','Over the bar but not by much. Worth an application, not a whole morning each.',worth)}
    ${(!strong.length&&!worth.length)?`<div class="empty"><b>Nothing clears the bar</b>
      ${scored.length?`${scored.length} scored here, none at fit ${WORK_FIT}+ and reachability ${WORK_REACH}+. Either this batch was weak or you have worked through it \u2014 pull in more roles.`:'None of these have been scored yet.'}</div>`:''}
    ${foldSect('below','Below the bar',`Scored under fit ${WORK_FIT} or reachability ${WORK_REACH}. Kept, because a score is a judgement rather than a fact.`,below)}
    ${foldSect('unscored','Not scored yet','Invisible to ranking until something reads them. Scoring runs on its own as they arrive.',unscored)}`;
}

/* ═══ Applied — review ═══
   Everything already sent, which is a different question from what to do next.
   Cold approaches land here too: the app calls those contacted rather than
   applied, but the review is the same one. Ordered by how long it has been
   silent, because that is what decides whether to chase.

   Closed sits folded at the bottom. Anything that got this far carries history
   -- who you spoke to, what they said -- so it is never deleted, only tidied
   away. Rows closed without ever being sent never reach here: they carry
   nothing, and retention clears them on its own. */
function renderApplied(){
  const p=P();
  const all=p.jobs.map((j,i)=>({j,i})).filter(x=>CHFILT==='all'||chOf(x.j)===CHFILT);
  const bySilent=(a,b)=>daysSilent(b.j)-daysSilent(a.j);
  const due    =all.filter(x=>isDue(x.j)).sort(bySilent);
  const live   =all.filter(x=>stOf(x.j)==='live').sort(bySilent);
  const waiting=all.filter(x=>stOf(x.j)==='sent'&&!isDue(x.j)).sort(bySilent);
  const closed =all.filter(x=>stOf(x.j)==='closed').sort(bySilent);

  if(!due.length&&!live.length&&!waiting.length&&!closed.length){
    return `<div class="empty"><b>Nothing sent yet</b>
      Anything you mark applied or contacted lands here, so you can chase it without hunting through the whole list.</div>`;
  }
  const oldest=[...due,...waiting,...live].reduce((m,x)=>Math.max(m,daysSilent(x.j)),0);
  return `<div class="stats">
      <div class="stat"><div class="k num" style="color:var(--warn)">${due.length}</div><div class="l">overdue</div></div>
      <div class="stat"><div class="k num" style="color:var(--live)">${live.length}</div><div class="l">in conversation</div></div>
      <div class="stat"><div class="k num" style="color:var(--neutral)">${waiting.length}</div><div class="l">waiting</div></div>
      <div class="stat"><div class="k num">${oldest}</div><div class="l">days, longest silence</div></div>
    </div>
    ${sect('due','Overdue a chase',`Past the ${FOLLOWUP_DAYS}-day mark with no reply. One nudge is worth sending; a second rarely is.`,due)}
    ${sect('live','In conversation','Someone replied. Keep these moving before anything else.',live)}
    ${sect('','Still waiting','Sent recently and not yet due. Nothing to do but leave them alone.',waiting)}
    ${foldSect('closed','Closed','Ended, withdrawn or turned down. Kept for the record \u2014 reopening puts one back in Unapplied.',closed)}`;
}

/* ═══ Dashboard ═══
   The three things a list cannot show: the shape of the pipeline, how old the
   board has got, and what has actually been happening lately. The activity feed
   is built from the per-job event logs, which until now could only be read one
   job at a time -- every note, reply and application is already in there. */
function renderDash(){
  const p=P(), jobs=p.jobs;
  if(!jobs.length) return `<div class="empty"><b>Nothing to summarise yet</b>
    Find some roles and this fills in: what is in the pipeline, how fresh it is, and what you have been doing.</div>`;

  const cnt=st=>jobs.filter(j=>stOf(j)===st).length;
  const nNew=cnt('new'), nSent=cnt('sent'), nLive=cnt('live'), nClosed=cnt('closed');
  const dated=jobs.filter(j=>ageOf(j)!==null);
  const week=dated.filter(j=>ageOf(j)<=7).length;
  const fortnight=dated.filter(j=>ageOf(j)<=14).length;
  const stale=dated.filter(j=>ageOf(j)>60).length;
  const undated=jobs.length-dated.length;
  const goingSoon=jobs.filter(j=>!hasHistory(j)&&j.added)
    .filter(j=>{const left=KEEP_UNTOUCHED_DAYS-dayDiff(j.added,today()); return left>=0&&left<=2;}).length;

  const feed=[];
  jobs.forEach((j,i)=>listOf(j,'events').forEach(e=>feed.push({on:e.on,kind:e.kind,text:e.text,j,i})));
  feed.sort((a,b)=>String(b.on).localeCompare(String(a.on)));

  const row=(label,n,col)=>{
    const w=jobs.length?Math.round(n/jobs.length*100):0;
    return `<div style="display:flex;align-items:center;gap:11px;margin-bottom:8px">
      <span style="width:96px;font-size:12px;color:var(--muted)">${label}</span>
      <span style="flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden"><i style="display:block;height:100%;width:${w}%;background:${col}"></i></span>
      <span class="num" style="width:36px;text-align:right;font-size:12.5px">${n}</span></div>`;
  };

  return `<div class="sect">
      <div class="sect-h"><h3>Pipeline</h3><span class="ct">${jobs.length}</span></div>
      <p class="sect-sub">Where everything stands. A live conversation is worth more than any number of new rows.</p>
      <div class="card">
        ${row('Unapplied',nNew,'var(--signal)')}
        ${row('Sent',nSent,'var(--neutral)')}
        ${row('In conversation',nLive,'var(--live)')}
        ${row('Closed',nClosed,'var(--dim)')}
      </div>
    </div>

    <div class="sect">
      <div class="sect-h"><h3>Freshness</h3><span class="ct">${dated.length} dated</span></div>
      <p class="sect-sub">How old the board has got. A stale posting is usually filled however well it scores \u2014 an italic age on a card was estimated rather than stated.</p>
      <div class="stats" style="margin-top:0">
        <div class="stat"><div class="k num" style="color:var(--posted)">${week}</div><div class="l">this week</div></div>
        <div class="stat"><div class="k num">${fortnight}</div><div class="l">last 14 days</div></div>
        <div class="stat"><div class="k num" style="color:var(--dim)">${stale}</div><div class="l">over 60 days</div></div>
        <div class="stat"><div class="k num" style="color:var(--dim)">${undated}</div><div class="l">undated</div></div>
      </div>
      <p class="hint" style="margin-top:0">Untouched rows are cleared ${KEEP_UNTOUCHED_DAYS} days after they arrive.${
        PURGED?` ${PURGED} went on this load.`:''}${
        goingSoon?` ${goingSoon} due to go within two days \u2014 act on one to keep it.`:''}</p>
    </div>

    <div class="sect">
      <div class="sect-h"><h3>Recent activity</h3><span class="ct">${feed.length}</span></div>
      <p class="sect-sub">Everything you have logged, newest first, across every job.</p>
      ${feed.length?`<div class="card">${feed.slice(0,14).map(e=>`
        <div class="ct-row" style="align-items:baseline">
          <span class="num" style="font-size:11px;color:var(--dim);width:72px;flex-shrink:0">${esc(e.on)}</span>
          <span class="stage" style="flex-shrink:0">${esc(e.kind)}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px">${esc(e.j.company||'\u2014')}<span style="color:var(--muted)"> \u00b7 ${esc(e.j.title||'')}</span></div>
            ${e.text?`<div style="font-size:12px;color:var(--muted)">${esc(e.text)}</div>`:''}
          </div>
          <button class="btn-sm" data-act="open" data-i="${e.i}" style="flex-shrink:0">Open</button>
        </div>`).join('')}</div>`
      :`<div class="empty">Nothing logged yet. Marking a job applied, or logging a note on one, writes its first line here.</div>`}
    </div>`;
}

function renderApp(){
  /* Read the disclosures back before the markup that replaces them is built.
     The toggle event fires asynchronously, so a render triggered promptly after
     a click would run before it and rebuild the panel shut -- which is the one
     thing FOLDS exists to stop. The DOM is the truth; ask it here. */
  document.querySelectorAll('[data-fold]').forEach(d=>{ FOLDS[d.dataset.fold]=d.open; });
  const p=P(), prof=p.profile;

      THEME==='auto'
        ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none"/></svg> Auto'
        : THEME==='light'
        ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg> Light'
        : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="vertical-align:-2px"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg> Dark'
    }</button>
    <button class="btn-sm" id="btnSwitch">Switch profile</button>
    ${CLOUD&&USER?`<button class="btn-sm" id="btnSignOut" title="${esc(userName())}">Sign out</button>`:''}
  </div>
  <div id="syncInfo" class="err" style="display:none;margin:0 22px"></div>
  <div class="wrap">
    <div class="side ${TOOLS?'open':''}">
      <div class="sheet-head">
        <span class="eyebrow">Tools</span>
        <div class="spacer"></div>
        <button class="btn-sm" id="tbClose">Close</button>
      </div>
      <div class="block"><span class="eyebrow">Direction</span>
        <select id="trackSel">${(prof.tracks||[]).map(t=>
          `<option value="${esc(t.id)}" ${t.id===p.track?'selected':''}>${esc(t.label)} · ${esc(t.difficulty||'')}</option>`).join('')}</select>
        <div class="hint">${esc(trk.why||'')}</div>
        <div class="btn-row" style="margin-top:9px">
          <button class="btn-sm" id="btnProfile" style="flex:1">My profile</button>
          <button class="btn-sm" id="btnAddTrack" style="flex:1">+ Direction</button></div>
        ${trk.custom?`<button class="btn-sm" id="btnTrackInfo" style="width:100%;margin-top:7px">Why this rating</button>`:''}
      </div>
      <div class="block"><span class="eyebrow">Find work</span>
        <label class="lab">Location</label>
        <input type="text" id="sqLoc" placeholder="anywhere"
          value="${esc(WHERE!==null?WHERE:String(prof.location||'').split(',')[0].trim())}">
        <p class="hint">Narrows the big portals to this place, and to anything remote. Blank searches worldwide. This field's own registries are always read in full.</p>
        <button class="btn-go btn-sm" id="btnBoards" style="width:100%;margin-top:7px" ${busy?'disabled':''}>
          ${busy?'<span class="spin"></span> Searching…':'Search the job boards'}</button>
        ${(trk.boards||[]).length
          ? `<div class="chips" style="margin-top:8px">${trk.boards.slice(0,6).map(b=>`<span class="chip">${esc(b)}</span>`).join('')}</div>
             <p class="hint">${PORTALS.length} general portals plus these registries, through Google in one run.</p>`
          : `<p class="hint">${PORTALS.length} general portals through Google. This track named no specialist registries.</p>`}
        <div id="searchInfo" class="hint"></div>

        <details class="fold" data-fold="add" ${FOLDS.add?'open':''}>
          <summary>Other ways to add</summary>

            <button class="btn-go btn-sm" id="btnSuggest" style="width:100%" ${busy?'disabled':''}>

      </div>

          <span style="flex:1">${busy?'Scoring\u2026':AUTO?'Scoring new jobs automatically':'Auto-scoring is off'}</span>
          <span class="num">${scored.length}/${p.jobs.length}</span>
        </div>
        ${busy?'<div class="prog"><i id="progBar" style="width:0"></i></div>':''}

            <button class="btn-sm" id="btnRescore" style="margin-top:8px;width:100%" ${busy?'disabled':''}>Rescore everything</button>

            <label class="hint" style="display:flex;align-items:center;gap:7px;margin-top:10px;cursor:pointer">
              <input type="checkbox" id="cbAuto" ${AUTO?'checked':''} style="accent-color:var(--signal);cursor:pointer">
              Score new jobs automatically as they arrive</label>
          </div>
        </details>
      </div>
      <details class="fold block" data-fold="data" ${FOLDS.data?'open':''}>
        <summary>Data &amp; keys</summary>
        <div class="foldbody">
          <button class="btn-go btn-sm" id="btnData" style="width:100%">Backup &amp; transfer</button>
          <div class="btn-row" style="margin-top:7px">
            <button class="btn-sm" id="btnKey" style="flex:1">${KEY?'Keys':'Set up keys'}</button>
            <button class="btn-sm" id="btnExport" style="flex:1">Export CSV</button></div>
          <div class="btn-row" style="margin-top:7px">
            <button class="btn-sm" id="btnTrim" style="width:100%">Trim to top ${KEEP_TOP}</button></div>
          <p class="hint">Bins the scored roles you never acted on that rank below the top ${KEEP_TOP}. Anything you applied to, contacted or logged against is kept whatever it scored.</p>
          <div class="btn-row" style="margin-top:8px">
            <button class="btn-sm" id="btnClear" style="width:100%">Clear jobs</button></div>
          ${CLOUD&&USER?`<div class="btn-row" style="margin-top:8px">
            <button class="btn-sm" id="btnWipe" style="width:100%;color:var(--warn);border-color:var(--warn-line)">Delete everything in my account</button></div>
          <p class="hint">Erases every profile, job, CV and note stored against ${esc(userName()||'this account')}, on every device. The account itself stays. There is no undo.</p>`:''}
          <p class="hint">${CLOUD&&USER?'Saved to your account and to this browser.':'Stored in this browser only \u2014 clearing site data wipes it. Take a backup.'}</p>
        </div>
      </details>
    </div>
    <div class="main">
      ${(()=>{ const n=nextStep(); return n?`<div class="next ${n.cls}">
        <div style="flex:1;min-width:220px">
          <div class="nh">${esc(n.h)}</div>

        <button class="btn-go" id="btnNext" data-next="${esc(n.act)}" ${busy?'disabled':''}>${esc(n.b)}</button>

      <div class="tabs">
        <div class="tab ${TAB==='unapplied'?'on':''}" data-tab="unapplied">Unapplied${
          unappliedCount?` <span class="tabct">${unappliedCount}</span>`:''}</div>
        <div class="tab ${TAB==='applied'?'on':''}" data-tab="applied">Applied${
          appliedCount?` <span class="tabct${appliedDue?' due':''}">${appliedCount}</span>`:''}</div>
        <div class="tab ${TAB==='map'?'on':''}" data-tab="map">Map</div>

          <span class="num" style="font-size:11px;color:${RANGE?'var(--signal)':'var(--muted)'}">${RANGE
            ? `${inr.length} of ${scored.length} selected · fit ${Math.round(RANGE.f0)}–${Math.round(RANGE.f1)} · reach ${Math.round(RANGE.r0)}–${Math.round(RANGE.r1)}`
            : `showing all ${scored.length}`}</span>
          <button class="btn-sm" id="btnReset" ${RANGE?'':'disabled'}>Reset range</button></div>
          <svg class="plot" id="plot" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet">${plotSVG()}</svg></div>
        <div class="stats">${[[p.jobs.length,'held'],[posted,'posted ●'],[cold,'cold □'],[inr.length,'in range'],[strong,'worth doing'],[applied,'actioned']]
          .map(([k,l])=>`<div class="stat"><div class="k num">${k}</div><div class="l">${l}</div></div>`).join('')}</div>
        ${scored.length?`<p style="color:var(--muted);font-size:12px;margin:0">Top-right is where to spend today: work you can do, at places likely to reply. A dot high on the left is a good job you probably won't win — worth one shot, not a week.</p>`
          :`<div class="empty"><b>The map fills in after scoring</b>Add some jobs on the left, then hit score.</div>`}
      </div>`}
      ${TAB!=='unapplied' ? '' : `<div>${renderUnapplied()}</div>`}
      ${TAB!=='applied'   ? '' : `<div>${renderApplied()}</div>`}
      ${TAB!=='dash'      ? '' : `<div>${renderDash()}</div>`}
    </div>
  </div>
  <div id="scrim"></div>
  <div id="toolbar">
    <button class="btn-go" id="tbTools" style="flex:1">${TOOLS?'Close':'Find work &amp; tools'}</button>
  </div>`;

/* ═══ plot drag ═══ */
function bindPlot(){
  const svg=$('#plot'); if(!svg) return;
  let start=null;
  const toPlot=ev=>{ const pt=svg.createSVGPoint(); const t=ev.touches?ev.touches[0]:ev;
    pt.x=t.clientX; pt.y=t.clientY; const m=svg.getScreenCTM(); if(!m) return null;
    const q=pt.matrixTransform(m.inverse());
    return { r:Math.max(0,Math.min(100,(q.x-PL.x)/PL.w*100)), f:Math.max(0,Math.min(100,(1-(q.y-PL.y)/PL.h)*100)) }; };
  const down=ev=>{ if(ev.target.classList.contains('dot')) return;
    const p=toPlot(ev); if(!p) return; start=p; ev.preventDefault(); };
  const move=ev=>{ if(!start) return; const p=toPlot(ev); if(!p) return;
    RANGE={f0:Math.min(start.f,p.f),f1:Math.max(start.f,p.f),r0:Math.min(start.r,p.r),r1:Math.max(start.r,p.r)};
    svg.innerHTML=plotSVG(); };
  const up=()=>{ if(start&&RANGE&&(RANGE.f1-RANGE.f0<4||RANGE.r1-RANGE.r0<4)) RANGE=null;
    if(start){ start=null; render(); } start=null; };
  svg.addEventListener('mousedown',down); svg.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up); window.addEventListener('touchend',up);
  // A dot is the job, so clicking it goes to the posting. Cold targets have no
  // posting to open, and neither do rows added by hand, so those fall back to
  // the detail view rather than doing nothing.
  svg.addEventListener('click',ev=>{
    if(!ev.target.classList.contains('dot')) return;
    const idx=parseInt(ev.target.dataset.idx,10), j=P().jobs[idx];
    if(j && j.url) window.open(j.url,'_blank','noopener');
    else showJob(idx);
  });
}

/* ═══ backup, restore, and sharing ═══
   Everything lives in this browser's storage, which is durable but not
   permanent — clearing site data wipes it, and there is no server copy. So a
   real export matters more here than it would in a hosted app.

   Keys are deliberately kept OUT of the data backup and given their own file.
   A data backup is the thing you keep and pass around; credentials are not, and
   bundling them together is how a key ends up somewhere it shouldn't be. */

function downloadFile(name, text, mime){
  const b=new Blob([text],{type:mime||'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

async function exportBackup(){
  const payload={
    kind:"triage-backup", version:3, exported:today(),
    profiles:DB.profiles, current:DB.current
  };
  downloadFile(`triage-backup-${today()}.json`, JSON.stringify(payload,null,1));
}

async function importBackup(text, mode){
  let d; try{ d=JSON.parse(text); }catch(e){ throw new Error("That isn't a valid backup file."); }
  if(d.kind!=="triage-backup"||!d.profiles) throw new Error("That JSON isn't a triage backup.");
  const incoming=Object.keys(d.profiles).length;
  if(mode==='replace'){ DB.profiles=d.profiles; DB.current=d.current||Object.keys(d.profiles)[0]||null; }
  else {
    // Merge: keep both sides. Colliding ids get a fresh one rather than
    // silently overwriting someone's work.
    Object.entries(d.profiles).forEach(([id,prof])=>{
      const key = DB.profiles[id] ? id+'_'+Math.random().toString(36).slice(2,6) : id;
      DB.profiles[key]=prof;
    });
    if(!DB.current) DB.current=Object.keys(DB.profiles)[0]||null;
  }
  await save();
  return incoming;
}

/* ═══ shared bits ═══ */
function modal(html){
  const d=document.createElement('div'); d.className='modal';
  d.innerHTML=`<div class="box">${html}</div>`;
  d.addEventListener('click',e=>{ if(e.target===d) d.remove(); });
  document.body.appendChild(d); return d;
}
function hookDrop(dropEl,inputEl,handler){
  if(!dropEl) return;
  dropEl.onclick=()=>inputEl.click();
  inputEl.onchange=e=>{ const f=e.target.files[0]; if(f) readFile(f,handler); inputEl.value=''; };
  ['dragenter','dragover'].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.remove('over');}));
  dropEl.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) readFile(f,handler); });
}
function readFile(file,cb){ const r=new FileReader(); r.onload=()=>cb(String(r.result),file.name); r.readAsText(file); }

async function onCsv(text){
  const rows=parseCSV(text);
  const info=$('#csvInfo');
  if(rows.length<2){ if(info) info.innerHTML='<span class="err">That file has no rows.</span>'; return; }
  const head=rows[0].map(h=>String(h).trim().toLowerCase()); const idx={};
  head.forEach((h,i)=>idx[h]=i);
  if(idx.title===undefined){ if(info) info.innerHTML='<span class="err">No "title" column. Needs at least title and company.</span>'; return; }
  let list=rows.slice(1).map(r=>{ const j=blank();
    COLS.forEach(c=>{ if(idx[c]!==undefined) j[c]=String(r[idx[c]]==null?'':r[idx[c]]).trim(); });
    if(!j.status) j.status='New'; if(!j.channel) j.channel='posted'; return j; });

  // The starter template ships with placeholder rows. People import it before
  // clearing them, then wonder why the app is recommending 'Example Corp'.
  // Drop them on the way in rather than letting them reach the scorer, which
  // costs a call to conclude what we can tell from the title.
  const isPlaceholder = j => {
    const blob=(j.title+' '+j.company).toLowerCase();
    return /delete me|example corp|example row|example cold target|somewhere you want to work|another company|^your city$/.test(blob);
  };
  const skipped = list.filter(isPlaceholder).length;
  list = list.filter(j=>!isPlaceholder(j));

  const added=addJobs(list);
  await save(); render();
  const i2=$('#csvInfo');
  if(i2){
    if(!list.length && skipped){
      i2.innerHTML='<span class="err">That was the blank template \u2014 only the example rows were in it. Replace them with real jobs, or use Search to pull some in.</span>';
    } else {
      i2.textContent=`${added} added \u00b7 ${list.length-added} already here`
        + (skipped?` \u00b7 ${skipped} example row${skipped>1?'s':''} skipped`:'');
    }
  }
  if(added) await autoScore();
}

  d.querySelectorAll('[data-stage]').forEach(b=>b.onclick=async()=>{

    await save(); d.remove(); render(); });

function contactDialog(i){

/* Rendered into #tasks, which sits outside #root — render() replaces the whole
   of #root on every state change, and a toast that vanished mid-run would be
   worse than no toast at all. */
function renderTasks(){
  const el=$('#tasks'); if(!el) return;
  el.innerHTML=TASKS.map(t=>`<div class="task ${t.state==='done'?'done':t.state==='error'?'err':''}">
    <div class="tl">${t.state==='running'?'<span class="spin"></span> ':''}${esc(t.label)}</div>
    <div class="ts">${esc(t.status||'')}</div>
    ${t.state==='running'?'':`<div class="btn-row" style="margin-top:9px">
      ${t.state==='done'&&(t.result||[]).length?`<button class="btn-go btn-sm" data-task-open="${t.id}">Review</button>`:''}
      <button class="btn-sm" data-task-drop="${t.id}">Dismiss</button></div>`}
  </div>`).join('');
  el.querySelectorAll('[data-task-open]').forEach(b=>b.onclick=()=>{
    const t=TASKS.find(x=>x.id===b.dataset.taskOpen); if(!t) return;
    dropTask(t.id); hrPick(t);
  });
  el.querySelectorAll('[data-task-drop]').forEach(b=>b.onclick=()=>dropTask(b.dataset.taskDrop));
}
function dropTask(id){ TASKS=TASKS.filter(t=>t.id!==id); renderTasks(); }

function hrRow(c,i){

        ${c.role?`<span style="color:var(--muted);font-size:11px">· ${esc(c.role)}</span>`:''}</div>

      ${c.email?`<div class="ct-meta">${esc(c.email)}</div>`:''}
      ${c.linkedin?`<div class="ct-meta"><a class="lnk" href="${esc(c.linkedin)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(c.linkedin.replace(/^https?:\/\//,'').slice(0,52))}</a></div>`:''}
    </div></label>`;

/* Runs the two-actor chain in findHrContacts and lets the person pick which
   hits are worth keeping — a scraped page can surface a stray email that has
   nothing to do with hiring, so this never adds anything unreviewed. */
function hrDialog(i){
  const p=P(), j=p.jobs[i];
  const trk=(p.profile.tracks||[]).find(t=>t.id===p.track)||{};
  const ctx={ title:j.title, titles:trk.titles||[], description:j.description };
  const d=modal(`<div class="eyebrow">Find a contact</div>
    <h2 style="margin:6px 0 6px">${esc(j.company)}</h2>
    <p style="color:var(--muted);font-size:12.5px;margin:0 0 12px">Searches LinkedIn for two kinds of person at ${esc(j.company)}: anyone in recruiting or HR, and whoever looks like they run the team this role sits in. LinkedIn doesn't publish emails, so any shown here is a guessed firstname.lastname pattern from the company's domain — not confirmed.</p>
    <p class="hint" style="margin-bottom:12px">About a cent of Apify credit, and free for the rest of the week once a company has been looked up. If search finds nobody public at this company, it says so rather than spending more to keep looking — add a name by hand instead. It runs in the background — carry on working and you'll get a note in the corner when it's done.</p>
    <div class="btn-row"><button class="btn-go btn-sm" id="hrGo">Search</button>
      <button class="btn-sm" onclick="this.closest('.modal').remove()">Cancel</button></div>`);
  d.querySelector('#hrGo').onclick=()=>{ d.remove(); startHrSearch(i, ctx); };
}

/* Detached on purpose. An Apify run takes minutes, and a modal held open over
   the whole app for that long stops the person doing the thing they actually
   came here for. The run reports into the corner instead, and the picker only
   appears once there is something to pick. */
function startHrSearch(i, ctx){
  const p=P(), j=p.jobs[i];
  // Held by key, not index: this runs for minutes, and a delete or an import
  // in the meantime would otherwise land the contacts on somebody else's job.
  const t={ id:'t'+(++TASKSEQ), label:'Finding contacts at '+(j.company||'this company'),
            status:'starting…', state:'running', profileId:DB.current, key:keyOf(j), result:null };
  TASKS.push(t); renderTasks();
  findHrContacts(j.company, ctx, s=>{ t.status=s; renderTasks(); })
    .then(res=>{ t.state='done'; t.result=res.list;
      t.status=res.list.length+' worth looking at';
      renderTasks(); })
    .catch(e=>{
      if(e.message==='NEEDAPIFY'){ dropTask(t.id); keyDialog(()=>startHrSearch(i,ctx)); return; }
      // A failed run is still worth a couple of cents of context, so say what
      // went wrong rather than silently dropping the toast.
      t.state='error'; t.status=e.message; renderTasks();
    });
}

function hrPick(t){
  if(DB.current!==t.profileId) return alert('That search was run under a different profile.');
  const p=P(), j=p&&p.jobs.find(x=>keyOf(x)===t.key);
  if(!j) return alert('That job is no longer in the list, so there is nothing to attach these to.');
  const list=t.result||[];
  const d=modal(`<div class="eyebrow">Contacts found</div>
    <h2 style="margin:6px 0 10px">${esc(j.company)}</h2>
    <div class="eyebrow">${list.length} found · untick any that aren't right</div>
    <div style="margin-top:8px;max-height:340px;overflow:auto">${list.map(hrRow).join('')}</div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn-go btn-sm" id="hrAdd">Add selected</button>
      <button class="btn-sm" onclick="this.closest('.modal').remove()">Cancel</button></div>`);
  d.querySelector('#hrAdd').onclick=async()=>{
    const picked=Array.from(d.querySelectorAll('[data-hr]:checked')).map(x=>list[parseInt(x.dataset.hr,10)]);
    if(!picked.length){ d.remove(); return; }
    const arr=listOf(j,'contacts'); picked.forEach(c=>arr.push(c)); setList(j,'contacts',arr);
    logEvent(j,'contact','found '+picked.length+' contact'+(picked.length>1?'s':'')+' via contact search');
    await save(); d.remove(); render();
  };
}
