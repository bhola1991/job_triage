<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Triage</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#111315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>

<style>
  /* ═══ colour ═══
     A neutral ground -- charcoal at night, paper by day -- and four accents,
     each meaning one thing:
       go        do this now, your move, nothing blocking
       due       overdue: past the follow-up date
       closing   the posting is old enough to be filled soon
       awaiting  sent, and the next move is theirs
     Grey is only ever the absence of an instruction. Three rules keep it honest:
     a row carries at most one accent (the nearer deadline wins); a score is never
     an accent (colour says what to do, the number says how good it is); the
     accent is stated on the row's edge, and the card behind it stays plain.
     Reachability stays grey -- a second axis, not a verdict.

     The older names below (signal, warn, posted, live...) are kept so nothing
     that reads them breaks, but they now resolve onto the same law. Every hue in
     the file still goes through this block. */
  :root{
    color-scheme:dark;
    /* The app's own, not in the tokens file: the one brand colour, the hard
       offset shadow, and the light tile the drawn people stand on. */
    --brand:#A98BFF; --hard:#000000; --tile:#EFEFEA; --gnd:#C9C9C0;
    /* Freshness on the map: one hue (the brand purple, never an accent), freshest
       most vivid. Night's own steps -- fresh is lightest here -- not a flip.
       App-only, like --cold: not in design/jobtriage.tokens.json. Each clears
       3:1 on --panel; adjacent steps are close, so a dot also says its age. */
    --fresh-0:#E0C7FF; --fresh-1:#BEA0FF; --fresh-2:#9B80D8; --fresh-3:#7B67A8;
    /* The map's directions: one hue each, in profile order (a colour follows its
       direction, never its rank). Picked to stay clear of the four accents and
       checked with the dataviz palette validator against --panel: lightness
       band, chroma, colour-blind separation of neighbours, 3:1 contrast. */
    --dir-0:#9566F0; --dir-1:#D14BA8; --dir-2:#A38C12; --dir-3:#0F98B5;
    --ink:#111315; --panel:#1A1D21; --panel2:#23272C; --line:#59616A; --hair:#2C3137;
    --text:#ECECE8; --muted:#AEB4BA; --dim:#8D949B;

    --go:#4CC76B;       --on-go:#0E1410;  --go-line:#2B6B3C;       --go-tint:#17301F;
    --due:#FF7A70;      --on-due:#1A0A08; --due-line:#7A3A35;      --due-tint:#3C1F1D;
    --closing:#F5B700;  --closing-line:#6B5410;  --closing-tint:#3A3110;
    --awaiting:#8FA2FF; --awaiting-line:#3B4A99; --awaiting-tint:#1F2850;
    --closed:#4A5058;
    /* A row is a plain card with its accent on the edge, in both themes, so
       every -row value is simply the card's own surface. The names stay
       because the tokens file and the kit carry them. */
    --go-row:#1A1D21; --due-row:#1A1D21;
    --closing-row:#1A1D21; --awaiting-row:#1A1D21;
    --row-pad:10px;

    --signal:#4CC76B; --signal-hi:#63D37F; --on-signal:#0E1410;
    --cool:#4CC76B;
    --warn:#FF7A70;   --warn-line:#7A3A35;
    --good:#4CC76B;   --good-line:#2B6B3C;

    --posted:#4CC76B; --posted-dim:#17301F;
    --cold:#AEB4BA;   --cold-dim:#23272C;
    --neutral:#8D949B; --neutral-line:#59616A;
    --live:#4CC76B;   --live-line:#2B6B3C;
    --stale-line:#2C3137;

    /* tints and washes -- the same names in both themes, different weights */
    --glow1:transparent; --glow2:transparent;
    --signal-tint:#17301F; --signal-tint2:rgba(76,199,107,.04);
    --signal-glow:transparent;
    --good-tint:#17301F;
    --warn-tint:#3C1F1D; --warn-chip:#4A2623;
    --live-tint:#17301F;
    --plot-fade:#4A5058;
    --veil:rgba(0,0,0,.68); --veil-lite:rgba(0,0,0,.5);
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 6px 18px rgba(0,0,0,.4);
    --shadow-lg:0 14px 40px rgba(0,0,0,.5);

    --disp:system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  }

  /* Salmon paper: the pink-brown of a financial daily, darker and warmer than
     the near-white it replaced on 2026-10-15. --line is a warm near-black
     outline, which is what gives this theme its drawn look. Accents darken to hold
     contrast on white. Shadows lose most of their weight -- a heavy shadow on
     white reads as dirt rather than as depth. */
  :root[data-theme="light"]{
    color-scheme:light;
    --brand:#6A41C6; --hard:#2B211C; --tile:#EBD3C1; --gnd:#D2B8A4;
    --fresh-0:#4E0096; --fresh-1:#6539A9; --fresh-2:#7B5DB8; --fresh-3:#907AC3;   /* see the dark block */
    --dir-0:#7340D8; --dir-1:#B8287F; --dir-2:#7A6400; --dir-3:#007A99;   /* validated on salmon and blush */
    --ink:#F4E1D2; --panel:#FCF1E7; --panel2:#EBD3C1; --line:#2B211C; --hair:#E0C6B3;
    --text:#211A16; --muted:#5A4A40; --dim:#6F5E53;

    --go:#1C6B38;       --on-go:#FFFFFF;  --go-line:#1C6B38;       --go-tint:#E1E8D2;
    --due:#B02E2A;      --on-due:#FFFFFF; --due-line:#B02E2A;      --due-tint:#F5D6CE;
    --closing:#7A5000;  --closing-line:#7A5000;  --closing-tint:#F3DFBE;
    --awaiting:#2A45AC; --awaiting-line:#2A45AC; --awaiting-tint:#E2DCE6;
    --closed:#BFAEA2;
    --go-row:#FCF1E7; --due-row:#FCF1E7; --closing-row:#FCF1E7; --awaiting-row:#FCF1E7;
    --row-pad:10px;

    --signal:#1C6B38; --signal-hi:#155530; --on-signal:#FFFFFF;
    --cool:#1C6B38;
    --warn:#B02E2A;   --warn-line:#B02E2A;
    --good:#1C6B38;   --good-line:#1C6B38;

    --posted:#1C6B38; --posted-dim:#E1E8D2;
    --cold:#5A4A40;   --cold-dim:#EBD3C1;
    --neutral:#6F5E53; --neutral-line:#2B211C;
    --live:#1C6B38;   --live-line:#1C6B38;
    --stale-line:#E0C6B3;

    --glow1:transparent; --glow2:transparent;
    --signal-tint:#E1E8D2; --signal-tint2:rgba(28,107,56,.03);
    --signal-glow:transparent;
    --good-tint:#E1E8D2;
    --warn-tint:#F5D6CE; --warn-chip:#F5D6CE;
    --live-tint:#E1E8D2;
    --plot-fade:#BFAEA2;
    --veil:rgba(43,33,28,.45); --veil-lite:rgba(43,33,28,.28);
    /* The shadow colour is --text (20,24,26), per the tokens file. */
    --shadow:0 1px 2px rgba(43,33,28,.07);
    --shadow-md:0 6px 18px rgba(43,33,28,.12);
    --shadow-lg:0 14px 40px rgba(43,33,28,.18);
  }
  /* Blush: the second paper. Same law, same accents a shade deeper, on a pink
     ground a little darker than salmon. App-only -- the tokens file carries one
     light set, and this rides on top of it as data-paper="blush", so every
     rule written for the light theme still applies. */
  :root[data-theme="light"][data-paper="blush"]{
    --ink:#EBD9D5; --panel:#F7EEEB; --panel2:#E2CDC8; --line:#2A2022; --hair:#D6BFBA;
    --text:#21191B; --muted:#574749; --dim:#695A5C;
    --go:#1C6B38; --go-line:#1C6B38; --go-tint:#DCE6D4; --go-row:#F7EEEB;
    --due:#AC2C31; --due-line:#AC2C31; --due-tint:#F2D3D2; --due-row:#F7EEEB;
    --closing:#774E00; --closing-line:#774E00; --closing-tint:#EFDCC0; --closing-row:#F7EEEB;
    --awaiting:#2D44AA; --awaiting-line:#2D44AA; --awaiting-tint:#DDDAEA; --awaiting-row:#F7EEEB;
    --closed:#C2AFAB; --plot-fade:#C2AFAB;
    --signal:#1C6B38; --cool:#1C6B38; --good:#1C6B38; --good-line:#1C6B38; --posted:#1C6B38; --live:#1C6B38; --live-line:#1C6B38;
    --posted-dim:#DCE6D4; --signal-tint:#DCE6D4; --good-tint:#DCE6D4; --live-tint:#DCE6D4;
    --warn:#AC2C31; --warn-line:#AC2C31; --warn-tint:#F2D3D2; --warn-chip:#F2D3D2;
    --cold:#574749; --cold-dim:#E2CDC8; --neutral:#695A5C; --neutral-line:#2A2022; --stale-line:#D6BFBA;
    --hard:#2A2022; --tile:#E2CDC8; --gnd:#C9AFA9;
  }
  *{box-sizing:border-box}
  #app{background:
      radial-gradient(1200px 500px at 15% -10%, var(--glow1), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, var(--glow2), transparent 55%),
      var(--ink);
    color:var(--text);font-family:var(--disp);
    font-size:14px;line-height:1.5;min-height:100vh;margin:0}
  #app h1,#app h2,#app h3{margin:0;font-weight:500;letter-spacing:-0.01em}
  @media(prefers-reduced-motion:no-preference){
    .card,.trk,.qitem,.stat,.chip{animation:rise .45s cubic-bezier(.16,1,.3,1) backwards}
    .qitem:nth-child(3),.trk:nth-child(2){animation-delay:.04s}
    .qitem:nth-child(4),.trk:nth-child(3){animation-delay:.08s}
    .qitem:nth-child(5){animation-delay:.12s}
    .qitem:nth-child(n+6){animation-delay:.16s}
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .spacer{flex:1}

  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:var(--panel);
    position:sticky;top:0;z-index:10}
  .topbar h1{font-size:16px}
  .who{display:flex;align-items:center;gap:9px}
  .av{width:30px;height:30px;border-radius:50%;background:var(--panel2);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:12px;color:var(--signal);flex-shrink:0}
  .who .nm{font-size:13px;line-height:1.2}
  .who .lc{font-size:11px;color:var(--muted);line-height:1.2}
  /* Direction, in the bar. The base select rule is sized for a sidebar's full
     width; here it has to sit on a row of buttons without shouting. */
  select.trkbar{width:auto;max-width:min(260px,38vw);font-size:12px;padding:5px 8px;
    border-radius:5px;background:var(--panel2);color:var(--text)}
  .pill{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:2px;
    border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.on{color:var(--good);border-color:var(--good-line)}
  .pill.due{color:var(--due);background:var(--due-tint);border-color:var(--due-line)}
  .pill.closing{color:var(--closing);background:var(--closing-tint);border-color:var(--closing-line)}
  .pill.awaiting{color:var(--awaiting);background:var(--awaiting-tint);border-color:var(--awaiting-line)}

  /* The day's floor. Reads doneToday, which the app has always computed and
     never shown. Not an accent and not on a row, so the colour law's one-per-row
     rule is not engaged -- it borrows --good the way .pill.on and .sdot.on do. */
  .floor{display:flex;align-items:center;gap:7px;padding:3px 9px 3px 8px;
    border-radius:999px;border:1px solid var(--line);background:var(--panel2)}
  .floor .fdots{display:flex;gap:4px}
  .fdot{width:9px;height:9px;border-radius:50%;box-sizing:border-box;
    border:1.5px solid var(--line);transition:background-color .18s,border-color .18s}
  .fdot.on{background:var(--good);border-color:var(--good)}
  .floor .flab{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
  .floor.met{border-color:var(--good-line);background:var(--good-tint)}
  .floor.met .flab{color:var(--good)}

  /* Tappable UI shouldn't behave like text on a touch screen — without this a
     tap that lingers a few ms selects the label or throws up a callout menu
     instead of registering as a click. */
  button,.tab,.trk,.stp,.dot,.chn,.stage,.pill,.drop,.chip,.tag{
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  button{font-family:var(--disp);font-size:13px;cursor:pointer;border-radius:5px;
    border:1px solid var(--line);background:var(--panel2);color:var(--text);
    padding:8px 13px;transition:transform .12s ease,box-shadow .12s ease,border-color .12s,color .12s,background .12s}
  button:hover:not(:disabled){border-color:var(--signal);color:var(--signal);transform:translateY(-1px)}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.38;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .btn-go{background:var(--signal);color:var(--on-signal);border-color:var(--signal);font-weight:700;
    box-shadow:var(--shadow)}
  .btn-go:hover:not(:disabled){background:var(--signal-hi);color:var(--on-signal);border-color:var(--signal-hi);
    box-shadow:0 4px 14px var(--signal-glow),var(--shadow)}
  .btn-sm{padding:5px 9px;font-size:12px}
  .btn-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

  textarea,input[type=text],input[type=email],input[type=password],select{width:100%;background:var(--ink);color:var(--text);
    border:1px solid var(--line);border-radius:3px;padding:9px;font-family:var(--mono);
    font-size:12px;resize:vertical}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--cool)}
  select{font-family:var(--disp);font-size:13px}
  label.lab{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}

  /* A password you cannot read is a password you mistype, and every mistyped
     one here costs a round trip to find out. */
  .pw{position:relative}
  .pw input{padding-right:62px}
  .pw .rev{position:absolute;right:5px;top:50%;transform:translateY(-50%);
    background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:10.5px;
    letter-spacing:.1em;padding:5px 7px;cursor:pointer}
  .pw .rev:hover:not(:disabled){color:var(--signal);border-color:transparent;
    background:none;transform:translateY(-50%)}
  .pw .rev:active:not(:disabled){transform:translateY(-50%)}

  .drop{border:1px dashed var(--line);border-radius:4px;padding:20px 14px;text-align:center;
    color:var(--muted);font-size:12px;cursor:pointer;transition:.14s}
  .drop:hover,.drop.over{border-color:var(--signal);color:var(--signal)}

  /* ── onboarding ── */
  .onb{max-width:680px;margin:0 auto;padding:48px 22px 80px}
  .onb .lede{font-size:26px;line-height:1.25;margin:14px 0 10px;letter-spacing:-.02em}
  .onb .say{color:var(--muted);margin:0 0 26px;font-size:14px}

  /* The opening page. The three people the app is for stand on a lined floor
     beside their car, and signing in is a card on the same page. It is the
     clean version of what began as a felt-pen drawing: one thin even line,
     flat colour, and the straight-line fill kept for the ground alone.
     Always paper, whatever the theme, so its values are fixed here rather
     than read from :root -- the paper theme's own, by value. No job row is
     ever on this screen, so nothing here is an instruction. */
  .au-scene,.au-strip,.ob-paper{
    --au-ink:#211A16;--au-paper:#F4E1D2;--au-card:#FCF1E7;--au-wash:#EBD3C1;--au-gndl:#D2B8A4;
    --au-yl:#F5B700;--au-rd:#B02E2A;--au-bl:#2A45AC;--au-gr:#1C6B38;--au-brand:#6A41C6}
  .au-scene{
    /* How tall the floor is. Tied to the people's drawn height, so their feet
       and the car's wheels land on the lined ground at every width. */
    --au-floor:min(4.6vw,60px);
    position:relative;overflow:hidden;min-height:100vh;color-scheme:light;
    display:flex;flex-direction:column;align-items:flex-start;
    background:var(--au-paper);color:var(--au-ink);font-size:15px;line-height:1.5}
  /* The floor: the one place the drawing's lines survive, as a quiet band. */
  .au-scene::after,.au-strip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--au-floor);
    background:repeating-linear-gradient(180deg,transparent 0 7px,var(--au-gndl) 7px 8.5px);
    border-top:1.5px solid var(--au-ink)}
  .au-scene::before{content:"";position:absolute;right:9%;top:11%;width:118px;height:118px;border-radius:50%;
    background:var(--au-yl);border:2.5px solid var(--au-ink)}
  .au-people{position:absolute;right:3%;bottom:0;width:min(56%,720px);height:auto;display:block;z-index:2}
  /* The lettered headline for someone who has not been here before: between the
     card and the sun when there is room, a short line under the card on a phone,
     and not at all in between, where the card's own headline carries the page. */
  .au-hero{display:none}
  .au-hero svg{display:block;height:min(34vh,330px);width:auto}
  @media(min-width:1100px) and (min-height:760px){.au-hero{display:block;position:absolute;z-index:2;left:calc(6% + 430px + 7vw);top:52px}}

  .au-sign{position:relative;z-index:3;width:min(430px,88%);margin:58px 0 150px 6%;padding:28px 28px 20px;
    background:var(--au-card);border:2px solid var(--au-ink);border-radius:16px;box-shadow:6px 6px 0 var(--au-ink)}
  .au-name{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--au-brand)}
  #app .au-sign h2{font-size:32px;line-height:1.12;letter-spacing:-.025em;font-weight:750;margin:10px 0 10px}
  .au-pitch{margin:0;font-size:15.5px}
  .au-pitch b{background:linear-gradient(transparent 66%,#FBE08A 66%);font-weight:650}
  .au-sign .au-b{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:20px;
    font-size:15px;font-weight:700;color:var(--au-ink);background:var(--au-card);
    border:1.5px solid var(--au-ink);border-radius:10px;padding:11px 14px}
  .au-sign .au-b:hover:not(:disabled){color:var(--au-ink);border-color:var(--au-ink);background:var(--au-wash);transform:none}
  /* White on this green is 6.5:1. The marker green it replaced was too light to carry white. */
  .au-sign .au-b.au-go,.au-sign .au-b.au-go:hover:not(:disabled){background:var(--au-gr);border-color:var(--au-gr);color:#fff}
  .au-sign .au-b.au-sm{width:auto;margin-top:0;font-size:13.5px;padding:8px 12px}
  .au-g{display:flex;background:#fff;border-radius:50%;padding:3px}
  .au-sign button:focus-visible,.au-sign summary:focus-visible,.au-sign input:focus-visible{
    outline:3px solid var(--au-bl);outline-offset:2px}
  .au-note{margin:12px 0 0;font-size:13.5px;font-weight:600}
  .au-note.au-bad{color:var(--au-rd)}
  .au-mail{margin-top:10px}
  .au-mail>summary{cursor:pointer;font-weight:650;font-size:14px;text-align:center;padding:6px 0;list-style:none;
    text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
  .au-mail>summary::-webkit-details-marker{display:none}
  .au-fields{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .au-fields label.lab{color:var(--au-ink);font-size:12.5px;font-weight:650;margin:4px 0 0}
  .au-fields input[type=text],.au-fields input[type=email],.au-fields input[type=password]{
    font-family:var(--disp);font-size:14px;padding:9px 11px;background:var(--au-card);color:var(--au-ink);
    border:1.5px solid var(--au-ink);border-radius:8px}
  .au-fields input:focus{border-color:var(--au-ink)}
  .au-fields .pw .rev{color:var(--au-ink)}
  .au-fields .hint,.au-sign .au-fine .say{color:var(--au-ink);opacity:.78;margin:0}
  .au-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:8px}
  /* On reset, claim and recover the fields are the screen, not an option under
     a bigger button, so they stand a little clear of the sentence above them. */
  .au-fields.au-solo{margin-top:16px}
  .au-sign .lnk{color:var(--au-ink);border-bottom:1px solid var(--au-ink);font-family:var(--disp);font-weight:500}
  .au-fine{margin-top:16px}
  /* Onboarding, on the same paper. The four setup steps come straight after
     sign-in and show no job rows either, so they stay on its page: the people
     stand in a strip across the top and everything below is the paper theme.
     Done by re-pointing the app's own tokens inside this wrapper rather than
     by restyling each piece, so anything added to onboarding follows without
     work. The values are the paper theme's, fixed, so onboarding does not
     turn charcoal half way through for someone whose device is set to night. */
  .ob-paper{
    color-scheme:light;min-height:100vh;background:var(--au-paper);color:var(--au-ink);
    --ink:var(--au-paper);--panel:var(--au-card);--panel2:var(--au-wash);--line:var(--au-ink);--hair:#E0C6B3;
    --text:var(--au-ink);--muted:#5A4A40;--dim:#6F5E53;
    --signal:var(--au-gr);--signal-hi:#155530;--on-signal:#fff;--cool:var(--au-gr);
    --go:var(--au-gr);--on-go:#fff;--good:var(--au-gr);--go-line:var(--au-gr);--good-line:var(--au-gr);
    --go-tint:#E1E8D2;--good-tint:#E1E8D2;--signal-tint:#E1E8D2;--signal-glow:transparent;
    --warn:var(--au-rd);--due:var(--au-rd);--warn-line:var(--au-rd);--warn-tint:#F5D6CE;

  .ob-paper .trk.sel{background:var(--go-tint);border-color:var(--au-ink);border-width:2px}
  .ob-paper input[type=text],.ob-paper textarea,.ob-paper select{background:var(--au-card);font-family:var(--disp);font-size:14px}
  .ob-paper input:focus,.ob-paper textarea:focus,.ob-paper select:focus{border-color:var(--au-ink);
    outline:3px solid var(--au-bl);outline-offset:2px}
  /* The strip: the same floor and people, as a band rather than a page. */
  .au-strip{--au-floor:34px;position:relative;overflow:hidden;height:170px;background:var(--au-paper);
    border-bottom:1.5px solid var(--au-ink)}

  /* One figure stands over the right edge of the 680px column, not the page. */

  @media(max-width:900px){

    .au-sign{width:auto;margin:20px 16px 0;padding:20px 18px 16px;box-shadow:5px 5px 0 var(--au-ink)}
    #app .au-sign h2{font-size:26px}
    .au-people{position:relative;right:auto;width:100%;margin-top:auto;padding-top:26px}
    .au-hero{display:block;margin:16px 16px 0 22px}.au-hero svg{height:104px}
    .au-sign button,.au-mail>summary{min-height:44px}
  }
  .steps{display:flex;gap:0;margin-bottom:30px;border-bottom:1px solid var(--line)}
  .stp{flex:1;padding:0 0 9px;font-size:11.5px;color:var(--dim);border-bottom:2px solid transparent;
    font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
  .stp.on{color:var(--signal);border-bottom-color:var(--signal)}
  .stp.did{color:var(--good)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px;
    box-shadow:var(--shadow)}
  .card + .card{margin-top:12px}
  .kv{display:grid;grid-template-columns:132px 1fr;gap:8px 14px;font-size:13px}
  .kv .k{color:var(--muted);font-size:12px}

    border:1px solid var(--line);color:var(--muted)}
  .chip.g{color:var(--good);border-color:var(--good-line)}
  .chip.r{color:var(--warn);border-color:var(--warn-line)}

  .trk{border:1px solid var(--line);border-radius:4px;padding:15px;cursor:pointer;
    transition:.14s;background:var(--panel);margin-bottom:10px}

  .trk.sel{border-color:var(--signal);background:var(--panel2)}
  .trk .tl{font-size:15px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:9px}
  .trk .tw{color:var(--muted);font-size:12.5px;margin:0}
  .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:2px 6px;
    border-radius:2px;background:var(--ink);color:var(--dim);text-transform:uppercase}
  .tag.easy{color:var(--good)} .tag.hard{color:var(--warn)} .tag.mid{color:var(--cool)}

  /* ── main app ── */
  /* ═══ one column of work ═══
     The sidebar used to be a permanent 288px column holding Direction, the
     colour key, Find work, Score, and Data & keys. All five are supply: ways
     to get more jobs. The list beside them is demand: jobs to act on. Running
     another search feels like progress and is the most comfortable way to not
     apply to anything, and it was always one click away and always on screen.
     So it is a drawer at every width now rather than only on a phone, and the
     queue gets the canvas. Nothing was taken out of it -- every input, every
     drop target and every button is still in there, and still in the DOM where
     the command palette dispatches by clicking them. */
  .wrap{display:grid;grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(336px,92vw);z-index:45;
    overflow-y:auto;background:var(--panel);padding:18px;
    border-right:1px solid var(--line);box-shadow:var(--shadow-lg);
    transform:translateX(-101%);transition:transform .22s cubic-bezier(.16,1,.3,1)}
  .side.open{transform:translateX(0)}
  .main{padding:20px 22px 60px;min-width:0}
  /* The drawer's own header, with the way out of it. Was display:none because
     a column needs no header; a drawer does, at every width. */
  .sheet-head{display:flex;align-items:center;gap:10px;margin:-4px 0 16px;
    position:sticky;top:-2px;padding:6px 0 10px;background:var(--panel);z-index:1}
  #scrim.on{display:block}

  /* ═══ the decision pane ═══
     One job, read and acted on beside the queue instead of inside it. The list
     keeps its shape when the selection moves, which is the whole point: an
     in-place expand pushed every row below it down the page, so every single
     decision cost you your place and a session ended at the fourth job rather
     than the twentieth.
     Docked as a third column while there is room for all three. Below that it
     overlays as a sheet, on the same pattern and the same z-index family as
     the sidebar already uses when it stops being a column.
     The ladder, bottom to top: #scrim 43, .rail 44 (phone), .side 45,
     #panescrim 46, .pane 47, .palscrim 48, .palbox 49, .modal 50. */
  .wrap.paned{grid-template-columns:minmax(0,1fr) 400px}
  .pane{border-left:1px solid var(--line);background:var(--panel);min-width:0;
    position:sticky;top:60px;align-self:start;max-height:calc(100vh - 60px);
    overflow-y:auto;padding:16px 18px 26px}
  .pane-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  /* jobDetail was drawn for the full width of a row: two columns with a 300px
     rail. In a 400px pane it stacks, and loses the padding and rule that only
     made sense where it sat under the row it belonged to. */
  .pane .qd{grid-template-columns:minmax(0,1fr);row-gap:20px;padding:0;border-top:0}
  .pane .qd-rail{background:var(--ink)}
  #panescrim{display:none}
  @media(max-width:1199px){
    .pane{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:47;
      max-height:86vh;align-self:auto;border-left:0;border-top:1px solid var(--line);
      border-radius:12px 12px 0 0;box-shadow:var(--shadow-lg);
      padding-bottom:calc(22px + env(safe-area-inset-bottom))}
    .pane-head{position:sticky;top:-2px;padding:4px 0 10px;margin:-4px 0 6px;
      background:var(--panel);z-index:1}
    #panescrim{display:block;position:fixed;inset:0;z-index:46;background:var(--veil-lite)}
    /* Everything in the sheet is a touch target, as in the sidebar. */
    .pane button,.pane summary{min-height:44px}
  }
  /* One column again once the pane is out of the flow. There is no longer a
     sidebar column to account for, so this is the same answer at every width
     below the dock and the bands no longer have to be mutually exclusive. */
  @media(max-width:1199px){
    .wrap.paned{grid-template-columns:minmax(0,1fr)}
  }

  /* Sidebar disclosures. Everything in this column is either something you do
     every session (pick a direction, run a search) or something you do twice a
     year (export, trim, rotate a key), and all of it was drawn at one weight.
     The rare half now sits behind one of these. Native <details>, so the open
     and closed states cost no script. */
  .fold{border:1px solid var(--line);border-radius:5px;background:var(--panel2);margin-top:12px}
  .fold > summary{list-style:none;cursor:pointer;padding:9px 11px;font-size:12.5px;
    display:flex;align-items:center;gap:8px;color:var(--text)}
  .fold > summary::-webkit-details-marker{display:none}
  .fold > summary::after{content:'';width:6px;height:6px;margin-left:auto;
    border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);
    transform:translateY(-2px) rotate(45deg);transition:transform .16s}
  .fold[open] > summary::after{transform:translateY(1px) rotate(-135deg)}
  .fold:hover{border-color:var(--cool)}
  .fold > .foldbody{padding:2px 11px 12px}
  /* Scoring runs on its own, so its ordinary state is a fact to read rather
     than a button to press. The button lives in the fold, for the two cases
     that need it: auto switched off, or a backlog past the auto cap. */
  .sidestat{display:flex;align-items:center;gap:8px;font-size:12px;
    color:var(--muted);padding:2px 0 4px}
  .sdot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0}
  .sdot.on{background:var(--good)}

  /* ── narrow screens ──
     This column used to sit BELOW the job list: the old rule was
     .main{order:1}.side{order:2}, which on a phone put every control — search,
     add, score, backup — underneath however many cards were on screen. With
     the list capped at 60 that is a very long scroll to reach the search box,
     and the controls are the reason you opened the app.

     So on a narrow screen the sidebar stops being a column and becomes a sheet,
     opened from a bar pinned to the bottom of the viewport where a thumb
     already rests. Taking it out of flow is also what makes the order rules
     unnecessary rather than merely wrong. */
  /* Below the sheet, above everything else. Toasts sit at 40 and the modal
     layer at 50, so an open sheet never covers a dialog it opened. */
  #scrim{display:none;position:fixed;inset:0;z-index:43;background:var(--veil-lite)}

  /* Turned on below, after the base rules above -- a media query carries no
     extra specificity, so these have to come second to win. */
  @media(max-width:900px){
    /* .wrap.paned carries two classes and so outranks a bare .wrap; it has to
       be named here or the phone layout keeps the sidebar's column. */
    .wrap,.wrap.paned{grid-template-columns:minmax(0,1fr)}
    /* A drawer off the left edge is a desktop gesture. On a phone it comes up
       from the bottom, where the thumb is -- so top, width and the axis it
       slides on are all overridden rather than inherited. */
    .side{left:0;right:0;bottom:0;top:auto;width:auto;
      max-height:82vh;overflow:auto;min-height:0;
      border-right:none;border-top:1px solid var(--line);
      border-radius:12px 12px 0 0;
      padding-bottom:calc(18px + env(safe-area-inset-bottom));
      transform:translateY(101%)}
    .side.open{transform:translateY(0)}
    .main{padding-bottom:96px}
    /* Everything in the sheet is a touch target now, not a pointer target. */
    .side button,.side select,.side .drop,.side summary{min-height:44px}
    /* Everything in an open panel is a touch target too, not just the sidebar. */
    .qd button{min-height:44px}
    .qacts .rowmenu>summary,.rowmenu-pop .btn-sm{min-height:44px}
    #scrim.on{display:block}
    /* No keyboard at this width, so naming two keys is just noise in a header
       that is already doing well to fit. */
    .pane-head .hint{display:none}
  }
  .block{margin-bottom:22px}
  .block > .eyebrow{display:block;margin-bottom:9px}

  .plotwrap{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;
    box-shadow:var(--shadow)}
  .plothead{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;flex-wrap:wrap}
  svg.plot{display:block;width:100%;height:auto;max-height:58vh;touch-action:none;cursor:crosshair}
  /* A phone: one finger scrolls the page over a map that is not zoomed; once
     zoomed, the map takes the finger (pan) -- pinch always belongs to the map. */
  @media(max-width:900px){ svg.plot{max-height:70vh;touch-action:pan-y} svg.plot.zoomed{touch-action:none} }
  /* Cold targets are drawn as unfilled squares, so without this only the 1.6px
     stroke is clickable. pointer-events makes the whole shape a target. */
  .dot{cursor:pointer;pointer-events:all}
  .dot:hover{filter:brightness(1.35)}
  .quadlabel{font-family:var(--mono);font-size:8px;fill:var(--dim);letter-spacing:.1em}

  .stats{display:flex;gap:20px;flex-wrap:wrap;margin:14px 0 22px}
  /* A count is a figure, not an instruction: plain ink unless a caller says why. */
  .stat .k{font-family:var(--mono);font-size:24px;color:var(--text);line-height:1}
  .stat .l{font-size:11px;color:var(--muted);margin-top:3px}

  .stage{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 7px;border-radius:2px;border:1px solid var(--line);color:var(--muted)}

  /* ── dashboard sections ── */
  .sect{margin-bottom:26px}
  .sect-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .sect-h h3{font-size:15px}
  .sect-h .ct{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .sect-sub{color:var(--muted);font-size:12px;margin:0 0 12px}

  .ct-row:first-of-type{border-top:none}
  .ct-nm{font-size:13px}
  .ct-meta{font-size:11px;color:var(--muted);font-family:var(--mono);word-break:break-all}

  /* ═══ the queue ═══
     Ruled rows, not boxes. A bordered card around every job made forty jobs a
     wall of containers; a rule between rows reads as one list. Each row states
     its one instruction on its edge, and every fact on it is a label over a
     value, in columns that line up down the page. */
  .qsec{margin-bottom:28px}
  .deck{display:none}
  /* A wrapper for the phone carousel; on a wide screen it is not there at all. */
  .qcar{display:contents}
  .qsec-h{display:flex;align-items:baseline;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .qsec-h h3{font-size:14px}
  .qsec-h .ct{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .qsec-sub{color:var(--muted);font-size:12px;margin:9px 0 0}
  .qsec.go .qsec-h{border-bottom-color:var(--go)}             .qsec.go h3{color:var(--go)}
  .qsec.due .qsec-h{border-bottom-color:var(--due)}           .qsec.due h3{color:var(--due)}
  .qsec.closing .qsec-h{border-bottom-color:var(--closing)}   .qsec.closing h3{color:var(--closing)}
  .qsec.awaiting .qsec-h{border-bottom-color:var(--awaiting)} .qsec.awaiting h3{color:var(--awaiting)}

  .qitem{border-bottom:1px solid var(--hair)}
  .qitem.closed{opacity:.55}
  .dmark{flex:0 0 12px;vertical-align:-1px;margin-right:6px}
  .qmini,.qhist{display:none}
  /* On a pointer screen a row at rest shows its one button; Read, the menu and
     the thumbnail of the map come up on hover or keyboard focus. */
  @media(hover:hover){

    .qitem:hover .qmini{display:block}
