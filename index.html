/* Detached on purpose. An Apify run takes minutes, and a modal held open over
   the whole app for that long stops the person doing the thing they actually
   came here for. The run reports into the corner instead, and the picker only
   appears once there is something to pick. */
function startHrSearch(i, ctx){
  const p=P(), j=p.jobs[i];
  // Held by key, not index: this runs for minutes, and a delete or an import
  // in the meantime would otherwise land the contacts on somebody else's job.
  const t={ id:'t'+(++TASKSEQ), label:'Finding contacts at '+(j.company||'this company'),
            status:'starting…', state:'running', profileId:DB.current, key:keyOf(j), result:null };
  TASKS.push(t); renderTasks();
  findHrContacts(j.company, ctx, s=>{ t.status=s; renderTasks(); })
    .then(res=>{ t.state='done'; t.result=res.list;
      t.status=res.list.length+' worth looking at';
      /* Kept on the job the moment they arrive (feedback #25): the picker can
         be closed by accident, and a second search costs a second run. Opening
         "Find contacts" again offers these first. */
      if(DB.current===t.profileId){ const jj=P().jobs.find(x=>keyOf(x)===t.key);
        if(jj && res.list.length){ jj.hrfound=JSON.stringify({ on:today(), list:res.list }); save(); } }
      renderTasks(); fbMoment('contacts'); })
    .catch(e=>{
      if(e.message==='NEEDAPIFY'){ dropTask(t.id); keyDialog(()=>startHrSearch(i,ctx)); return; }
      // A failed run is still worth a couple of cents of context, so say what
      // went wrong rather than silently dropping the toast.
      t.state='error'; t.status=e.message; renderTasks(); fbMoment('error');
    });
}

function hrPick(t){
  if(DB.current!==t.profileId) return alert('That search was run under a different profile.');
  const p=P(), j=p&&p.jobs.find(x=>keyOf(x)===t.key);
  if(!j) return alert('That job is no longer in the list, so there is nothing to attach these to.');
  const list=t.result||[];
  const d=modal(`<div class="eyebrow">Contacts found</div>
    <h2 style="margin:6px 0 10px">${esc(j.company)}</h2>
    <div class="eyebrow">${list.length} found · untick any that aren't right</div>

}

   whether the skills line is worth the tokens. */
const senderBlock=(prof,raw,heading,skills)=>`${heading}

Based in: ${prof.location||''}
In short: ${prof.headline||''}
Real strengths: ${(prof.strengths||[]).join('; ')}
${prof.unusual_combination?`What is rare about them: ${prof.unusual_combination}`:''}${skills?`
Skills: ${(prof.hard_skills||[]).join(', ')}`:''}

${String(raw||'').slice(0,9000)}`;

/* Draft a message, show it, let them copy it. The two drafters below differ
   only in the prompt they build and the buttons they want beside Copy. */
async function draftMessage(o){
  /* A notepad first, AI on request (feedback #23). It opens on whatever was
     last written for this job (o.job, kept in j.dm as you type, so closing it
     by mistake loses nothing), or empty; "Draft it with AI" fills it, and if
     there was already text, "Put back mine" undoes the AI. */
  const head=`<div class="eyebrow">${o.eyebrow}</div>
    <h2 style="margin:6px 0 14px">${o.head}</h2>`;
  // Every draft for a job in one field (j.drafts, carried in extras): the DM,
  // the chase, and one per contact for InMail.
  const drafts=()=>{ try{ return o.job && o.job.drafts ? JSON.parse(o.job.drafts) : {}; }catch(e){ return {}; } };
  const draftOf=()=>o.job ? String(drafts()[o.field||'dm']||'') : '';
  const init=draftOf();
  const d=modal(head+`
      <textarea id="msgTxt" rows="${o.rows}" placeholder="Write it here, or let AI draft it from your profile and this ${o.cold?'company':'job'}.">${esc(init)}</textarea>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn-sm ${init?'':'btn-go'}" id="msgAI">${init?'Redraft with AI':'Draft it with AI'}</button>
        <button class="btn-sm ${init?'btn-go':''}" id="msgCopy">Copy</button>
        ${(o.extras||[]).map(x=>`<button class="btn-sm" id="${x.id}">${x.label}</button>`).join('')}
        <button class="btn-sm" onclick="this.closest('.modal').remove()">Close</button></div>
      <div class="hint" id="msgNote" style="margin-top:8px"></div>`);
  const box=()=>d.querySelector('#msgTxt'), note=d.querySelector('#msgNote'), ai=d.querySelector('#msgAI');
  let keepT=null;
  const keep=()=>{ if(!o.job) return; clearTimeout(keepT); keepT=setTimeout(()=>{ const m=drafts(); m[o.field||'dm']=box().value; o.job.drafts=JSON.stringify(m); save(); },600); };
  box().addEventListener('input',keep);
  box().focus();
  d.querySelector('#msgCopy').onclick=()=>{ box().select();
    navigator.clipboard.writeText(box().value).then(()=>{ d.querySelector('#msgCopy').textContent='Copied'; },()=>{}); };
  (o.extras||[]).forEach(x=>{ const b=d.querySelector('#'+x.id); if(b) b.onclick=()=>x.run(box().value, d); });
  ai.onclick=async()=>{
    const mine=box().value;
    ai.disabled=true; note.innerHTML='<span class="spin"></span> Writing…';
    try{
      const txt=await claude(o.prompt, o.maxTok);
      box().value=String(txt||'').trim(); keep();
      ai.textContent='Redraft with AI'; ai.classList.remove('btn-go'); d.querySelector('#msgCopy').classList.add('btn-go');
      note.innerHTML = mine.trim() ? `Your text was replaced. <a href="#" class="lnk" id="msgBack">Put back mine</a>` : 'Edit it however you like; it is kept on this job.';
      const back=d.querySelector('#msgBack'); if(back) back.onclick=e=>{ e.preventDefault(); box().value=mine; keep(); note.textContent='Put back.'; };
    }catch(e){
      if(e.message==='NEEDKEY'){ note.textContent=''; keyDialog(()=>ai.click()); }
      else note.innerHTML=`<span class="err">Couldn't write it. ${esc(e.message)}</span>`;
    }finally{ ai.disabled=false; }
  };
}

/* ═══ the CV, tailored to one job ═══
   Your CV, reordered and reworded around what one posting asks for. The model
   may move, cut, merge and rephrase what the CV already says, and use the
   posting's own words where the CV genuinely backs them; it may not add a
   skill, a number, a title, an employer or a date. What the posting asks for
   and the CV does not show is returned separately as "gaps" -- said to the
   person, never written into the CV. Saved with the job (j.cvt, in extras),
   so it is there next time and travels with the row. */
const cvOf = j => { try{ return j && j.cvt ? JSON.parse(j.cvt) : null; }catch(e){ return null; } };
/* The CV's own small markup -> HTML: # name, ## section, - bullet, **bold**. */
function cvHtml(md){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let out='', list=false;
  for(const raw of String(md||'').split('\n')){
    const l=raw.trim();
    const close=()=>{ if(list){ out+='</ul>'; list=false; } };
    if(!l){ close(); continue; }
    if(/^#\s/.test(l)){ close(); out+=`<h1>${inl(l.slice(2))}</h1>`; }
    else if(/^##\s/.test(l)){ close(); out+=`<h2>${inl(l.slice(3))}</h2>`; }
    else if(/^[-*•]\s/.test(l)){ if(!list){ out+='<ul>'; list=true; } out+=`<li>${inl(l.slice(2))}</li>`; }
    else { close(); out+=`<p>${inl(l)}</p>`; }
  }
  return out+(list?'</ul>':'');
}
async function tailorCv(i){
  const p=P(), j=p.jobs[i]; if(!j) return;
  if(!String(p.raw||'').trim()){
    return modal(`<div class="eyebrow">Your CV for this job</div><h2 style="margin:6px 0 8px">Add your CV first</h2>
      <p style="color:var(--muted)">This rewrites your own CV around the job, so it needs your CV to start from. Add it from your profile.</p>
      <div class="btn-row" style="margin-top:12px"><button class="btn-sm" onclick="this.closest('.modal').remove()">Close</button></div>`);
  }
  const d=modal(`<div class="eyebrow">Your CV for this job</div><h2 style="margin:6px 0 14px">${esc(j.title)} · ${esc(j.company)}</h2>
    <p style="color:var(--muted)"><span class="spin"></span> Reading the posting against your CV…</p>`);
  try{
    const txt=await claude(`Tailor a job seeker's CV to one job posting.

THE CV (the ONLY source of facts):
${String(p.raw).slice(0,12000)}

THE JOB:
Title: ${j.title}
Company: ${j.company}
${j.location?`Location: ${j.location}\n`:''}Posting: ${String(j.description||'(no description saved)').slice(0,5000)}

Rules -- these are absolute:
- Use ONLY facts in the CV. Never add a skill, tool, number, metric, title, employer, date, degree or responsibility the CV does not state. If the CV says "managed a team", do not write "managed a team of 8".
- You MAY reorder sections and bullets so what matters to this job comes first, cut what is irrelevant, merge bullets, and reword a bullet so it uses the posting's own language -- but only where the CV genuinely supports that wording.
- Keep every job the CV lists, with its real title, employer and dates. Less relevant ones may be shortened to one line, never removed or renamed.
- Start with a 2-3 line summary aimed at this job, built only from the CV.
- Plain, specific, active. No buzzwords, no "passionate", no "results-driven".
- Fit on one page if the CV allows it; never more than two.
- Keep the name and contact lines exactly as the CV has them.

Markup for "cv": "# " the person's name, a plain line for contact details, "## " each section heading, "- " each bullet, **text** for bold. Nothing else.

Return ONLY this JSON:
{"cv": "the tailored CV in the markup above",
 "changes": ["what you moved or reworded and why, in plain words -- 3 to 6 items"],
 "gaps": ["each thing the posting asks for that the CV does not show -- 0 to 6 items, short; these are NOT added to the CV"]}`, TOK_CAP);
    const r=grabJSON(txt);
    if(!r || !String(r.cv||'').trim()) throw new Error('the answer came back empty');
    j.cvt=JSON.stringify({ on:today(), md:String(r.cv), changes:[].concat(r.changes||[]).map(String).slice(0,8), gaps:[].concat(r.gaps||[]).map(String).slice(0,8) });
    logEvent(j,'note','tailored the CV to this job');
    track('cv_tailored',{ gaps:(r.gaps||[]).length });
    await save(); d.remove(); render(); showCv(i);
  }catch(e){
    d.remove();
    if(e.message==='NEEDKEY'){ keyDialog(()=>tailorCv(i)); return; }
    modal(`<div class="eyebrow">Your CV for this job</div><p class="err">Couldn't tailor it. ${esc(e.message)}</p>
      <div class="btn-row"><button class="btn-sm" onclick="this.closest('.modal').remove()">Close</button></div>`);
  }
}
/* The saved CV: read it, edit it, copy it, or print it to PDF. Edits are saved
   back to the job, so the version you sent is the version that is kept. */
function showCv(i){
  const p=P(), j=p.jobs[i], cv=cvOf(j); if(!cv) return tailorCv(i);
  const d=modal(`<div class="eyebrow">Your CV for ${esc(j.title)} · ${esc(j.company)}</div>
    <h2 style="margin:6px 0 4px">Tailored ${esc(cv.on)}</h2>
    ${cv.gaps&&cv.gaps.length?`<div class="cvgap"><b>It asks for, and your CV does not show:</b> ${cv.gaps.map(esc).join(' · ')}. Not added: if you have these, put them in your CV and tailor again.</div>`:''}
    ${cv.changes&&cv.changes.length?`<details style="margin:6px 0 10px"><summary style="cursor:pointer;color:var(--muted);font-size:12.5px">What was changed</summary>
      <ul style="font-size:12.5px;color:var(--muted)">${cv.changes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></details>`:''}
    <div class="cvdoc" id="cvView">${cvHtml(cv.md)}</div>
    <textarea id="cvEdit" rows="18" style="display:none;font-family:var(--mono);font-size:12px">${esc(cv.md)}</textarea>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn-go btn-sm" id="cvPrint">Download as PDF</button>
      <button class="btn-sm" id="cvCopy">Copy text</button>
      <button class="btn-sm" id="cvEditBtn">Edit</button>
      <button class="btn-sm" onclick="this.closest('.modal').remove()">Close</button></div>`);
  const view=d.querySelector('#cvView'), ed=d.querySelector('#cvEdit'), eb=d.querySelector('#cvEditBtn');
  const current=()=>ed.style.display==='none' ? cv.md : ed.value;
  eb.onclick=async()=>{
    if(ed.style.display==='none'){ ed.style.display=''; view.style.display='none'; eb.textContent='Save edits'; return; }
    cv.md=ed.value; j.cvt=JSON.stringify(cv); await save();
    view.innerHTML=cvHtml(cv.md); ed.style.display='none'; view.style.display=''; eb.textContent='Edit';
  };
  d.querySelector('#cvCopy').onclick=()=>{ navigator.clipboard.writeText(current()).then(()=>{ d.querySelector('#cvCopy').textContent='Copied'; },()=>{}); };
  // A print window rather than a PDF library: the browser's own "Save as PDF"
  // makes a real, selectable PDF and adds no dependency (CLAUDE.md §3).
  d.querySelector('#cvPrint').onclick=()=>{
    const w=window.open('','_blank'); if(!w){ alert('Allow pop-ups for this site to download the PDF.'); return; }
    const name=(String(current()).match(/^#\s+(.+)$/m)||[])[1]||'CV';
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(name)} — ${esc(j.title)}</title><style>
      @page{size:A4;margin:16mm 16mm}
      body{font:10.5pt/1.45 Georgia,'Times New Roman',serif;color:#111;max-width:178mm;margin:0 auto}
      h1{font:600 20pt/1.1 system-ui,-apple-system,'Segoe UI',sans-serif;margin:0 0 2pt}
      h2{font:700 9pt system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-bottom:.6pt solid #888;padding-bottom:2pt;margin:11pt 0 5pt}
      p{margin:2pt 0} ul{margin:2pt 0 4pt;padding-left:13pt} li{margin:1.5pt 0} b{font-weight:700}
    </style></head><body>${cvHtml(current())}<script>window.onload=()=>{window.print()}<\/script></body></html>`);
    w.document.close(); track('cv_pdf');
  };
}

async function draftPitch(i,isChase){
  const p=P(), j=p.jobs[i]; if(!j) return;
  const prof=p.profile;
  const cts=listOf(j,'contacts'), ev=listOf(j,'events');
  return draftMessage({
    eyebrow:'Outreach', head:`${esc(j.title)} · ${esc(j.company)}`, rows:10, maxTok:TOK_CAP,
    job:j, field:isChase?'dmchase':'dm', cold:chOf(j)!=='posted',
    retry:()=>draftPitch(i,isChase),
    extras:[{id:'msgSave', label:'Save to notes', run:async(text)=>{
      j.notes=(j.notes?j.notes+' | ':'')+text;
      j.pitch_sent='Drafted'; await save(); render(); }}],
    prompt:`Write a short cold outreach message for a job seeker.

${senderBlock(prof,p.raw,'WHO THEY ARE',true)}

TARGET COMPANY: ${j.company}
TARGET ROLE: ${j.title}
CONTEXT: ${String(j.description||'').slice(0,900)}${(()=>{ const pu=pulseOf(j); return pu&&!pu.error&&(pu.now||[]).length
  ? `\nWHAT THEY ARE DOING NOW (from their own news and posts -- mention the most relevant one naturally, never invent detail): ${pu.now.map(n=>n.what+' ('+(n.when||'')+')').join('; ')}` : ''; })()}

ADDRESSED TO: ${cts.length ? cts.map(c=>`${c.name||'(unnamed)'}${c.role?', '+c.role:''}`).join('; ') : 'nobody identified yet \u2014 keep it addressable to any reader'}

${isChase ? `THIS IS A FOLLOW-UP. They were contacted ${daysSilent(j)} days ago and have not replied.
Previous activity, most recent first:
${ev.slice(0,4).map(x=>`- ${x.on} ${x.kind}: ${x.text||''}`).join('\n')||'- no detail logged'}
Write a SHORT nudge: three sentences at most. Do not re-pitch from scratch and do not repeat the original message. Add one new thing \u2014 a relevant piece of work, a recent development at their company, or a sharper version of the offer. Be graceful, never wounded, and make it easy to ignore without awkwardness.` : ''}

CHANNEL: ${chOf(j)==='place'
 ? 'WALK-IN \u2014 a short message to the owner or manager of this place (WhatsApp, or what to say at the counter), asking for a trial shift or a few minutes to talk. TARGET ROLE above is the work to ask about. Name the place, say in one line what they can do from their own experience, and when they can come in. Three or four sentences, warm and plain. Never a cover letter. The place was found on a map, not in a job ad: NOTHING is known about an opening there, so never say or suggest that one exists -- ask whether they could use someone.'
 : chOf(j)==='pitch'
 ? 'PITCH \u2014 a story pitch to the editor who commissions at this outlet. TARGET ROLE above is the story, not a job. Open with the story itself: what happened or is happening, why now, and what access or evidence they have that others do not. Then one sentence on who they are, with the most relevant piece they have published. The ask: whether the outlet would take it, at what length. Never ask for a job.'
 : chOf(j)==='person'
 ? 'ASK \u2014 a short note to someone who hires or vouches for this kind of work. TARGET ROLE above is who the person is, not a job. Ask for one small thing: fifteen minutes of advice, or to be kept in mind for contributor or stringer work. Never ask for a job outright.'
 : chOf(j)==='cold'
 ? 'COLD \u2014 there is NO job posting. This is an unsolicited approach to someone at the company. Do not refer to "the role", "this position", "the opening" or "your posting", because none exists. Open by making them want to reply, and make the ask a conversation, not an application.'
 : 'POSTED \u2014 there is a live job posting, so referring to the role directly is correct.'}

Rules:
- Maximum 5 sentences. A LinkedIn DM or short email, not a cover letter.
- Open with the single most specific concrete thing this person has actually built or run. No "I hope this finds you well", no "I am writing to express interest".
- Lead with whatever is rarest about them relative to other applicants for this role.
- Reference something specific about this company or role.
- End with a low-friction ask: a short call, or an offer to show something they've made. Never "please consider my application".
- Plain language. No buzzwords, no em-dashes, no "passionate about".
- Invent nothing not in the profile above.

Return only the message text.`});
}

/* One person, one LinkedIn InMail. Separate from draftPitch because that one
   addresses the job as a whole (or "nobody identified yet") — this always has
   exactly one named reader, so the opener can use their name and role directly
   instead of hedging. Nothing is sent from here: LinkedIn has no API for it, so
   this only produces text to paste into their own compose box. */
async function draftInmail(i,ci){
  const p=P(), j=p.jobs[i]; if(!j) return;
  const c=listOf(j,'contacts')[ci]; if(!c) return;
  const prof=p.profile;
  return draftMessage({
    eyebrow:'InMail draft', head:`${esc(c.name||'them')} · ${esc(j.company)}`, rows:8, maxTok:TOK_CAP,
    job:j, field:'inmail:'+(c.name||ci),
    retry:()=>draftInmail(i,ci),
    extras: c.linkedin ? [{id:'msgOpen', label:'Open their profile',
      run:()=>{ if(httpUrl(c.linkedin)) window.open(c.linkedin,'_blank','noopener'); }}] : [],
    prompt:`Write a short LinkedIn InMail message from a job seeker to one specific person.

${senderBlock(prof,p.raw,"WHO IT'S FROM",false)}

WHO IT'S TO: ${c.name||'(name unknown)'}${c.role?', '+c.role:''} at ${j.company}

TARGET ROLE: ${j.title}
CONTEXT: ${String(j.description||'').slice(0,900)}${(()=>{ const pu=pulseOf(j); return pu&&!pu.error&&(pu.now||[]).length
  ? `\nWHAT THEY ARE DOING NOW (from their own news and posts -- mention the most relevant one naturally, never invent detail): ${pu.now.map(n=>n.what+' ('+(n.when||'')+')').join('; ')}` : ''; })()}

CHANNEL: ${chOf(j)==='cold'
 ? 'COLD — there is NO job posting. Do not refer to "the role" or "your posting" as if one exists. This is an unsolicited approach; make them want to reply.'
 : 'POSTED — there is a live posting, so referring to the role directly is correct. Mention that an application is going in (or already has), so this reads as a real signal, not a substitute for applying.'}

Rules:
- This is a LinkedIn InMail to someone they are not yet connected with — shorter than an email, no subject line, no formal greeting like "Dear".
- Maximum 4 sentences.
- Open by addressing them by first name, then the single most specific concrete thing this person (the sender) has actually built or run. No "I hope this finds you well", no "I am writing to express interest".
- Reference something specific about this company or role, and if they have a title suggesting they'd actually own hiring for this, say why you're reaching out to them specifically.
- End with a low-friction ask — a short call, or an offer to show something specific.
- Plain language. No buzzwords, no em-dashes, no "passionate about".
- Invent nothing not in the profile above.

Return only the message text.`});
}

document.addEventListener('click',async e=>{
  // Anywhere on a row that is not one of its own controls opens it, by pressing
  // the row's Details button -- one toggle, however it was reached.
  /* A row menu left open while the page is clicked elsewhere would hang over
     whatever is underneath it, so anything outside one closes them all. */
  if(!e.target.closest('.rowmenu')){
    document.querySelectorAll('.rowmenu[open]').forEach(d=>{ d.open=false; });
  }
  if(!e.target.closest('button,a,input,select,textarea,label,summary,.rowmenu')){
    const d=e.target.closest('.qrow')?.querySelector('button[data-act="open"]');
    if(d){ d.click(); return; }
  }
  const b=e.target.closest('button[data-act]'); if(!b) return;
  const i=parseInt(b.dataset.i,10), p=P(), j=p&&p.jobs[i]; if(!j) return;
  const a=b.dataset.act;
  /* Synchronous, and before anything in this handler is awaited: a popup
     blocker only lets window.open through inside the gesture that caused it,
     so this cannot wait until after the save. */
  if(a==='apply'){
    track('apply_click',{ score:+j.ai_score||null });
    const u=httpUrl(String(j.url||'').trim());
    if(u) window.open(u,'_blank','noopener');
  }
  // Two different intents that used to share one verb. 'open' toggles a card
  // that is already on screen; 'goto' is pressed from somewhere the card is
  // NOT -- the dashboard's feed -- and has to travel to it first.
  /* Selects, where it used to toggle. A toggle made sense when the row held
     the detail; with a pane, clicking the row you are already reading should
     leave it alone rather than slam the pane shut. */
  if(a==='open'){ SEL_JOB = keyOf(j); track('job_open',{ stage:stOf(j), score:+j.ai_score||null }); return render(); }
  if(a==='unsel'){ SEL_JOB = null; return render(); }
  if(a==='goto') return showJob(i);
  if(a==='pass'){ const ps=passedSet(); ps.keys.add(keyOf(j)); ps.last.push(keyOf(j)); keepPassed(); return render(); }
  if(a==='unpass'){ const ps=passedSet(); ps.keys.delete(keyOf(j)); ps.last.pop(); keepPassed(); return render(); }
  if(a==='save'){
    const undo=snapRow(j); toggleSaved(j);
    // From the swipe deck the card flying off IS the confirmation (feedback #27);
    // a notice on every swipe was noise. Saved jobs are in Saved, and the row
    // menu's "Take off saved" undoes it.
    if(!b.closest('.deck-btns')) undoToast(j, undo, isSaved(j)?'Saved for later':'Taken off saved');
  }
  if(a==='pitch')  return draftPitch(i,false);
  if(a==='cv')     return tailorCv(i);
  if(a==='cvopen') return showCv(i);
  if(a==='chase')  return draftPitch(i,true);
  if(a==='note')   return noteDialog(i);
  if(a==='logadd') return noteDialog(i);
  if(a==='ctadd')  return contactDialog(i);
  if(a==='hrfind') return hrDialog(i);
  if(a==='inmail') return draftInmail(i, parseInt(b.dataset.ci,10));
  if(a==='ctdel'){
    // Destructive, and it used to happen in silence. A found contact can cost
    // an Apify run to find again, so this one especially wants a way back.
    const undo=snapRow(j);
    const arr=listOf(j,'contacts'); arr.splice(parseInt(b.dataset.ci,10),1);
    setList(j,'contacts',arr);
    logEvent(j,'contact','removed a contact');
    undoToast(j,undo,'Contact removed');
  }
  // One route for every stage change, from the card's shortcut or the panel's
  // full row, so they log the same thing and set the same fields.
  const to = a==='stage' ? b.dataset.to
           : (a==='sent'||a==='apply') ? 'sent' : a==='live' ? 'live'
           : a==='close' ? 'closed' : a==='reopen' ? 'new' : '';
  if(to && STAGES.includes(to)) stageChange(j,to);
  await save(); render();
});
/* Snapshotted before the change, and every stage change gets one -- not just
   the optimistic apply. Reopening a row rewrites its follow-up clock and
   closing one takes it out of the queue, and neither is obvious to put back by
   hand once the row has moved tab. Does not save: every caller does. */
function stageChange(j,to,extra){
  const undo = snapRow(j);
  track('stage',{ from:stOf(j), to, mail:!!extra });
  setStage(j,to);
  logEvent(j, to==='live'?'reply':to==='sent'?'sent':to==='closed'?'closed':'note', stageNote(j,to));
  // extra rides on the event just logged: {mail:id} files a mail under this job.
  if(extra){ const ev=listOf(j,'events'); Object.assign(ev[0],extra); setList(j,'events',ev); }
  undoToast(j, undo, stageToast(j,to), to==='sent' ? sentMoment() : null);
  if(to==='sent'){ fbMoment('applied'); inboxNudge(); }
}

/* ═══ sign in ═══
   Only ever reached when config.js is filled in. The copy is deliberate about
   what changes by having an account, because "your CV stays in your browser"
   stopped being true the moment this screen existed and pretending otherwise
   would be the dishonest kind of onboarding. */
let AUTH = { mode:'in', msg:'', err:'', busy:false, user:'', email:'', pass:'', remember:true, open:false };

/* Usernames are lowercase and narrow on purpose: they are an identifier people
   type, and a name that differs from another only by case or by a space is a
   support ticket waiting to happen. Mirrors the CHECK constraint in schema.sql. */
const USERNAME_RE = /^[a-z0-9_]{3,20}$/;

/* Two different questions. myUsername() is "has this account claimed a name",
   which gates the claim step below. userName() is "what do we call them on
   screen", which falls back to the email so a legacy account is not blank. */
function myUsername(){
  const m = USER && USER.user_metadata;
  return (m && m.username) || '';
}
function userName(){ return myUsername() || (USER && USER.email) || ''; }

/* The three people this app is for, and their car, as they stand on the
   signed-out screens. The same art as CAST at the foot of the rail. Static markup. */
const AU_PEOPLE = artSvg('cast','au-people','The three job seekers and their car');

/* The frame every signed-out screen stands in: the page, with one card on
   it. Signing in, resetting a password, claiming a username and setting a new
   password are the same place, so they are drawn as the same place -- a person
   who clicks "Forgot your password?" should not land somewhere that looks like
   a different product. */
const auScene = (sign, hero) => `
  <div class="au-scene">
    <div class="au-sign">
      <div class="au-name">Job Triage</div>
${sign}
    </div>
    ${hero?`<div class="au-hero">${hero}</div>`:''}
    ${AU_PEOPLE}
  </div>`;

function renderAuth(){
  if(AUTH.mode==='reset') return renderReset();
  const up = AUTH.mode==='up';
  // A stranger's first screen must say what this is. "Welcome back" is only true for someone who has signed in here before.
  let returning=false; try{ returning=!!localStorage.getItem('triage:returning'); }catch(e){}
  /* Open if they opened it, or if there is anything in it they would lose
     sight of: a half-typed name, a sign-up in progress, a "check your email". */
  const mailOpen = up || AUTH.open || !!AUTH.user || !!AUTH.pass || !!AUTH.msg;
  $('#root').innerHTML=auScene(`
      <h2>${returning?'Welcome back.':'Stop applying to jobs that won\u2019t write back.'}</h2>
      ${returning?'':`<p class="au-pitch">We score every job twice \u2014 <b>can you do it</b>, and <b>will they reply</b> \u2014 then show you which to apply to first.</p>`}
      <button class="au-b au-go" id="authGoogle" ${AUTH.busy?'disabled':''}>
        <span class="au-g"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.87-3.04.87-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.73A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.19.29-1.73V4.94H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.06l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg></span>
        Continue with Google
      </button>
      ${AUTH.err?`<p class="au-note au-bad">${esc(AUTH.err)}</p>`:''}
      ${AUTH.msg?`<p class="au-note">${esc(AUTH.msg)}</p>`:''}
      <details class="au-mail" id="auMail" ${mailOpen?'open':''}>
        <summary>${up?'Make an account with email':'Use email instead'}</summary>
        <div class="au-fields">
          ${up?`<p class="hint">Your CV, your jobs and your notes are stored in the cloud so they follow you between devices. You can delete all of it, permanently, from inside the app.</p>`:''}
          <label class="lab" for="auUser">${up?'Username':'Username or email'}</label>
          <input id="auUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
                 placeholder="${up?'3-20 characters: a-z, 0-9, underscore':''}" value="${esc(AUTH.user)}">
          ${up?`<label class="lab" for="auEmail">Email</label>
          <input id="auEmail" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(AUTH.email)}">
          <p class="hint">Only ever used to reset your password. It is not shown to anyone else.</p>`:''}
          <label class="lab" for="auPass">Password</label>
          ${pwField('auPass', up?'new-password':'current-password', up?'At least 8 characters':'', AUTH.pass)}
          ${up?'':`<label class="hint" style="display:flex;align-items:center;gap:7px;cursor:pointer">
            <input type="checkbox" id="auRemember" ${AUTH.remember?'checked':''} style="accent-color:var(--au-gr);cursor:pointer">
            Remember me on this device</label>`}
          <div class="au-row">
            <button class="au-b au-sm au-go" id="auGo" ${AUTH.busy?'disabled':''}>${AUTH.busy?'\u2026':(up?'Create account':'Log in')}</button>
            <button class="au-b au-sm" id="auSwap">${up?'I already have one':'Make an account'}</button>
            ${up?'':`<a href="#" class="lnk" id="auReset" style="font-size:12.5px">Forgot your password?</a>`}
          </div>
        </div>
      </details>
      <div class="au-fine">${LEGAL_LINKS}</div>`, returning ? '' : artSvg('they','','they can\u2019t help you.'));

  // Swapping mode or hitting an error re-renders the form, which would throw
  // away what was typed. Read it back into state before anything re-renders.
  const stash=()=>{
    AUTH.user=($('#auUser').value||'').trim().toLowerCase();
    if($('#auEmail')) AUTH.email=($('#auEmail').value||'').trim();
    AUTH.pass=$('#auPass').value||'';
    if($('#auRemember')) AUTH.remember=$('#auRemember').checked;
  };
  const fail=m=>{ AUTH.busy=false; AUTH.err=m; renderAuth(); };

  const go=async ()=>{
    stash();
    const user=AUTH.user, pass=AUTH.pass, email=AUTH.email;
    if(!user||!pass) return fail(up?'Username and password, please.':'Fill both in, please.');
    // Only sign-up dictates the shape. Sign-in also accepts an email, because
    // accounts made before usernames existed have nothing else to type.
    if(up && !USERNAME_RE.test(user)) return fail('Usernames are 3-20 characters: lowercase letters, numbers or underscore.');
    if(up && !email) return fail('An email, so you can reset your password later.');
    if(up && pass.length<8) return fail('Passwords need to be at least 8 characters.');
    AUTH.busy=true; AUTH.err=''; AUTH.msg=''; renderAuth();

    try{
      if(up){
        const {data:free,error:e0}=await SB.rpc('username_available',{p_username:user});
        if(e0) throw e0;
        if(!free) return fail('That username is taken.');
        // The username rides along in user_metadata; a trigger on auth.users
        // claims it, which is the only moment that works when email
        // confirmation is on and sign-up returns no session.
        const {data,error}=await SB.auth.signUp({email,password:pass,options:{data:{username:user}}});
        if(error) throw error;
        if(!(data && data.session)){
          AUTH.busy=false; AUTH.pass='';
          AUTH.msg='Check your email to confirm the account, then sign in with your username.';
          AUTH.mode='in'; return renderAuth();
        }
      } else {
        // An '@' means they typed an email, which Supabase takes directly; no
        // lookup, and no way for this branch to confirm an address exists.
        let addr = user;
        if(!user.includes('@')){
          const {data,error:e1}=await SB.rpc('login_email',{p_username:user});
          if(e1) throw e1;
          addr = data;
        }
        // Same message however it failed, so this form does not become a way
        // to test which usernames or emails exist.
        const nope = 'That did not match. Check the username or email, and the password.';
        if(!addr) return fail(nope);
        REMEMBER = AUTH.remember;
        try{ sessionStorage.setItem('triage:remember', REMEMBER?'1':'0'); }catch(e){}
        const {error}=await SB.auth.signInWithPassword({email:addr,password:pass});
        if(error) return fail(nope);
      }
    }catch(e){
      return fail((e&&e.message)||'That did not work.');
    }
    AUTH.busy=false; AUTH.pass='';
  };

  $('#auGo').onclick=go;
  $('#auPass').onkeydown=e=>{ if(e.key==='Enter') go(); };
  // Every failed attempt re-renders this screen; without this the fields would
  // fold shut under the person the moment they got something wrong.
  $('#auMail').ontoggle=e=>{ AUTH.open=e.target.open; };
  $('#auSwap').onclick=()=>{ stash(); AUTH.mode=up?'in':'up'; AUTH.err=''; AUTH.msg=''; renderAuth(); };
  // Supabase redirects to Google and back, so nothing below runs again until
  // the browser returns here with a session already in the URL hash -- picked
  // up automatically by the client's own detectSessionInUrl.
  $('#authGoogle').onclick=async()=>{
    stash();
    AUTH.busy=true; AUTH.err=''; renderAuth();
    try{
      const {error}=await SB.auth.signInWithOAuth({provider:'google',
        options:{redirectTo:location.origin+location.pathname}});
      if(error) return fail(error.message||'Could not start Google sign-in.');
    }catch(e){ return fail((e&&e.message)||'Could not start Google sign-in.'); }
  };

  if($('#auReset')) $('#auReset').onclick=e=>{
    e.preventDefault();
    stash();
    AUTH.mode='reset'; AUTH.err=''; AUTH.msg='';
    renderAuth();
  };
}

/* Reset goes by email, not by username: the recovery link is sent to the
   address on the account, and asking for it directly keeps this form from
   answering "which email is behind this username". An in-page form rather
   than a native prompt() — prompt() is silently blocked in a fair few
   contexts (installed PWA, some in-app browsers), which made this
   unreachable rather than merely ugly. */
function renderReset(){
  $('#root').innerHTML=auScene(`
      <h2>Reset your password</h2>
      <p class="au-pitch">Enter the email on your account and we will send a link to set a new one.</p>
      <div class="au-fields au-solo">
        <label class="lab" for="rsEmail">Email</label>
        <input id="rsEmail" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(AUTH.email)}">
        ${AUTH.err?`<p class="au-note au-bad">${esc(AUTH.err)}</p>`:''}
        ${AUTH.msg?`<p class="au-note">${esc(AUTH.msg)}</p>`:''}
        <div class="au-row">
          <button class="au-b au-sm au-go" id="rsGo" ${AUTH.busy?'disabled':''}>${AUTH.busy?'\u2026':'Send reset link'}</button>
          <button class="au-b au-sm" id="rsBack">Back to sign in</button>
        </div>
      </div>
      <div class="au-fine">${LEGAL_LINKS}</div>`);

  const go=async ()=>{
    const email=($('#rsEmail').value||'').trim();
    AUTH.email=email;
    if(!email) { AUTH.err='Enter the email on your account.'; AUTH.msg=''; return renderReset(); }
    AUTH.busy=true; AUTH.err=''; AUTH.msg=''; renderReset();
    /* supabase-js RETURNS {error} rather than throwing, so a try/catch alone
       swallowed a mailer that was failing on every send and told the person
       a link was on its way. An unknown address is not an error here (the
       server answers 200 for it), so surfacing one gives nothing away. */
    let failed=false;
    try{ const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.href}); failed=!!error; }
    catch(err){ failed=true; }
    AUTH.busy=false;
    if(failed){
      AUTH.err='We could not send the email just now. Try again in a minute, or write to support@jobtriage.in.';
      return renderReset();
    }
    // Said the same way whether or not the address exists: telling a stranger
    // which emails have accounts here is not information worth giving away.
    AUTH.msg='If that address has an account, a reset link is on its way.';
    renderReset();
  };
  $('#rsGo').onclick=go;
  $('#rsEmail').onkeydown=e=>{ if(e.key==='Enter') go(); };
  $('#rsBack').onclick=()=>{ AUTH.mode='in'; AUTH.err=''; AUTH.msg=''; renderAuth(); };
}

/* Shown once, to accounts that pre-date usernames. They signed in with their
   email; they cannot sign in again without a name, so this is not skippable.
   It is deliberately not part of onboarding: onboarding is about the CV, and
   an account that already has jobs in it should not be sent back through it. */
let CLAIM = {user:'', err:'', busy:false};
function renderClaim(){
  $('#root').innerHTML=auScene(`
      <h2>Pick a username</h2>
      <p class="au-pitch">Sign-in moved to usernames. Your account and everything in it is unchanged \u2014 this is the name you will type from now on instead of ${esc(USER&&USER.email||'your email')}.</p>
      <div class="au-fields au-solo">
        <label class="lab" for="clUser">Username</label>
        <input id="clUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
               placeholder="3-20 characters: a-z, 0-9, underscore" value="${esc(CLAIM.user)}">
        <p class="hint">Lowercase letters, numbers and underscores. You cannot change it later, so pick one you will recognise.</p>
        ${CLAIM.err?`<p class="au-note au-bad">${esc(CLAIM.err)}</p>`:''}
        <div class="au-row">
          <button class="au-b au-sm au-go" id="clGo" ${CLAIM.busy?'disabled':''}>${CLAIM.busy?'\u2026':'Use this name'}</button>
          <button class="au-b au-sm" id="clOut">Sign out</button>
        </div>
      </div>`);
  const fail=m=>{ CLAIM.busy=false; CLAIM.err=m; renderClaim(); };
  const go=async()=>{
    CLAIM.user=($('#clUser').value||'').trim().toLowerCase();
    const u=CLAIM.user;
    if(!USERNAME_RE.test(u)) return fail('3-20 characters: lowercase letters, numbers or underscore.');
    CLAIM.busy=true; CLAIM.err=''; renderClaim();
    try{
      const {data:free,error:e0}=await SB.rpc('username_available',{p_username:u});
      if(e0) throw e0;
      if(!free) return fail('That username is taken.');
      const {error:e1}=await SB.rpc('claim_username',{p_username:u});
      if(e1) throw e1;
      // The row is what counts; this copies it onto the session so the rest of
      // the app can read it without another round trip.
      const {error:e2}=await SB.auth.updateUser({data:{username:u}});
      if(e2) throw e2;
      if(USER) USER.user_metadata=Object.assign({},USER.user_metadata,{username:u});
      CLAIM.busy=false; CLAIM.err=''; render();
    }catch(e){ return fail((e&&e.message)||'That did not work.'); }
  };
  $('#clGo').onclick=go;
  $('#clUser').onkeydown=e=>{ if(e.key==='Enter') go(); };
  $('#clOut').onclick=async()=>{
    try{ await SB.auth.signOut(); }catch(e){}
    USER=null; DB={profiles:{},current:null}; VIEW='onb'; render();
  };
}

/* #root is empty until the first render, and everything before it waits on the
   network: getSession, then the cloud read, then possibly a migration. That was
   a dark rectangle for as long as it all took, which reads as a broken page
   rather than a loading one. */
function splash(msg, sub){
  const r=$('#root'); if(!r) return;
  r.innerHTML=`<div class="onb"><div class="eyebrow" style="margin-bottom:14px">Job Triage</div>${waitScene(msg, sub, null, 'watch')}</div>`;
}

/* Landing from a "reset your password" email. Supabase has already put a
   recovery session in place by the time this runs, so the only thing left is
   to take the new password. Without this the link signed people in and showed
   them the app, with no way to actually change anything. */
let RECOVER = false;
function renderRecover(){
  $('#root').innerHTML=auScene(`
      <h2>Set a new password</h2>
      <p class="au-pitch">You followed a reset link${USER&&USER.email?` for ${esc(USER.email)}`:''}. Pick something you will remember.</p>
      <div class="au-fields au-solo">
        <label class="lab" for="rcA">New password</label>
        ${pwField('rcA','new-password','At least 8 characters')}
        <label class="lab" for="rcB">Type it again</label>
        ${pwField('rcB','new-password')}
        <p class="au-note au-bad" id="rcErr" style="display:none"></p>
        <div class="au-row">
          <button class="au-b au-sm au-go" id="rcGo">Save it</button>
        </div>
      </div>`);
  const fail=m=>{ const e=$('#rcErr'); e.textContent=m; e.style.display='block'; $('#rcGo').disabled=false; };
  const go=async()=>{
    const a=$('#rcA').value, b=$('#rcB').value;
    if(a.length<8) return fail('Passwords need to be at least 8 characters.');
    if(a!==b)      return fail('Those two do not match.');
    $('#rcGo').disabled=true;
    try{
      const {error}=await SB.auth.updateUser({password:a});
      if(error) throw error;
    }catch(e){ return fail((e&&e.message)||'That did not work.'); }
    RECOVER=false;
    splash('Password changed. Loading your account\u2026');
    await afterAuth();
  };
  $('#rcGo').onclick=go;
  $('#rcB').onkeydown=e=>{ if(e.key==='Enter') go(); };
}

function render(){
  fbGate();
  if(VIEW==='app' && !ONB.editing && wantsDue()) return askWants();
  /* From here, not from afterAuth: the screen above can take the first open,
     and every way into the app passes through render. Not awaited; until it
     answers, a direction counts as all advertised. */
  if(VIEW==='app' && !ROUTES_ASKED) backfillRoutes();
  if(CLOUD && RECOVER && USER) return renderRecover();
  if(CLOUD && !USER) return renderAuth();
  if(CLOUD && USER && !myUsername()) return renderClaim();
  const app=VIEW==='app'&&P(), v=app ? 'app:'+TAB : 'onb:'+ONB.step+(ONB.editing?':edit':'');
  if(v!==TRACK_VIEW){ TRACK_VIEW=v; track('view',{ view:v }); }
  app ? renderApp() : renderOnb();
}

/* Carries a browser-only setup into the account the first time someone signs
   in, so making an account does not read as having lost everything. Only ever
   fills an empty account — it must never overwrite what is already up there. */
async function migrateLocal(){
  try{
    if(await get('triage:db')) return;
    const local=await getLocal('triage:db');
    if(!local) return;
    const d=JSON.parse(local);
    if(!d || !d.profiles || !Object.keys(d.profiles).length) return;
    // This can be megabytes on a well-used tracker, and it is the slowest thing
    // that happens between signing in and seeing the app. Say so.
    const n=Object.values(d.profiles).reduce((a,p)=>a+((p.jobs||[]).length),0);
    splash('Moving your work into your account\u2026',
           `${n} job${n===1?'':'s'} from this browser. This only happens once.`);
    await put('triage:db', local);
    DB.profiles=d.profiles||{}; DB.current=d.current||null;
  }catch(e){}
}

async function afterAuth(){
  // afterAuth also runs on a signed-out boot, so only a real session marks this browser as returning.
  if(USER){ try{ localStorage.setItem('triage:returning','1'); }catch(e){} }
  DB={profiles:{},current:null}; VIEW='onb';
  /* Reset with DB, not separately. These two describe what the SERVER holds
     for whoever was signed in a moment ago; carried into a different account
     they would make the next save look like a mass deletion. Row-level
     security would refuse it -- the ids belong to the other user -- but
     "the database happened to stop us" is not where this should be decided. */
  LAST_SAVED=null; PROFILE_IDS={}; MIGRATED=false;
  TRACK_Q=[]; TRACK_READY=false; TRACK_VIEW=''; TESTER=false;
  if(cloudNow()) splash('Loading your account\u2026');
  CREDITS=null; loadCredits();          // not awaited: a slow balance mustn't hold up the app
  try{
    await afterAuthInner();
    checkMail(true);                    // not awaited: news must not hold up the app
    { const pr=Object.values(DB.profiles||{}).filter(usable);
      track('open',{ profiles:pr.length, jobs:pr.reduce((n,p)=>n+((p.jobs||[]).length),0) }); }
  }catch(e){
    // Reaching here with nothing on screen is the one outcome worth guarding
    // against. Whatever is on this device beats a page that never finishes.
    console.error('afterAuth failed:', e);
    try{
      const v=await getLocal('triage:db');
      if(v){ const d=JSON.parse(v); DB.profiles=d.profiles||{}; DB.current=d.current||null; }
    }catch(e2){}
    syncNote('Could not reach your account \u2014 showing what is on this device. '+((e&&e.message)||''));
  }
  // A DB.current pointing at an unusable record leaves the app with nothing to
  // draw. Log what was wrong -- it should not happen -- and move on rather than
  // stranding them on a screen that cannot render.
  if(DB.current && !usable(DB.profiles[DB.current])){
    console.warn('profile', DB.current, 'has no profile object; keys =',
                 Object.keys(DB.profiles[DB.current]||{}));
    DB.current = Object.keys(DB.profiles).find(id=>usable(DB.profiles[id])) || null;
  }
  if(DB.current&&usable(DB.profiles[DB.current])) VIEW='app';
  // After the profile resolves and before the first paint, so the list drawn is
  // the list that will still be there on the next load. Saved only if it bit.
  try{
    PURGED = purgeUntouched();
    if(PURGED) await save();
  }catch(e){ console.warn('retention pass failed:', e && e.message); }
  /* Here and not inside the try above: VIEW only becomes 'app' a few lines up,
     so called there it returned on every returning visit and the open-time
     fill never ran (found 2026-10-24). */
  openSteps();
  render();
  // After the render, not before: render() rebuilds #root and would wipe it.
  if(CLOUD_DOWN) syncNote('Could not reach your account just now — working from this device. Anything you change is saved here and will sync when you reload with a connection.');
}

async function afterAuthInner(){
  // user_metadata on a session minted before the name was claimed still says
  // there is none. The table is the truth; ask it once per sign-in.
  if(cloudNow() && !myUsername()){
    try{
      const {data}=await withTimeout(SB.rpc('my_username'), READ_MS, 'checking your username');
      if(data) USER.user_metadata=Object.assign({},USER.user_metadata,{username:data});
    }catch(e){ cloudDown(e); console.warn('my_username:', e && e.message); }
  }
  await load();
  if(cloudNow()) await migrateLocal();
  /* After migrateLocal, not before: that one moves a local blob up to the
     account, and this one takes whatever blob is there apart into rows. Run
     them the other way round and a first-time cloud sign-in migrates nothing. */
  try{ await migrateRows(); }
  catch(e){ cloudDown(e); console.warn('row migration failed:', e && e.message); }
  /* After the rows exist, since it saves. Its own failure is not worth
     stopping a sign-in for: the rows keep the flags they had and the key stays
     unset, so the next load tries again. */
  try{ await reflagJudged(); }
  catch(e){ console.warn('re-flagging judged rows failed:', e && e.message); }
}

/* A reset link that's expired or was already used comes back with the
   failure encoded in the URL hash instead of a session \u2014 nothing strips it
   or surfaces it otherwise, which leaves people on a blank sign-in screen
   with a cryptic URL and no idea why. Read it once, then send them straight
   to requesting a fresh link instead of guessing. */
function consumeAuthHashError(){
  const h=location.hash;
  if(!h || h.indexOf('error=')===-1) return;
  const desc=new URLSearchParams(h.slice(1)).get('error_description');
  history.replaceState(null,'',location.pathname+location.search);
  AUTH.mode='reset';
  AUTH.err=(desc?desc.replace(/\+/g,' '):'That link did not work')+' \u2014 request a new one below.';
}

async function boot(){
  if(CLOUD) splash('Starting\u2026');
  if(CLOUD){
    consumeAuthHashError();
    try{
      const {data}=await SB.auth.getSession();
      USER=(data&&data.session&&data.session.user)||null;
    }catch(e){ USER=null; }
    // Arrived on a reset link: take the new password before showing the app,
    // however the session got here.
    if(RECOVERY_LINK && USER) RECOVER=true;
    let last=USER?USER.id:null;
    SB.auth.onAuthStateChange((ev,sess)=>{
      const now=(sess&&sess.user)||null;
      if(ev==='PASSWORD_RECOVERY'){
        // Arrived from a reset email. Take the new password before anything else.
        USER=now; last=now?now.id:null; RECOVER=true; render(); return;
      }
      if((now?now.id:null)===last) return;      // token refreshes are not events
      last=now?now.id:null; USER=now; afterAuth();
    });
  }
  await afterAuth();
  if('serviceWorker' in navigator){
    // file:// has no service worker support and does not need one.
    if(location.protocol==='http:'||location.protocol==='https:'){
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  }
}
fbMount();
boot();
})();
</script>
