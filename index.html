<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Triage</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#131A21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>

<style>
  /* ═══ colour ═══
     Green, red and white. Every hue in the file resolves through a name below,
     so the two themes are the same design at two lightnesses rather than two
     designs -- and nothing outside this block hardcodes a colour.

     The semantics the old amber/teal palette carried are all still here, moved
     onto what green-red-white can actually distinguish:
       green   the primary action, and a posted role: the ordinary good thing
       red     overdue, destructive, wrong: the only colour that interrupts
       white   temperature. A cold approach is DESATURATED because nobody has
               answered yet; a live conversation is the brightest thing on the
               screen because somebody has. That reading inverts in the light
               theme, where live becomes the deepest ink rather than the palest.
     Reachability stays deliberately grey. It is a second axis, not a verdict,
     and it must never compete with the channel colours for attention. */
  :root{
    color-scheme:dark;
    --ink:#0E1411; --panel:#151D18; --panel2:#1C2620; --line:#29372F;
    --text:#E9F0EB; --muted:#8B9C92; --dim:#798B81;

    --signal:#56C88A; --signal-hi:#6FD79D; --on-signal:#08150E;
    --cool:#4FB58C;
    --warn:#E2685C;   --warn-line:#5A2E2A;
    --good:#6FD79D;   --good-line:#2C5540;

    --posted:#56C88A; --posted-dim:#1F3A2A;
    --cold:#A9BCB1;   --cold-dim:#23302A;
--neutral:#86988D;--neutral-line:#364339;
    --live:#FFFFFF;   --live-line:#4A5A50;
    --stale-line:#232E28;

    /* tints and washes -- the same names in both themes, different weights */
    --glow1:rgba(86,200,138,.07); --glow2:rgba(233,240,235,.04);
    --signal-tint:rgba(86,200,138,.12); --signal-tint2:rgba(86,200,138,.03);
    --signal-glow:rgba(86,200,138,.28);
    --good-tint:rgba(111,215,157,.10);
    --warn-tint:rgba(226,104,92,.13); --warn-chip:#4A2622;
    --live-tint:rgba(255,255,255,.07);
    --plot-fade:#3A4A41;
    --veil:rgba(6,11,8,.82); --veil-lite:rgba(6,11,8,.6);
    --shadow:0 1px 2px rgba(0,0,0,.25);
    --shadow-md:0 10px 30px rgba(0,0,0,.5);
    --shadow-lg:0 20px 60px rgba(0,0,0,.5);

    --disp:system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  }

  /* The light theme is the same palette read from the other end. Green and red
     darken so they hold contrast on white; the temperature reading flips, so a
     live conversation is now the deepest green on the page rather than the
     palest thing. Shadows lose most of their weight -- a heavy shadow on white
     reads as dirt rather than as depth. */
  :root[data-theme="light"]{
    color-scheme:light;
    --ink:#F6F9F7; --panel:#FFFFFF; --panel2:#EDF3EF; --line:#D3DFD8;
    --text:#131C17; --muted:#56675D; --dim:#63736A;

    --signal:#157F42; --signal-hi:#0F6635; --on-signal:#FFFFFF;
    --cool:#177A47;
    --warn:#C33B2E;   --warn-line:#EEBAB4;
    --good:#157F42;   --good-line:#A8D8BC;

    --posted:#157F42; --posted-dim:#DCF0E4;
    --cold:#55665C;   --cold-dim:#E6EDE8;
    --neutral:#65756B; --neutral-line:#C6D3CB;
    --live:#0B3D22;   --live-line:#A8D8BC;
    --stale-line:#E2E9E4;

    --glow1:rgba(21,127,66,.07); --glow2:rgba(19,28,23,.03);
    --signal-tint:rgba(21,127,66,.11); --signal-tint2:rgba(21,127,66,.03);
    --signal-glow:rgba(21,127,66,.24);
    --good-tint:rgba(21,127,66,.10);
    --warn-tint:rgba(195,59,46,.10); --warn-chip:#FBE4E1;
    --live-tint:rgba(11,61,34,.07);
    --plot-fade:#B4C4BA;
    --veil:rgba(19,28,23,.42); --veil-lite:rgba(19,28,23,.3);
    --shadow:0 1px 2px rgba(19,28,23,.06);
    --shadow-md:0 8px 24px rgba(19,28,23,.12);
    --shadow-lg:0 18px 50px rgba(19,28,23,.18);
  }
  *{box-sizing:border-box}
  #app{background:
      radial-gradient(1200px 500px at 15% -10%, var(--glow1), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, var(--glow2), transparent 55%),
      var(--ink);
    color:var(--text);font-family:var(--disp);
    font-size:14px;line-height:1.5;min-height:100vh;margin:0}
  #app h1,#app h2,#app h3{margin:0;font-weight:500;letter-spacing:-0.01em}
  @media(prefers-reduced-motion:no-preference){
    .card,.trk,.job,.stat,.chip{animation:rise .45s cubic-bezier(.16,1,.3,1) backwards}
    .job:nth-child(2),.trk:nth-child(2){animation-delay:.04s}
    .job:nth-child(3),.trk:nth-child(3){animation-delay:.08s}
    .job:nth-child(4){animation-delay:.12s}
    .job:nth-child(5){animation-delay:.16s}
    .job:nth-child(n+6){animation-delay:.2s}
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .spacer{flex:1}

  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
  .topbar h1{font-size:19px;background:linear-gradient(90deg,var(--text),var(--signal) 160%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .who{display:flex;align-items:center;gap:9px}
  .av{width:30px;height:30px;border-radius:50%;background:var(--panel2);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:12px;color:var(--signal);flex-shrink:0}
  .who .nm{font-size:13px;line-height:1.2}
  .who .lc{font-size:11px;color:var(--muted);line-height:1.2}
  .pill{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:2px;
    border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.on{color:var(--good);border-color:var(--good-line)}

  /* Tappable UI shouldn't behave like text on a touch screen — without this a
     tap that lingers a few ms selects the label or throws up a callout menu
     instead of registering as a click. */
  button,.tab,.trk,.stp,.dot,.chn,.stage,.pill,.drop,.chip,.tag{
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  button{font-family:var(--disp);font-size:13px;cursor:pointer;border-radius:5px;
    border:1px solid var(--line);background:var(--panel2);color:var(--text);
    padding:8px 13px;transition:transform .12s ease,box-shadow .12s ease,border-color .12s,color .12s,background .12s}
  button:hover:not(:disabled){border-color:var(--signal);color:var(--signal);transform:translateY(-1px)}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.38;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .btn-go{background:var(--signal);color:var(--on-signal);border-color:var(--signal);font-weight:700;
    box-shadow:var(--shadow)}
  .btn-go:hover:not(:disabled){background:var(--signal-hi);color:var(--on-signal);border-color:var(--signal-hi);
    box-shadow:0 4px 14px var(--signal-glow),var(--shadow)}
  .btn-sm{padding:5px 9px;font-size:12px}
  .btn-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

  textarea,input[type=text],select{width:100%;background:var(--ink);color:var(--text);
    border:1px solid var(--line);border-radius:3px;padding:9px;font-family:var(--mono);
    font-size:12px;resize:vertical}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--cool)}
  select{font-family:var(--disp);font-size:13px}
  label.lab{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}

  /* A password you cannot read is a password you mistype, and every mistyped
     one here costs a round trip to find out. */
  .pw{position:relative}
  .pw input{padding-right:62px}
  .pw .rev{position:absolute;right:5px;top:50%;transform:translateY(-50%);
    background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:10.5px;
    letter-spacing:.1em;padding:5px 7px;cursor:pointer}
  .pw .rev:hover:not(:disabled){color:var(--signal);border-color:transparent;
    background:none;transform:translateY(-50%)}
  .pw .rev:active:not(:disabled){transform:translateY(-50%)}

  .drop{border:1px dashed var(--line);border-radius:4px;padding:20px 14px;text-align:center;
    color:var(--muted);font-size:12px;cursor:pointer;transition:.14s}
  .drop:hover,.drop.over{border-color:var(--signal);color:var(--signal)}

  /* ── onboarding ── */
  .onb{max-width:680px;margin:0 auto;padding:48px 22px 80px}
  .onb .lede{font-size:26px;line-height:1.25;margin:14px 0 10px;letter-spacing:-.02em}
  .onb .say{color:var(--muted);margin:0 0 26px;font-size:14px}
  .steps{display:flex;gap:0;margin-bottom:30px;border-bottom:1px solid var(--line)}
  .stp{flex:1;padding:0 0 9px;font-size:11.5px;color:var(--dim);border-bottom:2px solid transparent;
    font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
  .stp.on{color:var(--signal);border-bottom-color:var(--signal)}
  .stp.did{color:var(--good)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px;
    box-shadow:var(--shadow)}
  .card + .card{margin-top:12px}
  .kv{display:grid;grid-template-columns:132px 1fr;gap:8px 14px;font-size:13px}
  .kv .k{color:var(--muted);font-size:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11.5px;padding:3px 8px;border-radius:2px;background:var(--panel2);
    border:1px solid var(--line);color:var(--muted)}
  .chip.g{color:var(--good);border-color:var(--good-line)}
  .chip.r{color:var(--warn);border-color:var(--warn-line)}

  .trk{border:1px solid var(--line);border-radius:4px;padding:15px;cursor:pointer;
    transition:.14s;background:var(--panel);margin-bottom:10px}
  .trk:hover{border-color:var(--cool)}
  .trk.sel{border-color:var(--signal);background:var(--panel2)}
  .trk .tl{font-size:15px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:9px}
  .trk .tw{color:var(--muted);font-size:12.5px;margin:0}
  .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:2px 6px;
    border-radius:2px;background:var(--ink);color:var(--dim);text-transform:uppercase}
  .tag.easy{color:var(--good)} .tag.hard{color:var(--warn)} .tag.mid{color:var(--cool)}

  /* ── main app ── */
  .wrap{display:grid;grid-template-columns:288px 1fr}
  .side{border-right:1px solid var(--line);padding:18px;background:var(--panel);
    min-height:calc(100vh - 60px)}
  .main{padding:20px 22px 60px;min-width:0}
  .sheet-head{display:none}

  /* Sidebar disclosures. Everything in this column is either something you do
     every session (pick a direction, run a search) or something you do twice a
     year (export, trim, rotate a key), and all of it was drawn at one weight.
     The rare half now sits behind one of these. Native <details>, so the open
     and closed states cost no script. */
  .fold{border:1px solid var(--line);border-radius:5px;background:var(--panel2);margin-top:12px}
  .fold > summary{list-style:none;cursor:pointer;padding:9px 11px;font-size:12.5px;
    display:flex;align-items:center;gap:8px;color:var(--text)}
  .fold > summary::-webkit-details-marker{display:none}
  .fold > summary::after{content:'';width:6px;height:6px;margin-left:auto;
    border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);
    transform:translateY(-2px) rotate(45deg);transition:transform .16s}
  .fold[open] > summary::after{transform:translateY(1px) rotate(-135deg)}
  .fold:hover{border-color:var(--cool)}
  .fold > .foldbody{padding:2px 11px 12px}
  /* Scoring runs on its own, so its ordinary state is a fact to read rather
     than a button to press. The button lives in the fold, for the two cases
     that need it: auto switched off, or a backlog past the auto cap. */
  .sidestat{display:flex;align-items:center;gap:8px;font-size:12px;
    color:var(--muted);padding:2px 0 4px}
  .sdot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0}
  .sdot.on{background:var(--good)}

  /* ── narrow screens ──
     This column used to sit BELOW the job list: the old rule was
     .main{order:1}.side{order:2}, which on a phone put every control — search,
     add, score, backup — underneath however many cards were on screen. With
     the list capped at 60 that is a very long scroll to reach the search box,
     and the controls are the reason you opened the app.

     So on a narrow screen the sidebar stops being a column and becomes a sheet,
     opened from a bar pinned to the bottom of the viewport where a thumb
     already rests. Taking it out of flow is also what makes the order rules
     unnecessary rather than merely wrong. */
  /* Below the sheet, above everything else. Toasts sit at 40 and the modal
     layer at 50, so an open sheet never covers a dialog it opened. */
  #toolbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:44;
    gap:10px;align-items:center;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    box-shadow:var(--shadow-md)}
  #toolbar button{min-height:44px}
  #scrim{display:none;position:fixed;inset:0;z-index:43;background:var(--veil-lite)}

  /* Turned on below, after the base rules above -- a media query carries no
     extra specificity, so these have to come second to win. */
  @media(max-width:900px){
    .wrap{grid-template-columns:1fr}
    .side{position:fixed;left:0;right:0;bottom:0;z-index:45;
      max-height:82vh;overflow:auto;min-height:0;
      border-right:none;border-top:1px solid var(--line);
      border-radius:12px 12px 0 0;box-shadow:var(--shadow-lg);
      padding-bottom:calc(18px + env(safe-area-inset-bottom));
      transform:translateY(101%);transition:transform .22s cubic-bezier(.16,1,.3,1)}
    .side.open{transform:translateY(0)}
    .sheet-head{display:flex;align-items:center;gap:10px;margin:-4px 0 16px;
      position:sticky;top:-2px;padding:6px 0 10px;background:var(--panel);z-index:1}
    .main{padding-bottom:96px}
    /* Everything in the sheet is a touch target now, not a pointer target. */
    .side button,.side select,.side .drop,.side summary{min-height:44px}
    #toolbar{display:flex}
    #scrim{display:block}
  }
  .block{margin-bottom:22px}
  .block > .eyebrow{display:block;margin-bottom:9px}

  .plotwrap{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;
    box-shadow:var(--shadow)}
  .plothead{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;flex-wrap:wrap}
  svg.plot{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
  /* Cold targets are drawn as unfilled squares, so without this only the 1.6px
     stroke is clickable. pointer-events makes the whole shape a target. */
  .dot{cursor:pointer;pointer-events:all}
  .dot:hover{filter:brightness(1.35)}
  .quadlabel{font-family:var(--mono);font-size:8px;fill:var(--dim);letter-spacing:.1em}

  .stats{display:flex;gap:20px;flex-wrap:wrap;margin:14px 0 22px}
  .stat .k{font-family:var(--mono);font-size:24px;color:var(--signal);line-height:1}
  .stat .l{font-size:11px;color:var(--muted);margin-top:3px}

  .job{border:1px solid var(--line);border-left:2px solid var(--dim);border-radius:3px;
    background:var(--panel);padding:13px 15px;margin-bottom:9px;box-shadow:var(--shadow)}
  .job.hi{border-left-color:var(--signal)}
  .job.ch-posted{border-left-color:var(--posted)}
  .job.ch-cold{border-left-color:var(--cold)}
  .job.ch-cold .jscore .big{color:var(--cold)}
  .job.st-live{border-left-color:var(--live);background:linear-gradient(90deg,var(--live-tint),transparent 40%)}
  .job.st-due{border-left-color:var(--warn)}
  .stage{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 7px;border-radius:2px;border:1px solid var(--line);color:var(--muted)}
  .stage.s-new{color:var(--muted)}
  .stage.s-sent{color:var(--neutral);border-color:var(--neutral-line)}
  .stage.s-due{color:var(--warn);border-color:var(--warn-line)}
  .stage.s-live{color:var(--live);border-color:var(--live-line)}
  .stage.s-closed{color:var(--dim)}
  /* Age earns colour only at the ends of the scale. A fortnight-old posting is
     ordinary and should not shout; a stale one should visibly recede. */
  .stage.s-age{color:var(--muted)}
  .stage.s-age.hot{color:var(--posted);border-color:var(--posted-dim)}
  .stage.s-age.stale{color:var(--dim);border-color:var(--stale-line)}
  .stage.s-age.guess{font-style:italic}
  .chn{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 7px;border-radius:2px}
  .chn.posted{color:var(--posted);background:var(--posted-dim)}
  .chn.cold{color:var(--cold);background:var(--cold-dim)}

  /* ── daily dashboard ── */
  .sect{margin-bottom:26px}
  .sect-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .sect-h h3{font-size:15px}
  .sect-h .ct{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .sect-sub{color:var(--muted);font-size:12px;margin:0 0 12px}
  .sect.live .sect-h h3{color:var(--live)}
  .sect.due .sect-h h3{color:var(--warn)}

  /* ── contacts ── */
  .ct-row{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
  .ct-row:first-of-type{border-top:none}
  .ct-nm{font-size:13px}
  .ct-meta{font-size:11px;color:var(--muted);font-family:var(--mono);word-break:break-all}
  .ct-none{color:var(--dim);font-size:12px;padding:8px 0}
  .log{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:7px 0}
  .log b{color:var(--text);font-weight:500}
  .log .when{font-family:var(--mono);font-size:10px;color:var(--dim)}
  .job.done{opacity:.42}
  .jrow{display:flex;gap:12px;align-items:flex-start}
  .jt{font-size:15px;font-weight:500;margin-bottom:2px}
  .jc{color:var(--muted);font-size:12px}
  .jscore{text-align:right;flex-shrink:0;font-family:var(--mono)}
  .jscore .big{font-size:19px;color:var(--signal);line-height:1}
  .jscore .sm{font-size:10px;color:var(--dim);margin-top:2px}
  .jreason{font-size:12px;color:var(--muted);margin:8px 0 0;font-style:italic}
  .flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .flag{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:2px;
    background:var(--panel2);color:var(--muted);letter-spacing:.04em}
  .flag.g{color:var(--good)} .flag.r{color:var(--warn)}
  .jacts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;align-items:center}
  a.lnk{color:var(--cool);text-decoration:none;font-size:12px;font-family:var(--mono)}
  a.lnk:hover{text-decoration:underline}
  .bar{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%}

  .empty{border:1px dashed var(--line);border-radius:4px;padding:34px 20px;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--text);font-size:15px;font-weight:500;margin-bottom:6px}
  .prog{height:2px;background:var(--panel2);border-radius:1px;overflow:hidden;margin-top:8px}
  .prog i{display:block;height:100%;background:var(--signal);transition:width .3s}

  .modal{position:fixed;inset:0;background:var(--veil);display:flex;
    align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:5px;
    max-width:620px;width:100%;max-height:84vh;overflow:auto;padding:22px;
    box-shadow:var(--shadow-lg)}

  .tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--signal);border-bottom-color:var(--signal)}
  .tab:hover{color:var(--text)}
  .tabct{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:8px;
    background:var(--panel2);color:var(--muted);vertical-align:1px}
  .tabct.due{background:var(--warn-chip);color:var(--warn)}
  @media(max-width:480px){
    .tabs{flex-wrap:wrap;row-gap:10px}

  .listhead{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}

  /* Background-task toasts. Fixed to the corner and above the app but BELOW

    flex-direction:column;gap:9px;width:min(330px,calc(100vw - 32px))}

<div id="app"><div id="root"></div><div id="tasks"></div></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
/* Password fields, with a way to read back what was typed. */
const pwField = (id, autocomplete, placeholder, value) =>
  `<div class="pw"><input id="${id}" type="password" autocomplete="${autocomplete}"`
  + ` placeholder="${esc(placeholder||'')}" value="${esc(value||'')}">`
  + `<button type="button" class="rev" data-pw="${id}">SHOW</button></div>`;
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-pw]'); if(!b) return;
  const i = document.getElementById(b.dataset.pw); if(!i) return;
  const reveal = i.type === 'password';
  i.type = reveal ? 'text' : 'password';
  b.textContent = reveal ? 'HIDE' : 'SHOW';
  i.focus();
});

const COLS = ["title","company","location","url","description","status","date_applied",
  "follow_up_date","pitch_sent","notes","source","query",
  "ai_score","ai_reason","ai_flags","ai_confidence","ai_reachability","channel",
  "stage","last_touch","contacts","events","added",
  "posted","posted_lo","posted_hi","posted_src"];

/* ═══ when was this posted ═══
   'added' is when a row reached this app, which says nothing about the job.
   A posting's age is the one signal that decays on its own: the same role is
   a different bet on day 2 and on day 40, and until now nothing here showed
   that. So it is stored as a real field with its provenance, not spelled into
   a notes string where only a human can read it.

   Four fields, because certainty varies and pretending otherwise would be the
   whole problem. posted_lo/posted_hi bound the window, posted is the single
   date to sort on (the midpoint of a window), and posted_src says where the
   claim came from:
     feed  the source stated it — an ATS feed carries a real one
     page  parsed out of a search snippet, usually "5 days ago"
     est   the model's reading of the description, and the widest of the three
   Cheapest and most reliable first: nothing is asked of the model that a feed
   already answered for free. */
const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const isoOf = d => (d instanceof Date && !isNaN(d)) ? d.toISOString().slice(0,10) : '';
function shiftDays(base, n){
  const d=new Date(String(base)+"T00:00:00Z");
  if(isNaN(d)) return '';
  d.setUTCDate(d.getUTCDate()-n);
  return isoOf(d);
}
/* A job cannot have been posted tomorrow, and one older than three years is a
   parse gone wrong rather than a very patient employer. Both are dropped
   rather than shown, because a confidently wrong date is worse than none. */
function saneDate(iso, base){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||''))) return '';
  base=base||today();
  // A day or two into the future is a timezone, and worth keeping as today.
  // Anything beyond that is bad data, and dropping it matters more than most:
  // a future date sorts to the very top of the freshest list.
  if(iso>base) return dayDiff(base,iso)<=2 ? base : '';
  return dayDiff(iso,base)>1095 ? '' : iso;
}
function parseWhen(txt, base){
  const t=String(txt||'').trim();
  if(!t) return '';
  base=base||today();
  if(/^\d{13}$/.test(t)) return saneDate(isoOf(new Date(parseInt(t,10))),base);
  if(/^\d{10}$/.test(t)) return saneDate(isoOf(new Date(parseInt(t,10)*1000)),base);
  const iso=t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return saneDate(iso[0],base);
  if(/\b(just\s*now|today|moments?\s+ago|hours?\s+ago|minutes?\s+ago)\b/i.test(t)) return base;
  if(/\byesterday\b/i.test(t)) return shiftDays(base,1);
  const rel=t.match(/\b(a|an|\d{1,3})\s*(day|week|month|year)s?\s+ago\b/i);
  if(rel){
    const n=/^\d+$/.test(rel[1])?parseInt(rel[1],10):1;
    const per={day:1,week:7,month:30,year:365}[rel[2].toLowerCase()];
    return saneDate(shiftDays(base,n*per),base);
  }
  // "Aug 30, 2026" / "August 30" / "30 Aug 2026". A missing year means the most
  // recent time that day/month happened, which is what a careers page means.
  let mo=0,day=0,yr=0;
  let m=t.match(/\b([a-z]{3,9})\.?\s+(\d{1,2})\b(?:[,\s]+(\d{4}))?/i);
  if(m && MONTHS[m[1].slice(0,3).toLowerCase()]){ mo=MONTHS[m[1].slice(0,3).toLowerCase()]; day=+m[2]; yr=+(m[3]||0); }
  if(!mo){
    m=t.match(/\b(\d{1,2})\s+([a-z]{3,9})\.?\b(?:[,\s]+(\d{4}))?/i);
    if(m && MONTHS[m[2].slice(0,3).toLowerCase()]){ day=+m[1]; mo=MONTHS[m[2].slice(0,3).toLowerCase()]; yr=+(m[3]||0); }
  }
  if(!mo || !day || day>31) return '';
  const pad=n=>String(n).padStart(2,'0');
  if(yr) return saneDate(`${yr}-${pad(mo)}-${pad(day)}`,base);
  const thisYear=+base.slice(0,4);
  const guess=`${thisYear}-${pad(mo)}-${pad(day)}`;
  return saneDate(guess<=base ? guess : `${thisYear-1}-${pad(mo)}-${pad(day)}`, base);
}
/* The single date a window sorts on. */
function midDate(lo, hi){
  if(!lo) return hi||'';
  if(!hi) return lo;
  const a=new Date(lo+"T00:00:00Z"), b=new Date(hi+"T00:00:00Z");
  if(isNaN(a)||isNaN(b)) return lo;
  return isoOf(new Date((a.getTime()+b.getTime())/2));
}
/* Days since posting, or null when genuinely unknown — which is not the same
   as old, and the tab keeps the two apart. */
function ageOf(j){
  const d=saneDate(j&&j.posted);
  return d ? Math.max(0, dayDiff(d, today())) : null;
}
const spanTxt = n => n<1 ? 'today' : n===1 ? '1d' : n<21 ? n+'d' : n<70 ? Math.round(n/7)+'w' : Math.round(n/30)+'mo';
/* Both ends of a window in the same unit, chosen by the older end. */
function spanPair(a,b){
  const unit = b<21 ? [1,'d'] : b<70 ? [7,'w'] : [30,'mo'];
  const f = n => Math.max(unit[0]===1?0:1, Math.round(n/unit[0]))+unit[1];
  return f(a)+'\u2013'+f(b);
}
/* Exact dates read as a point, estimates as the window they really are. */
function ageLabel(j){
  const n=ageOf(j); if(n===null) return '';
  const lo=saneDate(j.posted_lo), hi=saneDate(j.posted_hi);
  if(lo&&hi&&lo!==hi){
    const a=Math.max(0,dayDiff(hi,today())), b=Math.max(0,dayDiff(lo,today()));
    if(a!==b) return `~${spanPair(a,b)} ago`;
  }
  return n<1 ? 'today' : spanTxt(n)+' ago';
}

/* Pipeline stages. Deliberately few — every extra state is one more decision
   the person has to make about a row instead of acting on it.
     new    scored, untouched
     sent   applied or messaged, waiting
     live   they replied. the only state where a human is on the other end
     closed rejected, withdrawn, or given up on
   'due' is not stored. It is derived: sent, and the follow-up date has passed.
   Storing it would mean rewriting rows on a timer just to keep them honest. */
const STAGES = ["new","sent","live","closed"];
const FOLLOWUP_DAYS = 7;

/* ═══ state ═══
   Multi-profile. Each person who uses this gets their own entry:
   their parsed profile, their chosen track, their own job list. */
let DB = { profiles:{}, current:null };
let KEY  = '';           // LLM key (DeepSeek or Anthropic)
let PROV = 'deepseek';   // 'deepseek' | 'anthropic'
let APIFY= '';           // Apify token for board search and contact lookup
let CHFILT = 'all';      // 'all' | 'posted' | 'cold'
let AUTO  = true;        // score whatever a pull brings in, without being asked
let VIEW = 'onb';        // 'onb' | 'app'
const blankOnb = () => ({ step:0, raw:'', fileName:'', parsed:null, track:null,
  error:'', assessing:false, assessed:null, assessErr:'', wantText:'' });
let ONB = blankOnb();
let RANGE = null, TAB = 'unapplied', busy = false;
/* Narrow screens only: is the tools sheet showing. Never read above 900px,
   where the sidebar is simply a column and the sheet CSS does not apply. */
let TOOLS = false;
/* Which disclosures are open, sidebar and lists alike. Held here rather than
   left as DOM state because render() rebuilds #root from scratch: a panel that
   shut itself every time you used something inside it would be worse than no
   panel at all. Keys appear as folds do; an unknown one reads as closed. */
let FOLDS = { add:false, score:false, data:false };

/* ═══ theme ═══
   'auto' follows the operating system, which is the right default because the
   person already told their machine which they wanted. The two explicit modes
   are for the case where this app is the exception. Kept per device rather than
   in the account: which screen you are sitting at is not a fact about you, and
   syncing it would mean a phone in bed inheriting a desktop's daylight. */
let THEME = 'auto';
const THEMES = ['auto','light','dark'];
/* One place reads a token's computed value, so the plot can be drawn in the
   same colours as everything else instead of repeating their hexes. */
const CV = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const sysLight = () => !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
function applyTheme(){
  const light = THEME==='auto' ? sysLight() : THEME==='light';
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  // The browser paints its own chrome from this on mobile; leaving it on the
  // old dark value puts a black bar above a white page.
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', CV('--ink') || '#0E1411');
}
/* Before the first paint, and synchronously -- everything else here is async,
   and a single frame of the wrong theme is the one theming bug people notice. */
try{ THEME = localStorage.getItem('triage:theme') || 'auto'; }catch(e){}
applyTheme();
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: light)');
  const onSys = () => { if(THEME==='auto'){ applyTheme(); render(); } };
  if(mq.addEventListener) mq.addEventListener('change', onSys);
  else if(mq.addListener) mq.addListener(onSys);
}
/* Three different questions, deliberately kept apart. 'rank' is is this worth
   doing, 'new' is when did this reach me, 'posted' is when did the employer
   list it -- and the last two are not the same thing at all. */
let SORT = 'rank';       // 'rank' | 'new' (added) | 'posted' (listed)
/* Where to search. null means nobody has chosen, which reads as the profile's
   own location -- so the box arrives filled in. Held here rather than left in
   the input because starting a search re-renders the sidebar, and a control
   that reverts to its default the moment you use it is worse than none. */
let WHERE = null;
/* Every job card is roughly 1.5KB of HTML. At 800 jobs the two long lists were
   drawing 1,600 cards between them on every single render -- 2.7MB of innerHTML
   and 46,000 nodes -- which on a mid-range machine is seconds of blank screen
   before anything appears. Nobody scrolls 800 cards; they work the top and
   search for the rest. */
const LIST_CAP = 60;
/* Long-running work lives here rather than behind a modal, so the app stays
   usable while an Apify run polls. Deliberately not persisted: a run belongs
   to the page that started it, and a task restored after a reload would have
   nothing on the other end of it. */
let TASKS = [], TASKSEQ = 0;

/* A profile record is only usable if it actually carries a parsed profile.
   A record without one -- a half-finished onboarding, a partial write -- took
   the whole app down: renderApp reads prof.tracks on its first line, and the
   onboarding fallback reads p.profile.name, so there was nowhere left to land.
   Treating it as absent sends them to onboarding, which can fix it. */
const usable = p => !!(p && p.profile);
const P = () => { const p = DB.profiles[DB.current]; return usable(p) ? p : null; };

/* ═══ storage ═══
   Two homes. Inside Claude's artifact viewer window.storage exists and is the
   only thing that works. Opened as a downloaded file there is no window.storage,
   so fall back to localStorage, which works there and is blocked in the viewer.
   Use whichever is actually available. */
const HAS_WS = typeof window.storage !== 'undefined' && window.storage
               && typeof window.storage.get === 'function';

/* ═══ accounts and cloud sync ═══
   Optional, and off unless config.js has been filled in. An unconfigured copy
   runs exactly as it always did — no account, no server, data in this browser
   — because the alternative is that a missing config file bricks the app for
   everyone, which is not a trade worth making for a feature nobody asked to be
   mandatory.

   The put/get shim below is why this is a small change rather than a rewrite:
   the app has always talked to storage through two functions, so pointing them
   at Postgres leaves every caller untouched. One table, one row per key per
   user, protected by row-level security in the database rather than by any
   check in this file — a bug up here must not be able to leak somebody's CV.

   API keys are the deliberate exception and stay local. Uploading a person's
   DeepSeek and Apify credentials would add real liability and buy nothing:
   they are per-device by nature, and a stolen database should not also be a
   stolen set of API keys. */
const CFG   = window.TRIAGE_CONFIG || {};
const CLOUD = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase);
const SB    = CLOUD ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;
let USER = null;                      // the signed-in auth user, or null
/* Never leaves the device it was typed on. */
const LOCAL_ONLY = /^triage:(key|prov|apify|hr:)/;
/* Every cloud call here sits between the person and their own data, so none of
   them may hang. A request that never settles is an app that loads forever,
   which is worse than one that fails: a failure falls back to the copy on this
   device and they carry on working. */
const withTimeout = (p, ms, what) => Promise.race([p,
  new Promise((_,rej)=>setTimeout(()=>rej(new Error(what+' timed out after '+Math.round(ms/1000)+'s')), ms))]);
const READ_MS = 8000, WRITE_MS = 45000;
/* Once one call has timed out, the rest of this page load will too. Latching
   here turns four serial timeouts into one, and every later call falls through
   to the copy on this device immediately. Cleared by a reload. */
let CLOUD_DOWN = false;
const cloudDown = e => { if(e && /timed out/.test(e.message||'')) CLOUD_DOWN = true; };
const cloudNow = () => !!(SB && USER && !CLOUD_DOWN);

async function putLocal(k,v){
  if(HAS_WS){ try{ await window.storage.set(k,v); return; }catch(e){} }
  try{ localStorage.setItem(k,v); }catch(e){ console.error('save failed',e); }
}
async function getLocal(k){
  if(HAS_WS){ try{ const r=await window.storage.get(k); return r?r.value:null; }catch(e){ return null; } }
  try{ return localStorage.getItem(k); }catch(e){ return null; }
}
async function put(k,v){
  if(!cloudNow() || LOCAL_ONLY.test(k)) return putLocal(k,v);
  // Written locally as well, always. A failed round trip must not silently
  // lose the thing the user just did, and it doubles as the offline copy.
  await putLocal(k,v);
  try{
    const {error}=await withTimeout(
      SB.from('user_state')
        .upsert({user_id:USER.id,k,v,updated_at:new Date().toISOString()},{onConflict:'user_id,k'}),
      WRITE_MS, 'saving to your account');
    if(error) throw error;
    syncNote('');
  }catch(e){
    cloudDown(e);
    console.warn('cloud save failed:', e && e.message);
    syncNote("Saved on this device \u2014 " + ((e&&e.message)||'could not reach the server')
             + ". Your work is not lost.");
  }
}
async function get(k){
  if(!cloudNow() || LOCAL_ONLY.test(k)) return getLocal(k);
  try{
    const {data,error}=await withTimeout(
      SB.from('user_state').select('v').eq('user_id',USER.id).eq('k',k).maybeSingle(),
      READ_MS, 'reading your account');
    if(error) throw error;
    if(data && typeof data.v==='string'){ await putLocal(k,data.v); return data.v; }
    return null;
  }catch(e){ cloudDown(e); console.warn('cloud read failed:', e && e.message); return getLocal(k); }   // offline: last known good
}
function syncNote(t){ const e=$('#syncInfo'); if(e){ e.textContent=t; e.style.display=t?'block':'none'; } }
async function save(){ await put('triage:db', JSON.stringify(DB)); }
async function load(){
  try{
    const v = await get('triage:db');
    if(v){ const d=JSON.parse(v); DB.profiles=d.profiles||{}; DB.current=d.current||null; }
  }catch(e){}
  KEY   = (await get('triage:key'))   || '';
  PROV  = (await get('triage:prov'))  || 'deepseek';
  APIFY = (await get('triage:apify')) || '';
  AUTO  = (await get('triage:auto')) !== '0';   // on unless turned off
  // Local, not cloud -- see the theme block above.
  const th = await getLocal('triage:theme');
  if(THEMES.includes(th)){ THEME = th; applyTheme(); }
}

/* ═══ Apify ═══
   Apify's REST API does send CORS headers, so this runs from the browser.
   The token is stored locally and sent only to Apify — but it is a real
   credential, so this file should not be shared with the token saved in it. */
const APIFY_BASE  = "https://api.apify.com/v2";

/* Giving up on a run does not stop it. The tab walks away, the actor keeps
   working, and the bill keeps growing — the one way to spend money here and
   get nothing whatsoever back. Two guards, because they fail differently:
   every run carries a server-side timeout, which holds even if the browser is
   closed mid-run, and every place that stops waiting also aborts on its way
   out, which is immediate rather than waiting for that timeout to expire. */
function runUrl(actor, secs){
  return APIFY_BASE+"/acts/"+actor+"/runs?timeout="+secs;
}
async function abortRun(runId, H){
  if(!runId) return;
  try{ await fetch(APIFY_BASE+"/actor-runs/"+runId+"/abort",{method:"POST",headers:H}); }catch(e){}
}


/* ═══ ATS feeds ═══
   The best data source in the app, and the only one that costs nothing.

   Most companies' careers pages are a thin shell over one of a handful of
   applicant tracking systems, and those systems publish the underlying jobs as
   public JSON. No key, no token, no proxy, no Apify run. These are the same
   endpoints the careers page itself calls, so they are complete, live, and do
   not break when someone redesigns the site.

   They also solve the confidence problem: Google gives a two-line snippet, an
   ATS feed gives the entire job description. Every row pulled this way scores
   high-confidence instead of thin_data.

   CORS: these endpoints are built to be called from customer career sites, so
   they send permissive headers and work from the browser. If one is ever
   blocked, it will fail as a network error, not a 4xx. */

const ATS = {
  greenhouse:{
    label:"Greenhouse",
    host:/(?:job-)?boards\.greenhouse\.io\/([^/?#]+)/i,
    url:s=>`https://boards-api.greenhouse.io/v1/boards/${encodeURIComponent(s)}/jobs?content=true`,
    parse:(d,slug)=>(d.jobs||[]).map(x=>({
      title:x.title||"", location:(x.location&&x.location.name)||"",
      url:x.absolute_url||"", posted:(x.updated_at||"").slice(0,10),
      // Greenhouse returns the description HTML-encoded inside a JSON string.
      desc:decodeHTML(String(x.content||"")), dept:((x.departments||[])[0]||{}).name||""
    }))
  },
  lever:{
    label:"Lever",
    host:/jobs\.lever\.co\/([^/?#]+)/i,
    url:s=>`https://api.lever.co/v0/postings/${encodeURIComponent(s)}?mode=json`,
    parse:d=>(Array.isArray(d)?d:[]).map(x=>({
      title:x.text||"", location:(x.categories&&x.categories.location)||"",
      url:x.hostedUrl||x.applyUrl||"",
      posted:x.createdAt?new Date(x.createdAt).toISOString().slice(0,10):"",
      desc:stripTags(String(x.descriptionPlain||x.description||"")),
      dept:(x.categories&&(x.categories.team||x.categories.department))||""
    }))
  },
  ashby:{
    label:"Ashby",
    host:/jobs\.ashbyhq\.com\/([^/?#]+)/i,
    url:s=>`https://api.ashbyhq.com/posting-api/job-board/${encodeURIComponent(s)}?includeCompensation=true`,
    parse:d=>(d.jobs||[]).map(x=>({
      title:x.title||"", location:x.location||"",
      url:x.jobUrl||x.applyUrl||"", posted:(x.publishedAt||"").slice(0,10),
      desc:stripTags(String(x.descriptionPlain||x.descriptionHtml||"")),
      dept:x.department||"",
      // Ashby is the one feed with reliable pay data, so keep it when present.
      pay:x.compensation&&x.compensation.compensationTierSummary||""
    }))
  }
};

function decodeHTML(str){
  const t=document.createElement("textarea"); t.innerHTML=str;
  return stripTags(t.value);
}
const stripTags = h => String(h).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();

/* Turning a company NAME into an ATS slug is the whole difficulty of this
   feature. A URL is unambiguous; a name is not. "Deployment Inc" could be
   deploymentinc, deployment-inc, deployment, or something unrelated.

   Rather than make the person go and find each careers page by hand, try the
   handful of forms companies actually use. Each miss is a cheap 404, and we
   stop at the first hit. Anything still unfound falls through to a Google
   lookup afterwards, which is what a person would have done manually anyway. */
function slugVariants(name){
  const base=String(name).toLowerCase().trim()
    // Drop the corporate suffixes almost nobody puts in a board slug.
    .replace(/\b(inc|llc|ltd|limited|corp|corporation|co|gmbh|pvt|private|technologies|technology|labs|ai)\b\.?/g,' ')
    .replace(/[^a-z0-9 -]/g,' ').replace(/\s+/g,' ').trim();
  const squashed=base.replace(/[\s-]/g,'');
  const hyphen=base.replace(/\s+/g,'-');
  const firstWord=base.split(' ')[0]||'';
  // Keep the AI suffix version too: plenty of companies do use it (sarvamai).
  const withAi=String(name).toLowerCase().replace(/[^a-z0-9]/g,'');
  return [...new Set([squashed,hyphen,firstWord,withAi].filter(x=>x&&x.length>1))].slice(0,4);
}

/* Accepts a careers URL, "platform:slug", or a bare company name. */
function parseAtsTarget(line){
  const t=String(line).trim(); if(!t) return [];
  for(const k in ATS){
    const m=t.match(ATS[k].host);
    if(m) return [{platform:k,slug:m[1],exact:true}];
  }
  const explicit=t.match(/^(greenhouse|lever|ashby)\s*[:/]\s*(.+)$/i);
  if(explicit) return [{platform:explicit[1].toLowerCase(),slug:explicit[2].trim(),exact:true}];
  if(/^https?:\/\//i.test(t)) return [];        // some other careers page; Google will have to find it
  const out=[];
  slugVariants(t).forEach(sl=>Object.keys(ATS).forEach(k=>out.push({platform:k,slug:sl,name:t})));
  return out;
}

/* Last resort: ask Google where this company's board lives. This is exactly the
   manual step it saves — one search per company, and the slug falls out of the
   URL. Needs the Apify token; without it, unfound companies are just reported. */
/* Every Apify feature here is the same three steps: start a run, poll it until
   it stops, read its dataset. Only the actor, the payload, the polling cadence
   and the wording of the status line differ, so those are the arguments.

   cap is how long this tab is willing to wait. The run's own server-side
   timeout is derived from it rather than passed separately, because the two
   must not drift: the server has to outlive the browser's patience, or a run
   the tab is still polling gets killed underneath it. Giving up also aborts,
   since walking away from a run does not stop the bill. */
async function apifyRun(actor, payload, o){
  const every=o.every||6000, cap=o.cap||600;
  if(!APIFY || !APIFY.startsWith("apify_api_")) throw new Error("NEEDAPIFY");
  const H={"Authorization":"Bearer "+APIFY,"Content-Type":"application/json"};
  let r;
  try{ r=await fetch(runUrl(actor,cap+60),{method:"POST",headers:H,body:JSON.stringify(payload)}); }
  catch(e){ throw new Error("Couldn't reach Apify."); }
  if(r.status===401||r.status===403) throw new Error("NEEDAPIFY");
  if(!r.ok) throw new Error("Apify returned "+r.status);
  const d=(await r.json()).data||{};
  if(!d.id) throw new Error("Apify wouldn't start the run.");
  // The loop condition already exits on SUCCEEDED; only a hard failure throws.
  let status="RUNNING", waited=0;
  while(status==="RUNNING"||status==="READY"){
    await new Promise(z=>setTimeout(z,every)); waited+=every/1000;
    if(waited>cap){ abortRun(d.id,H); throw new Error(`${o.label||'That run'} timed out after ${Math.round(cap/60)} minutes.`); }
    const pr=await fetch(APIFY_BASE+"/acts/"+actor+"/runs/"+d.id,{headers:H});
    status=((await pr.json()).data||{}).status||"UNKNOWN";
    if(o.onStatus) o.onStatus(`${o.label||'working'} — ${status.toLowerCase()}, ${waited}s`);
    if(["FAILED","TIMED-OUT","ABORTED"].includes(status)) throw new Error("Apify run "+status);
  }
  const dr=await fetch(APIFY_BASE+"/datasets/"+d.defaultDatasetId+"/items?clean=true&format=json",{headers:H});
  return (await dr.json())||[];
}

async function findBoardsViaGoogle(names, onStatus){
  const qs=names.slice(0,10).map(n=>
    `"${n}" (site:boards.greenhouse.io OR site:job-boards.greenhouse.io OR site:jobs.lever.co OR site:jobs.ashbyhq.com)`);
  if(!qs.length) return {};
  const items=await apifyRun(APIFY_GOOGLE,
    {queries:qs.join("\n"),languageCode:"en",maxPagesPerQuery:1,resultsPerPage:5,mobileResults:false},
    {every:6000,cap:300,onStatus,label:`looking up ${qs.length} careers page${qs.length>1?'s':''}`});
  const map={};
  (items||[]).forEach(item=>{
    const term=((item.searchQuery||{}).term)||"";
    const name=(term.match(/^"([^"]+)"/)||[])[1];
    if(!name || map[name]) return;
    for(const res of (item.organicResults||[])){
      for(const k in ATS){
        const m=String(res.url||"").match(ATS[k].host);
        if(m){ map[name]={platform:k,slug:m[1],exact:true}; return; }
      }
    }
  });
  return map;
}

async function atsPull(platform, slug){
  const cfg=ATS[platform]; if(!cfg) return null;
  let r;
  try{ r=await fetch(cfg.url(slug),{headers:{"Accept":"application/json"}}); }
  catch(e){ throw new Error("network"); }
  if(r.status===404||r.status===400) return null;   // wrong slug or wrong platform
  if(!r.ok) throw new Error(cfg.label+" returned "+r.status);
  let d; try{ d=await r.json(); }catch(e){ return null; }
  const rows=cfg.parse(d,slug)||[];
  if(!rows.length) return null;
  return {platform,slug,label:cfg.label,rows};
}

async function atsSearch(lines, onStatus){
  const found=[], unresolved=[];
  const tryCands=async(cands,label)=>{
    for(const c of cands){
      if(onStatus) onStatus(`checking ${c.slug} on ${ATS[c.platform].label}\u2026`);
      try{
        const res=await atsPull(c.platform,c.slug);
        if(res){ res.name=label||res.slug; return res; }
      }catch(e){
        if(e.message==="network") throw new Error(
          "The ATS feed was blocked by the browser. This normally works \u2014 try again, or add these by hand.");
      }
    }
    return null;
  };

  // Pass one: URLs resolve immediately; names get their likely slugs tried.
  for(const line of lines){
    const cands=parseAtsTarget(line);
    if(!cands.length){ unresolved.push(line); continue; }
    const hit=await tryCands(cands,line);
    if(hit) found.push(hit); else unresolved.push(line);
  }

  // Pass two: whatever is left, ask Google to locate. This is the step that
  // means nobody has to go hunting for careers URLs by hand.
  const misses=[];
  if(unresolved.length){
    let map={};
    try{ map=await findBoardsViaGoogle(unresolved,onStatus); }catch(e){ map={}; }
    for(const line of unresolved){
      const c=map[line];
      if(!c){ misses.push(line); continue; }
      const hit=await tryCands([c],line);
      if(hit){ hit.viaGoogle=true; found.push(hit); } else misses.push(line);
    }
  }
  return {found,misses};
}

/* Hiring velocity. Posting counts over time say more about whether a cold
   approach will land than any static company attribute: a team adding roles is
   building, a team that stopped is not. Snapshot on every pull so the delta is
   there next time. */
/* One ATS hit becomes job rows. Shared by "pull a company I know" and the
   hiring check inside company suggestions, which differ only in whether a
   velocity note rides along in the row. */
function rowsFromAts(hit, vel){
  return hit.rows.map(x=>{
    const j=blank();
    j.title=x.title||'[No Title]'; j.company=hit.name||hit.slug;
    j.location=x.location||''; j.url=x.url||'';
    j.description=(x.desc||'').slice(0,4000);
    j.source=hit.label; j.query=hit.slug; j.channel='posted'; j.stage='new';
    setPosted(j, x.posted, 'feed');
    j.notes=[x.dept?'Team: '+x.dept:'', x.pay?'Pay: '+x.pay:'', vel||''].filter(Boolean).join(' \u00b7 ');
    return j;
  });
}

async function recordVelocity(slug, count){
  const p=P(); if(!p) return;
  p.velocity = p.velocity || {};
  const hist = p.velocity[slug] || [];
  if(!hist.length || hist[0].on !== today()) hist.unshift({on:today(),count});
  else hist[0].count = count;
  p.velocity[slug] = hist.slice(0,12);
}
function velocityNote(slug){
  const p=P(); const h=(p&&p.velocity&&p.velocity[slug])||[];
  if(h.length<2) return "";
  const d=h[0].count-h[1].count;
  if(d>0) return `+${d} since ${h[1].on} \u2014 they're building`;
  if(d<0) return `${d} since ${h[1].on}`;
  return `flat since ${h[1].on}`;
}

/* ═══ Apify: board search via Google ═══
   The only way jobs are searched here. Every portal and every registry is
   reached identically — one Google site: query each, through one actor — which
   is the reason there is no per-portal scraper to maintain or to pay for.

   That uniformity is what makes covering everything affordable, and covering
   everything is the point: no single portal is enough. LinkedIn is one pipe and
   for most careers the wrong one — academic posts live on registries like
   linguistlist.org and academicjobsonline.org and are essentially never on
   LinkedIn; startup roles cluster on YC and Ashby; every field has its own. So
   the big portals go in as a fixed baseline, the profile supplies the
   registries its own field uses, and both are searched in the same run.

   Same actor, same polling shape as the Python backfill. The only difference is
   what we do with the results: each organic hit becomes a new row instead of
   patching an existing one. */
const APIFY_GOOGLE = "apify~google-search-scraper";

/* One query per board, with the titles OR'd inside it, rather than one query
   per board-and-title pair. Apify bills a Google page per query, so the old
   8x4 fan-out cost four times this for slots that were mostly empty anyway —
   a niche board and an exact title rarely fill ten results between them, and
   the four titles are near-synonyms competing for the same postings. If a
   large board starts to feel under-read, maxPagesPerQuery in apifyBoardSearch
   is the dial, and a second page is cheaper than splitting the query back up
   because it does not pay for another run. */
/* The general portals, always searched. This is where most advertised work
   actually sits, and one site: query reaches each of them — which is the whole
   reason a dedicated scraper per portal was never worth paying for.
   linkedin.com/jobs rather than the bare domain: linkedin.com drags in profiles
   and posts, and a job search should come back with jobs. */
const PORTALS = ["linkedin.com/jobs","upwork.com","indeed.com","glassdoor.com",
                 "wellfound.com","ziprecruiter.com"];
/* Fourteen: the six portals above plus eight of the track's own registries. The
   specialist boards are what make a niche search work at all, so they are added
   to the portals rather than made to compete with them for slots. */
function buildBoardQueries(titles, boards, where){
  const ts=(titles||[]).slice(0,4).map(t=>`"${t}"`);
  if(!ts.length) return [];
  const any=ts.length>1 ? `(${ts.join(' OR ')})` : ts[0];
  /* Location narrows the portals, and only the portals. A portal carries every
     job on earth and is useless until cut down; a field registry carries forty
     and needs all of them, so a city term there removes more than it filters.
     "OR remote" because a remote posting names the employer's city or no city
     at all -- never the reader's, so requiring the city bare would drop the
     lot of them. */
  const place=String(where||'').trim();
  /* A multi-word place has to be quoted, or Google binds the OR to the last
     word alone: `Bangalore, India OR remote` asks for Bangalore AND (India OR
     remote), which requires the city and so excludes exactly the remote roles
     the OR is there to keep. Left alone if they have written an expression of
     their own -- quoting `Berlin OR Munich` would turn it into a phrase that
     matches nothing, and silent-empty is the worst failure this can have. */
  const term = /[\s,]/.test(place) && !/"|\bOR\b|\(/.test(place) ? `"${place}"` : place;
  const near = !place ? '' : /^remote$/i.test(place) ? ' remote' : ` (${term} OR remote)`;
  return (boards||[]).slice(0,14).map(b=>`site:${b} ${any}` + (PORTALS.includes(b)?near:''));
}

async function apifyBoardSearch(queries, countryCode, onStatus){
  // Schema confirmed against apify.com/apify/google-search-scraper:
  // queries is a newline-separated STRING, not an array.
  const items=await apifyRun(APIFY_GOOGLE,
    {queries:queries.join("\n"),countryCode:countryCode||"",languageCode:"en",
     maxPagesPerQuery:1,resultsPerPage:10,mobileResults:false},
    {every:6000,cap:600,onStatus,label:`searching ${queries.length} board queries`});

  const out=[];
  (items||[]).forEach(item=>{
    const term=((item.searchQuery||{}).term)||"";
    (item.organicResults||[]).forEach(res=>{
      const u=String(res.url||"");
      if(!u) return;
      const j=blank();
      // Google's title is usually "Job Title - Employer - Board". Take the first
      // segment as the title and the second as the employer when it looks right;
      // the scorer sees the full snippet either way, so a bad split is survivable.
      const raw=String(res.title||"").trim();
      const bits=raw.split(/\s+[\u2013\u2014|-]\s+/);
      j.title = (bits[0]||raw).slice(0,180) || "[No Title]";
      j.company = (bits.length>1 ? bits[1] : "").slice(0,120) || "[from search — verify]";
      j.url = u;
      j.description = String(res.description||"").slice(0,900);
      // Google prefixes a lot of job snippets with "5 days ago \u2014 ..." or a
      // plain date. It is free and more reliable than anything inferred from
      // the posting's own prose, so it is worth reading before the model is.
      setPosted(j, String(res.description||"").slice(0,40), 'page');
      j.source = "Board search"; j.query = term; j.status="New"; j.channel="posted";
      j.notes = "Found via "+ (u.replace(/^https?:\/\//,'').split('/')[0]);
      out.push(j);
    });
  });
  return out;
}

/* ═══ Apify: HR / recruiter contact finder (LinkedIn) ═══
   A company's own "about" page turns out to be a weak signal — most don't name
   HR at all. LinkedIn does, publicly: recruiters and department heads write who
   they are in their headline, and Google has all of it indexed.

   So this asks Google directly for the people, rather than paying an employee
   scraper to hand back the whole company. That is not a small difference. Such
   an actor bills per profile and defaults to fifty of them, and — without a
   LinkedIn cookie — is running Google underneath anyway: fifty strangers at
   ~$0.005 each, to keep the handful whose title mentions hiring. A site: query
   against linkedin.com/in asks for that handful in the first place, and one
   page of Google results costs about the price of half a profile.

   That is the whole reason there is no second path here. One did exist, as a
   fallback for when search came back thin, and it was deleted: a threshold
   nobody had measured decided when to start spending per profile, and a
   company Google has not indexed is usually one whose staff are not findable
   at any price. When search finds nobody, this says so and asks for a name.

   Three queries go out in one run — recruiting side, hiring side, and the
   company's own domain — because Apify charges per run as well as per page,
   and results are told apart afterwards by the shape of their URL.

   LinkedIn never publishes email addresses, scraped or otherwise, so this does
   NOT claim to find one. It reads the company's own domain out of the same
   search and guesses the ordinary firstname.lastname pattern from it — clearly
   labelled as a guess, everywhere it's shown, never presented as confirmed. */
/* A roster is a fact about a company, not about a job. Two roles at the same
   employer — which is the common case, companies post in batches — should cost
   one lookup, and a week is well inside how fast a recruiting desk changes. */
const HR_CACHE_DAYS  = 7;
const NOT_COMPANY_SITE = /linkedin\.com|indeed\.com|glassdoor\.com|wellfound\.com|angel\.co|crunchbase\.com|facebook\.com|twitter\.com|x\.com|instagram\.com|ycombinator\.com|builtin\.com|monster\.com|ziprecruiter\.com|ambitionbox\.com|ridewheel\.com/i;
/* Two ways a person is worth talking to. The first is the recruiting side —
   they own the process. The second is the hiring side: whoever runs the team
   the role sits in, matched by pairing a leadership word with a word from the
   job you're actually chasing, so a "Head of Data" surfaces for a data role
   and stays out of the way for a design one. */
const TITLE_NOISE = /^(a|an|the|and|or|of|for|at|in|to|with|senior|junior|staff|principal|lead|head|chief|vp|vice|president|director|manager|associate|assistant|i|ii|iii|jr|sr|remote|hybrid|onsite|full|part|time|contract|intern)$/i;

/* Words from the role being chased, used to decide whether a department head
   is relevant. Deliberately crude — a shared noun like "data" or "design" is
   a good enough signal, and anything cleverer starts inventing relevance. */
function roleWords(ctx){
  const src=[(ctx&&ctx.title)||'', ...(((ctx&&ctx.titles)||[]).slice(0,6))].join(' ');
  const out=new Set();
  String(src).toLowerCase().split(/[^a-z+#]+/).forEach(w=>{
    if(w.length>=3 && !TITLE_NOISE.test(w)) out.add(w);
  });
  return Array.from(out);
}

async function googleFirst(query, onStatus, statusLabel){
  return apifyRun(APIFY_GOOGLE,
    {queries:query,languageCode:"en",maxPagesPerQuery:1,resultsPerPage:8,mobileResults:false},
    {every:4000,cap:180,onStatus,label:statusLabel});
}

/* Google titles a LinkedIn profile "Name - Headline - Company | LinkedIn",
   which is exactly the three fields a roster needs. Activity pages ("Jane on
   LinkedIn: ...") share the domain but are not people, so they go. */
function peopleFromSerp(results, company){
  const out=[], seen={};
  const cmp=String(company||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  (results||[]).forEach(res=>{
    const u=String(res.url||'');
    if(!/linkedin\.com\/in\//i.test(u)) return;
    const raw=String(res.title||'').trim();
    if(/\bon linkedin\s*:/i.test(raw)) return;
    const clean=raw.replace(/\s*[|\u2013\u2014-]\s*linkedin\s*$/i,'').trim();
    const bits=clean.split(/\s+[\u2013\u2014|-]\s+/);
    const name=(bits[0]||'').trim();
    // A headline long enough to be a sentence is a name Google mangled.
    if(!name || name.length>60 || !/[a-z]/i.test(name)) return;
    const key=u.split(/[?#]/)[0].toLowerCase();
    if(seen[key]) return; seen[key]=1;
    // "Name - Headline - Company" is the usual shape, and repeating the
    // employer back at someone reading a list of that employer's staff is
    // noise — in the panel and in the prompt alike.
    const rest=bits.slice(1);
    if(rest.length && cmp && rest[rest.length-1].toLowerCase().replace(/[^a-z0-9]/g,'')===cmp) rest.pop();
    const role=rest.join(' \u2014 ').trim() || String(res.description||'');
    out.push({ name, role:String(role).slice(0,140), linkedin:key });
  });
  return out;
}

/* The company's own site, out of the same batch of results. */
function domainFromSerp(results){
  for(const res of (results||[])){
    try{
      const host=new URL(res.url).hostname.replace(/^www\./,'');
      if(host && !NOT_COMPANY_SITE.test(host)) return host;
    }catch(e){}
  }
  return null;
}

/* Recruiting side and hiring side asked for separately, because one OR-chain
   long enough to cover both stops matching anything useful. The third query is
   the domain, riding along free of a second run start. */
function hrQueries(company, ctx){
  const c=String(company||'').replace(/"/g,'').trim();
  const words=roleWords(ctx).slice(0,4);
  const qs=[`site:linkedin.com/in "${c}" (recruiter OR "talent acquisition" OR "people operations" OR "head of people" OR "hiring manager")`];
  if(words.length)
    qs.push(`site:linkedin.com/in "${c}" (${words.map(w=>`"${w}"`).join(' OR ')}) (head OR director OR VP OR lead OR manager)`);
  qs.push(`"${c}" official website`);
  return qs;
}

/* ── roster cache ── */
const hrCacheKey = c => 'triage:hr:'+String(c||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,60);
async function cachedRoster(company){
  try{
    const v=await get(hrCacheKey(company)); if(!v) return null;
    const d=JSON.parse(v);
    if(!d || !d.at || !(d.roster||[]).length) return null;
    if(Date.now()-d.at > HR_CACHE_DAYS*864e5) return null;
    return d;
  }catch(e){ return null; }
}
async function storeRoster(company, roster, domain){
  try{ await put(hrCacheKey(company),
    JSON.stringify({at:Date.now(), roster:(roster||[]).slice(0,60), domain:domain||''})); }catch(e){}
}

function guessEmail(name, domain){
  const parts=String(name||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z\s]/g,'').trim().split(/\s+/).filter(Boolean);
  if(parts.length<2 || !domain) return '';
  return `${parts[0]}.${parts[parts.length-1]}@${domain}`;
}

async function findHrContacts(company, ctx, onStatus){
  if(!APIFY || !APIFY.startsWith("apify_api_")) throw new Error("NEEDAPIFY");

  let roster=null, domain='';
  const hit=await cachedRoster(company);
  if(hit){
    roster=hit.roster; domain=hit.domain||'';
    if(onStatus) onStatus(`reusing the ${roster.length} profiles already found at ${company}…`);
  }

  if(!roster){
    if(onStatus) onStatus(`searching for who to contact at ${company}…`);
    const items=await googleFirst(hrQueries(company,ctx).join("\n"), onStatus,
                                  `searching for people at ${company}`);
    // One run, three queries, one pile of results: a profile URL is a person, a
    // company URL is the domain, and nothing needs the query it came from.
    const flat=[];
    (items||[]).forEach(it=>flat.push(...(it.organicResults||[])));
    roster=peopleFromSerp(flat, company);
    domain=domainFromSerp(flat)||'';

    if(!roster.length) throw new Error(`Couldn't find anyone public at ${company} to contact. Try adding someone by hand.`);
    await storeRoster(company, roster, domain);
  }

  // The model reads the roster. An empty answer from it is an answer — "nobody
  // here" is a real finding, which is why there is no keyword sweep second-
  // guessing it and putting back the false positives it was brought in to remove.
  if(onStatus) onStatus(`reading ${roster.length} profiles for who is worth contacting…`);
  let people=[];
  try{ people=await pickPeople(roster, company, ctx); }
  catch(e){
    // The roster has already been found and paid for, but nothing has judged
    // it. Say that plainly, rather than falling through to the "none of them
    // looked right" throw below, which would claim the model looked and didn't.
    throw new Error(`Read ${roster.length} public profile${roster.length===1?'':'s'} at ${company}, but the model didn't run, so none of them have been judged: `
      + (e.message==='NEEDKEY' ? 'no API key is set for scoring.' : e.message));
  }

  if(!people.length) throw new Error(`Read ${roster.length} public profile${roster.length===1?'':'s'} at ${company} — none of them looked like the right desk for this role. Try adding someone by hand.`);

  return { list: people.map(p=>{
    const guess = domain ? guessEmail(p.name, domain) : '';
    return {
      name: p.name,
      role: p.role + (guess ? ' · email is a guessed pattern, unverified' : ''),
      email: guess, linkedin: p.linkedin||'', tier: p.tier, why: p.why||''
    };
  })};
}

/* Relevance is a judgement, not a string match. "Head of Business Intelligence"
   is the right desk for an analytics role and shares no word with it, while
   "Head of Data Governance" shares two and is the wrong desk. The model already
   reads jobs for scoring; here it reads the employee list the same way, and
   says in one line why each person is the one to write to. */
async function pickPeople(roster, company, ctx){
  const prof=P().profile;
  const listed=roster.slice(0,60)
    .map((x,n)=>`${n}. ${x.name} — ${String(x.role||'').slice(0,110)}`).join('\n');
  const txt=await claude(
`Choose who a job seeker should contact at one company.

THE ROLE THEY ARE CHASING
${ctx.title||'unspecified'} at ${company}
${String(ctx.description||'').slice(0,500)}
Related titles in this family: ${(ctx.titles||[]).slice(0,6).join(', ')||'none given'}

THE PERSON APPLYING
${prof.headline||''}
Strengths: ${(prof.strengths||[]).slice(0,5).join('; ')}

PEOPLE ON THE COMPANY'S PUBLIC EMPLOYEE LIST
${listed}

Return ONLY a JSON object, no preamble, no markdown fences:
{"picks":[{"i":0,"tier":"recruiting","why":"..."}]}

Rules:
- tier "recruiting": they own hiring itself — recruiter, talent, HR, people ops, staffing.
- tier "hiring": they run, or sit senior in, the team this role belongs to.
- Judge by what the work actually is, not by shared words. "Head of Business Intelligence" is the right desk for an analytics role. "Head of Data Governance" is not, despite the overlap.
- Include someone only if a message from this candidate about THIS role would plausibly land on the right desk.
- Leave out individual contributors unless the company looks small and there is nobody else.
- why: max 12 words, specific about why this is the right desk. No flattery, no restating their title.
- At most 8, best first, recruiting ahead of hiring side when equally good.
- Nobody suitable is a valid answer: {"picks":[]}
- Use only the numbered list above. Never invent a person or a title.`, 900);
  const parsed=grabJSON(txt);
  const picks=Array.isArray(parsed)?parsed:(parsed.picks||[]);
  const out=[];
  picks.forEach(pk=>{
    const src=roster[parseInt(pk.i,10)];
    if(!src) return;                                  // model made an index up
    if(out.some(o=>o.linkedin===src.linkedin&&o.name===src.name)) return;
    out.push({ name:src.name, role:src.role, linkedin:src.linkedin,
      tier: pk.tier==='recruiting'?'recruiting':'hiring',
      why: String(pk.why||'').slice(0,90) });
  });
  return out;
}

/* ═══ LLM ═══
   Two providers. DeepSeek is the default because it is roughly 20x cheaper per
   token than a frontier model and this workload — structured scoring against a
   fixed rubric — is exactly the kind of task where that trade is worth taking.
   Anthropic stays available as a fallback, and is the only one that works with
   no key at all when this file is opened inside Claude itself.

   One caveat that is not in our control: calling any LLM API straight from a
   browser depends on that provider sending permissive CORS headers. Anthropic
   documents a header for it. DeepSeek does not document browser use either way,
   so if DeepSeek fails with a network error and the key is definitely right,
   that is CORS, and the fix is to switch provider rather than to retry. */
const LLM = {
  deepseek: {
    url:"https://api.deepseek.com/chat/completions",
    label:"DeepSeek",
    keyPrefix:"sk-",
    where:"platform.deepseek.com → API keys",
    headers:k=>({"Content-Type":"application/json","Authorization":"Bearer "+k}),
    body:(prompt,mt)=>({model:"deepseek-chat",max_tokens:mt||1400,
      messages:[{role:"user",content:prompt}],temperature:0.2}),
    read:d=>((d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"").trim()
  },
  anthropic: {
    url:"https://api.anthropic.com/v1/messages",
    label:"Anthropic",
    keyPrefix:"sk-ant-",
    where:"console.anthropic.com → API keys",
    headers:k=>{const h={"Content-Type":"application/json"};
      if(k){h["x-api-key"]=k;h["anthropic-version"]="2023-06-01";
        h["anthropic-dangerous-direct-browser-access"]="true";} return h;},
    body:(prompt,mt)=>({model:"claude-sonnet-4-6",max_tokens:mt||1400,
      messages:[{role:"user",content:prompt}]}),
    read:d=>(d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("").trim()
  }
};

async function claude(prompt, maxTok){
  const cfg = LLM[PROV] || LLM.deepseek;
  // Anthropic inside the Claude viewer needs no key; DeepSeek always does.
  if(!KEY && PROV!=="anthropic") throw new Error("NEEDKEY");
  let res;
  try{
    res = await fetch(cfg.url,{method:"POST",headers:cfg.headers(KEY),
      body:JSON.stringify(cfg.body(prompt,maxTok))});
  }catch(e){
    throw new Error(KEY
      ? "Couldn't reach "+cfg.label+". If the key is right, this is the browser being blocked \u2014 try the other provider."
      : "NEEDKEY");
  }
  if(res.status===401||res.status===403) throw new Error("NEEDKEY");
  if(!res.ok){
    let d=''; try{const j=await res.json(); d=(j.error&&j.error.message)?': '+j.error.message:'';}catch(e){}
    throw new Error(cfg.label+" returned "+res.status+d);
  }
  const out = cfg.read(await res.json());
  if(!out) throw new Error(cfg.label+" returned an empty response.");
  return out;
}

function grabJSON(txt){
  let t = txt.replace(/^```(?:json)?/,'').replace(/```$/,'').trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a>=0 && b>a) t=t.slice(a,b+1);
  return JSON.parse(t);
}

/* ═══ profile extraction ═══
   This is what makes the tool work for anyone. It reads whatever CV-ish
   markdown a person drops in and turns it into the structured facts the
   scorer needs: where they are, what level they're at, what they can
   honestly claim, what they can't, and which directions are open. */
const EXTRACT_PROMPT = raw => `Read this person's career profile and extract a structured summary.

Return ONLY a JSON object, no preamble, no markdown fences:
{
 "name":"",
 "location":"",
 "country":"",
 "country_code":"two-letter lower-case ISO code for that country, e.g. in, us, gb, de",
 "headline":"one line, max 12 words, what they are",
 "years_experience":0,
 "seniority":"junior|mid|senior|lead",
 "domains":["3-6 fields they have real experience in"],
 "strengths":["4-7 specific things they can actually do, concrete not generic"],
 "hard_skills":["6-12 named tools, systems or disciplines from the profile"],
 "unusual_combination":"one sentence on what makes this person's mix rare, or empty string",
 "gaps":["3-6 things they honestly CANNOT claim: missing credentials, missing experience"],
 "wrong_shapes":["3-6 kinds of role they should not apply to, and why in a few words"],
 "tracks":[
   {"id":"slug","label":"Job family name","difficulty":"easy|moderate|moonshot",
    "why":"one sentence: why this fits them specifically",
    "titles":["5-8 real job titles to search for"],
    "boards":["4-8 domains where THIS KIND of job is actually posted"]}
 ]
}

Rules for tracks: give 3 or 4. Order them from most obvious to most ambitious.
"easy" = they could get this now with what's on the page.
"moderate" = a real but winnable step across.
"moonshot" = plausible but they'd be an unusual hire, and would need to be argued for.
Base every track on evidence in the profile. Do not invent a direction the profile doesn't support.

Rules for gaps: be honest and specific. These stop the tool from recommending roles the person cannot win. If the profile states its own limitations, use them.

Rules for boards: this is the most important field to get right. For each track, list the domains where that specific kind of job is genuinely advertised - not generic job sites. Give bare domains, no protocol, no path. Think about where people in that field actually look:
- Academic and research posts are advertised on field-specific registries and university systems, almost never on general job sites. A linguistics post goes to linguistlist.org, academicjobsonline.org, jobs.ac.uk, apply.interfolio.com, higheredjobs.com, euraxess.ec.europa.eu, chroniclevitae.com - not to linkedin.com.
- Startup and tech roles cluster on ycombinator.com, wellfound.com, lever.co, greenhouse.io, ashbyhq.com, jobs.ashbyhq.com.
- Public sector, NGO and development roles have their own registries entirely.
- Medicine, law, teaching, trades, design, and creative fields each have their own.
Do NOT list general portals - linkedin.com, indeed.com, upwork.com, glassdoor.com and the like are always searched anyway. This field is only for the SPECIALIST registries a general portal would miss. If you are unsure for a field, give the specialist registry.

Rules generally: use ONLY what is in the profile below. Do not invent experience, employers, metrics or skills. If something isn't stated, leave it out.

PROFILE:
${String(raw).slice(0,16000)}`;

async function extractProfile(raw){
  const txt = await claude(EXTRACT_PROMPT(raw), 2000);
  const p = grabJSON(txt);
  p.name = p.name || 'Unnamed';
  // Google's countryCode wants "in" -- not "India", and not "IN".
  p.country_code = String(p.country_code||'').toLowerCase().replace(/[^a-z]/g,'').slice(0,2);
  p.tracks = Array.isArray(p.tracks) && p.tracks.length ? p.tracks : [{
    id:'general', label:'General search', difficulty:'moderate',
    why:'Broad search across everything in the profile.', titles:[]
  }];
  ['domains','strengths','hard_skills','gaps','wrong_shapes'].forEach(k=>{
    if(!Array.isArray(p[k])) p[k]=[];
  });
  p.tracks.forEach(t=>{
    if(!Array.isArray(t.titles)) t.titles=[];
    if(!Array.isArray(t.boards)) t.boards=[];
    // Strip protocol/path if the model returned a URL rather than a bare domain.
    t.boards = t.boards.map(b=>String(b).replace(/^https?:\/\//,'').replace(/\/.*$/,'').trim())
                       .filter(Boolean);
  });
  return p;
}

/* ═══ company discovery ═══
   The person should not have to already know who to approach. Naming the
   companies is the hardest part of a cold search and the part they are least
   equipped to do — they know their own work, not the shape of the market.

   Two steps, and the split matters. The model proposes companies where this
   specific background would be unusually valuable. Then the ATS layer checks
   which of them are actually hiring. A company with open roles becomes a normal
   application; a company with none becomes a cold approach. Same list, sorted
   by reality rather than by guesswork. */
async function suggestCompanies(prof, trk, extra){
  const txt = await claude(`Name companies a specific person should approach about work.

THE PERSON
Based in: ${prof.location||'unspecified'}${prof.country?', '+prof.country:''}
Level: ${prof.seniority||'unspecified'}${prof.years_experience?` (~${prof.years_experience} years)`:''}
In short: ${prof.headline||''}
Fields they know: ${(prof.domains||[]).join('; ')}
What they can actually do: ${(prof.strengths||[]).join('; ')}
Skills: ${(prof.hard_skills||[]).join(', ')}
${prof.unusual_combination?`What is rare about them: ${prof.unusual_combination}`:''}
Honest gaps: ${(prof.gaps||[]).join('; ')||'none stated'}

THE DIRECTION THEY ARE PURSUING: ${trk.label||'general'}${trk.why?` — ${trk.why}`:''}
${extra?`ADDITIONAL STEER FROM THEM: ${String(extra).slice(0,300)}`:''}

Return ONLY a JSON object, no preamble, no markdown fences:
{"companies":[{
  "name":"exact company name",
  "location":"city, country, or Remote",
  "stage":"seed|series-a|series-b|series-c|growth|public|agency|nonprofit|university|government",
  "why":"one sentence, max 22 words: why THIS person specifically, not a generic candidate",
  "overlap":"the single concrete thing in their background that this company would care about",
  "odds":"strong|fair|longshot"
}]}

Give 16 to 24 companies. Rules that matter:

1. Weight heavily toward the person's DOMAIN, not just their job title. Someone who has run operations in a particular industry is far more valuable to companies in that industry than to a generic employer, even when the role title is identical. Find the companies where their specific background is an advantage rather than a neutral.

2. Spread across reachability. Include some obvious large names, but the majority should be companies small or specific enough that a well-aimed message actually gets read. A list of famous companies is useless.

3. Favour their own region and genuinely remote-friendly employers. A company that will not hire someone in ${prof.location||'their location'} is not a real target.

4. Prefer companies that plausibly use Greenhouse, Lever or Ashby - startups and scale-ups - since their openings can be checked automatically. But include a few larger or regional ones if they are genuinely strong fits.

5. "odds" is about whether an approach from THIS person converts, considering their gaps, not about company quality.

6. Real companies only, named exactly. No placeholders, no invented names, no "various startups". If unsure a company exists, leave it out.`, 3000);
  const d = grabJSON(txt);
  const list = Array.isArray(d) ? d : (d.companies||[]);
  return list.filter(c=>c&&c.name).slice(0,24);
}

function companyRow(c,i){
  const tag = c.odds==='strong'?'easy':c.odds==='longshot'?'hard':'mid';
  return `<label class="ct-row" style="cursor:pointer;align-items:flex-start">
    <input type="checkbox" data-co="${i}" checked style="margin-top:4px;width:auto">
    <div style="flex:1;min-width:0">
      <div class="ct-nm">${esc(c.name)}
        <span class="tag ${tag}" style="margin-left:6px">${esc(c.odds||'')}</span></div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(c.why||'')}</div>
      ${c.overlap?`<div style="font-size:11px;color:var(--cold);margin-top:3px">↳ ${esc(c.overlap)}</div>`:''}
      <div class="ct-meta" style="margin-top:3px">${esc(c.location||'')}${c.stage?' · '+esc(c.stage):''}</div>
    </div></label>`;
}

function suggestDialog(){
  const p=P(), prof=p.profile;
  const trk=(prof.tracks||[]).find(t=>t.id===p.track)||{};
  const d=modal(`<div class="eyebrow">Who to approach</div>
    <h2 style="margin:6px 0 6px">Companies worth your time</h2>
    <p style="color:var(--muted);font-size:12.5px;margin:0 0 12px">Built from your background and your current direction — <b>${esc(trk.label||'general')}</b>. Weighted toward places where what you've actually done is an advantage, not just places that are hiring.</p>
    <label class="lab">Anything to steer it? (optional)</label>

    <div id="sgOut"></div>`);

  const run=async()=>{

    d.querySelector('#sgGo').disabled=true;
    d.querySelector('#sgOut').innerHTML='<p style="color:var(--muted);margin-top:16px"><span class="spin"></span> Working out who would want you…</p>';
