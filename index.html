<div id="app"><div id="root"></div><div id="fb"><div id="tasks"></div></div><div id="palette"></div></div>

<script>
(function(){
const $ = s => document.querySelector(s);
// javascript: and data: URLs survive esc() untouched — esc stops attribute
// break-out, not a scheme. Anything that becomes an href or a window.open
// target goes through here first.
const httpUrl = u => { try{ const p = new URL(u); return (p.protocol==='http:'||p.protocol==='https:') ? u : ''; }catch(e){ return ''; } };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
/* Password fields, with a way to read back what was typed. */
const pwField = (id, autocomplete, placeholder, value) =>
  `<div class="pw"><input id="${id}" type="password" autocomplete="${autocomplete}"`
  + ` placeholder="${esc(placeholder||'')}" value="${esc(value||'')}">`
  + `<button type="button" class="rev" data-pw="${id}">SHOW</button></div>`;
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-pw]'); if(!b) return;
  const i = document.getElementById(b.dataset.pw); if(!i) return;
  const reveal = i.type === 'password';
  i.type = reveal ? 'text' : 'password';
  b.textContent = reveal ? 'HIDE' : 'SHOW';
  i.focus();
});

const COLS = ["title","company","location","url","description","status","date_applied",
  "follow_up_date","pitch_sent","notes","source","query",
  "ai_score","ai_reason","ai_flags","ai_judgment","ai_confidence","ai_reachability",
  // Which model produced ai_score. JOB_TEXT derives from COLS, so this one line
  // carries it through jobRow, coerceJob and the CSV. It is what makes "is the
  // pro tier worth 4.9x flash" a question the data can answer: the ledger knew
  // the model, public.jobs knew the score, and nothing joined them.
  "ai_model","channel",
  "stage","last_touch","contacts","events","added",
  "posted","posted_lo","posted_hi","posted_src"];

/* ═══ when was this posted ═══
   'added' is when a row reached this app, which says nothing about the job.
   A posting's age is the one signal that decays on its own: the same role is
   a different bet on day 2 and on day 40, and until now nothing here showed
   that. So it is stored as a real field with its provenance, not spelled into
   a notes string where only a human can read it.

   Four fields, because certainty varies and pretending otherwise would be the
   whole problem. posted_lo/posted_hi bound the window, posted is the single
   date to sort on (the midpoint of a window), and posted_src says where the
   claim came from:
     feed  the source stated it — an ATS feed carries a real one
     page  parsed out of a search snippet, usually "5 days ago"
     est   the model's reading of the description, and the widest of the three
   Cheapest and most reliable first: nothing is asked of the model that a feed
   already answered for free. */
const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const isoOf = d => (d instanceof Date && !isNaN(d)) ? d.toISOString().slice(0,10) : '';
function shiftDays(base, n){
  const d=new Date(String(base)+"T00:00:00Z");
  if(isNaN(d)) return '';
  d.setUTCDate(d.getUTCDate()-n);
  return isoOf(d);
}
/* A job cannot have been posted tomorrow, and one older than three years is a
   parse gone wrong rather than a very patient employer. Both are dropped
   rather than shown, because a confidently wrong date is worse than none. */
function saneDate(iso, base){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||''))) return '';
  base=base||today();
  // A day or two into the future is a timezone, and worth keeping as today.
  // Anything beyond that is bad data, and dropping it matters more than most:
  // a future date sorts to the very top of the freshest list.
  if(iso>base) return dayDiff(base,iso)<=2 ? base : '';
  return dayDiff(iso,base)>1095 ? '' : iso;
}
function parseWhen(txt, base){
  const t=String(txt||'').trim();
  if(!t) return '';
  base=base||today();
  if(/^\d{13}$/.test(t)) return saneDate(isoOf(new Date(parseInt(t,10))),base);
  if(/^\d{10}$/.test(t)) return saneDate(isoOf(new Date(parseInt(t,10)*1000)),base);
  const iso=t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return saneDate(iso[0],base);
  if(/\b(just\s*now|today|moments?\s+ago|hours?\s+ago|minutes?\s+ago)\b/i.test(t)) return base;
  if(/\byesterday\b/i.test(t)) return shiftDays(base,1);
  const rel=t.match(/\b(a|an|\d{1,3})\s*(day|week|month|year)s?\s+ago\b/i);
  if(rel){
    const n=/^\d+$/.test(rel[1])?parseInt(rel[1],10):1;
    const per={day:1,week:7,month:30,year:365}[rel[2].toLowerCase()];
    return saneDate(shiftDays(base,n*per),base);
  }
  // "Aug 30, 2026" / "August 30" / "30 Aug 2026". A missing year means the most
  // recent time that day/month happened, which is what a careers page means.
  let mo=0,day=0,yr=0;
  let m=t.match(/\b([a-z]{3,9})\.?\s+(\d{1,2})\b(?:[,\s]+(\d{4}))?/i);
  if(m && MONTHS[m[1].slice(0,3).toLowerCase()]){ mo=MONTHS[m[1].slice(0,3).toLowerCase()]; day=+m[2]; yr=+(m[3]||0); }
  if(!mo){
    m=t.match(/\b(\d{1,2})\s+([a-z]{3,9})\.?\b(?:[,\s]+(\d{4}))?/i);
    if(m && MONTHS[m[2].slice(0,3).toLowerCase()]){ day=+m[1]; mo=MONTHS[m[2].slice(0,3).toLowerCase()]; yr=+(m[3]||0); }
  }
  if(!mo || !day || day>31) return '';
  const pad=n=>String(n).padStart(2,'0');
  if(yr) return saneDate(`${yr}-${pad(mo)}-${pad(day)}`,base);
  const thisYear=+base.slice(0,4);
  const guess=`${thisYear}-${pad(mo)}-${pad(day)}`;
  return saneDate(guess<=base ? guess : `${thisYear-1}-${pad(mo)}-${pad(day)}`, base);
}
/* The single date a window sorts on. */
function midDate(lo, hi){
  if(!lo) return hi||'';
  if(!hi) return lo;
  const a=new Date(lo+"T00:00:00Z"), b=new Date(hi+"T00:00:00Z");
  if(isNaN(a)||isNaN(b)) return lo;
  return isoOf(new Date((a.getTime()+b.getTime())/2));
}
/* Days since posting, or null when genuinely unknown — which is not the same
   as old, and the tab keeps the two apart. */
function ageOf(j){
  const d=saneDate(j&&j.posted);
  return d ? Math.max(0, dayDiff(d, today())) : null;
}
const spanTxt = n => n<1 ? 'today' : n===1 ? '1d' : n<21 ? n+'d' : n<70 ? Math.round(n/7)+'w' : Math.round(n/30)+'mo';
/* Both ends of a window in the same unit, chosen by the older end. */
function spanPair(a,b){
  const unit = b<21 ? [1,'d'] : b<70 ? [7,'w'] : [30,'mo'];
  const f = n => Math.max(unit[0]===1?0:1, Math.round(n/unit[0]))+unit[1];
  return f(a)+'\u2013'+f(b);
}
/* Exact dates read as a point, estimates as the window they really are. */
function ageLabel(j){
  const n=ageOf(j); if(n===null) return '';
  const lo=saneDate(j.posted_lo), hi=saneDate(j.posted_hi);
  if(lo&&hi&&lo!==hi){
    const a=Math.max(0,dayDiff(hi,today())), b=Math.max(0,dayDiff(lo,today()));
    if(a!==b) return `~${spanPair(a,b)} ago`;
  }
  return n<1 ? 'today' : spanTxt(n)+' ago';
}

/* Pipeline stages. Deliberately few — every extra state is one more decision
   the person has to make about a row instead of acting on it.
     new    scored, untouched
     sent   applied or messaged, waiting
     live   they replied. the only state where a human is on the other end
     closed rejected, withdrawn, or given up on
   'due' is not stored. It is derived: sent, and the follow-up date has passed.
   Storing it would mean rewriting rows on a timer just to keep them honest. */
const STAGES = ["new","sent","live","closed"];
const FOLLOWUP_DAYS = 7;
/* The day's floor, and deliberately low. A floor is not a streak: a job search
   has bad weeks -- illness, a run of rejections, a week where resting is the
   right move -- and a counter that punishes a missed day costs the most to the
   people already having the worst one. This resets every morning and nothing
   is lost by missing it. */
const DAY_FLOOR = 3;

/* Every LLM call in this file uses the same number, and deliberately so. A thinking model
   spends tokens reasoning before it answers and those come out of the same
   ceiling, so a budget sized for the reply alone truncates mid-answer -- and a
   truncated scoring reply is the expensive failure: grabJSON throws, the batch
   is kept unscored, and the credit was already spent. max_tokens is a ceiling
   and not a reservation, so headroom costs nothing unless it is used; how long
   an answer should actually be is the prompt's job, not this number's. The
   server caps at the same number (LLM_TOK_CAP in supabase/functions/api/index.ts,
   which pipeline-map asserts is equal), so nothing larger has any effect.
   These were 700-3000 when the model did not think.

   Raised 4000 -> 8000 -> 16000, and the second raise is the instructive one.
   At 4000 the pro path looked like it was running at 97% of its ceiling: the
   ledger showed replies of 3874 and 3552. Those were the only calls that fit.
   A truncated call is refunded before logUsage writes anything, so the ledger
   records successes and nothing else, and any average taken from it is
   survivorship bias. With the ceiling at 8000 the same path immediately
   returned 7229, 5574 and 7353 -- every one of which had been failing
   silently, and none of which the ledger could show.

   So size this against what the model actually generates, not against what
   the ledger survived: pro spends roughly 1000-1200 output tokens per job at
   SIZE 6, reasoning included, and flash about 150 now that it does not reason.
   16000 is a little over twice the worst seen. The model accepts 65536, and
   max_tokens is a ceiling rather than a reservation, so the headroom is free
   until something uses it. */
const TOK_CAP = 16000;


/* ═══ state ═══
   Multi-profile. Each person who uses this gets their own entry:
   their parsed profile, their chosen track, their own job list. */
let DB = { profiles:{}, current:null };
let KEY  = '';           // LLM key (DeepSeek or Anthropic)
let PROV = 'deepseek';   // 'deepseek' | 'anthropic'
let APIFY= '';           // Apify token for board search and contact lookup
let CHFILT = 'all';      // 'all' | 'posted' | 'cold'
/* Whether rows a red line removed are shown anyway. A gate that hides work
   with no way to look is indistinguishable from a search that found nothing,
   so this exists and the count is always on screen even when it is false. */
let SHOW_GATED = false;
let AUTO  = true;        // score whatever a pull brings in, without being asked
let VIEW = 'onb';        // 'onb' | 'app'
const blankOnb = () => ({ step:0, raw:'', fileName:'', parsed:null, track:null,
  error:'', assessing:false, assessed:null, assessErr:'', wantText:'', editing:null });
let ONB = blankOnb();
let RANGE = null, TAB = 'unapplied', busy = false;   // To decide is home (feedback #21); the map lives inside it
let MAPON = false;
let YOUSUB = 'me';   // the You view: 'me' (who you are, your CVs) or 'stats' (the analytics that were the Dashboard)   // on a narrow screen, whether the map is open at the top of To decide
/* Narrow screens only: is the tools sheet showing. Never read above 900px,
   where the sidebar is simply a column and the sheet CSS does not apply. */
let TOOLS = false;
/* How far each phone carousel was swiped, by section, so a re-render -- which
   rebuilds it at the first card -- puts it back where the thumb left it. */
const CAR = {};
/* Which job is selected, held by keyOf rather than by index: a retention pass
   or an import can renumber the array underneath it, and the pane must not
   reopen on somebody else's job. One at a time, because the point of it is to
   read one carefully.
   It used to mean "expanded in the list", which is why it was called SEL_JOB.
   The detail now renders beside the queue instead of inside it, so this is a
   selection: the list does not change shape when it moves. */
let SEL_JOB = null;
let RAILMORE = false;   // the rail's More group, shown or not
/* Which disclosures are open, sidebar and lists alike. Held here rather than
   left as DOM state because render() rebuilds #root from scratch: a panel that
   shut itself every time you used something inside it would be worse than no
   panel at all. Keys appear as folds do; an unknown one reads as closed. */
let FOLDS = { add:false, score:false, data:false };

/* ═══ theme ═══
   'auto' follows the operating system, which is the right default because the
   person already told their machine which they wanted. The two explicit modes
   are for the case where this app is the exception. Kept per device rather than
   in the account: which screen you are sitting at is not a fact about you, and
   syncing it would mean a phone in bed inheriting a desktop's daylight. */
let THEME = 'auto';
const THEMES = ['auto','light','blush','dark'];
/* One place reads a token's computed value, so the plot can be drawn in the
   same colours as everything else instead of repeating their hexes. */
const CV = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const sysLight = () => !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
function applyTheme(){
  const light = THEME==='auto' ? sysLight() : THEME!=='dark';
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  // Blush is a paper, not a theme: it rides on light, so light's rules hold.
  if(THEME==='blush') document.documentElement.dataset.paper='blush';
  else delete document.documentElement.dataset.paper;
  // The browser paints its own chrome from this on mobile; leaving it on the
  // old dark value puts a black bar above a white page.
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', CV('--ink') || '#111315');
}
/* Before the first paint, and synchronously -- everything else here is async,
   and a single frame of the wrong theme is the one theming bug people notice. */
try{ THEME = localStorage.getItem('triage:theme') || 'auto'; }catch(e){}
applyTheme();
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: light)');
  const onSys = () => { if(THEME==='auto'){ applyTheme(); render(); } };
  if(mq.addEventListener) mq.addEventListener('change', onSys);
  else if(mq.addListener) mq.addListener(onSys);
}
/* Three different questions, deliberately kept apart. 'rank' is is this worth
   doing, 'new' is when did this reach me, 'posted' is when did the employer
   list it -- and the last two are not the same thing at all. */
let SORT = 'rank';       // 'rank' | 'new' (added) | 'posted' (listed)
/* Where to search. null means nobody has chosen, which reads as the profile's
   own location -- so the box arrives filled in. Held here rather than left in
   the input because starting a search re-renders the sidebar, and a control
   that reverts to its default the moment you use it is worse than none. */
let WHERE = null;
/* Every job card is roughly 1.5KB of HTML. At 800 jobs the two long lists were
   drawing 1,600 cards between them on every single render -- 2.7MB of innerHTML
   and 46,000 nodes -- which on a mid-range machine is seconds of blank screen
   before anything appears. Nobody scrolls 800 cards; they work the top and
   search for the rest. */
const LIST_CAP = 60;
/* Long-running work lives here rather than behind a modal, so the app stays
   usable while an Apify run polls. Deliberately not persisted: a run belongs
   to the page that started it, and a task restored after a reload would have
   nothing on the other end of it. */
let TASKS = [], TASKSEQ = 0;

/* A profile record is only usable if it actually carries a parsed profile.
   A record without one -- a half-finished onboarding, a partial write -- took
   the whole app down: renderApp reads prof.tracks on its first line, and the
   onboarding fallback reads p.profile.name, so there was nowhere left to land.
   Treating it as absent sends them to onboarding, which can fix it. */
const usable = p => !!(p && p.profile);
const P = () => { const p = DB.profiles[DB.current]; return usable(p) ? p : null; };

/* ═══ storage ═══
   Two homes. Inside Claude's artifact viewer window.storage exists and is the
   only thing that works. Opened as a downloaded file there is no window.storage,
   so fall back to localStorage, which works there and is blocked in the viewer.
   Use whichever is actually available. */
const HAS_WS = typeof window.storage !== 'undefined' && window.storage
               && typeof window.storage.get === 'function';

/* ═══ accounts and cloud sync ═══
   Optional, and off unless config.js has been filled in. An unconfigured copy
   runs exactly as it always did — no account, no server, data in this browser
   — because the alternative is that a missing config file bricks the app for
   everyone, which is not a trade worth making for a feature nobody asked to be
   mandatory.

   The put/get shim below is why this is a small change rather than a rewrite:
   the app has always talked to storage through two functions, so pointing them
   at Postgres leaves every caller untouched. One table, one row per key per
   user, protected by row-level security in the database rather than by any
   check in this file — a bug up here must not be able to leak somebody's CV.

   API keys are the deliberate exception and stay local. Uploading a person's
   DeepSeek and Apify credentials would add real liability and buy nothing:
   they are per-device by nature, and a stolen database should not also be a
   stolen set of API keys. */
const CFG   = window.TRIAGE_CONFIG || {};
const CLOUD = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase);
/* "Remember me": which native Storage the session token lives in. localStorage
   survives closing the browser; sessionStorage dies with the tab. The choice
   is stashed in sessionStorage itself so a refresh in the same tab still finds
   an unremembered session, and only actually closing the tab loses it. */
let REMEMBER = true;
try{ REMEMBER = sessionStorage.getItem('triage:remember') !== '0'; }catch(e){}
const authStorage = {
  getItem:  k => (REMEMBER?localStorage:sessionStorage).getItem(k),
  setItem:  (k,v) => (REMEMBER?localStorage:sessionStorage).setItem(k,v),
  removeItem: k => (REMEMBER?localStorage:sessionStorage).removeItem(k),
};
const SB    = CLOUD ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY,
                {auth:{storage:authStorage}}) : null;
/* Read synchronously, right here, because createClient above has already
   started eating the URL hash: it fires PASSWORD_RECOVERY while boot() is
   still thousands of lines away from attaching a listener, so that event is
   never heard and a reset link just signs you in and shows you the app. The
   hash is still intact on this line, so the intent is taken from it directly
   rather than from an event that has already gone. */
const RECOVERY_LINK = CLOUD && /(^|[#&])type=recovery(&|$)/.test(location.hash);
let USER = null;                      // the signed-in auth user, or null
/* Never leaves the device it was typed on. */
const LOCAL_ONLY = /^triage:(key|prov|apify|hr:)/;
/* Every cloud call here sits between the person and their own data, so none of
   them may hang. A request that never settles is an app that loads forever,
   which is worse than one that fails: a failure falls back to the copy on this
   device and they carry on working. */
const withTimeout = (p, ms, what) => Promise.race([p,
  new Promise((_,rej)=>setTimeout(()=>rej(new Error(what+' timed out after '+Math.round(ms/1000)+'s')), ms))]);
const READ_MS = 8000, WRITE_MS = 45000;
/* Once one call has timed out, the rest of this page load will too. Latching
   here turns four serial timeouts into one, and every later call falls through
   to the copy on this device immediately. Cleared by a reload. */
let CLOUD_DOWN = false;
let SOFT = null;   // the reason the last save only reached this device; null once one succeeds
const cloudDown = e => { if(e && /timed out/.test(e.message||'')) CLOUD_DOWN = true; };
const cloudNow = () => !!(SB && USER && !CLOUD_DOWN);

async function putLocal(k,v){
  if(HAS_WS){ try{ await window.storage.set(k,v); return; }catch(e){} }
  try{ localStorage.setItem(k,v); }catch(e){ console.error('save failed',e); }
}
async function getLocal(k){
  if(HAS_WS){ try{ const r=await window.storage.get(k); return r?r.value:null; }catch(e){ return null; } }
  try{ return localStorage.getItem(k); }catch(e){ return null; }
}
async function put(k,v){
  if(!cloudNow() || LOCAL_ONLY.test(k)) return putLocal(k,v);
  // Written locally as well, always. A failed round trip must not silently
  // lose the thing the user just did, and it doubles as the offline copy.
  await putLocal(k,v);
  try{
    const {error}=await withTimeout(
      SB.from('user_state')
        .upsert({user_id:USER.id,k,v,updated_at:new Date().toISOString()},{onConflict:'user_id,k'}),
      WRITE_MS, 'saving to your account');
    if(error) throw error;
    syncNote('');
  }catch(e){
    cloudDown(e);
    console.warn('cloud save failed:', e && e.message);
    softNote((e&&e.message)||'could not reach the server');
  }
}
async function get(k){
  if(!cloudNow() || LOCAL_ONLY.test(k)) return getLocal(k);
  try{
    const {data,error}=await withTimeout(
      SB.from('user_state').select('v').eq('user_id',USER.id).eq('k',k).maybeSingle(),
      READ_MS, 'reading your account');
    if(error) throw error;
    if(data && typeof data.v==='string'){ await putLocal(k,data.v); return data.v; }
    return null;
  }catch(e){ cloudDown(e); console.warn('cloud read failed:', e && e.message); return getLocal(k); }   // offline: last known good
}
function syncNote(t){ SOFT=null; const e=$('#syncInfo'); if(e){ e.className='err'; e.textContent=t; e.style.display=t?'block':'none'; } }
/* "Saved on this device": the work is safe and only the account copy is behind,
   so it is a calm picture and a way to try again, not a red line. Kept in SOFT
   and drawn again after every render (each one rebuilds #syncInfo), until a save
   gets through. */
function softNote(reason){
  SOFT = reason || 'could not reach the server';
  const e=$('#syncInfo'); if(!e) return;
  const r=String(SOFT).replace(/\.$/,''), msg=r.charAt(0).toUpperCase()+r.slice(1);
  e.className='soft'; e.style.display='flex';
  e.innerHTML=`<div class="soft-art" aria-hidden="true">${artSvg('woman','soft-fig')}</div>
    <div class="soft-t"><b>Saved on this device.</b><span>${esc(msg)}. Your work is not lost.</span>
    <button class="btn-sm" id="syncRetry">Try again</button></div>`;
  $('#syncRetry').onclick=()=>{ CLOUD_DOWN=false; $('#syncRetry').disabled=true; save(); };
}

/* The app is moving from jobtriage.reachbhola.workers.dev to jobtriage.in.
   The old address keeps working and is NOT redirected, on purpose: everything
   above is keyed to the origin, so a redirect would strand anyone using this
   without an account on a page that cannot see their jobs. Instead the old
   address says where the app went and how to carry the data, with the backup
   that already exists. Lives on <body>, outside #root, so render() cannot
   wipe it. On since 2026-10-09, when jobtriage.in started serving the app. */
const APP_HOME = 'https://jobtriage.in';
const MOVED = true;
if(MOVED && location.hostname.endsWith('.workers.dev')){
  const b=document.createElement('div');
  b.style.cssText='position:sticky;top:0;z-index:50;padding:8px 14px;background:var(--panel2);border-bottom:1px solid var(--line);color:var(--text);font-size:12.5px;text-align:center';
  b.innerHTML=`Job Triage has moved to <a href="${APP_HOME}" style="color:inherit"><b>jobtriage.in</b></a>. With an account, just sign in there. Without one, your jobs live in this browser only: use <b>Backup &amp; transfer</b> here to download a backup, then restore it there.`;
  document.body.prepend(b);
}

/* ═══ rows: profiles and jobs ═══
   The blob above is one text field holding everything a person has. Saving it
   is a full rewrite, so two tabs that both save lose whichever finished first,
   and it is never the tab that was wrong -- just the slower one. Searching in
   one tab while reading in another is the ordinary way to use this, so that is
   not a rare race; it is the normal one.

   Below, a job is a row. Two tabs editing two different jobs write two
   different rows and neither is lost. Two tabs editing the SAME job still lose
   one of them, and that is deliberate: the alternative is a version check on
   every write and a conflict screen in an app that has nowhere to put one. The
   trade is that the loser is now one field of one job instead of every job
   added since the other tab loaded.

   The blob does not go away. It is still written on every save, and it is
   still the offline copy -- it just stops being READ once this account has
   migrated. That is what makes a rollback a one-line change instead of a
   restore from somebody's Downloads folder.

   Types, and why there is an `extras` column. The app has no validation layer:
   every field of every job is a string, ai_score is whatever the model said,
   and the CSV door copies cells in untouched. A typed column would quietly
   edit that data on the way in -- "12/03/2025" is not a date to Postgres, and
   dropping it is a permanent change nobody asked for. So anything a typed
   column cannot hold unchanged is kept verbatim in `extras` and laid back over
   the row on read. Round trip in, round trip out, byte for byte. */

const JOB_INT  = ['ai_score','ai_reachability'];
const JOB_DATE = ['posted','posted_lo','posted_hi','date_applied','follow_up_date','last_touch'];
const JOB_JSON = ['contacts','events'];
/* `origin` is written by jsearchRow but is not in COLS, so it rides the blob
   and is lost by a CSV round trip. It gets a column here rather than
   inheriting that bug. */
const JOB_TEXT = COLS.filter(c => !JOB_INT.includes(c) && !JOB_DATE.includes(c) && !JOB_JSON.includes(c))
                     .concat('origin');
/* ── what the person WANTS, as opposed to what they can do ─────────────────
   Light rule, not a ═══ banner: scripts/pipeline-map.js treats those as
   SECTION boundaries and takes ownership of everything beneath, so putting one
   here moved st.save and st.saveRows out of "rows: profiles and jobs" and the
   map check failed. These are column lists; they belong to that section.
   Everything the extraction produces is a judgement about capability, read off
   a CV. `wrong_shapes` reads like preference and is not: on the live profiles
   every entry is "Broadcast editor: no broadcast credits shown" or "Film
   director: only assistant direction" -- reasons a role is out of reach, never
   reasons it is unwanted. So the app could not tell "cannot" from "will not",
   and these five fields are that distinction. See INTAKE.md.

   All five are ASKED, never inferred, and all five default to today's exact
   behaviour so that a person who skips the step loses nothing. */
const INTENTS = ['now','soon','browsing'];
const STRICT_MIN = 1, STRICT_MAX = 3, STRICT_DEFAULT = 2;

/* POLARITY MATTERS HERE and it is the easy bug: these say what the person CAN
   do, so `true` excludes nothing. A default of relocate:false would mean "will
   not relocate" and would gate every job outside their city on day one, for
   every profile that predates this field. Permissive by default, always. */
const LIMITS_DEFAULT = Object.freeze({ relocate: true, onsite_ok: true, min_pay: 0, avoid: [] });
const AVOID_OFFERED = ['agency or consultancy','night shift','commission-only','unpaid or equity-only'];

/* One place that normalises whatever is on the row into the shape the gates
   read, so a half-written object from an older save cannot reach them. */
function limitsOf(prof){
  const L = (prof && prof.limits) || {};
  const avoid = Array.isArray(L.avoid) ? L.avoid.map(x => String(x||'').trim()).filter(Boolean) : [];
  const pay = Number(L.min_pay);
  return {
    relocate:  L.relocate  === undefined ? LIMITS_DEFAULT.relocate  : !!L.relocate,
    onsite_ok: L.onsite_ok === undefined ? LIMITS_DEFAULT.onsite_ok : !!L.onsite_ok,
    min_pay:   Number.isFinite(pay) && pay > 0 ? Math.trunc(pay) : 0,
    avoid,
  };
}
/* ── red lines ────────────────────────────────────────────────────────────
   A limit EXCLUDES a posting. That is the whole difference between this and
   `wrong_shapes`, which is a soft signal fed to the `shape` flag: a person may
   well apply to a stretch, and should never be stopped. A red line is the
   opposite kind of fact, and the only way to honour one is to stop multiplying
   it by anything.

   Three rules this follows, each because the alternative hides real jobs:

   1. It returns a REASON, never a boolean. A row removed without a reason is
      indistinguishable from a row that was never found, and the person cannot
      tell a working filter from a broken search.
   2. It gates at READ time and writes nothing. The score on the row stays what
      the model said; unchecking a limit brings the jobs straight back with no
      re-scoring and no lost data.
   3. Pay gates ONLY on a figure the posting actually states. Absent is not
      below -- most postings name no salary, and treating silence as "under
      your floor" would quietly remove most of the market. When in doubt this
      returns null and the row stays. */
const AVOID_PATTERNS = {
  'agency or consultancy': /\b(recruit(ment|ing)? agency|staffing|consultanc|manpower|rpo)\b/,
  'night shift':           /\b(night shift|graveyard shift|us shift|overnight shift)\b/,
  'commission-only':       /\b(commission[\s-]?only|purely commission|no fixed salary)\b/,
  'unpaid or equity-only': /\b(unpaid|volunteer|pro bono|equity[\s-]?only|no salary|for exposure)\b/,
};

/* Only a clearly stated figure, normalised to rupees PER MONTH. Anything
   ambiguous returns null, which means "do not gate". Deliberately narrow:
   "competitive salary", "as per industry standards" and a bare "40" are all
   unparseable and must stay unparsed. */
function statedPayMonthly(text){
  const t = String(text||'').toLowerCase().replace(/,/g,'');
  // "8 LPA", "8.5 lakh per annum", "12 lac pa" -> annual lakhs
  const lpa = /(\d+(?:\.\d+)?)\s*(?:lpa|lakhs?|lacs?)\s*(?:pa|p\.a\.|per annum|annually|\/year|a year)?/.exec(t);
  if(lpa) return Math.round(Number(lpa[1]) * 100000 / 12);
  // A currency marker is required, so a random number cannot become a salary.
  const cur = /(?:₹|rs\.?|inr)\s*(\d{4,9})(?:\s*(?:-|to|–)\s*(\d{4,9}))?/.exec(t);
  if(!cur) return null;
  const lo = Number(cur[1]);
  if(!Number.isFinite(lo) || lo <= 0) return null;
  const per = t.slice(cur.index, cur.index + 160);
  if(/per annum|p\.a\.|\/year|a year|annually|yearly/.test(per)) return Math.round(lo / 12);
  if(/per month|\/month|a month|monthly|pm\b/.test(per))        return lo;
  /* No period stated. A figure at or under 25,000 beside a rupee sign is far
     more likely monthly than annual in this market, and above that it is a
     coin toss -- so only the unambiguous end is used and the rest is null. */
  return lo <= 25000 ? lo : null;
}

const FOREIGN_REMOTE = /united states|\busa?\b|canada|united kingdom|\buk\b|europe|emea|latam|latin america|africa|australia|germany|france|netherlands|ireland|north america/;
function redLine(j, prof){
  const L = limitsOf(prof);
  const loc = String((j && j.location) || '').toLowerCase();
  const txt = `${(j&&j.title)||''} ${(j&&j.description)||''} ${loc}`.toLowerCase();
  const remote = /\bremote\b|work from home|\bwfh\b|\banywhere\b|\bdistributed\b/.test(loc + ' ' + txt);

  if(!L.onsite_ok && !remote && /\bon[\s-]?site\b|\bin[\s-]?office\b|\bhybrid\b/.test(txt)){
    return 'you said you cannot work on-site';
  }
  if(!L.relocate && !remote){
    const mine = String((prof && prof.location) || '').split(',')[0].trim().toLowerCase();
    if(mine && loc && !loc.includes(mine)){
      return `you said you would not move, and this is in ${String(j.location).split(',')[0].trim()}`;
    }
  }
  /* "(remote)" with named places is not "anywhere": a role open only to the US
     or Africa is not remote for someone in India. Only when they said they
     would not relocate, and only when the place list names no country of
     theirs -- an unreadable list stays in. */
  if(!L.relocate){
    const m = /^(.*)\(remote\)\s*$/i.exec(String((j&&j.location)||'').trim());
    const where = m ? m[1].trim().toLowerCase() : '';
    const home = String((prof&&(prof.country||String(prof.location||'').split(',').pop()))||'').trim().toLowerCase();
    if(where && home && FOREIGN_REMOTE.test(where) && !where.includes(home)){
      return `remote, but only open to ${m[1].trim()}`;
    }
  }
  if(L.min_pay > 0){
    const pay = statedPayMonthly(txt);
    if(pay !== null && pay < L.min_pay) return `states about ${pay.toLocaleString('en-IN')} a month, under your floor`;
  }
  const hit = (L.avoid||[]).find(a => {
    const re = AVOID_PATTERNS[a];
    return re ? re.test(txt)
              : new RegExp('\\b' + String(a).toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b').test(txt);
  });
  if(hit) return `you asked never to see: ${hit}`;
  return null;
}

const intentOf = p => INTENTS.includes(p && p.intent) ? p.intent : 'browsing';
const strictOf = p => {
  /* Absent must mean DEFAULT, not minimum. Number(null) is 0 and Number('') is
     0, both finite, so clamping first turned every profile that predates this
     column into strict=1 -- the loosest setting -- rather than the balanced one
     everything was tuned at. Checked for emptiness before coercing. */
  const v = p && p.strict;
  if(v === null || v === undefined || v === '') return STRICT_DEFAULT;
  const n = Number(v);
  return Number.isFinite(n) ? Math.min(STRICT_MAX, Math.max(STRICT_MIN, Math.trunc(n))) : STRICT_DEFAULT;
};

/* The one posting the person said they would apply to today, read back for the
   judge. Not capped here: the edge function slices it to JUDGE_EXEMPLAR_CAP
   before it measures the batch. Returns '' for anyone who skipped the field,
   and '' means the question is not asked at all rather than asked about nothing. */
const exemplarOf = p => String((p && p.exemplar) || '').trim();

const PROF_TEXT = ['name','headline','location','country','country_code','seniority','unusual_combination','intent','exemplar'];
const PROF_JSON = ['domains','strengths','hard_skills','gaps','wrong_shapes','tracks'];
/* NOT in PROF_JSON. coerceProfile coerces every member of that list to an
   ARRAY (`Array.isArray(row[c]) ? row[c] : []`), so an object put there comes
   back as []. And not in PROF_TEXT, or `strict` round-trips as the string "2".
   Both are handled explicitly below, the way years_experience is. */
const PROF_INT = ['strict'];
const PROF_OBJ = ['limits'];
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
const chunks = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };

/* An integer column, unless the value is not one. 72 goes in as 72; 72.5 and
   "about 5" go in as null with the original in extras, because half a point of
   fit is still the person's data and "about 5" is still what the model said. */
function intOut(v, extras, name){
  const t = String(v==null?'':v).trim();
  if(t==='') return null;
  const n = Number(t);
  if(Number.isFinite(n) && String(Math.trunc(n))===t) return Math.trunc(n);
  extras[name] = t;
  return Number.isFinite(n) ? Math.trunc(n) : null;
}
/* Strict ISO only. The app's own parseWhen is no help here: it refuses future
   dates, and follow_up_date is legitimately in the future. */
function dateOut(v, extras, name){
  const t = String(v==null?'':v).trim();
  if(t==='') return null;
  if(ISO_DATE.test(t)) return t;
  extras[name] = t;
  return null;
}
/* contacts and events are JSON held in a string. Parse it into jsonb, but if
   re-serialising it would not give back the exact same string, keep the
   original too -- a backup export has to come out identical to what went in. */
function jsonOut(v, extras, name){
  if(v==null || v==='') return [];
  if(typeof v!=='string') return v;
  try{
    const parsed = JSON.parse(v);
    if(JSON.stringify(parsed)!==v) extras[name]=v;
    return parsed;
  }catch(e){ extras[name]=v; return []; }
}

/* One job -> one row. */
function jobRow(j){
  const extras = {}, r = { job_key: keyOf(j) };
  JOB_TEXT.forEach(c => { r[c] = (j[c]===undefined||j[c]===null) ? null : String(j[c]); });
  JOB_INT .forEach(c => { r[c] = intOut (j[c], extras, c); });
  JOB_DATE.forEach(c => { r[c] = dateOut(j[c], extras, c); });
  JOB_JSON.forEach(c => { r[c] = jsonOut(j[c], extras, c); });
  // A company's website and what was last read about it (Companies tab):
  // no column of their own, so they ride in extras, which the read side restores.
  ['site','pulse','dir','cvt','hrfound','drafts','deadline'].forEach(k => { if(j[k]) extras[k] = String(j[k]); });
  r.extras = extras;
  return r;
}

/* One row -> one job, in exactly the shape blank() would have made. */
function coerceJob(row){
  const j = {};
  COLS.forEach(c => j[c] = '');
  JOB_TEXT.forEach(c => { if(row[c]!=null) j[c] = String(row[c]); });
  JOB_INT .forEach(c => { if(row[c]!=null) j[c] = String(row[c]); });
  JOB_DATE.forEach(c => { if(row[c]!=null) j[c] = String(row[c]).slice(0,10); });
  JOB_JSON.forEach(c => { j[c] = JSON.stringify(row[c]==null ? [] : row[c]); });
  const ex = row.extras || {};
  Object.keys(ex).forEach(k => { j[k] = ex[k]; });   // last word, always
  return j;
}

/* One profile record -> one row. A record is {profile, raw, track, jobs,
   created}; `jobs` becomes rows of its own and the rest is spread flat. */
function profileRow(localId, p){
  const extras = {}, r = { local_id: localId };
  /* A record with no .profile is broken -- usable() rejects it and the app
     routes past it. It still gets stored verbatim rather than normalised into
     something that would then look repaired. */
  if(!usable(p)){
    PROF_TEXT.forEach(c => r[c] = null);
    PROF_JSON.forEach(c => r[c] = []);
    // Same keys as the usable branch below, or a mixed batch nulls real
    // columns: PostgREST's upsert unions the keys across the array.
    PROF_INT.forEach(c => r[c] = null);
    /* limits is NOT NULL in the table. Written as null it failed the insert,
       and PostgREST refuses the whole batch for one bad row -- so a single
       broken record beside a real profile meant NO profile was ever saved for
       that account, every save failed the same way, and a reload showed an
       empty app. Seen on 2026-10-13: a tester lost a finished onboarding. */
    PROF_OBJ.forEach(c => r[c] = (c === 'limits') ? {} : null);
    r.years_experience = null; r.cv_text = null; r.track = null; r.created = null;
    r.extras = { __raw: JSON.stringify(p) };
    return r;
  }
  const pr = p.profile;
  PROF_TEXT.forEach(c => { r[c] = (pr[c]===undefined||pr[c]===null) ? null : String(pr[c]); });
  PROF_JSON.forEach(c => { r[c] = Array.isArray(pr[c]) ? pr[c] : (pr[c]===undefined ? [] : jsonOut(pr[c],extras,c)); });
  r.years_experience = intOut(pr.years_experience, extras, 'years_experience');
  PROF_INT.forEach(c => { r[c] = intOut(pr[c], extras, c); });
  /* An object column, so neither jsonOut (which returns [] for anything it
     cannot parse) nor String() will do. Normalised on the way out as well as
     the way in, because a gate reading a half-written object is how a red line
     hides jobs nobody asked it to hide. */
  PROF_OBJ.forEach(c => { r[c] = (c === 'limits') ? limitsOf(pr) : (pr[c] ?? null); });
  r.cv_text = p.raw===undefined||p.raw===null ? null : String(p.raw);
  r.track   = p.track===undefined||p.track===null ? null : String(p.track);
  r.created = p.created===undefined||p.created===null ? null : String(p.created);
  /* Anything the extraction prompt returned that has no column. Prefixed so it
     cannot collide with a column name that arrives here for another reason. */
  const known = new Set(PROF_TEXT.concat(PROF_JSON, PROF_INT, PROF_OBJ, ['years_experience']));
  Object.keys(pr).forEach(k => { if(!known.has(k)) extras['profile.'+k] = pr[k]; });
  /* The columns above are in this file's order, not the order the extraction
     prompt happened to return. Keeping the original means an exported backup
     comes back byte-identical, and "the two files are the same" is a much
     stronger thing to be able to say about a migration than "the two files
     mean the same". */
  extras.__order = Object.keys(pr);
  r.extras = extras;
  return r;
}

function coerceProfile(row){
  const ex = row.extras || {};
  if(ex.__raw){ try{ return JSON.parse(ex.__raw); }catch(e){} }
  const pr = {};
  PROF_TEXT.forEach(c => { if(row[c]!=null) pr[c] = String(row[c]); });
  PROF_JSON.forEach(c => { pr[c] = Array.isArray(row[c]) ? row[c] : []; });
  if(row.years_experience!=null) pr.years_experience = row.years_experience;
  /* Always set, never left undefined. Two live profiles and every CSV import
     predate these columns, and nothing downstream should have to ask whether
     the field exists before reading it -- that is how a gate ends up comparing
     against undefined and excluding everything. */
  pr.intent = INTENTS.includes(row.intent) ? row.intent : 'browsing';
  pr.strict = strictOf({ strict: row.strict });
  pr.limits = limitsOf({ limits: row.limits && typeof row.limits === 'object' && !Array.isArray(row.limits) ? row.limits : {} });
  if(row.exemplar!=null) pr.exemplar = String(row.exemplar);
  Object.keys(ex).forEach(k => {
    if(k==='__order') return;
    if(k.indexOf('profile.')===0) pr[k.slice(8)] = ex[k];
    else if(k==='years_experience') pr[k] = ex[k];
    else if(PROF_JSON.includes(k)) pr[k] = ex[k];
  });
  let out = pr;
  if(Array.isArray(ex.__order)){
    out = {};
    ex.__order.forEach(k => { if(k in pr) out[k] = pr[k]; });
    Object.keys(pr).forEach(k => { if(!(k in out)) out[k] = pr[k]; });
  }
  return {
    profile: out,
    raw:     row.cv_text==null ? '' : String(row.cv_text),
    track:   row.track  ==null ? '' : String(row.track),
    jobs:    [],
    created: row.created==null ? '' : String(row.created),
  };
}

/* local_id -> profiles.id. A job row references the uuid, and the insert
   policy checks that the profile behind it belongs to the same person, so
   nothing can be filed under somebody else's list. */
let PROFILE_IDS = {};
/* What the server last agreed to hold. save() sends the difference, which is
   the whole point: a keystroke in one job must not rewrite 400 rows. */
let LAST_SAVED = null;
/* Has this account moved off the blob? Until it has, the blob is still read. */
let MIGRATED = false;

/* Every row this browser would write, keyed so the two sides can be diffed. */
function snapshot(){
  const sigs = {}, rows = {};
  Object.keys(DB.profiles).forEach(id => {
    const p = DB.profiles[id]; if(!p) return;
    const pk = 'p\u0000'+id;
    rows[pk] = profileRow(id, p); sigs[pk] = JSON.stringify(rows[pk]);
    /* Keyed by job_key, so a list that somehow holds the same posting twice
       collapses here rather than at the database, where one upsert touching a
       row twice is an error and the whole save would fail. */
    ((usable(p)?p.jobs:null) || []).forEach(j => {
      const r = jobRow(j);
      const jk = 'j\u0000'+id+'\u0000'+r.job_key;
      rows[jk] = { localId:id, row:r }; sigs[jk] = JSON.stringify(r);
    });
  });
  return { sigs, rows };
}

async function saveRows(){
  const now = new Date().toISOString();
  const cur = snapshot(), prev = LAST_SAVED || {};

  /* Profiles first. A job points at profiles.id and the insert policy checks
     that reference, so a brand-new profile has to exist before its jobs can. */
  const profUp = Object.keys(cur.rows)
    .filter(k => k[0]==='p' && cur.sigs[k]!==prev[k])
    .map(k => Object.assign({}, cur.rows[k], { user_id: USER.id, deleted: false, updated_at: now }));
  for(const part of chunks(profUp, 100)){
    const {data,error} = await withTimeout(
      SB.from('profiles').upsert(part, {onConflict:'user_id,local_id'}).select('id,local_id'),
      WRITE_MS, 'saving to your account');
    if(error) throw error;
    (data||[]).forEach(r => { PROFILE_IDS[r.local_id] = r.id; });
  }

  const jobUp = [];
  Object.keys(cur.rows).forEach(k => {
    if(k[0]!=='j' || cur.sigs[k]===prev[k]) return;
    const pid = PROFILE_IDS[cur.rows[k].localId]; if(!pid) return;
    jobUp.push(Object.assign({}, cur.rows[k].row,
      { user_id: USER.id, profile_id: pid, deleted: false, updated_at: now }));
  });
  for(const part of chunks(jobUp, 200)){
    const {error} = await withTimeout(
      SB.from('jobs').upsert(part, {onConflict:'profile_id,job_key'}),
      WRITE_MS, 'saving to your account');
    if(error) throw error;
  }

  /* Gone from this browser's copy. Marked, not deleted: a tab that has been
     offline still holds jobs somebody else removed, and without a tombstone it
     would helpfully put them all back on its next save. */
  const gone = Object.keys(prev).filter(k => !(k in cur.sigs));
  const byProfile = {};
  gone.filter(k => k[0]==='j').forEach(k => {
    const bits = k.split('\u0000');
    (byProfile[bits[1]] = byProfile[bits[1]] || []).push(bits[2]);
  });
  for(const lid of Object.keys(byProfile)){
    const pid = PROFILE_IDS[lid]; if(!pid) continue;
    for(const part of chunks(byProfile[lid], 200)){
      const {error} = await withTimeout(
        SB.from('jobs').update({deleted:true, updated_at:now}).eq('profile_id',pid).in('job_key',part),
        WRITE_MS, 'saving to your account');
      if(error) throw error;
    }
  }
  const goneProf = gone.filter(k => k[0]==='p').map(k => k.split('\u0000')[1]);
  for(const part of chunks(goneProf, 200)){
    const {error} = await withTimeout(
      SB.from('profiles').update({deleted:true, updated_at:now}).eq('user_id',USER.id).in('local_id',part),
      WRITE_MS, 'saving to your account');
    if(error) throw error;
  }

  LAST_SAVED = cur.sigs;
}

/* One read of the shared liveness table for the keys this account actually
   holds. Deliberately best-effort and never fatal: an account's jobs load with
   or without it, and a failure leaves every leg unknown, which is exactly what
   unknown is for. Batched because `in(...)` is a url and urls have limits. */
async function fillChecks(keys){
  /* Everything is inside the try, including the clear. The first version put
     CHECKS.clear() above it and that was a real bug, not a style point: the
     map is declared 1,400 lines further down, so any context holding this
     function without it -- selfcheck-sync slices exactly this range -- threw a
     ReferenceError before reaching the guard, and took the whole of loadRows
     with it. A best-effort read has to be best-effort on its first line. */
  try{
    CHECKS.clear();
    const uniq = [...new Set((keys||[]).filter(Boolean))];
    if(!uniq.length || typeof SB === 'undefined' || !SB) return;
    for(let i=0; i<uniq.length; i+=200){
      const r = await SB.from('job_checks').select('job_key,closed_on,last_seen').in('job_key', uniq.slice(i,i+200));
      if(r.error) return;
      (r.data||[]).forEach(c => CHECKS.set(c.job_key, c));
    }
  }catch(e){ /* unknown is a valid answer; never block a load on it */ }
}

async function loadRows(){
  const [pr, jr] = await Promise.all([
    withTimeout(SB.from('profiles').select('*').eq('user_id',USER.id).eq('deleted',false),
      READ_MS, 'reading your account'),
    withTimeout(SB.from('jobs').select('*').eq('user_id',USER.id).eq('deleted',false),
      READ_MS, 'reading your account'),
  ]);
  if(pr.error) throw pr.error;
  if(jr.error) throw jr.error;
  await fillChecks((jr.data||[]).map(r => r.job_key));
  const profiles = {}, byId = {};
  PROFILE_IDS = {};
  (pr.data||[]).forEach(row => {
    profiles[row.local_id] = coerceProfile(row);
    byId[row.id] = row.local_id;
    PROFILE_IDS[row.local_id] = row.id;
  });
  (jr.data||[]).forEach(row => {
    const lid = byId[row.profile_id]; if(!lid) return;
    const rec = profiles[lid]; if(!rec || !rec.jobs) return;
    rec.jobs.push(coerceJob(row));
  });
  DB.profiles = profiles;
  return Object.keys(profiles).length > 0 || (jr.data||[]).length > 0;
}

/* One account, one time: the blob becomes rows. Runs after load(), so DB is
   already whatever the blob said. */
async function migrateRows(){
  if(!cloudNow() || MIGRATED) return;
  const wantP = Object.keys(DB.profiles).length;
  const wantJ = Object.keys(DB.profiles).reduce((n,id) =>
    n + ((usable(DB.profiles[id]) ? DB.profiles[id].jobs : null) || []).length, 0);
  LAST_SAVED = null;                 // nothing is known to be there: write it all
  await saveRows();
  /* Count it back before declaring victory. A migration that reports success
     and did not run is how you lose everything in a single step, and the whole
     reason the blob keeps being written is that this check might fail. */
  const [cp, cj] = await Promise.all([
    withTimeout(SB.from('profiles').select('id',{count:'exact',head:true})
      .eq('user_id',USER.id).eq('deleted',false), READ_MS, 'reading your account'),
    withTimeout(SB.from('jobs').select('id',{count:'exact',head:true})
      .eq('user_id',USER.id).eq('deleted',false), READ_MS, 'reading your account'),
  ]);
  if(cp.error || cj.error) throw (cp.error || cj.error);
  if(cp.count !== wantP || cj.count !== wantJ){
    console.warn('migration count mismatch — staying on the blob',
                 {wantP, wantJ, gotP: cp.count, gotJ: cj.count});
    return;
  }
  MIGRATED = true;
  MIGRATED_AT = Date.now();
  await put('triage:current', DB.current||'');
  /* An ISO stamp rather than '1', because the blob's retirement is measured
     from this moment and '1' is not a date. '1' is still read as migrated
     below -- every account that migrated before today holds one -- it just has
     to be given a date the first time it is seen. */
  await put('triage:migrated', new Date(MIGRATED_AT).toISOString());
}

/* How long the blob keeps being written after an account moves onto rows.
   It is a rollback copy, and a rollback copy has a shelf life: two weeks of
   successful row saves is long enough to have noticed a migration that went
   wrong, and past that the blob is no longer insurance -- it is a full second
   copy of every job and every CV, rewritten on every keystroke-driven save,
   for a rollback nobody is going to perform. */
const BLOB_SUNSET_DAYS = 14;

/* When this account migrated, as epoch ms; null when it has not, or when the
   stamp could not be read. Null means keep writing -- never stop on a date we
   are unsure of. */
let MIGRATED_AT = null;

/* Whether the blob is still worth writing.

   Three ways to be true, and the last two matter as much as the first:
     - not migrated: the blob IS the storage.
     - the cloud is not reachable: rows cannot be written, so the blob is the
       only thing keeping this device's work, sunset or not.
     - migrated recently: still inside the rollback window. */
function blobLive(){
  if(!MIGRATED || !cloudNow() || !MIGRATED_AT) return true;
  return (Date.now() - MIGRATED_AT) < BLOB_SUNSET_DAYS * 864e5;
}

/* The blob was written on every save whether or not this account had migrated.
   Once it has, nothing reads it -- it is the offline copy and the rollback,
   and a rollback copy is only worth keeping while it could still be used. */
async function save(){
  if(blobLive()) await put('triage:db', JSON.stringify(DB));
  if(!cloudNow() || !MIGRATED) return;
  /* Which profile is open is the one thing in DB that is not a row. It rode
     inside the blob, and once the blob stops being read it needs its own key
     or every reload lands the person back in onboarding with all their data
     apparently gone. */
  try{ await saveRows(); await put('triage:current', DB.current||''); syncNote(''); }
  catch(e){
    cloudDown(e);
    console.warn('row save failed:', e && e.message);
    /* Locally, and whatever the sunset says. The note below promises the work
       is not lost, and once the blob is retired the row save is the only thing
       that was keeping that promise -- so the moment it fails is the moment
       the copy earns its keep again. Local only: the cloud is what just
       refused us. */
    try{ await putLocal('triage:db', JSON.stringify(DB)); }catch(_){}
    softNote((e&&e.message)||'could not reach the server');
  }
}
async function load(){
  /* Anything non-empty means migrated. Accounts that migrated before the stamp
     existed hold '1', which says it happened but not when -- so they are given
     today's date and their fortnight starts now. Backdating them instead would
     retire the blob on the same load that introduced the idea, which is not a
     window, it is a switch. */
  const mig = (await get('triage:migrated')) || '';
  MIGRATED = !!mig;
  /* Shape-checked before parsing, and that is not belt-and-braces. The legacy
     value is the string '1', and Date.parse('1') does not fail -- it returns
     the 1st of January 2001, which is twenty-five years past any window and
     would retire the blob on the spot for every account that predates the
     stamp. Only something ISO-shaped counts as a date here. */
  const at = /^\d{4}-\d{2}-\d{2}T/.test(mig) ? Date.parse(mig) : NaN;
  MIGRATED_AT = isNaN(at) ? null : at;
  if(MIGRATED && MIGRATED_AT === null){
    MIGRATED_AT = Date.now();
    try{ await put('triage:migrated', new Date(MIGRATED_AT).toISOString()); }
    catch(e){ console.warn('could not stamp the migration date:', e && e.message); }
  }
  let fromRows = false;
  if(cloudNow() && MIGRATED){
    try{
      await loadRows();
      DB.current = (await get('triage:current')) || null;
      fromRows = true;
    }
    catch(e){ cloudDown(e); console.warn('cloud row read failed:', e && e.message); }
  }
  if(!fromRows){
    try{
      const v = await get('triage:db');
      if(v){ const d=JSON.parse(v); DB.profiles=d.profiles||{}; DB.current=d.current||null; }
    }catch(e){}
  }
  /* Rows came back with no profile. Usually that is the truth. But if this
     account has no profile row in ANY state -- not even a deleted one -- then
     a row save has never once landed for it, and the blob, which save() writes
     first, is the only copy of whatever they made. Read it back rather than
     show them an empty app, and send it up properly below.

     The any-state check is what makes this safe: someone who deleted their
     profiles has rows marked deleted, so a stale blob can never resurrect
     what a person chose to remove. */
  let rescued = false;
  if(fromRows && !Object.keys(DB.profiles).length){
    try{
      const {count, error} = await SB.from('profiles').select('id', {count:'exact', head:true}).eq('user_id', USER.id);
      if(!error && count === 0){
        for(const read of [get, getLocal]){
          let d = null; try{ d = JSON.parse((await read('triage:db')) || 'null'); }catch(e){}
          const good = {};
          Object.keys((d && d.profiles) || {}).forEach(k => { if(usable(d.profiles[k])) good[k] = d.profiles[k]; });
          if(Object.keys(good).length){
            DB.profiles = good; DB.current = good[d.current] ? d.current : Object.keys(good)[0];
            rescued = true; break;
          }
        }
      }
    }catch(e){ console.warn('blob rescue skipped:', e && e.message); }
  }
  /* What the server is now known to hold, so the next save sends only what
     changed rather than every row the person has ever had. */
  LAST_SAVED = (cloudNow() && MIGRATED) ? (rescued ? {} : snapshot().sigs) : null;
  if(rescued){ console.warn('profiles restored from the blob; saving them as rows'); await save(); }
  KEY   = (await get('triage:key'))   || '';
  PROV  = (await get('triage:prov'))  || 'deepseek';
  APIFY = (await get('triage:apify')) || '';
  AUTO  = (await get('triage:auto')) !== '0';   // on unless turned off
  // Local, not cloud -- see the theme block above.
  const th = await getLocal('triage:theme');
  if(THEMES.includes(th)){ THEME = th; applyTheme(); }
}

/* ═══ Apify ═══
   Apify's REST API does send CORS headers, so this runs from the browser.
   The token is stored locally and sent only to Apify — but it is a real
   credential, so this file should not be shared with the token saved in it. */
const APIFY_BASE  = "https://api.apify.com/v2";

/* Giving up on a run does not stop it. The tab walks away, the actor keeps
   working, and the bill keeps growing — the one way to spend money here and
   get nothing whatsoever back. Two guards, because they fail differently:
   every run carries a server-side timeout, which holds even if the browser is
   closed mid-run, and every place that stops waiting also aborts on its way
   out, which is immediate rather than waiting for that timeout to expire. */
function runUrl(actor, secs){
  return APIFY_BASE+"/acts/"+actor+"/runs?timeout="+secs;
}
async function abortRun(runId, H){
  if(!runId) return;
  try{ await fetch(APIFY_BASE+"/actor-runs/"+runId+"/abort",{method:"POST",headers:H}); }catch(e){}
}


/* ═══ ATS feeds ═══
   The best data source in the app, and the only one that costs nothing.

   Most companies' careers pages are a thin shell over one of a handful of
   applicant tracking systems, and those systems publish the underlying jobs as
   public JSON. No key, no token, no proxy, no Apify run. These are the same
   endpoints the careers page itself calls, so they are complete, live, and do
   not break when someone redesigns the site.

   They also solve the confidence problem: Google gives a two-line snippet, an
   ATS feed gives the entire job description. Every row pulled this way scores
   high-confidence instead of thin_data.

   CORS: these endpoints are built to be called from customer career sites, so
   they send permissive headers and work from the browser. If one is ever
   blocked, it will fail as a network error, not a 4xx. */

const ATS = {
  greenhouse:{
    label:"Greenhouse",
    host:/(?:job-)?boards\.greenhouse\.io\/([^/?#]+)/i,
    url:s=>`https://boards-api.greenhouse.io/v1/boards/${encodeURIComponent(s)}/jobs?content=true`,
    parse:(d,slug)=>(d.jobs||[]).map(x=>({
      title:x.title||"", location:(x.location&&x.location.name)||"",
      url:x.absolute_url||"", posted:(x.updated_at||"").slice(0,10),
      // Greenhouse returns the description HTML-encoded inside a JSON string.
      desc:decodeHTML(String(x.content||"")), dept:((x.departments||[])[0]||{}).name||""
    }))
  },
  lever:{
    label:"Lever",
    host:/jobs\.lever\.co\/([^/?#]+)/i,
    url:s=>`https://api.lever.co/v0/postings/${encodeURIComponent(s)}?mode=json`,
    parse:d=>(Array.isArray(d)?d:[]).map(x=>({
      title:x.text||"", location:(x.categories&&x.categories.location)||"",
      url:x.hostedUrl||x.applyUrl||"",
      posted:x.createdAt?new Date(x.createdAt).toISOString().slice(0,10):"",
      desc:stripTags(String(x.descriptionPlain||x.description||"")),
      dept:(x.categories&&(x.categories.team||x.categories.department))||""
    }))
  },
  ashby:{
    label:"Ashby",
    host:/jobs\.ashbyhq\.com\/([^/?#]+)/i,
    url:s=>`https://api.ashbyhq.com/posting-api/job-board/${encodeURIComponent(s)}?includeCompensation=true`,
    parse:d=>(d.jobs||[]).map(x=>({
      title:x.title||"", location:x.location||"",
      url:x.jobUrl||x.applyUrl||"", posted:(x.publishedAt||"").slice(0,10),
      desc:stripTags(String(x.descriptionPlain||x.descriptionHtml||"")),
      dept:x.department||"",
      // Ashby is the one feed with reliable pay data, so keep it when present.
      pay:x.compensation&&x.compensation.compensationTierSummary||""
    }))
  },
  /* The three below were added later and are less proven from a browser: if
     one refuses the request (CORS), atsSearch treats it as a miss and moves
     on rather than failing the whole lookup. */
  workable:{
    label:"Workable",
    host:/apply\.workable\.com\/(?!api\/)([^/?#]+)/i,
    url:s=>`https://apply.workable.com/api/v1/widget/accounts/${encodeURIComponent(s)}?details=true`,
    parse:(d,slug)=>(d.jobs||[]).map(x=>({
      title:x.title||"", location:[x.city,x.state,x.country].filter(Boolean).join(", ")+(x.telecommuting?" (remote)":""),
      url:x.shortcode?`https://apply.workable.com/${slug}/j/${x.shortcode}/`:(x.url||""),
      posted:(x.published_on||x.created_at||"").slice(0,10),
      desc:stripTags(String(x.description||"")), dept:x.department||""
    }))
  },
  smartrecruiters:{
    label:"SmartRecruiters",
    host:/(?:jobs|careers)\.smartrecruiters\.com\/([^/?#]+)/i,
    url:s=>`https://api.smartrecruiters.com/v1/companies/${encodeURIComponent(s)}/postings?limit=100`,
    // ponytail: the list has no description; fromAts fetches it for the one
    // posting it needs (detail). Rows imported by company name stay title-only.
    parse:(d,slug)=>(d.content||[]).map(x=>({
      title:x.name||"", location:[x.location&&x.location.city, x.location&&x.location.country].filter(Boolean).join(", ")+(x.location&&x.location.remote?" (remote)":""),
      url:`https://jobs.smartrecruiters.com/${slug}/${x.id}`, posted:(x.releasedDate||"").slice(0,10),
      desc:"", dept:(x.department&&x.department.label)||"", detail:x.ref||""
    })),
    detail:async row=>{
      const d=await (await fetch(row.detail)).json();
      return stripTags(Object.values((d.jobAd&&d.jobAd.sections)||{}).map(s=>s&&s.text||"").join(" "));
    }
  },
  recruitee:{
    label:"Recruitee",
    host:/([a-z0-9-]+)\.recruitee\.com/i,
    url:s=>`https://${encodeURIComponent(s)}.recruitee.com/api/offers/`,
    parse:d=>(d.offers||[]).map(x=>({
      title:x.title||"", location:x.location||[x.city,x.country].filter(Boolean).join(", "),
      url:x.careers_url||"", posted:(x.published_at||x.created_at||"").slice(0,10),
      desc:stripTags(String(x.description||"")+" "+String(x.requirements||"")), dept:x.department||""
    }))
  }
};

function decodeHTML(str){
  const t=document.createElement("textarea"); t.innerHTML=str;
  return stripTags(t.value);
}
const stripTags = h => String(h).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();

/* Turning a company NAME into an ATS slug is the whole difficulty of this
   feature. A URL is unambiguous; a name is not. "Deployment Inc" could be
   deploymentinc, deployment-inc, deployment, or something unrelated.

   Rather than make the person go and find each careers page by hand, try the
   handful of forms companies actually use. Each miss is a cheap 404, and we
   stop at the first hit. Anything still unfound falls through to a Google
   lookup afterwards, which is what a person would have done manually anyway. */
function slugVariants(name){
  const base=String(name).toLowerCase().trim()
    // Drop the corporate suffixes almost nobody puts in a board slug.
    .replace(/\b(inc|llc|ltd|limited|corp|corporation|co|gmbh|pvt|private|technologies|technology|labs|ai)\b\.?/g,' ')
    .replace(/[^a-z0-9 -]/g,' ').replace(/\s+/g,' ').trim();
  const squashed=base.replace(/[\s-]/g,'');
  const hyphen=base.replace(/\s+/g,'-');
  const firstWord=base.split(' ')[0]||'';
  // Keep the AI suffix version too: plenty of companies do use it (sarvamai).
  const withAi=String(name).toLowerCase().replace(/[^a-z0-9]/g,'');
  return [...new Set([squashed,hyphen,firstWord,withAi].filter(x=>x&&x.length>1))].slice(0,4);
}

/* Accepts a careers URL, "platform:slug", or a bare company name. */
function parseAtsTarget(line){
  const t=String(line).trim(); if(!t) return [];
  for(const k in ATS){
    const m=t.match(ATS[k].host);
    if(m) return [{platform:k,slug:m[1],exact:true}];
  }
  const explicit=t.match(/^(greenhouse|lever|ashby|workable|smartrecruiters|recruitee)\s*[:/]\s*(.+)$/i);
  if(explicit) return [{platform:explicit[1].toLowerCase(),slug:explicit[2].trim(),exact:true}];
  if(/^https?:\/\//i.test(t)) return [];        // some other careers page; Google will have to find it
  const out=[];
  slugVariants(t).forEach(sl=>Object.keys(ATS).forEach(k=>out.push({platform:k,slug:sl,name:t})));
  return out;
}

/* Last resort: ask Google where this company's board lives. This is exactly the
   manual step it saves — one search per company, and the slug falls out of the
   URL. Needs the Apify token; without it, unfound companies are just reported. */
/* Every Apify feature here is the same three steps: start a run, poll it until
   it stops, read its dataset. Only the actor, the payload, the polling cadence
   and the wording of the status line differ, so those are the arguments.

   cap is how long this tab is willing to wait. The run's own server-side
   timeout is derived from it rather than passed separately, because the two
   must not drift: the server has to outlive the browser's patience, or a run
   the tab is still polling gets killed underneath it. Giving up also aborts,
   since walking away from a run does not stop the bill. */
const ownApify = () => !!(APIFY && APIFY.startsWith("apify_api_"));
async function apifyRun(actor, payload, o){
  const every=o.every||6000, cap=o.cap||600;
  if(!ownApify() && !cloudNow()) throw new Error("NEEDAPIFY");
  // Same start/poll/read loop either way; only who holds the token differs.
  // Their own token calls Apify directly; otherwise the server runs it on ours for credits.
  const H={"Authorization":"Bearer "+APIFY,"Content-Type":"application/json"};
  let dataset='';
  const api = ownApify() ? {
    start: async()=>{
      let r;
      try{ r=await fetch(runUrl(actor,cap+60),{method:"POST",headers:H,body:JSON.stringify(payload)}); }
      catch(e){ throw new Error("Couldn't reach Apify."); }
      if(r.status===401||r.status===403) throw new Error("NEEDAPIFY");
      if(!r.ok) throw new Error("Apify returned "+r.status);
      const d=(await r.json()).data||{};
      dataset=d.defaultDatasetId; return d.id;
    },
    status: async id=>((await (await fetch(APIFY_BASE+"/acts/"+actor+"/runs/"+id,{headers:H})).json()).data||{}).status,
    items:  async ()=>(await (await fetch(APIFY_BASE+"/datasets/"+dataset+"/items?clean=true&format=json",{headers:H})).json()),
    abort:  id=>abortRun(id,H)
  } : {
    // o.runId: the server already started (and charged for) this run, e.g. inside board_search.
    start:  async()=>o.runId || (await hosted('apify_start',{payload,timeout:cap+60})).id,
    status: async id=>(await hosted('apify_status',{id})).status,
    // o.source: a scraper run, which the server returns already in the Job shape.
    items:  async id=>(await hosted('apify_items',{id, source:o.source, search_id:SEARCH_ID})).items,
    abort:  id=>hosted('apify_abort',{id}).catch(()=>{})
  };
  const id=await api.start();
  if(!id) throw new Error("Apify wouldn't start the run.");
  // The loop condition already exits on SUCCEEDED; only a hard failure throws.
  let status="RUNNING", waited=0;
  while(status==="RUNNING"||status==="READY"){
    await new Promise(z=>setTimeout(z,every)); waited+=every/1000;
    if(stopped()){ api.abort(id); throw new Error('stopped'); }
    if(waited>cap){ api.abort(id); throw new Error(`${o.label||'That run'} timed out after ${Math.round(cap/60)} minutes.`); }
    status=(await api.status(id))||"UNKNOWN";
    if(o.onStatus) o.onStatus(`${o.label||'working'} — ${status.toLowerCase()}, ${waited}s`);
    if(["FAILED","TIMED-OUT","ABORTED"].includes(status)) throw new Error("Apify run "+status);
  }
  return (await api.items(id))||[];
}

/* Jev (TypeSafe System One) judges one job: how much of the posting is visible,
   the two fit scores, and the ten flag codes.

   NOTHING CALLS THIS as of 2026-10-04. runScoring was its last caller and now
   judges through judgeMany like the search path, so both remaining references
   -- judgeInto below, and this -- are reachable from no button. They are left
   in place rather than deleted because this is the only `hosted('judge')` call
   site, and scripts/pipeline-map.js asserts the hosted call sites map 1:1 onto
   the edge function's actions: removing them makes that gate fail and the right
   fix is then to retire the `judge` ACTION too, which judge_batch subsumes at
   one posting. That is a deliberate change to a deployed endpoint and not a
   side effect of a batching fix, so it is flagged here instead of smuggled in. */
async function judgeJob(posting, candidate){
  return hosted('judge', { posting, candidate });
}
/* The same judgement for a whole list, in one round trip and for one credit.
   Jev takes one state per request, so the server still makes one call per
   posting -- what is batched is the trip and the charge, which is the only
   reason judging a search of hundreds is affordable at all.

   Must equal MAX_JUDGE_BATCH in the edge function, which rejects anything
   longer; scripts/pipeline-map.js asserts the two agree. */
const JUDGE_BATCH = 50;
async function judgeMany(postings, candidate, exemplar){
  const out = [];
  for(let i=0;i<postings.length;i+=JUDGE_BATCH){
    // search_id ties the charge to the board search it belongs to, as claude() does.
    // exemplar rides every batch because it is the comparable, not a posting:
    // the same text for all fifty rows, and omitted entirely when empty so the
    // server asks two scores per posting instead of three.
    const r = await hosted('judge_batch', { postings: postings.slice(i,i+JUDGE_BATCH), candidate, exemplar, search_id:SEARCH_ID });
    const got = (r && r.judgments) || [];
    // Short replies pad with nulls: index k of the answer must stay index k of
    // the input, or every judgement lands on the wrong job.
    for(let k=0;k<Math.min(JUDGE_BATCH, postings.length-i);k++){
      const one = got[k];
      out.push(one && one.ok ? one : null);
    }
  }
  return out;
}
