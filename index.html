      padding:8px 10px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;box-shadow:var(--shadow-md);
      font-size:12px;color:var(--muted);line-height:1.5}
    .qitem.sel .qmini,.qitem.sel .qhist{display:none}
  }
  .qfacts{align-items:center}
  .youcard{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:start;margin:4px 0 26px;padding:16px;
    border:1.5px solid var(--line);border-radius:12px;background:var(--panel)}
  .youfig{background:var(--tile);border:1.5px solid var(--line);border-radius:10px;height:220px;display:grid;place-items:end center;overflow:hidden}
  .you-art{height:205px;width:auto}
  .youname{font-size:24px;font-weight:750;letter-spacing:-.02em;line-height:1.15}
  .youhead{font-size:14px;margin-top:4px} .youmeta{font-size:12.5px;color:var(--muted);margin-top:4px}
  .youdirs{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
  .youdirs span{display:inline-flex;align-items:center} .youdirs i{font-style:normal;color:var(--dim);margin-left:5px;font-size:11.5px}
  .youpick{display:flex;gap:6px;margin-top:12px}
  .youpick button,.youpick button:hover:not(:disabled){width:44px;height:52px;padding:2px;border:1.5px solid var(--hair);border-radius:8px;background:var(--tile);display:grid;place-items:end center;overflow:hidden}
  .youpick button.on{border-color:var(--text);box-shadow:0 0 0 1.5px var(--text)}
  .youpick svg{height:48px;width:auto}
  .youlist{margin:4px 0 0;padding-left:20px;font-size:13px;color:var(--muted);line-height:1.6}
  /* The You view's way to its analytics: big, top right, and fixed while the
     page scrolls -- drawn only on You (feedback, 2026-10-19). */
  .youswitch,.youswitch:hover:not(:disabled){position:fixed;top:16px;right:22px;z-index:30;display:inline-flex;align-items:center;gap:9px;
    padding:12px 18px 12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);
    font-size:15px;font-weight:700;box-shadow:var(--shadow-md)}
  .youswitch:hover:not(:disabled){background:var(--panel2)}
  @media(max-width:900px){ .youswitch,.youswitch:hover:not(:disabled){top:10px;right:12px;padding:10px 14px 10px 12px;font-size:14px}
    .youcard{grid-template-columns:110px minmax(0,1fr);gap:14px} .youfig{height:150px} .you-art{height:140px} .youname{font-size:20px} }
  /* To decide with the map as a layer: beside the list on a wide screen
     (sticky, so it stays while the list scrolls). Below 1100px the list is a
     SHUTTER over the map: it sits on top, covering it, and pulling it down by
     its handle (or tapping the handle) slides it down to reveal the map
     underneath; pushing it up closes it. --maph is the map's height, set after
     each render. While a job is open its pane takes the map's place. */
  .decide{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
  .shutter{display:none}
  @media(max-width:1099px){
    .decide{display:flex;flex-direction:column;gap:0;position:relative}
    .dmap{display:block;order:-1}            /* the map first, so the list can lie over it */
    .dlist{position:relative;z-index:3;background:var(--ink);margin-top:calc(-1 * var(--maph, 0px));
      border-top:1.5px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 24px rgba(0,0,0,.28);
      transition:margin-top .3s cubic-bezier(.2,.8,.2,1)}
    .decide.mapon .dlist{margin-top:14px}
    .dlist.dragging{transition:none}
    .shutter,.shutter:hover:not(:disabled){display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:10px 12px 12px;
      margin:0 0 6px;border:0;border-radius:18px 18px 0 0;background:none;color:var(--text);touch-action:none;cursor:grab}
    .shutter i{width:52px;height:6px;border-radius:3px;background:var(--dim)}
    .shutter span{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
    .shutter span svg{width:18px;height:18px}
    .shutter small{font-size:11.5px;color:var(--muted);font-weight:400}
  }
  @media(prefers-reduced-motion:reduce){ .dlist{transition:none} }
  .mapnote{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:0 0 10px;padding:7px 10px;
    border:1.5px solid var(--line);border-radius:8px;background:var(--panel2);font-size:12.5px}
  @media(min-width:1100px){
    .decide{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}
    .dmap{display:block;position:sticky;top:12px;order:0}
    .wrap.paned .decide{grid-template-columns:minmax(0,1fr)}
    .wrap.paned .dmap{display:none}
  }
  .qd-cv{margin:0 0 16px} .qd-cv .btn-row{margin-top:6px}
  .cvgap{margin:10px 0;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel2);font-size:12.5px;line-height:1.5}
  .cvdoc{max-height:52vh;overflow:auto;padding:16px 18px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;line-height:1.5}
  .cvdoc h1{font-size:19px;margin:0 0 2px} .cvdoc h2{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    border-bottom:1px solid var(--hair);padding-bottom:3px;margin:14px 0 6px}
  .cvdoc p{margin:3px 0} .cvdoc ul{margin:3px 0 6px;padding-left:18px} .cvdoc li{margin:2px 0}
  .dstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:2px 0 12px}
  .dstat{padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
  .dstat .num{font-size:26px;line-height:1.1;color:var(--text)}
  .dstat .dl{font-size:12.5px;font-weight:650;margin-top:4px} .dstat .ds{font-size:11.5px;color:var(--muted);margin-top:2px}
  .dpanes{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;margin-bottom:26px}
  /* .dpane, not .dcard: .dcard is the phone swipe deck's card. */
  .dpane{padding:12px 14px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}
  .dch{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:6px}
  .dch b{font-size:14px} .dch span{font-size:11.5px;color:var(--muted)}
  .dleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin:2px 0 4px}
  .dleg span{display:inline-flex;align-items:center}
  .dchart{position:relative} .dchart svg{display:block;width:100%;height:auto}
  .dchart [data-tip]{cursor:default}
  .dax{font:10px var(--mono);fill:var(--dim)} .dlab{font-size:11.5px;fill:var(--text)}
  .dgrid{display:grid;gap:4px;align-items:stretch;margin-top:8px}
  .dgh{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:center;align-self:end;padding-bottom:2px}
  .dgr,.dgr:hover:not(:disabled){display:flex;align-items:center;gap:2px;min-width:0;padding:6px 4px;border:0;border-radius:6px;background:none;
    color:var(--text);font-size:12.5px;font-weight:600;text-align:left}
  .dgr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dgr:not(:disabled):hover{background:var(--panel2)}
  .dcell,.dcell:hover:not(:disabled){min-height:38px;border:1.5px solid var(--hair);border-radius:7px;background:none;color:var(--text);padding:0}
  .dcell:not(:disabled):hover{border-color:var(--line)}
  .dcell:disabled{color:var(--dim)}
  .dcell .num{font-size:14px}
  @media(max-width:1080px){ .dpanes{grid-template-columns:minmax(0,1fr)} }
  @media(max-width:640px){ .dstats{grid-template-columns:repeat(2,minmax(0,1fr))} .dgh{font-size:8.5px;letter-spacing:0} }
  .wmstrip{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
  .wmstrip .wm-ic{flex:0 0 32px;width:32px;height:32px;border-radius:9px}
  .wmstrip .wm-t{flex:1;min-width:0;font-size:12.5px;color:var(--muted)} .wmstrip .wm-t b{color:var(--text);font-weight:650}
  .mapkey .kz.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--text)}
  .mapkey .kall{color:var(--text);font-weight:650;margin-bottom:6px;border:1.5px solid var(--line)}
  .costrip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
  .costrip .co-lead{flex:1 1 260px;font-size:12.5px;color:var(--muted)}

  /* Fixed widths on the fact and action columns, so the columns line up across
     rows even though every row is its own grid. */
  .qrow{display:grid;grid-template-columns:5px 38px minmax(0,1fr) 128px 104px 290px;
    gap:0 16px;align-items:center;padding:13px var(--row-pad);border-radius:4px;cursor:pointer;
    transition:transform .18s cubic-bezier(.16,1,.3,1),box-shadow .18s,background-color .18s}
  .qfacts{display:contents}
  .qbar{grid-row:1;align-self:stretch;min-height:38px;border-radius:1px;background:transparent}
  .qitem.go .qbar{background:var(--go)}         .qitem.go .qrow{background:var(--go-row)}
  .qitem.due .qbar{background:var(--due)}       .qitem.due .qrow{background:var(--due-row)}
  .qitem.closing .qbar{background:var(--closing)} .qitem.closing .qrow{background:var(--closing-row)}
  .qitem.awaiting .qbar{background:var(--awaiting)} .qitem.awaiting .qrow{background:var(--awaiting-row)}
  .qitem.closed .qbar{background:var(--closed)}
  /* The selected row. Lifted like a hover rather than tinted, because a tint
     would be a fifth accent and the law allows four. The ring sits on the
     accent bar, so whatever the row already means stays readable. */
  .qitem.sel .qrow{background:var(--panel);box-shadow:var(--shadow-md);
    position:relative;z-index:2}
  .qitem.sel .qbar{box-shadow:0 0 0 1px var(--signal)}
  /* The row under the pointer lifts off the list, so it is plain which one a
     click will open. Pointer devices only: on touch, hover sticks after a tap. */
  @media(hover:hover){
    .qitem .qrow:hover{transform:translateY(-2px) scale(1.012);background:var(--panel);
      box-shadow:var(--shadow-md);position:relative;z-index:1}
  }
  .qrank{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;line-height:1;color:var(--text)}
  /* No accent on the rank: colour is an instruction and a score is not one
     (see the colour law at the top of this file). The row's edge and the
     section it sits in already say what to do, and a green rank on an amber
     closing row put two accents on one row. Grey stays: it is the absence
     of an instruction, not an accent. */
  .qrank.quiet{color:var(--muted)}
  .qt{font-size:14px;line-height:1.35}
  .qs{font-size:12px;color:var(--muted);margin-top:2px}
  /* The pipeline as one bar, so its shape reads before any of its rows do.
     Only the two stages that mean something take an accent (law: one
     instruction each); the rest are neutral. */
  .pbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--hair);margin:4px 0 8px}
  .pbar i{display:block;min-width:3px}
  .pbar-l{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 12px}
  .pbar-l span{display:inline-flex;align-items:center;gap:6px}
  .pbar-l i{width:10px;height:10px;border-radius:2px;display:inline-block}
  .qfact .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;margin-top:3px;white-space:nowrap}
  .qfact .v.quiet{color:var(--muted)} .qfact .v.est{font-style:italic}
  .qfact .v.go{color:var(--go)} .qfact .v.due{color:var(--due)}
  .qfact .v.closing{color:var(--closing)} .qfact .v.awaiting{color:var(--awaiting)}
  .qacts{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
  .btn-due{background:var(--due);border-color:var(--due);color:var(--on-due);font-weight:700}
  .btn-due:hover:not(:disabled){background:var(--due);border-color:var(--due);color:var(--on-due);filter:brightness(1.08)}
  .btn-await{background:var(--awaiting-tint);border-color:var(--awaiting-line);color:var(--awaiting)}
  .btn-await:hover:not(:disabled){border-color:var(--awaiting);color:var(--awaiting)}
  /* The row's overflow. Always visible rather than revealed on hover, because a
     hover-reveal does not exist on a touch screen and a fair amount of triage
     happens on one. A <details> rather than a scripted menu, so it closes
     itself on the re-render that every action in it causes. */
  .rowmenu{position:relative}
  .rowmenu[open]{z-index:20}
  .rowmenu>summary{list-style:none;cursor:pointer;display:flex;align-items:center;
    justify-content:center;padding:5px 9px;font-family:var(--mono);font-size:12px;
    line-height:1.35;border:1px solid var(--line);border-radius:5px;
    background:var(--panel2);color:var(--muted)}
  .rowmenu>summary::-webkit-details-marker{display:none}
  .rowmenu>summary::marker{content:''}
  .rowmenu>summary:hover{border-color:var(--signal);color:var(--signal)}
  .rowmenu-pop{position:absolute;right:0;top:calc(100% + 5px);z-index:21;
    display:flex;flex-direction:column;gap:4px;min-width:212px;padding:6px;
    background:var(--panel);border:1px solid var(--line);border-radius:7px;
    box-shadow:var(--shadow-lg)}
  .rowmenu-pop .btn-sm{text-align:left;background:transparent;border-color:transparent}
  .rowmenu-pop .btn-sm:hover:not(:disabled){background:var(--panel2);
    border-color:transparent;transform:none}
  /* Too narrow for five columns: the facts drop under the title, then the
     actions under both. Same row, same order, stacked rather than squeezed. */
  @media(max-width:1240px){
    .qrow{grid-template-columns:5px 38px minmax(0,1fr) auto}
    .qbar{grid-row:1 / span 2}
    .qfacts{display:flex;gap:26px;grid-column:3;grid-row:2;margin-top:8px}
    .qacts{grid-column:4;grid-row:1 / span 2}
  }
  @media(max-width:640px){
    .qrow{grid-template-columns:5px 32px minmax(0,1fr);gap:0 12px}
    .qbar{grid-row:1 / span 3}
    .qacts{grid-column:3;grid-row:3;justify-content:flex-start;margin-top:10px}
    /* The actions sit at the left edge now, so a menu hung off their right
       edge would open past the left of the screen. Anchor it the other way. */
    .rowmenu-pop{right:auto;left:0}
  }

  /* ═══ one job, opened ═══
     In place, under its own row: the list you are working through stays where
     it is. Read rather than scanned, so it is laid out as a record on the left
     and the situation on the right. */
  .qd{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0 26px;
    padding:18px 0 22px var(--row-pad);border-top:1px solid var(--hair)}
  .qd-main{min-width:0}
  .qd-rail{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;
    align-self:start;display:flex;flex-direction:column;gap:18px;min-width:0}
  .qd-eb{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .qd-eb i{width:3px;height:13px;background:var(--dim)}
  .qd.go .qd-eb i{background:var(--go)}             .qd.go .qd-eb .eyebrow{color:var(--go)}
  .qd.due .qd-eb i{background:var(--due)}           .qd.due .qd-eb .eyebrow{color:var(--due)}
  .qd.closing .qd-eb i{background:var(--closing)}   .qd.closing .qd-eb .eyebrow{color:var(--closing)}
  .qd.awaiting .qd-eb i{background:var(--awaiting)} .qd.awaiting .qd-eb .eyebrow{color:var(--awaiting)}
  .qd-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 18px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .qd-stat{padding:13px 0}
  .qd-stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;line-height:1;margin-top:7px}
  .qd-stat .c{font-size:11px;color:var(--dim);margin-top:6px}
  .qd-stat.closing .v,.qd-stat.closing .c{color:var(--closing)}
  .qd-h{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);padding-bottom:8px;border-bottom:1px solid var(--line);margin-top:24px}
  .qd-rail .qd-h{margin-top:0}
  .qd-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
  .qd-p{font-size:13px;color:var(--muted);line-height:1.6;margin:11px 0 0}
  .qd-quote{font-size:13px;line-height:1.6;border-left:2px solid var(--line);padding-left:14px;
    margin-top:13px;white-space:pre-wrap;max-height:260px;overflow:auto}
  .pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
  .pl{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 7px;border-radius:2px;border:1px solid var(--line);background:var(--panel2);
    color:var(--muted);white-space:nowrap}
  .pl.go{color:var(--go);background:var(--go-tint);border-color:var(--go-line)}
  /* One flag, what in the posting makes it true, and the line it came from.
     The quote is the point: a wrong one is obvious at a glance, which a wrong
     sentence never was. */
  .ev{margin-top:11px}
  .ev-i{padding:9px 0;border-bottom:1px solid var(--hair)}
  .ev-i:last-child{border-bottom:0;padding-bottom:0}
  .ev-f{font-size:12.5px;color:var(--text);line-height:1.5;margin-top:6px}
  .ev-s{font-size:12px;color:var(--muted);line-height:1.55;font-style:italic;
    border-left:2px solid var(--line);padding-left:10px;margin-top:6px}
  .ev-n{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:6px}
  .qh{display:grid;grid-template-columns:8px 86px minmax(0,1fr);gap:0 12px;align-items:baseline;
    padding:9px 0;border-bottom:1px solid var(--hair);font-size:12.5px}
  .qh i{width:5px;height:5px;border-radius:50%;background:var(--closed)}
  .qh.go i{background:var(--go)} .qh.due i{background:var(--due)} .qh.awaiting i{background:var(--awaiting)}
  .qh .when{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .qh .what{color:var(--muted);min-width:0} .qh .what b{color:var(--text);font-weight:500}
  .qd-none{color:var(--dim);font-size:12.5px;padding:10px 0}
  .qd-callout{padding:10px 12px;border-left:3px solid var(--line);font-size:12.5px;line-height:1.5}
  .qd-callout.go{border-left-color:var(--go);background:var(--go-tint)}
  .qd-callout.due{border-left-color:var(--due);background:var(--due-tint)}
  .qd-callout.closing{border-left-color:var(--closing);background:var(--closing-tint)}
  .qd-callout.awaiting{border-left-color:var(--awaiting);background:var(--awaiting-tint)}
  .rec{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--hair)}
  .rec:last-child{border-bottom:none}
  .rec .k{font-size:12px;color:var(--muted);flex-shrink:0}
  .rec .v{font-size:12.5px;text-align:right;min-width:0;overflow-wrap:anywhere}
  .rec .v.go{color:var(--go)} .rec .v.due{color:var(--due)}
  .rec .v.closing{color:var(--closing)} .rec .v.awaiting{color:var(--awaiting)} .rec .v.closed{color:var(--dim)}
  .qp{padding:10px 0;border-bottom:1px solid var(--hair)}
  .qp:last-of-type{border-bottom:none}
  .qp-n{font-size:13px} .qp-r{font-size:11.5px;color:var(--muted);margin-top:2px}
  .qp-m{font-size:11px;color:var(--muted);font-family:var(--mono);overflow-wrap:anywhere;margin-top:2px}
  @media(max-width:1080px){ .qd{grid-template-columns:minmax(0,1fr);row-gap:20px} }
  @media(max-width:640px){
    .qd-two{grid-template-columns:minmax(0,1fr)}
    .qd-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  }

  /* The colour key in the sidebar: the law, with how many rows each rule holds. */
  .lg{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:0 11px;align-items:baseline;
    padding:8px 0;border-bottom:1px solid var(--hair)}
  .lg:last-child{border-bottom:none}
  .lg i{align-self:stretch;background:var(--closed)}
  .lg.go i{background:var(--go)} .lg.due i{background:var(--due)}
  .lg.closing i{background:var(--closing)} .lg.awaiting i{background:var(--awaiting)}
  .lg-h{font-size:12.5px} .lg-s{font-size:11px;color:var(--dim);margin-top:1px}
  .lg .num{font-size:13px;color:var(--muted)}
  .lg.go .num{color:var(--go)} .lg.due .num{color:var(--due)}
  .lg.closing .num{color:var(--closing)} .lg.awaiting .num{color:var(--awaiting)}
  a.lnk{color:var(--cool);text-decoration:none;font-size:12px;font-family:var(--mono)}
  a.lnk:hover{text-decoration:underline}
  .bar{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%}

  .empty{border:1.5px solid var(--line);border-radius:10px;padding:34px 20px 52px;text-align:center;color:var(--muted);
    background:var(--panel);position:relative;overflow:hidden}
  /* The straight-line motif, as on the sign-in floor and at the rail's foot. */
  .empty::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;border-top:1.5px solid var(--line);
    background:repeating-linear-gradient(180deg,transparent 0 4px,var(--gnd) 4px 5.5px)}
  .empty b{display:block;color:var(--text);font-size:15px;font-weight:500;margin-bottom:6px}

  /* Dialogs are appended to <body>, outside #app where the font is set, so they
     take it here; without this every dialog fell back to the browser's serif. */
  .modal{font-family:var(--disp);color:var(--text);position:fixed;inset:0;background:var(--veil);display:flex;
    align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:5px;
    max-width:620px;width:100%;max-height:84vh;overflow:auto;padding:22px;
    box-shadow:var(--shadow-lg)}

  .tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--signal);border-bottom-color:var(--signal)}
  .tab:hover{color:var(--text)}
  .tabct{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:8px;
    background:var(--panel2);color:var(--muted);vertical-align:1px}
  .tabct.due{background:var(--warn-chip);color:var(--warn)}
  @media(max-width:640px){
    /* Reclaims a wrapped row of the bar. Overdue stays, because it is the only
       one of these that is a request rather than a readout -- the rest is said
       again by the section headings and the Applied tab's own count. */
    .topbar .pill:not(.due){display:none}
    select.trkbar{max-width:min(240px,60vw)}
    /* The palette is a keyboard affordance and there is no keyboard here. It
       costs a wrapped row, and every command in it dispatches to a control in
       the drawer, which the thumb bar opens -- so nothing becomes unreachable
       by dropping the way in that needed two hands. */
    #btnPal{display:none}
  }
  @media(max-width:480px){
    .tabs{flex-wrap:wrap;row-gap:10px}
    .tabs .spacer{flex-basis:100%;height:0}
    .tab{padding:6px 10px 8px}
  }

  .listhead{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
  .segs{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .seg{border:none;border-radius:0;background:transparent;color:var(--muted);
    padding:5px 11px;font-size:12px}
  .seg + .seg{border-left:1px solid var(--line)}
  .seg:hover:not(.on){color:var(--text);transform:none}
  .seg.on{background:var(--panel2);color:var(--signal)}

  /* The one thing to do next. Everything else on screen is a list; this is a
     single instruction, derived from state rather than chosen by the reader. */
  .next{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:linear-gradient(90deg,var(--signal-tint),var(--signal-tint2) 60%,transparent);
    border:1px solid var(--line);border-left:3px solid var(--signal);
    border-radius:6px;padding:14px 16px;margin-bottom:18px}
  .next.calm{border-left-color:var(--good);
    background:linear-gradient(90deg,var(--good-tint),transparent 60%)}
  .next.warn{border-left-color:var(--warn);
    background:linear-gradient(90deg,var(--warn-tint),transparent 60%)}
  .next .nh{font-size:15px;font-weight:500;margin-bottom:2px}
  .next .ns{font-size:12px;color:var(--muted)}
  /* A picture beside the banner, on tile. The banner keeps its own colours. */
  .nextrow{display:flex;align-items:stretch;gap:12px;margin-bottom:18px}
  .nextrow .next{flex:1;min-width:0;margin-bottom:0}
  .next-art{position:relative;flex:none;width:112px;min-height:78px;overflow:hidden;background:var(--tile);
    border:1.5px solid var(--line);border-radius:12px;display:flex;align-items:flex-end;justify-content:center}
  .next-art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;border-top:1.5px solid var(--line);
    background:repeating-linear-gradient(180deg,transparent 0 4px,var(--hair) 4px 5.5px)}
  .next-fig{position:relative;z-index:1;height:70px;width:auto;margin-bottom:6px}
  .next-art.wide{width:184px}
  .next-art.wide .next-word{position:absolute;left:10px;top:8px;height:46px;width:auto}
  .next-art.wide .next-fig{position:absolute;right:12px;bottom:6px;margin:0}
  @media(max-width:700px){ .next-art{display:none} }
  /* On a phone the banner is a headline and a button; the sentence under it
     cost about 140px of an 844px screen before the map began. */
  @media(max-width:700px){ .next{padding:10px 14px;margin-bottom:12px;gap:10px} .next .ns{display:none} .next .nh{margin:0} }
  /* Background-task toasts. Fixed to the corner and above the app but BELOW
     the modal layer, so opening the picker doesn't leave a toast floating
     over its own dialog. */
  /* The command surface. Sits above the sidebar sheet and the mobile toolbar
     but below .modal, because a command that opens a dialog closes the palette
     first and the two are never on screen together. */
  .palscrim{position:fixed;inset:0;z-index:48;background:var(--veil-lite)}
  .palbox{position:fixed;z-index:49;left:50%;transform:translateX(-50%);
    top:calc(8vh + env(safe-area-inset-top, 0px));width:min(520px,calc(100vw - 32px));
    max-height:min(560px,74vh);background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden;
    display:flex;flex-direction:column}
  #palIn{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;
    background:transparent;font-family:var(--disp);font-size:15px;padding:14px 16px}
  #palIn:focus{outline:none;border-color:var(--line)}
  .pallist{overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:2px}
  .palrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:transparent;border:1px solid transparent;border-radius:5px;
    padding:9px 11px;font-size:13px}
  .palrow .plab{flex:1;min-width:0}
  .palrow .pgrp{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--muted);flex-shrink:0}
  .palrow:hover:not(:disabled){background:var(--panel2);border-color:transparent;
    color:var(--text);transform:none}
  .palrow.on{background:var(--signal-tint);border-color:var(--go-line)}
  .palrow.on:hover:not(:disabled){background:var(--signal-tint);border-color:var(--go-line)}
  .palnone{padding:15px 12px;font-size:13px;color:var(--muted)}
  .palfoot{border-top:1px solid var(--hair);padding:8px 13px;
    font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.03em}
  .palfoot .kb{border:1px solid var(--line);border-radius:3px;padding:0 4px;
    margin-right:2px;color:var(--muted)}

  #tasks{position:fixed;right:16px;bottom:16px;z-index:40;display:flex;
    flex-direction:column;gap:9px;width:min(330px,calc(100vw - 32px))}
  .task{background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--signal);border-radius:6px;padding:12px 13px;
    box-shadow:var(--shadow-md)}
  .task.done{border-left-color:var(--good)}
  .task.err{border-left-color:var(--warn)}
  .task .tl{font-size:13px;margin-bottom:3px}
  .task .tn{font-size:12px;color:var(--muted);margin-bottom:3px}
  /* "Sent.": the man on a tile at the left of the toast. */
  .task.art{display:flex;padding:0;overflow:hidden}
  .task-main{flex:1;min-width:0;padding:12px 13px}
  .task-art{position:relative;flex:none;width:66px;background:var(--tile);border-right:1.5px solid var(--line);
    display:flex;align-items:flex-end;justify-content:center}
  .task-art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;border-top:1.5px solid var(--line);
    background:repeating-linear-gradient(180deg,transparent 0 3.5px,var(--hair) 3.5px 5px)}
  .task-fig{position:relative;z-index:1;height:66px;width:auto;margin-bottom:5px}
  /* "Saved on this device": the calm woman beside the message and a retry. */
  .soft{display:flex;align-items:stretch;margin-top:8px;max-width:560px;overflow:hidden;background:var(--panel);
    border:1.5px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--disp)}
  .soft-art{position:relative;flex:none;width:76px;background:var(--tile);border-right:1.5px solid var(--line);
    display:flex;align-items:flex-end;justify-content:center}
  .soft-art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;border-top:1.5px solid var(--line);
    background:repeating-linear-gradient(180deg,transparent 0 4px,var(--hair) 4px 5.5px)}
  .soft-fig{position:relative;z-index:1;height:72px;width:auto;margin-bottom:6px}
  .soft-t{display:flex;flex-direction:column;gap:3px;padding:10px 12px;font-size:12px;color:var(--muted);min-width:0}
  .soft-t b{font-size:13px;color:var(--text)}
  .soft-t .btn-sm{align-self:flex-start;margin-top:6px}
  .task .ts{font-size:11px;color:var(--muted);font-family:var(--mono);
    word-break:break-word;line-height:1.4}
  @media(prefers-reduced-motion:no-preference){.task{animation:rise .3s cubic-bezier(.16,1,.3,1) backwards}}

  /* Feedback: a button that never leaves the corner, the form it opens and the
     question it sometimes asks. It takes the corner #tasks had and carries
     #tasks inside it, so a toast and a question stack instead of colliding.
     Same layer as the detail sheet and later in the DOM, so it stays reachable
     over an open job; the palette and dialogs still cover it.
     The column itself ignores the pointer -- only what is drawn in it does not,
     or its empty width would swallow clicks meant for the row underneath. */
  #fb #tasks{position:static;width:100%}
  #fb{position:fixed;right:16px;bottom:16px;z-index:47;display:flex;
    flex-direction:column;align-items:flex-end;gap:8px;
    width:min(320px,calc(100vw - 32px));pointer-events:none}
  #fb>*{pointer-events:auto}
  #fbFab{border-radius:999px;padding:8px 14px;background:var(--panel);box-shadow:var(--shadow-md)}
  .fbcard{width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:12px 13px;box-shadow:var(--shadow-lg)}
  .fbkinds{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .fbkinds button[aria-pressed=true]{border-color:var(--go);color:var(--go);background:var(--go-tint)}
  @media(prefers-reduced-motion:no-preference){.fbcard{animation:rise .3s cubic-bezier(.16,1,.3,1) backwards}}
  @media(max-width:900px){
    /* Clear of the bottom toolbar, and out of the way of the tools sheet,
       whose own controls reach this corner. */
    #fb{bottom:calc(76px + env(safe-area-inset-bottom))}
    #fb button{min-height:44px}
    #app:has(.side.open) #fb{display:none}
  }

  .hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.45}
  .err{color:var(--warn);font-size:12px;margin-top:8px;font-family:var(--mono)}
  /* currentColor, so it shows on a filled button too: it was green on green. */
  .spin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* Waiting: the one scene for a pause long enough to notice -- the boot splash
     and a board search. The cast's car drives the ruled floor on the light tile
     the people always stand on, so it reads the same in every theme. */
  .wait{border:1.5px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;margin-bottom:12px}
  .wait-h{display:flex;align-items:center;gap:9px;padding:14px 16px 0;font-size:15px;font-weight:600;color:var(--text)}
  .wait-s{padding:4px 16px 12px;font-family:var(--mono);font-size:12px;color:var(--muted);min-height:1.5em}
  .road{position:relative;height:86px;background:var(--tile);border-top:1.5px solid var(--line)}
  .road::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;border-top:1.5px solid var(--hard);
    background:repeating-linear-gradient(180deg,transparent 0 4px,var(--gnd) 4px 5.5px)}
  .road .car{position:absolute;bottom:17px;left:-100px;width:78px;height:auto;z-index:1;animation:drive 3.4s linear infinite}
  @keyframes drive{to{left:100%}}
  /* A wait with company: a taller road, someone at the end of it, and the car
     driving up to her before it starts over. She stands on the floor line. */
  .wait.co .road{height:132px}
  .wait-pal{position:absolute;right:28px;bottom:17px;height:104px;width:auto;z-index:1}
  .wait.co .car{animation:driveTo 4.4s linear infinite}
  @keyframes driveTo{0%{left:-100px;opacity:0}8%{opacity:1}86%{left:calc(100% - 172px);opacity:1}100%{left:calc(100% - 172px);opacity:0}}
  /* The two poster characters, standing over an empty view. */
  .empty-art{display:block;height:150px;width:auto;margin:0 auto 12px}
  @media(prefers-reduced-motion:reduce){.road .car,.wait.co .car{animation:none;opacity:1;left:calc(50% - 36px)}}   /* parked, not off-stage */
  .prog{height:8px;background:var(--panel2);border:1.5px solid var(--line);border-radius:5px;overflow:hidden;margin-top:8px}
  .prog i{display:block;height:100%;background:var(--go);transition:width .3s}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* The clean direction. One thin even line on everything, plain cards with a
     solid status edge, and exactly two hard offset shadows in the whole app:
     the selected job and the sign-in card. Written as one block after the
     rules it changes, so the older reasoning above still reads in order. */
  /* The page had the browser's own 8px margin and canvas colour until the
     rail needed a true left edge to sit on. */
  body{margin:0;background:var(--ink)}
  button{border-width:1.5px;border-color:var(--line);border-radius:8px;font-weight:600;background:var(--panel)}
  button:hover:not(:disabled){border-color:var(--text);color:var(--text);transform:none;background:var(--panel2)}
  .btn-go,.btn-go:hover:not(:disabled){background:var(--go);color:var(--on-go);border-color:var(--go);box-shadow:none}
  .btn-due,.btn-due:hover:not(:disabled){border-color:var(--due)}
  select,input[type=text],textarea{border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}
  .segs{border:1.5px solid var(--line);border-radius:8px}
  .seg,.seg:hover:not(:disabled){border:0;background:transparent}
  .seg.on,.seg.on:hover:not(:disabled){background:var(--text);color:var(--ink)}
  .tabs{border-bottom:1.5px solid var(--hair)}
  .tab.on{color:var(--text);border-bottom:3px solid var(--text);font-weight:650}
  .rowmenu>summary{border:1.5px solid var(--line);color:var(--text);background:var(--panel)}
  .rowmenu-pop{border:1.5px solid var(--line)}
  /* Headings: black type over a short straight stroke in the section's colour. */
  .qsec-h{border-bottom:0;padding-bottom:10px}
  .qsec-h h3{font-size:15px;font-weight:700;padding-bottom:4px;border-bottom:3px solid var(--text)}
  .qsec.go h3,.qsec.due h3,.qsec.closing h3,.qsec.awaiting h3{color:var(--text)}
  .qsec.go .qsec-h h3{border-bottom-color:var(--go)} .qsec.due .qsec-h h3{border-bottom-color:var(--due)}
  .qsec.closing .qsec-h h3{border-bottom-color:var(--closing)} .qsec.awaiting .qsec-h h3{border-bottom-color:var(--awaiting)}
  /* Rows: a card each. The facts sit under the title at every width now, so
     the row is the same shape whether or not the rail and the pane are open. */
  .qitem{border-bottom:0;margin-top:8px}
  .qrow{border:1.5px solid var(--line);border-radius:10px;background:var(--panel);
    grid-template-columns:5px 38px minmax(0,1fr) auto;transition:padding .16s ease,box-shadow .16s ease}
  .qbar{grid-row:1 / span 2;border-radius:3px}
  .qfacts{display:flex;gap:26px;grid-column:3;grid-row:2;margin-top:8px}
  .qacts{grid-column:4;grid-row:1 / span 2}
  .qt{font-weight:650}
  @media(hover:hover){.qitem .qrow:hover{transform:none;box-shadow:var(--shadow-md);background:var(--panel)}}
  /* The selected row, blown up to its name and its one button. Everything else
     about it is in the pane beside it, so the row stops repeating it. */
  .qitem.sel .qrow{grid-template-columns:6px minmax(0,1fr) auto;align-items:center;gap:0 20px;
    padding:26px 24px 26px 14px;border-width:2px;border-color:var(--text);box-shadow:5px 5px 0 var(--hard);
    background:var(--panel);transform:none}
  .qitem.sel .qbar{grid-row:auto;align-self:stretch;min-height:56px;box-shadow:none}
  .qitem.sel .qrank,.qitem.sel .qfacts{display:none}
  /* Company and place stay: they are what you compare rows by, and the list
     lost them the moment you picked one. The numbers are still in the pane. */
  .qitem.sel .qs{font-size:14px;margin-top:6px}
  .qitem.sel .qt{font-size:25px;line-height:1.15;font-weight:750;letter-spacing:-.02em;white-space:normal}
  .qitem.sel .qacts{grid-column:auto;grid-row:auto}
  .qitem.sel .qacts>*:not(.act-primary){display:none}
  .qitem.sel .qacts button,.pane-pri button{font-size:16px;padding:12px 22px;border-radius:10px}
  .next,.next.calm,.next.warn{border:1.5px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:none}
  .next .nh{font-size:16px;font-weight:700}
  .fold{border-width:1.5px;border-radius:10px;background:var(--panel)}
  .pane{top:0;max-height:100vh;border-left:1.5px solid var(--line)}
  .qd-rail{border:1.5px solid var(--hair);border-radius:10px;background:var(--ink)}
  .side{border-right:1.5px solid var(--line)}
  .palbox{border:1.5px solid var(--line)}
  .task{border:1.5px solid var(--line);border-left:5px solid var(--go)}

  /* The rail. Everything the top bar held, down the left edge: icons at 68px,
     icons and words at 296px. Every control keeps the id it had in the bar,
     because the command palette dispatches by clicking them. */
  .rail{position:fixed;left:0;top:0;bottom:0;width:76px;z-index:12;background:var(--panel);
    border-right:1.5px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:12px 10px;
    overflow:hidden auto;scrollbar-width:none;font-family:var(--disp);transition:width .18s ease}
  .rail .r-it,.rail .r-it:hover:not(:disabled){display:flex;align-items:center;gap:12px;padding:4px 2px;min-height:48px;
    flex:0 0 auto;width:100%;border:0;border-radius:0;background:none;color:var(--text);text-align:left;
    white-space:nowrap;position:relative;font-weight:400}
  .rail .r-it[hidden]{display:none}
  .r-ic{flex:0 0 42px;width:42px;height:42px;display:grid;place-items:center;position:relative;color:var(--text);
    border:1.5px solid var(--line);border-radius:11px;background:var(--panel)}
  button.r-it:hover .r-ic,.r-dir:hover .r-ic{background:var(--panel2);border-color:var(--text)}
  .r-it.primary .r-ic,button.r-it.primary:hover .r-ic{background:var(--go);border-color:var(--go);color:var(--on-go)}
  /* Neutral on purpose: an accent here would be an instruction about nothing. */
  .r-ic.r-av{background:var(--panel2);border-radius:50%;font:700 13px var(--mono)}
  .r-ic.r-jt{background:var(--brand);border-color:var(--brand);color:var(--panel);font:800 14px var(--disp);letter-spacing:-.02em}
  .r-lb{font-size:13.5px;font-weight:650;line-height:1.25;display:none;min-width:0}
  .r-lb small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
  .r-bd{position:absolute;right:-8px;top:-8px;min-width:19px;height:19px;border-radius:10px;border:1.5px solid var(--panel);
    font:700 10px var(--mono);display:grid;place-items:center;padding:0 4px;background:var(--text);color:var(--ink)}
  .r-bd.go{background:var(--go);color:var(--on-go)} .r-bd.due{background:var(--due);color:var(--on-due)}
  .r-bd.closing{background:var(--closing)} .r-bd.awaiting{background:var(--awaiting)}
  .r-sep{flex:0 0 1.5px;background:var(--hair);margin:6px 4px}
  /* Direction, closed: the picker lies invisibly over its icon, so one click
     on the compass opens the native list. Open, it is an ordinary select. */
  .r-dir select.trkbar{position:absolute;left:2px;top:4px;width:42px;height:42px;opacity:0;cursor:pointer;max-width:none}
  .rail.open .r-dir select.trkbar{position:static;opacity:1;width:auto;height:auto;flex:1 1 0;min-width:0}
  /* The three of them and the car, on a light tile in both themes: they are
     drawn in ink, so the page under them stays paper even at night. */
  .r-foot{display:none;margin-top:auto;position:relative;flex:0 0 146px;margin-inline:-10px;margin-bottom:-12px;
    background:var(--tile);border-top:1.5px solid var(--line)}
  .r-foot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20px;
    background:repeating-linear-gradient(180deg,transparent 0 4px,var(--gnd) 4px 5.5px)}
  .r-cast{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:250px;height:auto;z-index:1}
  .r-grab{display:none}
  .rail.open{width:296px}
  .rail.open .r-lb{display:block;white-space:normal}
  .rail.open .r-foot{display:block}
  /* On a short screen the list already fills the rail; a cut-off drawing looks broken. */
  @media(max-height:800px) and (min-width:901px){ .rail.open .r-foot{display:none} }
  #syncInfo{margin:0 22px}
  .rail ~ .wrap{margin-left:76px;transition:margin-left .18s ease}
  .rail ~ #syncInfo{margin-left:98px}
  /* Closed, each icon carries a short word under it: icons alone were read as
     buttons of unknown meaning (feedback #14). */
  .rail:not(.open) .r-it,.rail:not(.open) .r-it:hover:not(:disabled){flex-direction:column;justify-content:center;gap:3px;min-height:62px;padding:2px 0}
  .rail:not(.open) .r-lb{display:block;font-size:10.5px;font-weight:600;line-height:1.1;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;text-align:center;color:var(--muted)}
  .rail:not(.open){padding-inline:5px}
  .rail.open .r-dir .r-lb{display:none}   /* open, the select names itself */
  .rail:not(.open) .r-lb small{display:none}
  .rail:not(.open) .r-view.on .r-lb{color:var(--text)}
  .rail:not(.open) .r-dir select.trkbar{left:0;top:0;width:100%;height:100%}
  /* The More group: in the page always (the command list clicks these ids),
     shown only when asked for. Beats the phone sheet's show-everything rule. */
  .rail:not(.more) .r-it.r-more{display:none !important}
  /* Open, the rail pushes the workspace across instead of covering it, at
     every width where it is a column. It used to push only from 1200px, so on
     most laptops it covered the queue instead. Below 1200 the decision pane is
     a sheet over the page, so there is still room for the queue beside it. */
  .rail.open ~ .wrap{margin-left:296px}
  .rail.open ~ #syncInfo{margin-left:318px}
  @media(prefers-reduced-motion:reduce){ .rail,.rail ~ .wrap{transition:none} }

  /* A job open on a small screen: the sheet leads with the name and the one
     button, the same two things the blown-up row keeps on a wide one. */
  .pane-pri{display:none}
  @media(max-width:1199px){
    .pane-pri{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;
      margin:2px 0 14px;padding-bottom:14px;border-bottom:1.5px solid var(--hair)}
    .pane-pri .t{font-size:22px;line-height:1.15;font-weight:750;letter-spacing:-.02em;flex:1 1 180px}
    .pane{border-left:0;border-top:1.5px solid var(--line)}
  }
  /* Phone: the rail is a strip along the bottom, under the thumb, and pulls up
     into a sheet -- by its handle, or by a swipe. */
  @media(max-width:900px){
    .rail{left:0;right:0;top:auto;bottom:0;width:auto;height:calc(104px + env(safe-area-inset-bottom));flex-direction:row;
      align-items:flex-start;justify-content:space-around;border-right:0;border-top:1.5px solid var(--line);
      border-radius:18px 18px 0 0;padding:24px 12px 0;gap:4px;z-index:44;transition:none;overflow:hidden}
    .r-grab,.rail .r-grab:hover:not(:disabled){display:block;position:absolute;left:0;right:0;top:0;height:22px;
      min-height:0;padding:0;border:0;border-radius:0;background:none}
    .r-grab::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:46px;height:5px;
      border-radius:3px;background:var(--dim)}
    .r-sep,.rail .r-it.r-x2{display:none}
    .rail .r-it,.rail .r-it:hover:not(:disabled){padding:0;min-height:0;width:auto}
    .r-ic{flex-basis:46px;width:46px;height:46px}
    .rail.open{width:auto;height:auto;max-height:88vh;flex-direction:column;align-items:stretch;justify-content:flex-start;
      gap:0;padding:26px 14px 0;overflow:hidden auto}
    .rail.open .r-it,.rail.open .r-it.r-x2,.rail.open .r-it:hover:not(:disabled){display:flex;padding:2px 3px;min-height:46px;width:100%}
    .rail.open .r-it[hidden]{display:none}
    .rail.open .r-ic{flex-basis:38px;width:38px;height:38px}
    .rail.open .r-sep{display:block;margin:3px 6px}
    .rail.open .r-foot{flex-basis:136px;margin-inline:-14px;margin-bottom:0}
    .r-dir select.trkbar{width:38px;height:38px}
    .rail ~ .wrap,.rail ~ #syncInfo{margin-left:0}
    .rail.open ~ #scrim{display:block}
    .main{padding-bottom:140px}
    .rail:not(.open) .r-it,.rail:not(.open) .r-it:hover:not(:disabled){flex:1 1 0;min-width:0;padding:0}
    #fb{bottom:calc(120px + env(safe-area-inset-bottom))}
    #app:has(.rail.open) #fb{display:none}
    .qrow{grid-template-columns:5px 32px minmax(0,1fr)} .qbar{grid-row:1 / span 3}
    .qfacts{grid-column:3} .qacts{grid-column:3;grid-row:3;justify-content:flex-start;margin-top:10px}
    .qitem.sel .qrow{grid-template-columns:6px minmax(0,1fr);padding:20px 16px 20px 12px}
    .qitem.sel .qacts{margin-top:12px}
    .qitem.sel .qt{font-size:21px}
    /* A carousel, not a thread: one job at a time, swiped sideways, with the
       next one showing at the edge so it is plain there is more. Sections stay
       stacked, so the colour law still reads top to bottom. Native scroll-snap,
       no script; the cards in a section share the tallest one's height. */
    .qcar{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
      margin:0 -22px;padding:4px 22px 12px;scroll-padding-inline:22px;scrollbar-width:none}
    .qcar::-webkit-scrollbar{display:none}
    .qcar>.qitem{flex:0 0 86%;scroll-snap-align:start;margin-top:0;display:flex}
    .qcar>.qitem:only-child{flex-basis:100%}
    .qcar>.qitem>.qrow{flex:1}
    /* The deck replaces the bands on a phone; the folds and Saved stay. */
    .bands{display:none}
    .deck{display:grid;gap:14px;margin:4px 0 28px}
    .deck-meta{display:flex;align-items:center;justify-content:space-between;min-height:30px;
      font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
    .deck-stack{display:grid}
    .dcard{grid-area:1/1;position:relative;display:grid;gap:10px;align-content:start;min-height:290px;
      background:var(--panel);border:1.5px solid var(--line);border-left:6px solid var(--closed);border-radius:16px;
      padding:20px 20px 18px;touch-action:pan-y;user-select:none;-webkit-user-select:none;
      transition:transform .2s cubic-bezier(.16,1,.3,1)}
    .dcard.go{border-left-color:var(--go)} .dcard.due{border-left-color:var(--due)}
    .dcard.closing{border-left-color:var(--closing)} .dcard.awaiting{border-left-color:var(--awaiting)}
    .dcard:not(.top){transform:translateY(12px) scale(.95);opacity:.65}

    .dc-band{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
