/* ═══ shared bits ═══ */
function modal(html){
  const d=document.createElement('div'); d.className='modal';
  d.innerHTML=`<div class="box">${html}</div>`;
  d.addEventListener('click',e=>{ if(e.target===d) d.remove(); });
  document.body.appendChild(d); return d;
}
function hookDrop(dropEl,inputEl,handler){
  if(!dropEl) return;
  dropEl.onclick=()=>inputEl.click();
  inputEl.onchange=e=>{ const f=e.target.files[0]; if(f) readFile(f,handler); inputEl.value=''; };
  ['dragenter','dragover'].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.remove('over');}));
  dropEl.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) readFile(f,handler); });
}
function readFile(file,cb){ const r=new FileReader(); r.onload=()=>cb(String(r.result),file.name); r.readAsText(file); }

async function onCsv(text){
  const rows=parseCSV(text);
  const info=$('#csvInfo');
  if(rows.length<2){ if(info) info.innerHTML='<span class="err">That file has no rows.</span>'; return; }
  const head=rows[0].map(h=>String(h).trim().toLowerCase()); const idx={};
  head.forEach((h,i)=>idx[h]=i);
  if(idx.title===undefined){ if(info) info.innerHTML='<span class="err">No "title" column. Needs at least title and company.</span>'; return; }
  let list=rows.slice(1).map(r=>{ const j=blank();
    COLS.forEach(c=>{ if(idx[c]!==undefined) j[c]=String(r[idx[c]]==null?'':r[idx[c]]).trim(); });
    if(!j.status) j.status='New'; if(!j.channel) j.channel='posted'; return j; });

  // The starter template ships with placeholder rows. People import it before
  // clearing them, then wonder why the app is recommending 'Example Corp'.
  // Drop them on the way in rather than letting them reach the scorer, which
  // costs a call to conclude what we can tell from the title.
  const isPlaceholder = j => {
    const blob=(j.title+' '+j.company).toLowerCase();
    return /delete me|example corp|example row|example cold target|somewhere you want to work|another company|^your city$/.test(blob);
  };
  const skipped = list.filter(isPlaceholder).length;
  list = list.filter(j=>!isPlaceholder(j));

  const added=addJobs(list);
  await save(); render();
  const i2=$('#csvInfo');
  if(i2){
    if(!list.length && skipped){
      i2.innerHTML='<span class="err">That was the blank template \u2014 only the example rows were in it. Replace them with real jobs, or use Search to pull some in.</span>';
    } else {
      i2.textContent=`${added} added \u00b7 ${list.length-added} already here`
        + (skipped?` \u00b7 ${skipped} example row${skipped>1?'s':''} skipped`:'');
    }
  }
}

ADDRESSED TO: ${cts.length ? cts.map(c=>`${c.name||'(unnamed)'}${c.role?', '+c.role:''}`).join('; ') : 'nobody identified yet \u2014 keep it addressable to any reader'}

${isChase ? `THIS IS A FOLLOW-UP. They were contacted ${daysSilent(j)} days ago and have not replied.
Previous activity, most recent first:
${ev.slice(0,4).map(x=>`- ${x.on} ${x.kind}: ${x.text||''}`).join('\n')||'- no detail logged'}
Write a SHORT nudge: three sentences at most. Do not re-pitch from scratch and do not repeat the original message. Add one new thing \u2014 a relevant piece of work, a recent development at their company, or a sharper version of the offer. Be graceful, never wounded, and make it easy to ignore without awkwardness.` : ''}

CHANNEL: ${chOf(j)==='cold'
 ? 'COLD \u2014 there is NO job posting. This is an unsolicited approach to someone at the company. Do not refer to "the role", "this position", "the opening" or "your posting", because none exists. Open by making them want to reply, and make the ask a conversation, not an application.'
 : 'POSTED \u2014 there is a live job posting, so referring to the role directly is correct.'}

Rules:
- Maximum 5 sentences. A LinkedIn DM or short email, not a cover letter.
- Open with the single most specific concrete thing this person has actually built or run. No "I hope this finds you well", no "I am writing to express interest".
- Lead with whatever is rarest about them relative to other applicants for this role.
- Reference something specific about this company or role.
- End with a low-friction ask: a short call, or an offer to show something they've made. Never "please consider my application".
- Plain language. No buzzwords, no em-dashes, no "passionate about".
- Invent nothing not in the profile above.

Return only the message text.`, 1000);
    d.querySelector('.box').innerHTML=`<div class="eyebrow">Outreach</div>
      <h2 style="margin:6px 0 14px">${esc(j.title)} · ${esc(j.company)}</h2>
      <textarea id="pitchTxt" rows="10">${esc(txt)}</textarea>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn-go btn-sm" id="pitchCopy">Copy</button>
        <button class="btn-sm" id="pitchSave">Save to notes</button>
        <button class="btn-sm" onclick="this.closest('.modal').remove()">Close</button></div>`;
    d.querySelector('#pitchCopy').onclick=()=>{ const t=d.querySelector('#pitchTxt'); t.select();
      navigator.clipboard.writeText(t.value).then(()=>{ d.querySelector('#pitchCopy').textContent='Copied'; },()=>{}); };
    d.querySelector('#pitchSave').onclick=async()=>{
      j.notes=(j.notes?j.notes+' | ':'')+d.querySelector('#pitchTxt').value;
      j.pitch_sent='Drafted'; await save(); render(); d.remove(); };
  }catch(e){
    d.remove();
    if(e.message==='NEEDKEY'){ keyDialog(()=>draftPitch(i)); return; }
    modal(`<div class="eyebrow">Outreach</div><p class="err">Couldn't write it. ${esc(e.message)}</p>
      <button class="btn-sm" onclick="this.closest('.modal').remove()">Close</button>`);
  }
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('button[data-act]'); if(!b) return;
  const i=parseInt(b.dataset.i,10), p=P(), j=p&&p.jobs[i]; if(!j) return;
  const a=b.dataset.act;
  if(a==='open')  return showJob(i);
  if(a==='pitch') return draftPitch(i,false);
  if(a==='chase') return draftPitch(i,true);
  if(a==='note')  return noteDialog(i);
  if(a==='sent'){ setStage(j,'sent'); logEvent(j,'sent',chOf(j)==='cold'?'reached out':'applied'); }
  if(a==='live'){ setStage(j,'live'); logEvent(j,'reply','they replied'); }
  if(a==='close'){ setStage(j,'closed'); logEvent(j,'closed','closed out'); }
  if(a==='reopen'){ setStage(j,'new'); j.follow_up_date=''; logEvent(j,'note','reopened'); }
  await save(); render();
});

function render(){ (VIEW==='app'&&P()) ? renderApp() : renderOnb(); }
load().then(()=>{ if(DB.current&&DB.profiles[DB.current]) VIEW='app'; render(); });
})();
</script>
