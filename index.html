async function findBoardsViaGoogle(names, onStatus){
  const qs=names.slice(0,10).map(n=>
    `"${n}" (site:boards.greenhouse.io OR site:job-boards.greenhouse.io OR site:jobs.lever.co OR site:jobs.ashbyhq.com OR site:apply.workable.com OR site:jobs.smartrecruiters.com OR site:recruitee.com)`);
  if(!qs.length) return {};
  const items=await apifyRun(APIFY_GOOGLE,
    {queries:qs.join("\n"),languageCode:"en",maxPagesPerQuery:1,resultsPerPage:5,mobileResults:false},
    {every:6000,cap:300,onStatus,label:`looking up ${qs.length} careers page${qs.length>1?'s':''}`});
  const map={};
  (items||[]).forEach(item=>{
    const term=((item.searchQuery||{}).term)||"";
    const name=(term.match(/^"([^"]+)"/)||[])[1];
    if(!name || map[name]) return;
    for(const res of (item.organicResults||[])){
      for(const k in ATS){
        const m=String(res.url||"").match(ATS[k].host);
        if(m){ map[name]={platform:k,slug:m[1],exact:true}; return; }
      }
    }
  });
  return map;
}

async function atsPull(platform, slug){
  const cfg=ATS[platform]; if(!cfg) return null;
  let r;
  try{ r=await fetch(cfg.url(slug),{headers:{"Accept":"application/json"}}); }
  catch(e){ throw new Error("network"); }
  if(r.status===404||r.status===400) return null;   // wrong slug or wrong platform
  if(!r.ok) throw new Error(cfg.label+" returned "+r.status);
  let d; try{ d=await r.json(); }catch(e){ return null; }
  const rows=cfg.parse(d,slug)||[];
  if(!rows.length) return null;
  return {platform,slug,label:cfg.label,rows};
}

async function atsSearch(lines, onStatus){
  const found=[], unresolved=[];
  const tryCands=async(cands,label)=>{
    for(const c of cands){
      if(onStatus) onStatus(`checking ${c.slug} on ${ATS[c.platform].label}\u2026`);
      try{
        const res=await atsPull(c.platform,c.slug);
        if(res){ res.name=label||res.slug; return res; }
      }catch(e){
        // Greenhouse/Lever/Ashby are known to allow browser calls, so a block there
        // is a real problem. The newer feeds may simply not allow it: skip those.
        if(e.message==="network" && ['greenhouse','lever','ashby'].includes(c.platform)) throw new Error(
          "The ATS feed was blocked by the browser. This normally works \u2014 try again, or add these by hand.");
      }
    }
    return null;
  };

  // Pass one: URLs resolve immediately; names get their likely slugs tried.
  for(const line of lines){
    const cands=parseAtsTarget(line);
    if(!cands.length){ unresolved.push(line); continue; }
    const hit=await tryCands(cands,line);
    if(hit) found.push(hit); else unresolved.push(line);
  }

  // Pass two: whatever is left, ask Google to locate. This is the step that
  // means nobody has to go hunting for careers URLs by hand.
  const misses=[];
  if(unresolved.length){
    let map={};
    try{ map=await findBoardsViaGoogle(unresolved,onStatus); }catch(e){ map={}; }
    for(const line of unresolved){
      const c=map[line];
      if(!c){ misses.push(line); continue; }
      const hit=await tryCands([c],line);
      if(hit){ hit.viaGoogle=true; found.push(hit); } else misses.push(line);
    }
  }
  return {found,misses};
}

/* Hiring velocity. Posting counts over time say more about whether a cold
   approach will land than any static company attribute: a team adding roles is
   building, a team that stopped is not. Snapshot on every pull so the delta is
   there next time. */
/* One ATS hit becomes job rows. Shared by "pull a company I know" and the
   hiring check inside company suggestions, which differ only in whether a
   velocity note rides along in the row. */
function rowsFromAts(hit, vel){
  return hit.rows.map(x=>{
    const j=blank();
    j.title=x.title||'[No Title]'; j.company=hit.name||hit.slug;
    j.location=x.location||''; j.url=x.url||'';
    j.description=(x.desc||'').slice(0,4000);
    j.source=hit.label; j.query=hit.slug; j.channel='posted'; j.stage='new';
    setPosted(j, x.posted, 'feed');
    j.notes=[x.dept?'Team: '+x.dept:'', x.pay?'Pay: '+x.pay:'', vel||''].filter(Boolean).join(' \u00b7 ');
    return j;
  });
}

async function recordVelocity(slug, count){
  const p=P(); if(!p) return;
  p.velocity = p.velocity || {};
  const hist = p.velocity[slug] || [];
  if(!hist.length || hist[0].on !== today()) hist.unshift({on:today(),count});
  else hist[0].count = count;
  p.velocity[slug] = hist.slice(0,12);
}
function velocityNote(slug){
  const p=P(); const h=(p&&p.velocity&&p.velocity[slug])||[];
  if(h.length<2) return "";
  const d=h[0].count-h[1].count;
  if(d>0) return `+${d} since ${h[1].on} \u2014 they're building`;
  if(d<0) return `${d} since ${h[1].on}`;
  return `flat since ${h[1].on}`;
}

/* ═══ Apify: board search via Google ═══
   The only way jobs are searched here. Every portal and every registry is
   reached identically — one Google site: query each, through one actor — which
   is the reason there is no per-portal scraper to maintain or to pay for.

   That uniformity is what makes covering everything affordable, and covering
   everything is the point: no single portal is enough. LinkedIn is one pipe and
   for most careers the wrong one — academic posts live on registries like
   linguistlist.org and academicjobsonline.org and are essentially never on
   LinkedIn; startup roles cluster on YC and Ashby; every field has its own. So
   the big portals go in as a fixed baseline, the profile supplies the
   registries its own field uses, and both are searched in the same run.

   Same actor, same polling shape as the Python backfill. The only difference is
   what we do with the results: each organic hit becomes a new row instead of
   patching an existing one. */
const APIFY_GOOGLE = "apify~google-search-scraper";

/* One query per board, with the titles OR'd inside it, rather than one query
   per board-and-title pair. Apify bills a Google page per query, so the old
   8x4 fan-out cost four times this for slots that were mostly empty anyway —
   a niche board and an exact title rarely fill ten results between them, and
   the four titles are near-synonyms competing for the same postings. If a
   large board starts to feel under-read, maxPagesPerQuery in apifyBoardSearch
   is the dial, and a second page is cheaper than splitting the query back up
   because it does not pay for another run. */
/* The general portals, always searched. This is where most advertised work
   actually sits, and one site: query reaches each of them — which is the whole
   reason a dedicated scraper per portal was never worth paying for.
   linkedin.com/jobs rather than the bare domain: linkedin.com drags in profiles
   and posts, and a job search should come back with jobs. */
const PORTALS = ["linkedin.com/jobs","upwork.com","indeed.com","glassdoor.com",
                 "wellfound.com","ziprecruiter.com"];
/* Which of those a track actually queries, by the shape of work it is after.
   Every portal carries every kind of work in theory; in practice Upwork has no
   salaried posts and ZipRecruiter has no project briefs, so querying the wrong
   one spends a Google query to return nothing usable AND takes one of the
   fourteen slots the right boards were sharing. The cost is the smaller half:
   a freelancer reading salaried listings is the part that wastes their day.

   `mode` belongs to the TRACK, not the person. Someone with a day job and a
   side practice has one track of each, and each searches its own list -- which
   is why this is not a property of the profile. A track with no mode (every
   profile extracted before this existed) gets the full list, i.e. exactly the
   old behaviour. */
const PORTALS_BY_MODE = {
  permanent: ["linkedin.com/jobs","indeed.com","glassdoor.com","wellfound.com","ziprecruiter.com"],
  freelance: ["upwork.com","linkedin.com/jobs","wellfound.com"],
  gig:       ["indeed.com","ziprecruiter.com"],
};
const portalsFor = m => PORTALS_BY_MODE[m] || PORTALS;

/* Routes.
   How people actually get a kind of work (2026-10-24). Salaried, freelance and
   gig describe the contract, not how anybody finds the work: a chef has no
   job board, a reporter is hired through editors who know their work. So each
   direction carries a MIX of routes, read off the CV when the direction is
   made, and the person can change it. A direction with no mix (made before
   this) is all "advertised", which is exactly what the app did before.
   Recruiters and headhunters count as "people". `mode` stays underneath: the
   server still routes its scrapers by it, and it only ever mattered to the
   advertised route. */
const ROUTES = [
  ['advertised','Advertised','postings on boards and careers pages'],
  ['people','Through people','someone vouches for you: editors, alumni, recruiters'],
  ['pitch','Pitching','you propose the work to an outlet or client'],
  ['local','Local, walk-in','you turn up, do a trial, word of mouth'],
  ['deadline','Deadlines and exams','a yearly cycle with a closing date'],
  ['platform','Platforms','the work comes to your profile'],
];
/* Every sentence the person reads about themselves is written TO them. The
   CV read once called a reporter "He" -- a guess from a name, which misgenders
   whoever it gets wrong, so the rule goes into every prompt that writes about
   the person (2026-10-24). */
const YOU_RULE = 'Write every sentence about the person TO them, as "you" ("you have five years on this beat"). Never "he", "she", "they" or their name: their gender is not in the profile and must not be guessed.';
const ROUTE_LABEL = Object.fromEntries(ROUTES.map(([k,l])=>[k,l]));
const ROUTES_JSON = '{'+ROUTES.map(([k])=>`"${k}":0.0`).join(',')+'}';
const ROUTES_RULES = `Rules for routes: how people ACTUALLY get this kind of work, as weights that add up to 1.
- "advertised": the work is posted on job boards or careers pages and people apply.
- "people": hired through who vouches for you -- editors, former colleagues, alumni, recruiters and headhunters.
- "pitch": you propose the work yourself to an outlet or client (freelance reporting, writing, design, consulting).
- "local": you turn up, do a trial shift, or hear by word of mouth (chefs, hospitality, retail, trades).
- "deadline": a yearly cycle with a closing date (government and bank exams, fellowships, grants, campus intakes).
- "platform": the work comes to a profile on a marketplace or platform (creators' brand deals, Upwork).
Judge the field in the person's country, not in general: software is mostly advertised; a political reporter in India is mostly people and pitch; a chef is mostly local and people. Never give "advertised" weight a field does not have.
"how_hired": one plain sentence, max 18 words, on how people really get this work there.`;
function normRoutes(r){
  const o={}; let sum=0;
  ROUTES.forEach(([k])=>{ const v=Number(r&&r[k]); if(Number.isFinite(v)&&v>0){ o[k]=v; sum+=v; } });
  if(!sum) return null;
  Object.keys(o).forEach(k=>o[k]=Math.round(o[k]/sum*100)/100);
  return o;
}
const routesOf = t => (t && t.routes) || { advertised:1 };
/* "Through people 40 · Pitching 40 · Deadlines 15": the routes worth naming, largest first. */
const routeLine = t => Object.entries(routesOf(t)).filter(([,v])=>v>=0.1).sort((a,b)=>b[1]-a[1])
  .map(([k,v])=>`${ROUTE_LABEL[k]} ${Math.round(v*100)}%`).join(' · ');
function fixRoutes(t){ const r=normRoutes(t.routes); if(r) t.routes=r; else delete t.routes; t.how_hired=String(t.how_hired||'').slice(0,200); return t; }

/* Directions made before routes existed get theirs once, in one cheap call per
   profile, on the next open. Until it answers they count as all advertised. */
let ROUTES_ASKED=false;
async function backfillRoutes(){
  const p=P(); if(!p || ROUTES_ASKED || !cloudNow()) return;
  ROUTES_ASKED=true;                  // once a session, answered or not
  const need=(p.profile.tracks||[]).filter(t=>!t.routes);
  if(!need.length) return;
  try{
    const txt=await claude(`A person based in ${p.profile.location||'an unstated place'}${p.profile.country?', '+p.profile.country:''} is pursuing these kinds of work:
${need.map(t=>`- id "${t.id}": ${t.label||''}${(t.titles||[]).length?` (titles: ${t.titles.slice(0,5).join(', ')})`:''}`).join('\n')}

Return ONLY a JSON object, no preamble, no markdown fences, keyed by id:
{"<id>":{"routes":${ROUTES_JSON},"how_hired":""}}

${ROUTES_RULES}`, TOK_CAP, 'flash');
    const d=grabJSON(txt)||{};
    let n=0;
    need.forEach(t=>{ const r=d[t.id]; if(!r) return; t.routes=r.routes; t.how_hired=r.how_hired; fixRoutes(t); if(t.routes) n++; });
    if(n){ track('routes_backfill',{ n }); save(); render(); }
  }catch(e){ console.warn('routes not filled in:', e.message); }
}

/* Change a direction's mix by hand: one slider per route, saved as weights. */
function routesDialog(t){
  if(!t) return;

  const d=modal(`<div class="eyebrow">${esc(t.label||'This direction')}</div>

    ${ROUTES.map(([k,l,sub])=>`<label class="lab" style="margin-top:10px">${esc(l)} <span style="color:var(--dim)">&mdash; ${esc(sub)}</span></label>
      <input type="range" min="0" max="100" step="5" value="${Math.round((r[k]||0)*100)}" data-route="${k}" style="width:100%">`).join('')}
    <div class="btn-row" style="margin-top:16px">

      <button class="btn-sm" onclick="this.closest('.modal').remove()">Cancel</button></div>`);
  d.querySelector('#rtSave').onclick=()=>{

/* Fourteen: the six portals above plus eight of the track's own registries. The
   specialist boards are what make a niche search work at all, so they are added
   to the portals rather than made to compete with them for slots. */
function buildBoardQueries(titles, boards, where){
  const ts=(titles||[]).slice(0,4).map(t=>`"${t}"`);
  if(!ts.length) return [];
  const any=ts.length>1 ? `(${ts.join(' OR ')})` : ts[0];
  /* Location narrows the portals, and only the portals. A portal carries every
     job on earth and is useless until cut down; a field registry carries forty
     and needs all of them, so a city term there removes more than it filters.
     "OR remote" because a remote posting names the employer's city or no city
     at all -- never the reader's, so requiring the city bare would drop the
     lot of them. */
  const place=String(where||'').trim();
  /* A multi-word place has to be quoted, or Google binds the OR to the last
     word alone: `Bangalore, India OR remote` asks for Bangalore AND (India OR
     remote), which requires the city and so excludes exactly the remote roles
     the OR is there to keep. Left alone if they have written an expression of
     their own -- quoting `Berlin OR Munich` would turn it into a phrase that
     matches nothing, and silent-empty is the worst failure this can have. */
  const term = /[\s,]/.test(place) && !/"|\bOR\b|\(/.test(place) ? `"${place}"` : place;
  const near = !place ? '' : /^remote$/i.test(place) ? ' remote' : ` (${term} OR remote)`;
  return (boards||[]).slice(0,14).map(b=>`site:${b} ${any}` + (PORTALS.includes(b)?near:''));
}

/* runId: poll a run the server started instead of starting one here. */
async function apifyBoardSearch(queries, countryCode, onStatus, runId){
  // Schema confirmed against apify.com/apify/google-search-scraper:
  // queries is a newline-separated STRING, not an array.
  const items=await apifyRun(APIFY_GOOGLE,
    {queries:queries.join("\n"),countryCode:countryCode||"",languageCode:"en",
     maxPagesPerQuery:1,resultsPerPage:10,mobileResults:false},
    {every:6000,cap:600,onStatus,runId,label:`searching ${queries.length} board queries`});

  const out=[];
  (items||[]).forEach(item=>{
    const term=((item.searchQuery||{}).term)||"";
    (item.organicResults||[]).forEach(res=>{
      const u=String(res.url||"");
      if(!u) return;
      const j=blank();
      // Google's title is usually "Job Title - Employer - Board". Take the first
      // segment as the title and the second as the employer when it looks right;
      // the scorer sees the full snippet either way, so a bad split is survivable.
      const raw=String(res.title||"").trim();
      const bits=raw.split(/\s+[\u2013\u2014|-]\s+/);
      j.title = (bits[0]||raw).slice(0,180) || "[No Title]";
      j.company = (bits.length>1 ? bits[1] : "").slice(0,120) || "[from search — verify]";
      j.url = u;
      j.description = String(res.description||"").slice(0,900);
      // Google prefixes a lot of job snippets with "5 days ago \u2014 ..." or a
      // plain date. It is free and more reliable than anything inferred from
      // the posting's own prose, so it is worth reading before the model is.
      setPosted(j, String(res.description||"").slice(0,40), 'page');
      j.source = "Board search"; j.query = term; j.origin = "google"; j.status="New"; j.channel="posted";
      j.notes = "Found via "+ (u.replace(/^https?:\/\//,'').split('/')[0]);
      out.push(j);
    });
  });
  return out;
}

/* ═══ Apify: HR / recruiter contact finder (LinkedIn) ═══
   A company's own "about" page turns out to be a weak signal — most don't name
   HR at all. LinkedIn does, publicly: recruiters and department heads write who
   they are in their headline, and Google has all of it indexed.

   So this asks Google directly for the people, rather than paying an employee
   scraper to hand back the whole company. That is not a small difference. Such
   an actor bills per profile and defaults to fifty of them, and — without a
   LinkedIn cookie — is running Google underneath anyway: fifty strangers at
   ~$0.005 each, to keep the handful whose title mentions hiring. A site: query
   against linkedin.com/in asks for that handful in the first place, and one
   page of Google results costs about the price of half a profile.

   That is the whole reason there is no second path here. One did exist, as a
   fallback for when search came back thin, and it was deleted: a threshold
   nobody had measured decided when to start spending per profile, and a
   company Google has not indexed is usually one whose staff are not findable
   at any price. When search finds nobody, this says so and asks for a name.

   Three queries go out in one run — recruiting side, hiring side, and the
   company's own domain — because Apify charges per run as well as per page,
   and results are told apart afterwards by the shape of their URL.

   LinkedIn never publishes email addresses, scraped or otherwise, so this does
   NOT claim to find one. It reads the company's own domain out of the same
   search and guesses the ordinary firstname.lastname pattern from it — clearly
   labelled as a guess, everywhere it's shown, never presented as confirmed. */
/* A roster is a fact about a company, not about a job. Two roles at the same
   employer — which is the common case, companies post in batches — should cost
   one lookup, and a week is well inside how fast a recruiting desk changes. */
const HR_CACHE_DAYS  = 7;
const NOT_COMPANY_SITE = /linkedin\.com|indeed\.com|glassdoor\.com|wellfound\.com|angel\.co|crunchbase\.com|facebook\.com|twitter\.com|x\.com|instagram\.com|ycombinator\.com|builtin\.com|monster\.com|ziprecruiter\.com|ambitionbox\.com|ridewheel\.com/i;
/* Two ways a person is worth talking to. The first is the recruiting side —
   they own the process. The second is the hiring side: whoever runs the team
   the role sits in, matched by pairing a leadership word with a word from the
   job you're actually chasing, so a "Head of Data" surfaces for a data role
   and stays out of the way for a design one. */
const TITLE_NOISE = /^(a|an|the|and|or|of|for|at|in|to|with|senior|junior|staff|principal|lead|head|chief|vp|vice|president|director|manager|associate|assistant|i|ii|iii|jr|sr|remote|hybrid|onsite|full|part|time|contract|intern)$/i;

/* Words from the role being chased, used to decide whether a department head
   is relevant. Deliberately crude — a shared noun like "data" or "design" is
   a good enough signal, and anything cleverer starts inventing relevance. */
function roleWords(ctx){
  const src=[(ctx&&ctx.title)||'', ...(((ctx&&ctx.titles)||[]).slice(0,6))].join(' ');
  const out=new Set();
  String(src).toLowerCase().split(/[^a-z+#]+/).forEach(w=>{
    if(w.length>=3 && !TITLE_NOISE.test(w)) out.add(w);
  });
  return Array.from(out);
}

async function googleFirst(query, onStatus, statusLabel){
  return apifyRun(APIFY_GOOGLE,
    {queries:query,languageCode:"en",maxPagesPerQuery:1,resultsPerPage:8,mobileResults:false},
    {every:4000,cap:180,onStatus,label:statusLabel});
}

/* Google titles a LinkedIn profile "Name - Headline - Company | LinkedIn",
   which is exactly the three fields a roster needs. Activity pages ("Jane on
   LinkedIn: ...") share the domain but are not people, so they go. */
function peopleFromSerp(results, company){
  const out=[], seen={};
  const cmp=String(company||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  (results||[]).forEach(res=>{
    const u=String(res.url||'');
    if(!/linkedin\.com\/in\//i.test(u)) return;
    const raw=String(res.title||'').trim();
    if(/\bon linkedin\s*:/i.test(raw)) return;
    const clean=raw.replace(/\s*[|\u2013\u2014-]\s*linkedin\s*$/i,'').trim();
    const bits=clean.split(/\s+[\u2013\u2014|-]\s+/);
    const name=(bits[0]||'').trim();
    // A headline long enough to be a sentence is a name Google mangled.
    if(!name || name.length>60 || !/[a-z]/i.test(name)) return;
    const key=u.split(/[?#]/)[0].toLowerCase();
    if(seen[key]) return; seen[key]=1;
    // "Name - Headline - Company" is the usual shape, and repeating the
    // employer back at someone reading a list of that employer's staff is
    // noise — in the panel and in the prompt alike.
    const rest=bits.slice(1);
    if(rest.length && cmp && rest[rest.length-1].toLowerCase().replace(/[^a-z0-9]/g,'')===cmp) rest.pop();
    const role=rest.join(' \u2014 ').trim() || String(res.description||'');
    out.push({ name, role:String(role).slice(0,140), linkedin:key });
  });
  return out;
}

/* The company's own site, out of the same batch of results. */
function domainFromSerp(results){
  for(const res of (results||[])){
    try{
      const host=new URL(res.url).hostname.replace(/^www\./,'');
      if(host && !NOT_COMPANY_SITE.test(host)) return host;
    }catch(e){}
  }
  return null;
}

/* Recruiting side and hiring side asked for separately, because one OR-chain
   long enough to cover both stops matching anything useful. The third query is
   the domain, riding along free of a second run start. */
function hrQueries(company, ctx){
  const c=String(company||'').replace(/"/g,'').trim();
  const words=roleWords(ctx).slice(0,4);
  const qs=[`site:linkedin.com/in "${c}" (recruiter OR "talent acquisition" OR "people operations" OR "head of people" OR "hiring manager")`];
  if(words.length)
    qs.push(`site:linkedin.com/in "${c}" (${words.map(w=>`"${w}"`).join(' OR ')}) (head OR director OR VP OR lead OR manager)`);
  qs.push(`"${c}" official website`);
  return qs;
}

/* ── roster cache ── */
const hrCacheKey = c => 'triage:hr:'+String(c||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,60);
async function cachedRoster(company){
  try{
    const v=await get(hrCacheKey(company)); if(!v) return null;
    const d=JSON.parse(v);
    if(!d || !d.at || !(d.roster||[]).length) return null;
    if(Date.now()-d.at > HR_CACHE_DAYS*864e5) return null;
    return d;
  }catch(e){ return null; }
}
async function storeRoster(company, roster, domain){
  try{ await put(hrCacheKey(company),
    JSON.stringify({at:Date.now(), roster:(roster||[]).slice(0,60), domain:domain||''})); }catch(e){}
}

function guessEmail(name, domain){
  const parts=String(name||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z\s]/g,'').trim().split(/\s+/).filter(Boolean);
  if(parts.length<2 || !domain) return '';
  return `${parts[0]}.${parts[parts.length-1]}@${domain}`;
}

async function findHrContacts(company, ctx, onStatus){
  if(!ownApify() && !cloudNow()) throw new Error("NEEDAPIFY");

  let roster=null, domain='';
  const hit=await cachedRoster(company);
  if(hit){
    roster=hit.roster; domain=hit.domain||'';
    if(onStatus) onStatus(`reusing the ${roster.length} profiles already found at ${company}…`);
  }

  /* Mantiks first. It knows who owns the req; the Google path below guesses at
     profiles and then pays a model to rank the guesses. A miss is silent and
     free -- the action refunds its own credits -- so this is strictly an
     attempt, and anything it cannot answer falls through unchanged. */
  if(!roster && cloudNow()){
    try{
      const m=await hosted('mantiks_contact',{company, website:domain, title:(ctx&&ctx.title)||''});
      if(m && m.person && m.person.name){
        roster=[{name:m.person.name, role:m.person.role||'', linkedin:m.person.linkedin||'', why:m.person.why||''}];
        domain=domain||m.domain||'';
        if(onStatus) onStatus(`found ${m.person.name} at ${company}…`);
        await storeRoster(company, roster, domain);
      }
    }catch(e){ /* MANTIKS_MISS, key unset, or down: the Google roster below is the answer */ }
  }

  if(!roster){
    if(onStatus) onStatus(`searching for who to contact at ${company}…`);
    const items=await googleFirst(hrQueries(company,ctx).join("\n"), onStatus,
                                  `searching for people at ${company}`);
    // One run, three queries, one pile of results: a profile URL is a person, a
    // company URL is the domain, and nothing needs the query it came from.
    const flat=[];
    (items||[]).forEach(it=>flat.push(...(it.organicResults||[])));
    roster=peopleFromSerp(flat, company);
    domain=domainFromSerp(flat)||'';

    if(!roster.length) throw new Error(`Couldn't find anyone public at ${company} to contact. Try adding someone by hand.`);
    await storeRoster(company, roster, domain);
  }

  // The model reads the roster. An empty answer from it is an answer — "nobody
  // here" is a real finding, which is why there is no keyword sweep second-
  // guessing it and putting back the false positives it was brought in to remove.
  if(onStatus) onStatus(`reading ${roster.length} profiles for who is worth contacting…`);
  let people=[];
  try{ people=await pickPeople(roster, company, ctx); }
  catch(e){
    // The roster has already been found and paid for, but nothing has judged
    // it. Say that plainly, rather than falling through to the "none of them
    // looked right" throw below, which would claim the model looked and didn't.
    throw new Error(`Read ${roster.length} public profile${roster.length===1?'':'s'} at ${company}, but the model didn't run, so none of them have been judged: `
      + (e.message==='NEEDKEY' ? 'no API key is set for scoring.' : e.message));
  }

  if(!people.length) throw new Error(`Read ${roster.length} public profile${roster.length===1?'':'s'} at ${company} — none of them looked like the right desk for this role. Try adding someone by hand.`);

  return { list: people.map(p=>{
    const guess = domain ? guessEmail(p.name, domain) : '';
    return {
      name: p.name,
      role: p.role + (guess ? ' · email is a guessed pattern, unverified' : ''),
      email: guess, linkedin: p.linkedin||'', tier: p.tier, why: p.why||''
    };
  })};
}

/* Relevance is a judgement, not a string match. "Head of Business Intelligence"
   is the right desk for an analytics role and shares no word with it, while
   "Head of Data Governance" shares two and is the wrong desk. The model already
   reads jobs for scoring; here it reads the employee list the same way, and
   says in one line why each person is the one to write to. */
async function pickPeople(roster, company, ctx){
  const prof=P().profile;
  const listed=roster.slice(0,60)
    .map((x,n)=>`${n}. ${x.name} — ${String(x.role||'').slice(0,110)}`).join('\n');
  const txt=await claude(
`Choose who a job seeker should contact at one company.

THE ROLE THEY ARE CHASING
${ctx.title||'unspecified'} at ${company}
${String(ctx.description||'').slice(0,500)}
Related titles in this family: ${(ctx.titles||[]).slice(0,6).join(', ')||'none given'}

THE PERSON APPLYING
${prof.headline||''}
Strengths: ${(prof.strengths||[]).slice(0,5).join('; ')}

PEOPLE ON THE COMPANY'S PUBLIC EMPLOYEE LIST
${listed}

Return ONLY a JSON object, no preamble, no markdown fences:
{"picks":[{"i":0,"tier":"recruiting","why":"..."}]}

Rules:
- tier "recruiting": they own hiring itself — recruiter, talent, HR, people ops, staffing.
- tier "hiring": they run, or sit senior in, the team this role belongs to.
- Judge by what the work actually is, not by shared words. "Head of Business Intelligence" is the right desk for an analytics role. "Head of Data Governance" is not, despite the overlap.
- Include someone only if a message from this candidate about THIS role would plausibly land on the right desk.
- Leave out individual contributors unless the company looks small and there is nobody else.
- why: max 12 words, specific about why this is the right desk. No flattery, no restating their title.
- At most 8, best first, recruiting ahead of hiring side when equally good.
- Nobody suitable is a valid answer: {"picks":[]}
- Use only the numbered list above. Never invent a person or a title.`, TOK_CAP);
  const parsed=grabJSON(txt);
  const picks=Array.isArray(parsed)?parsed:(parsed.picks||[]);
  const out=[];
  picks.forEach(pk=>{
    const src=roster[parseInt(pk.i,10)];
    if(!src) return;                                  // model made an index up
    if(out.some(o=>o.linkedin===src.linkedin&&o.name===src.name)) return;
    out.push({ name:src.name, role:src.role, linkedin:src.linkedin,
      tier: pk.tier==='recruiting'?'recruiting':'hiring',
      why: String(pk.why||'').slice(0,90) });
  });
  return out;
}

/* ═══ LLM ═══
   Two providers. DeepSeek is the default because it is roughly 20x cheaper per
   token than a frontier model and this workload — structured scoring against a
   fixed rubric — is exactly the kind of task where that trade is worth taking.
   Anthropic stays available as a fallback, and is the only one that works with
   no key at all when this file is opened inside Claude itself.

   One caveat that is not in our control: calling any LLM API straight from a
   browser depends on that provider sending permissive CORS headers. Anthropic
   documents a header for it. DeepSeek does not document browser use either way,
   so if DeepSeek fails with a network error and the key is definitely right,
   that is CORS, and the fix is to switch provider rather than to retry. */
/* Two tiers of the same provider. Everything defaults to "pro"; only
   board-search scoring asks for "flash", because that is the one call site with
   volume -- a search of 300 jobs is 25 calls, every other feature is one call
   per click. Flash is roughly a quarter the price per token for a task that is
   structured scoring against a fixed rubric, which is where the trade is worth
   taking; a judgement the user reads as prose (the direction verdict, an
   outreach draft) is not.

   The id is "deepseek-flash", not "deepseek-v4-flash". DeepSeek retired the V4
   Flash weights on 2026-09-10 and now routes the v4 name to V4.1 Flash, which
   is the same model this asks for by its current name -- but their changelog
   calls that routing "temporary", so the alias is a dependency with an
   expiry date and the canonical id is not.

   Both tiers think before they answer, so both are sized by TOK_CAP. Note that
   swapping tiers also swaps prompt caches: the sysPrompt prefix is cached per
   model, so the first scoring call after a board search pays full price for a
   prefix the search had already warmed on the other tier. */
const DS_MODELS = { pro:"deepseek-v4-pro", flash:"deepseek-flash" };

const LLM = {
  deepseek: {
    url:"https://api.deepseek.com/chat/completions",
    label:"DeepSeek",
    keyPrefix:"sk-",
    where:"platform.deepseek.com → API keys",
    headers:k=>({"Content-Type":"application/json","Authorization":"Bearer "+k}),
    /* Reasoning on pro only, matching the hosted path in the edge function.
       Reasoning tokens share the max_tokens budget, so asking flash to think
       through a batch of twelve overruns TOK_CAP and the reply comes back cut
       off mid-token -- grabJSON throws, scoreAndCut keeps the batch unscored,
       and an own-key user pays for it. flash is only asked for a rubric score,
       which is the one answer thinking does not improve. */
    body:(prompt,mt,tier)=>{
      const model=DS_MODELS[tier]||DS_MODELS.pro;
      const o={model,max_tokens:mt||TOK_CAP,messages:[{role:"user",content:prompt}]};
      if(model===DS_MODELS.pro){ o.reasoning_effort="high"; o.thinking={type:"enabled"}; }
      return o;
    },
    read:d=>((d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"").trim()
  },
  anthropic: {
    url:"https://api.anthropic.com/v1/messages",
    label:"Anthropic",
    keyPrefix:"sk-ant-",
    where:"console.anthropic.com → API keys",
    headers:k=>{const h={"Content-Type":"application/json"};
      if(k){h["x-api-key"]=k;h["anthropic-version"]="2023-06-01";
        h["anthropic-dangerous-direct-browser-access"]="true";} return h;},
    // No tier here on purpose: "flash" is a DeepSeek price tier, not a rubric
    // change, and picking a smaller Anthropic model to mirror it would be a
    // quality decision nobody has made. An own-key Anthropic user scores every
    // batch on the same model they always did.
    body:(prompt,mt)=>({model:"claude-sonnet-4-6",max_tokens:mt||TOK_CAP,
      messages:[{role:"user",content:prompt}]}),
    read:d=>(d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("").trim()
  }
};

// tier is "flash" or undefined (= "pro"). The hosted path sends the NAME, never
// a model id: the server holds our key, so it picks the model from its own
// whitelist and an unknown tier falls back to pro rather than reaching DeepSeek.
/* Which model answered the LAST hosted call. A latch rather than a return value
   because claude() answers with a string and a dozen callers expect that;
   threading a pair through all of them to carry one label is a worse trade.
   Read immediately after the await, where it is still the right answer --
   scoreBatch and scoreAndCut both do. Null on an own-key call, because then the
   model is the user's choice and not ours to record.

   On globalThis deliberately, not a bare `let`. The selfcheck scripts slice
   individual functions out of this file and eval them, so a bare identifier
   declared elsewhere is a ReferenceError inside the slice -- and scoreAndCut
   catches everything and calls it "keeping it unscored", so the first version of
   this silently sent all 30 jobs of selfcheck-boards down the unscored path
   instead of failing loudly. globalThis always exists, so reading it cannot
   throw however little of this file is in scope. */
async function claude(prompt, maxTok, tier){
  // No key of their own but signed in: the server calls DeepSeek with ours and takes a credit.
  // search_id ties the call to the board search it belongs to, for the usage ledger.
  if(!KEY && cloudNow()){
    const d=await hosted('llm',{prompt, max_tokens:maxTok||TOK_CAP, tier, search_id:SEARCH_ID});
    globalThis.LAST_MODEL=d.model||null;
    return d.text;
  }
  globalThis.LAST_MODEL=null;
  const cfg = LLM[PROV] || LLM.deepseek;
  // Anthropic inside the Claude viewer needs no key; DeepSeek always does.
  if(!KEY && PROV!=="anthropic") throw new Error("NEEDKEY");
  let res;
  try{
    res = await fetch(cfg.url,{method:"POST",headers:cfg.headers(KEY),
      body:JSON.stringify(cfg.body(prompt,maxTok,tier))});
  }catch(e){
    throw new Error(KEY
      ? "Couldn't reach "+cfg.label+". If the key is right, this is the browser being blocked \u2014 try the other provider."
      : "NEEDKEY");
  }
  if(res.status===401||res.status===403) throw new Error("NEEDKEY");
  if(!res.ok){
    let d=''; try{const j=await res.json(); d=(j.error&&j.error.message)?': '+j.error.message:'';}catch(e){}
    throw new Error(cfg.label+" returned "+res.status+d);
  }
  const out = cfg.read(await res.json());
  if(!out) throw new Error(cfg.label+" returned an empty response.");
  return out;
}

function grabJSON(txt){
  let t = txt.replace(/^```(?:json)?/,'').replace(/```$/,'').trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a>=0 && b>a) t=t.slice(a,b+1);
  return JSON.parse(t);
}

/* ═══ profile extraction ═══
   This is what makes the tool work for anyone. It reads whatever CV-ish
   markdown a person drops in and turns it into the structured facts the
   scorer needs: where they are, what level they're at, what they can
   honestly claim, what they can't, and which directions are open. */
/* Strip the contactable identifiers out of a CV before it is sent to a model.
   Checked 2026-10-08: DeepSeek's own privacy policy says inputs are stored in
   the People's Republic of China, kept "for as long as you have an account",
   and used to train its models unless you opt out -- and it draws no
   distinction between the developer API and the consumer app. This one call
   sends the WHOLE CV, so it is the largest and most sensitive payload in the
   product by a wide margin.

   What this removes: email addresses, dialable phone numbers, and the PATH of
   any url, so `linkedin.com/in/priyarao` becomes `linkedin.com` -- the handle
   is the identifier, the host is only a signal that they have a profile there.

   What it does NOT remove, and the honest limit of it: the person's name and
   the body of the CV still go. The extraction's whole job is to read that
   prose, and the name cannot be found before it has been extracted without
   being circular. The name is removed from every LATER call instead -- scoring,
   judging and track assessment no longer send it (see sysPrompt, candidateOf,
   assessTrack), so it crosses the wire once rather than on every batch.

   A year range is deliberately kept. `2019-2023` is eight digits and an early
   version of this ate it, which would have cost the extraction the dates its
   seniority judgement rests on. Ten digits is the shortest number anyone can
   actually ring. */
const YEAR_RANGE = /^\s*(19|20)\d{2}\s*[-\u2013\u2014]\s*(19|20)\d{2}\s*$/;
const redactCV = (text) => String(text || '')
  .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z0-9.-]+/g, '[email removed]')
  .replace(/(?:https?:\/\/)?(?:www\.)?([a-z0-9-]+(?:\.[a-z0-9-]+)+)\/[^\s,;)\]]*/gi,
    (m, host) => /\.(com|org|net|io|dev|co|in|me|ai|app|uk|gov|edu)/i.test(host) ? host : m)
  .replace(/\+?\(?\d[\d ()\-.]{6,}\d/g, (m) => {
    if (YEAR_RANGE.test(m)) return m;
    const digits = m.replace(/\D/g, '').length;
    return (digits >= 10 || /^\+/.test(m.trim())) ? '[phone removed]' : m;
  });

function addCatalogueBoards(t, prof){
  const text=[t.label,t.why,...(t.titles||[]),...((prof&&prof.domains)||[])].join(' ');

async function extractProfile(raw){

  const txt = await claude(EXTRACT_PROMPT(redactCV(raw)), TOK_CAP);

  p.country_code = String(p.country_code||'').toLowerCase().replace(/[^a-z]/g,'').slice(0,2);

    id:'general', label:'General search', difficulty:'moderate',
    why:'Broad search across everything in the profile.', titles:[]

  ['domains','strengths','hard_skills','gaps','wrong_shapes'].forEach(k=>{
    if(!Array.isArray(p[k])) p[k]=[];

  p.tracks.forEach(t=>{
    if(!Array.isArray(t.titles)) t.titles=[];

/* Days from today to a YYYY-MM-DD date; null when there is none. */
const daysTo = d => /^\d{4}-\d{2}-\d{2}$/.test(String(d||'')) ? Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5) : null;
/* A closing date counts only if the sentence quoted for it is really on the
   official page AND names that date (its day, and its month by name or number).
   A model that misreads or invents a date fails one or the other. */
function deadlineOk(text, closes, quote){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(closes||'')) || isNaN(new Date(closes))) return false;
  const norm=x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim(), q=norm(quote);
  if(q.length<8 || !norm(text).includes(q)) return false;
  const [, m, d]=closes.split('-').map(Number);
  const dayIn=new RegExp(`(^|\\D)0?${d}(\\D|$)`).test(q);
  const monthIn=q.includes(Object.keys(MONTHS)[m-1]) || new RegExp(`(^|\\D)0?${m}[./-]|[./-]0?${m}(\\D|$)`).test(q);
  return dayIn && monthIn;
}
/* Read each deadline's official page and keep a closing date only where the

async function verifyDeadlines(rows){
  const withUrl=rows.filter(j=>httpUrl(String(j.url||''))).slice(0,10);
  const pages=await Promise.all(withUrl.map(j=>hosted('page_text',{url:String(j.url).replace(/#.*$/,'')}).then(r=>String(r.text||'')).catch(()=>'')));
  const have=withUrl.map((j,k)=>({j, text:pages[k]})).filter(x=>x.text.length>200);
  if(!have.length) return 0;

Return ONLY a JSON object, no preamble, no markdown fences:
{"r":[{"i":0,"closes":"YYYY-MM-DD or empty","quote":"the exact words from the page that state that date, copied character for character"}]}
If the page does not state a closing date, give an empty "closes". Never work a date out from a pattern or from memory.

${have.map((x,i)=>`ITEM ${i}: ${x.j.title} (${x.j.company})\nPAGE TEXT: ${x.text.slice(0,6000)}`).join('\n\n')}`, TOK_CAP, 'flash');

   the board fill: the routes a direction leans on fill themselves too. More

const ROUTE_WORK = new Set();
async function routeFill(trk, route, more){
  const p=P(); if(!p || !cloudNow() || ROUTE_WORK.has(route)) return;
  const k='triage:route:'+DB.current+':'+trk.id+':'+route;
  if(!more){ try{ if(localStorage.getItem(k)) return; }catch(e){ return; } }
  ROUTE_WORK.add(route); render();
  try{
    const have=p.jobs.filter(j=>chOf(j)===ROUTE_CH[route] && inDir(j,p)).map(j=>`${j.title} (${j.company})`);
    const rows = route==='local' ? await localOpps(trk) : await routeOpps(trk, route, have);
    if(route==='deadline') await verifyDeadlines(rows).catch(e=>console.warn('deadline pages not read:', e.message));

async function addSuggested(list, checkHiring){
  const p=P(); if(!p||!list.length) return;
  busy=true; render();

  // Everything starts as a cold target. The ATS check below promotes whichever
  // ones turn out to be hiring, so the default is never wrong.
  const cold=list.map(c=>{
    const j=blank();
    j.company=c.name; j.title='Cold approach'; j.location=c.location||'';
    j.description=[c.why,c.overlap?('Your overlap: '+c.overlap):'',c.how_they_work?('How they work: '+c.how_they_work):'',c.stage?('Stage: '+c.stage):'']
      .filter(Boolean).join(' — ');
    j.source='Suggested'; j.channel='cold'; j.stage='new';
    j.notes=c.odds?('Odds: '+c.odds):'';
    if(c.website && /^[a-z0-9.-]+\.[a-z]{2,}$/i.test(String(c.website).replace(/^https?:\/\//,'').replace(/\/.*$/,''))) j.site=String(c.website).replace(/^https?:\/\//,'').replace(/\/.*$/,'');
    return j;
  });
  let added=addJobs(cold);
  await save(); render();

  if(!checkHiring){ busy=false; render(); setSearchInfo(`Added ${added} cold targets.`); await autoScore(); return; }

  try{
    const {found,misses}=await atsSearch(list.map(c=>c.name), setSearchInfo);
    let roles=0;
    for(const hit of found){
      await recordVelocity(hit.slug,hit.rows.length);
      const vel=velocityNote(hit.slug);
      const jobs=rowsFromAts(hit, vel);
      roles+=addJobs(jobs);
      // This company is advertising, so the placeholder cold row is redundant.
      const ci=p.jobs.findIndex(j=>j.channel==='cold'&&j.source==='Suggested'&&j.company===(hit.name||hit.slug));
      if(ci>=0 && jobs.length) p.jobs.splice(ci,1);
    }
    busy=false; await save(); render();
    setSearchInfo(`${found.length} of ${list.length} are hiring — ${roles} open roles pulled. `
      + `${misses.length} stay cold approaches.`);
    await autoScore();
  }catch(e){
    busy=false; await save(); render();
    setSearchInfo(`Added ${added} cold targets. Couldn't check hiring: ${e.message}`);
    await autoScore();
  }
}

/* ═══ assessing a direction the person names themselves ═══
   The generated tracks are the model's read on where someone could go. This is
   the inverse: the person says where they want to go, and gets an honest answer
   about what that would take. It is the more useful direction of the two,
   because ambition usually arrives before evidence, and the thing worth knowing
   is not "is this allowed" but "what specifically is missing". */
async function assessTrack(want, prof){
  const txt = await claude(`A person wants to know whether a particular kind of job is realistic for them.

THEIR PROFILE
Based in: ${prof.location||'unspecified'}
Level: ${prof.seniority||'unspecified'}${prof.years_experience?` (~${prof.years_experience} years)`:''}
In short: ${prof.headline||''}
Fields: ${(prof.domains||[]).join('; ')}
Real strengths: ${(prof.strengths||[]).join('; ')}
Skills: ${(prof.hard_skills||[]).join(', ')}
${prof.unusual_combination?`What is rare about them: ${prof.unusual_combination}`:''}
Honest gaps: ${(prof.gaps||[]).join('; ')||'none stated'}

THE KIND OF JOB THEY ARE ASKING ABOUT: "${String(want).slice(0,200)}"

${YOU_RULE}

Return ONLY a JSON object, no preamble, no markdown fences:
{
 "id":"short-slug",
 "label":"the job family, named properly as the industry names it",
 "difficulty":"easy|moderate|moonshot",
 "why":"one sentence, max 20 words, on the fit",

}

Difficulty means:
- "easy": they could get this now with what is already on their profile. Someone reading their CV would find it an unsurprising application.
- "moderate": a real step across. Winnable, but they would need to argue for it and would be competing against people with more direct experience.
- "moonshot": plausible but they would be an unusual hire. Worth a small number of well-aimed attempts, not a campaign.

Be honest rather than encouraging. If this is a bad idea for them, say so in the verdict and mark it moonshot - an inflated assessment wastes months of someone's life. If it is genuinely easy, say that too and do not manufacture obstacles.
If the request is vague, interpret it as the nearest real job family and name that in the label.
For boards: give the registries where this specific field posts, not general job sites. Bare domains, no protocol.
For mode: "permanent" for a salaried post (use this when unsure), "freelance" for project or contract work with several clients, "gig" for platform task work paid per task.
${ROUTES_RULES}
Use ONLY what is in the profile. Do not invent experience.`, TOK_CAP);
  const t = grabJSON(txt);

/* ═══ scoring prompt, built from THIS person ═══ */
function sysPrompt(prof, track){
  const ts = prof.tracks || [];
  const t = ts.find(x=>x.id===track) || ts[0] || {};
  return `You score job listings for one specific candidate. You will be given their profile and a batch of jobs.

CANDIDATE SNAPSHOT
Based in: ${prof.location||'unspecified'}${prof.country?', '+prof.country:''}
Level: ${prof.seniority||'unspecified'}${prof.years_experience?` (~${prof.years_experience} years)`:''}
What they are: ${prof.headline||''}
Real strengths: ${(prof.strengths||[]).join('; ')}
${prof.unusual_combination?`What is rare about them: ${prof.unusual_combination}`:''}

THEY ARE TARGETING: ${t.label||'general roles'}${t.why?` — ${t.why}`:''}
Typical titles in this family: ${(t.titles||[]).join(', ')||'various'}

HONEST GAPS (they cannot claim these): ${(prof.gaps||[]).join('; ')||'none stated'}
ROLE SHAPES TO RULE OUT: ${(prof.wrong_shapes||[]).join('; ')||'none stated'}

TODAY'S DATE IS ${today()}. Use it for any date reasoning below.

Return ONLY a JSON object, no preamble, no markdown fences, using these short keys:
{"r":[{"id":"...","s":0,"re":0,"c":"h","f":[{"code":"loc","fact":"on-site Berlin, no remote"}]}]}

For EACH job:
- id: exactly as given
- s (score): 0-100 FIT ONLY. How well does the described WORK match what this candidate can do and is targeting? Judge the work, not the title, and NOT whether they would win the process.
- re (reachability): 0-100, SEPARATELY. How likely is an application from THIS candidate to actually convert? Consider company prestige and applicant volume, whether credentials this candidate lacks are demanded, the seniority bar versus their level, signals of openness to non-traditional candidates, and company stage. A perfect-fit role at a famous employer scores HIGH on fit and LOW here.
- c (confidence): "h" (real job description) | "m" (short snippet) | "l" (title and company only)
- f (flags): the codes that apply, [] if none. Each is an object: "code" from the set below, and "fact" -- the specific thing in THIS posting that makes the code true, max 10 words, lifted from what the posting actually says rather than generalised. "on-site Berlin, no remote" is a fact; "location mismatch" is just the code again in longer words. If you cannot point at something in the text, do not raise the flag.
  Codes: fit=strong fit, sen_hi=seniority too high, sen_lo=seniority too low, cred=credential gated, shape=wrong role shape, loc=location ineligible, thin=thin data, comp=high competition, open=non-traditional friendly, rare=rare combination fit
- p (posted): ONLY for a job given WITHOUT a "posted" value, and only when its text carries evidence of WHEN it was posted: the window that evidence allows, as {"from":"YYYY-MM-DD","to":"YYYY-MM-DD"}. Otherwise leave the p key out entirely.

Rules:
- The candidate is based in ${prof.location||'their stated location'}. A role requiring presence somewhere else with no remote allowance scores below 20 on FIT and gets "loc".
- Do NOT lower the FIT score because of the gaps listed above. Gaps are a REACHABILITY consideration. Keep the two axes strictly separate.
- Any job matching the ruled-out role shapes scores below 20 on FIT and gets "shape", however appealing its title.
- A job that needs the candidate's rare combination of skills should score higher — flag "rare".
- Do not invent details. Inferring from a title alone means confidence "l" and flag "thin".
- Do not inflate. Most jobs are mediocre. The distribution should be wide on both axes.
- A job given to you with a "posted" value already has a real date from its source. Leave p out for it; do not restate or revise it.
- Evidence for p means the text says something datable: an explicit date, "posted last week", an application deadline, an interview or start date, a named quarter or term. A window as wide as three months is a good answer when that is all the evidence supports. Widen the window rather than picking a date you cannot defend.
- The subject matter of a job is NOT evidence of its age. No datable statement means no p. Guessing here is worse than useless, because it sorts a stale job to the top of the freshest list.
- p "to" must never be later than today, and "from" never later than "to".
- One entry per input job. JSON object only.`;
}

/* ═══ jobs ═══ */
/* One way in for a posting date, so provenance and the sort key can never
   disagree. lo/hi collapse to the same day for an exact date; a window keeps
   both and sorts on the middle. Anything unparseable leaves the row undated,
   which the Freshest tab shows honestly rather than guessing at. */
function setPosted(j, when, src, hi){
  const lo=parseWhen(when);
  if(!lo) return false;
  const top=hi?parseWhen(hi):'';
  j.posted_lo=lo;
  j.posted_hi=(top&&top>=lo)?top:lo;
  j.posted=midDate(j.posted_lo,j.posted_hi);
  j.posted_src=src||'feed';
  return true;
}

function blank(){ const o={}; COLS.forEach(c=>o[c]=''); o.status='New'; o.pitch_sent='No'; o.channel='posted'; o.stage='new'; o.contacts='[]'; o.events='[]'; o.added=today(); return o; }
function keyOf(j){
  const u=String(j.url||'').trim();
  if(u && u!=='nan') return 'u:'+u.toLowerCase();
  return 't:'+[j.title,j.company,j.location].map(x=>String(x||'').trim().toLowerCase()).join('|');
}
function addJobs(list){
  const p=P(); if(!p) return 0;
  const seen=new Set(p.jobs.map(keyOf)); let n=0;
  list.forEach(j=>{ if(!String(j.title||'').trim()) return;
    const k=keyOf(j); if(seen.has(k)) return; seen.add(k); p.jobs.push(j); n++; });
  return n;
}
const isScored = j => String(j.ai_score||'').trim()!=='';
/* Is this job the current direction's? Scored before jobs carried a direction,
   or for a direction since deleted: it belongs to all of them (feedback #13). */
const inDir = (j,p) => !j.dir || j.dir===p.track || !(p.profile.tracks||[]).some(t=>t.id===j.dir);

/* Can you act on this row? Three legs, kept apart on purpose.

   A score says how good a job is. None of these do: they say whether the row
   is worth showing a verdict about at all. Collapsing them into one number is
   the mistake -- "we cannot see this posting" would become "this job is
   slightly worse", which is what confWeight's 0.78 already does to low
   confidence and why an unknown row currently sinks in among genuinely bad
   ones instead of standing apart.

   Each leg returns null for UNKNOWN, and null is never false. We have not
   checked most postings; that is not evidence they are dead. The render shows
   unknown as grey -- `--closed`, which the colour law already defines as "the
   absence of an instruction" -- and never as a low number. */
const CHECKS = new Map();        // job_key -> row from public.job_checks

/* Liveness is a fact about the posting, so public.job_checks is shared and not
   per-user: checked once, read by everyone. Filled on load, best effort. */
function liveOf(j){
  const c = CHECKS.get(keyOf(j));
  return c ? !c.closed_on : null;
}
/* Reachability is "is there a person to write to", which today we only know
   once contacts have been found. Absence means not-yet-looked, not nobody --
   hence null. The free Mantiks per-company pre-check is what will turn most of
   these from null into a real answer without spending a credit. */
function reachableOf(j){
  return listOf(j,'contacts').length ? true : null;
}
function actionableOf(j){
  return { live: liveOf(j), fresh: ageOf(j), reach: reachableOf(j) };
}
const fitOf   = j => { const v=parseFloat(j.ai_score); return isNaN(v)?0:Math.max(0,Math.min(100,v)); };
const reachOf = j => { const v=parseFloat(j.ai_reachability); return isNaN(v)?45:Math.max(0,Math.min(100,v)); };
/* The raw judgement as stored on the row, or null. Every number derived from a
   judgement goes through here, so a row judged before this existed simply falls
   back to whatever it already had rather than being re-judged for it. */
function judgmentOf(j){
  const v = j && j.ai_judgment;
  if(!v) return null;
  if(typeof v === 'object') return v;
  try{ return JSON.parse(String(v)); }catch(e){ return null; }
}
const CONF_W={high:1,medium:.9,low:.78};
/* How much a posting's visibility discounts its rank. Jev answers this as a
   choice over the same three words the old ordinal used, so a row with no raw
   judgement keeps exactly the weight it had. With one, the whole distribution
   is used rather than its winner: a posting the model reads as 60% full and 40%
   snippet is not the same row as one it is certain about, and collapsing to
   "high" threw that difference away. */
function confWeight(j){
  const jv=judgmentOf(j), pr=jv&&jv.confidence_probabilities;
  if(pr){
    let acc=0, mass=0;
    Object.keys(CONF_W).forEach(k=>{ const p=Number(pr[k]); if(isNaN(p)) return; acc+=CONF_W[k]*p; mass+=p; });
    if(mass) return acc/mass;
  }
  return CONF_W[String(j.ai_confidence||'low').toLowerCase()]||.78;
}
function rankOf(j){
  return Math.pow(fitOf(j),0.65)*Math.pow(reachOf(j),0.35)*confWeight(j);
}
/* ── freshness, which rankOf has never had ────────────────────────────────
   Deliberately NOT folded into rankOf. That function is sliced and asserted
   by scripts/eval-matcher.js with a single argument, and pipeline-map anchors
   a node on it by name, so it stays pure and one-argument. This is the wrapper
   the app sorts by instead.

   How much age matters is the one thing `intent` is for. Someone who needs
   work now is better served by a good posting from today than a slightly
   better one from three weeks ago, because the three-week-old one is probably
   filled. Someone browsing wants the strongest thing regardless.

   An UNKNOWN age never costs a row anything: ageOf returns null when no date
   was stated, and null is not old. That rule is already load-bearing in
   boardFilter and it holds here. */
/* The profile the view is currently about. Several display rules need it and
   none of them is handed it, so this is the single place that reaches for it --
   repeating `P() && P().profile` at each site is how two of them end up
   disagreeing about which band is in force. */
const curProf = () => { const p = P(); return p ? p.profile : null; };
const INTENT_FRESH = { now: 0.45, soon: 0.20, browsing: 0 };
function freshWeight(j, prof){
  const w = INTENT_FRESH[intentOf(prof)] || 0;
  if(!w) return 1;
  const a = ageOf(j);
  if(a === null) return 1;
  /* Linear to CLOSING_DAYS and flat after: by the time a posting is old enough
     to be closing, the penalty has done its work, and continuing to divide
     would rank a 90-day-old role below an unscored one. */
  return 1 - w * Math.min(1, a / CLOSING_DAYS);
}
/* What the app sorts by. rankOf is the score; this is the score as the person
   asked to see it. */
const rankFor = (j, prof) => rankOf(j) * freshWeight(j, prof);
const isOpen = j => stOf(j)!=='closed';

/* ═══ trimming the list ═══
   A list that has been running for weeks fills with roles that were never
   worth an application, and scrolling past them is a tax on every session.
   So: keep the best, bin the rest.

   Two things are never binned, and the distinction matters more than the
   number 50. A row you have acted on is the ONLY record that you applied
   there, who you spoke to and what they said — that history exists nowhere
   else and no score justifies deleting it. And a row that was never scored
   has not been judged, so calling it "not top 50" would be a lie; it is
   probably something you pulled in five minutes ago. Both are protected, so
   the total kept can exceed 50, and the confirm says so plainly rather than
   quietly deleting something you would want back. */
const KEEP_TOP = 50;

/* ═══ retention ═══
   A tracker that only ever grows stops being a list of what to do and becomes
   an archive to scroll past. The rows safe to drop are the ones nothing ever
   happened to: they are not a record of anything, because there is nothing to
   record. Ten days is the window -- a posting you have not touched in that time
   is one you decided against without saying so, and the posting itself has
   probably gone.

   What is never dropped is anything carrying history. A row you applied to,
   messaged someone at, or logged a note against is the ONLY record that any of
   it happened, and it exists nowhere else -- the same reason trimPlan() refuses
   to bin it however badly it scores.

   isTouched() cannot be reused here. It counts any stage other than 'new' as
   touched, so a job closed on sight would be protected by it, which is exactly
   backwards: those are the rows this is for. */
const KEEP_UNTOUCHED_DAYS = 10;
const hasHistory = j =>
     String(j.pitch_sent||'').trim().toLowerCase()==='yes'
  || !!String(j.date_applied||'').trim()
  || listOf(j,'contacts').length>0
  || listOf(j,'events').length>0;
/* No 'added' means the row predates the field and its age cannot be known, so
   it is left alone rather than guessed at. */
const staleUntouched = j => !hasHistory(j) && !!j.added
  && dayDiff(j.added, today()) > KEEP_UNTOUCHED_DAYS;
let PURGED = 0;
function purgeUntouched(){
  const p=P(); if(!p||!p.jobs) return 0;
  const n=p.jobs.length;
  p.jobs=p.jobs.filter(j=>!staleUntouched(j));
  return n-p.jobs.length;
}
function isTouched(j){
  return stOf(j)!=='new'
      || String(j.pitch_sent||'').trim().toLowerCase()==='yes'
      || String(j.status||'').trim().toLowerCase()==='applied'
      || listOf(j,'contacts').length>0
      || listOf(j,'events').length>0;
}
function trimPlan(jobs){
  const safe=[], pool=[];
  (jobs||[]).forEach(j=>{ (isTouched(j)||!isScored(j) ? safe : pool).push(j); });
  // Rank decides. Age only breaks ties, and only now that rows carry one:
  // between two equally good roles, the fresher one is likelier to still exist.
  pool.sort((a,b)=>{
    const d=rankOf(b)-rankOf(a); if(d) return d;
    const x=ageOf(a), y=ageOf(b);
    if(x===null&&y===null) return 0;
    if(x===null) return 1;
    if(y===null) return -1;
    return x-y;
  });
  return { safe, best:pool.slice(0,KEEP_TOP), drop:pool.slice(KEEP_TOP) };
}
const chOf   = j => { const c=String(j.channel||'posted').trim().toLowerCase(); return OPP[c] ? c : 'posted'; };
/* The kinds of opportunity a row can be (routes, phase 2, 2026-10-24). A
   posting is the default; a company to approach is 'cold'; a story to pitch
   and a person to ask are rows like any other, with fit, reachability and one
   next step, so the stages, the map, undo and sync all carry them unchanged.
   Only the words differ: what "sent" is called, and what the button does. */
const OPP = {
  posted: { sent:'applied',    status:'Applied',   toast:'Marked applied',   key:'Postings' },
  cold:   { sent:'reached out', status:'Contacted', toast:'Marked contacted', key:'Companies to approach', one:'company to approach' },
  pitch:  { sent:'pitched',    status:'Pitched',   toast:'Marked pitched',   key:'Stories to pitch', one:'a story to pitch',
            btn:'Draft the pitch', sect:'Pitch these', sub:'Outlets that take this kind of story, and an angle from your own beat. Each pitch goes to the person who commissions it.' },
  person: { sent:'asked',      status:'Asked',     toast:'Marked asked',     key:'People to ask', one:'someone to ask',
            btn:'Draft a note',    sect:'People to ask', sub:'Who hires or vouches for this work, and what to ask them. Someone you already know comes first.' },
  deadline: { sent:'registered', status:'Registered', toast:'Marked registered', key:'Deadlines and exams', one:'a deadline',
            btn:'Check the dates \u2197', act:'apply', sect:'Deadlines coming up', sub:'Exams, fellowships and intakes that open once a year. A date is shown only when it was read off the official page; otherwise check it there.' },
  place:  { sent:'visited',    status:'Visited',   toast:'Marked visited',   key:'Places near you', one:'a place near you',
            btn:'Draft what to say', sect:'Places near you', sub:'Where this work is near you. Most of it is got by turning up, asking for a trial, or a message to the owner.' },
};
const ROUTE_CH = { pitch:'pitch', people:'person', deadline:'deadline', local:'place' };   // route -> the channel its rows carry
const stOf   = j => { const v=String(j.stage||'').trim().toLowerCase();
  if(STAGES.includes(v)) return v;
  // Rows imported before stages existed, or from the Python tracker.
  const s=String(j.status||'').trim().toLowerCase();
  if(s==='applied'||s==='contacted') return 'sent';
  if(s==='skipped'||s==='rejected'||s==='closed') return 'closed';
  return 'new'; };
const dayDiff = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
function isDue(j){
  if(stOf(j)!=='sent') return false;
  // One definition of "when is this due", shared with followUpOn, so the card,
  // the panel and the overdue count cannot disagree.
  const on=followUpOn(j);
  return on ? on <= today() : false;
}
const daysSilent = j => { const t=j.last_touch||j.date_applied; return t?dayDiff(t,today()):0; };
const listOf = (j,k) => { try{ const v=JSON.parse(j[k]||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } };
const setList = (j,k,v) => { j[k]=JSON.stringify(v); };
function logEvent(j,kind,text){
  const ev=listOf(j,'events');
  ev.unshift({on:today(),kind,text:String(text||'').slice(0,400)});
  setList(j,'events',ev.slice(0,40));
  j.last_touch=today();
}
/* What a stage change says in the log. Shared, because the card and the detail
   panel both make them, and 'moved to sent' is a worse record than 'applied'. */
const stageNote = (j,st) => st==='sent' ? OPP[chOf(j)].sent
  : st==='live' ? 'they replied' : st==='closed' ? 'closed out' : 'reopened';
function setStage(j,st){
  j.stage=st;
  j.status = st==='sent' ? OPP[chOf(j)].status
           : st==='live' ? 'In conversation'
           : st==='closed' ? 'Closed' : 'New';
  // A stale follow-up on a reopened row would fall due against a clock that
  // started the first time round.
  if(st==='new') j.follow_up_date='';
  if(st==='sent'){
    if(!j.date_applied) j.date_applied=today();
    const d=new Date(); d.setDate(d.getDate()+FOLLOWUP_DAYS);
    j.follow_up_date=d.toISOString().slice(0,10);
  }
  j.last_touch=today();
}

/* Every field an action in the queue can change on one row. The list fields
   are JSON strings on the record, so holding the strings IS the deep copy. */
const UNDO_FIELDS = ['stage','status','date_applied','follow_up_date','last_touch',
                     'events','contacts','notes','pitch_sent'];

/* One row, held so any action on it can be put back whole rather than
   approximately. Undo is not a nicety here: the queue's whole job is to make
   acting cheap, and an action is only cheap if being wrong about it is. */
function snapRow(j){
  const s={ pid:DB.current };
  UNDO_FIELDS.forEach(k=>{ s[k]=j[k]; });
  return async ()=>{
    /* The closure holds the row object itself. Undoing after a profile switch
       would write a row from one profile through a save of another. */
    if(DB.current!==s.pid){
      alert('That happened under a different profile, so it cannot be undone from here.');
      return;
    }
    UNDO_FIELDS.forEach(k=>{ j[k]=s[k]; });
    await save(); render();
  };
}

/* What the toast says a stage change did. stageNote is the log's voice
   ("applied"); this is the confirmation's ("Marked applied"), and they are not
   the same sentence -- a log is a record and a toast is an answer. */
const stageToast = (j,st) => st==='sent' ? OPP[chOf(j)].toast
  : st==='live' ? 'Marked as replied' : st==='closed' ? 'Closed' : 'Reopened';

/* "Sent." with the man standing on tile: a beat for a first or a milestone, not
   for every send. The first three sends ever, and the send that reaches the day's
   target (DAY_FLOOR); after that the toast is the plain "Marked applied". Counted
   in this browser only. */
function sentMoment(){
  let seen=0; try{ seen=+localStorage.getItem('triage:sentart')||0; }catch(e){}
  const n=P().jobs.filter(x=>x.date_applied===today()).length;
  if(seen>=3 && n!==DAY_FLOOR) return null;
  if(seen<3) try{ localStorage.setItem('triage:sentart', String(seen+1)); }catch(e){}
  return { art:'man', label:'Sent.', note:'The next move is theirs.',
           eyebrow: n<=DAY_FLOOR ? `Sent \u00b7 ${n} of ${DAY_FLOOR} today` : `Sent \u00b7 ${n} today` };
}

/* Reuses the background-task toasts rather than adding a second toast layer:
   #tasks already sits outside #root, so this survives the re-render that every
   one of these actions causes. */
function undoToast(j,undo,label,extra){
  const t={ id:'t'+(++TASKSEQ), state:'done', label:label||'Done',
            status:[j.title,j.company].filter(Boolean).join(' · ')||'this role', undo };
  if(extra) Object.assign(t, extra);
  TASKS.push(t); renderTasks();
  setTimeout(()=>dropTask(t.id), 6000);   // long enough to reach Undo, short enough not to need dismissing
}

/* ═══ CSV ═══ */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else { if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=''; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=c; } }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.length && r.some(v=>String(v).trim()!==''));
}
function toCSV(rows,cols){
  const q=v=>{const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  return [cols.join(',')].concat(rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\n');
}

/* ═══ scoring run ═══
   Token budget, because a search can score hundreds of jobs:
   - sysPrompt is the identical first part of every call (same profile, same
     day), so DeepSeek serves it from its prompt cache at a fraction of the
     price. Nothing that varies may go before "JOBS TO SCORE".
   - Replies use short keys and flag codes, a 12-word reason, and no posted
     field for jobs already dated. Reply tokens cost ~4x prompt tokens.
   - Descriptions are cut to 700 characters; the opening carries the role. */
const FLAG_CODES = {fit:'strong_fit', sen_hi:'seniority_too_high', sen_lo:'seniority_too_low', cred:'credential_gated',
  shape:'wrong_role_shape', loc:'location_ineligible', thin:'thin_data', comp:'high_competition',
  open:'non_traditional_friendly', rare:'rare_combination_fit'};
const CONF_CODES = {h:'high', m:'medium', l:'low'};
/* Long name -> short code as well as short -> short, so a model that answers
   in the old vocabulary still lands on a known flag instead of inventing one. */
const FLAG_SHORT = {};
Object.keys(FLAG_CODES).forEach(k => { FLAG_SHORT[k] = k; FLAG_SHORT[FLAG_CODES[k]] = k; });

/* Flags, facts and evidence.
   The model used to return a sentence -- "strong on the work, but the location
   rules you out" -- and the app printed it. A sentence is the one part of a
   judgement that cannot be checked: it reads exactly as well when it is wrong,
   and there is nothing in it to point at.

   So the judgement is a flag, a fact and a span. The flag is the category, the
   fact is what in THIS posting makes it true, and the span is the sentence the
   fact came from, quoted. A wrong span is visible at a glance in a way that a
   wrong sentence never is, and that visibility is the whole point: the claim
   this product makes is that it will show its work.

   The span is found here, in the browser, by looking for it -- not asked of a
   model. That keeps it free, keeps it working with no account and no key, and
   means the quote is a substring of the posting by construction rather than by
   the model's good behaviour. */
function normFlags(f){
  if(!Array.isArray(f)) return [];
  const out = [], seen = {};
  f.forEach(x => {
    const raw  = (x && typeof x === 'object') ? x.code : x;
    const code = FLAG_SHORT[String(raw||'').trim()];
    if(!code || seen[code]) return;
    seen[code] = 1;
    out.push({ code, fact: String(((x && typeof x === 'object') ? x.fact : '') || '').trim().slice(0,120) });
  });
  return out;
}

/* Jobs scored before this change carry a comma-joined string of long names and
   no facts at all. They are not re-scored for it -- that would be a paid
   rewrite of work already done -- so every reader goes through here. */
function flagsOf(j){
  const v = j && j.ai_flags;
  if(!v) return [];
  if(Array.isArray(v)) return normFlags(v);
  const t = String(v).trim();
  if(t.charAt(0) === '[') { try{ return normFlags(JSON.parse(t)); }catch(e){} }
  return normFlags(t.split(','));
}

const FACT_STOP = new Set(('a an the and or of to in for on with at by from as is are be was were we you your our their its this that it will can must have has had not no there they he she'
  ).split(' '));
const factTok = s => (String(s||'').toLowerCase().match(/[a-z0-9+#]{2,}/g) || []).filter(w => !FACT_STOP.has(w));
/* How much of the fact a sentence has to account for before it is called the
   evidence. An empty span says "no quote for this"; a confidently wrong one
   says "here is your proof" and points at the wrong line, which is worse than
   saying nothing. So this errs high. */
const SPAN_FLOOR = 0.5;
const SPAN_MAX = 240;

/* The sentence of `desc` that best supports `fact`, quoted exactly, or ''. */
function bestSentence(desc, fact){
  const text = String(desc||'');
  const want = factTok(fact);
  if(!text || !want.length) return '';
  const wanted = Array.from(new Set(want));
  let at = 0, best = null, bestScore = 0;
  const re = /[^.!?\n]+[.!?]*/g;
  let m;
  while((m = re.exec(text))){
    if(!m[0].trim()) continue;
    const have = new Set(factTok(m[0]));
    let hit = 0;
    wanted.forEach(w => { if(have.has(w)) hit++; });
    const score = hit / wanted.length;
    if(score > bestScore){ bestScore = score; best = [m.index, m.index + m[0].length]; }
    at = m.index;
  }
  if(!best || bestScore < SPAN_FLOOR) return '';
  /* Indices in, one slice out. Trimming by moving the ends rather than by
     trimming the result is what makes "this is a substring of the posting"
     true by construction instead of by inspection. */
  let [a, b] = best;
  while(a < b && /\s/.test(text.charAt(a))) a++;
  while(b > a && /\s/.test(text.charAt(b-1))) b--;
  if(b - a > SPAN_MAX){
    const cut = text.lastIndexOf(' ', a + SPAN_MAX);
    b = cut > a ? cut : a + SPAN_MAX;
  }
  return b > a ? text.slice(a, b) : '';
}

/* Above which probability a Jev noul counts as "this flag is true". Jev
   returns a number per flag precisely so the caller can keep its own
   threshold rather than trusting one chosen elsewhere; this is ours.

   0.8, measured rather than picked. It was 0.5, which is the worst available
   cut: a noul carries no separate confidence, so 0.5 is exactly where the
   model is torn, and every flag it was unsure about became a chip on a row.
   Over the ten labelled postings that fired seven flags nothing supported --
   `open` on five of them.

   scripts/tune-flag-threshold.js sweeps the recorded probabilities in
   scripts/eval/judgments.json against the labels. Seven of the ten flags
   separate cleanly, and every one of their gaps straddles 0.8:

       flag      true fires at    false reaches    gap
       loc            0.96             0.25        0.71
       thin           0.95             0.22        0.73
       shape          0.97             0.48        0.49
       sen_lo         0.97             0.53        0.44
       comp           0.90             0.45        0.45
       sen_hi         0.82             0.58        0.24
       open           0.91             0.70        0.21

   One number for all ten rather than ten tuned numbers, because with one or
   two positive cases per flag a per-flag decimal would be fitted to noise.
   The gaps are wide enough that the choice inside them barely matters; what
   mattered was being at 0.5.

   The consequence argument points the same way. The flags that bury a job --
   loc, cred, shape, sen_hi, sen_lo, thin, comp -- are the ones with the widest
   gaps, so a high cut costs them nothing and a false one is expensive. The
   flags that merely encourage an application are where the residual noise
   sits, which is the cheaper error to keep.

   Two flags are not fixable from here at any cut, and scripts/tune-flag-thresholds.js shows
   why, per code: `fit` answers the question it was asked while the labels name
   the flag worth showing, and `rare` is weakly true of nearly every posting
   this profile sees. Calibrated on jev-1.13.0; a model bump invalidates it. */
const FLAG_P = 0.8;
/* Salvaged from the jev-pin-and-threshold branch, 2026-10-05, before deleting it:
   the 0.5 it replaces was measured at 0.483 flag precision, with `open` and
   `rare` firing on six cases of ten. The branch's own measurement tooling was
   a third copy of what scripts/eval/ already does and went with the branch. */

/* ── composing a judgement into numbers ──────────────────────────────────
   Jev answers questions; it does not hand back a fit score. These turn its
   answers into the 0-100 pair the app ranks on, in the browser, for free.

   That is the point of storing the raw answers rather than only the numbers:
   every weight below is a policy choice, and changing one re-ranks a list
   that has already been judged without spending another credit on it. The
   model's evidence has not changed, so there is nothing to ask again. */

/* Jev's score levels come back as a probability per level plus an interpolated
   float. The float is NOT used: jev-1.13 is documented as weak at numerical
   calibration and cannot be trusted to place a value between two levels. The
   distribution is the calibrated part, so each level contributes its own
   position weighted by its own probability. */
function scoreFromDist(ans){
  if(!ans || !ans.probabilities) return null;
  const keys = Object.keys(ans.probabilities);
  let top = 0;
  keys.forEach(k => { const n = Number(k); if(n > top) top = n; });
  if(!top) return null;
  let acc = 0, mass = 0;
  keys.forEach(k => {
    const p = Number(ans.probabilities[k]);
    if(isNaN(p)) return;
    acc += (Number(k) / top) * p; mass += p;
  });
  return mass ? Math.max(0, Math.min(100, Math.round(acc / mass * 100))) : null;
}

/* Three questions, because "fit" was always at least two: whether the person
   can do the work, and whether it is the work they want. Capability carries
   more weight — a role someone can do but is not aiming at is still an
   application they could win, while the reverse is a wish.

   fit_exemplar is the third, and it is asked ONLY when the person pasted a
   posting they would apply to today (exemplarOf above). So it is absent from
   most judgements, and from every judgement recorded before it existed --
   fitFromJudgment normalises by the weight it actually found, which is why a
   third key here leaves a row with no exemplar scoring exactly what it scored
   before, to the point.

   0.15, and the small number is the considered part. An exemplar is evidence
   about TARGETING -- the same axis as fit_targeting, stated concretely instead
   of as adjectives -- so the two of them sit on the same side of the sentence
   above, and "the reverse is a wish" only holds while capability outweighs
   both together: 0.6 > 0.4 + 0.15. At 0.3, which this was first written at, it
   did not (0.6 < 0.7), and the eval caught the consequence -- a job the person
   plainly cannot do, matching their pasted posting, outranking one they
   plainly can. The queue would have filled with near-copies of whatever single
   posting they happened to paste.

   What 0.15 buys: a top-to-bottom swing on the exemplar moves fit about 13
   points, which re-orders a shortlist, where adjacent rows sit a few points
   apart, and cannot dictate it. scripts/eval-matcher.js asserts both halves of
   that -- that the exemplar moves fit in each direction, and that it plus
   targeting still lose to capability. */
const FIT_W = {fit_capability:0.6, fit_targeting:0.4, fit_exemplar:0.15};
/* Probabilities by code, from the flags array Jev always returns in full. */
function flagProbs(jv){
  const p = {};
  if(jv && Array.isArray(jv.flags)) jv.flags.forEach(f => { p[f.code] = Number(f.probability); });
  return p;
}
/* Fit is GATED, not just composed, and the gate is the whole reason this did
   not ship when it was first written. Composing capability and targeting alone
   answers "could they do it and do they want it" and nothing else -- so the
   eval measured loc-onsite-berlin at fit 92 against a label of 0-35, a posting
   in the wrong city with no remote allowance, which Jev had correctly flagged
   `loc` at 0.95. The number said "excellent match" about a job the person
   cannot take. DeepSeek's single `s` had those disqualifiers folded in; the
   composition threw them away.

   Only two codes gate, and which two is measured rather than assumed:

     loc    eligibility. A job that cannot be taken has no fit however well the
            work suits them, so fit scales by (1 - p).
     thin   abstention, NOT a disqualifier. The posting leaves the work
