<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#131A21; --panel:#19222B; --panel2:#1F2A34; --line:#2B3945;
    --text:#E2E8ED; --muted:#7D8C99; --dim:#56656F;
    --signal:#E8B04B; --cool:#5FA8C7; --warn:#C4634A; --good:#6FB98F;
    /* Two channel families. Posted roles are amber, cold approaches teal.
       Reachability moves to neutral grey so it stops competing with them. */
    --posted:#E8B04B; --posted-dim:#4a3d22;
    --cold:#4FB3A5;   --cold-dim:#1f3f3b;
    --neutral:#6B7A87;
    --live:#7FA9E8;   /* an active conversation - the most valuable state */
    --disp:'Space Grotesk',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  #app{background:var(--ink);color:var(--text);font-family:var(--disp);
    font-size:14px;line-height:1.5;min-height:100vh;margin:0}
  #app h1,#app h2,#app h3{margin:0;font-weight:500;letter-spacing:-0.01em}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .spacer{flex:1}

  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  .topbar h1{font-size:18px}
  .who{display:flex;align-items:center;gap:9px}
  .av{width:30px;height:30px;border-radius:50%;background:var(--panel2);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:12px;color:var(--signal);flex-shrink:0}
  .who .nm{font-size:13px;line-height:1.2}
  .who .lc{font-size:11px;color:var(--muted);line-height:1.2}
  .pill{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:2px;
    border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.on{color:var(--good);border-color:#31513f}

  /* Tappable UI shouldn't behave like text on a touch screen — without this a
     tap that lingers a few ms selects the label or throws up a callout menu
     instead of registering as a click. */
  button,.tab,.trk,.stp,.dot,.chn,.stage,.pill,.drop,.chip,.tag{
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  button{font-family:var(--disp);font-size:13px;cursor:pointer;border-radius:3px;
    border:1px solid var(--line);background:var(--panel2);color:var(--text);
    padding:8px 13px;transition:.14s}
  button:hover:not(:disabled){border-color:var(--signal);color:var(--signal)}
  button:disabled{opacity:.38;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .btn-go{background:var(--signal);color:#16202a;border-color:var(--signal);font-weight:700}
  .btn-go:hover:not(:disabled){background:#f0c163;color:#16202a;border-color:#f0c163}
  .btn-sm{padding:5px 9px;font-size:12px}
  .btn-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

  textarea,input[type=text],select{width:100%;background:var(--ink);color:var(--text);
    border:1px solid var(--line);border-radius:3px;padding:9px;font-family:var(--mono);
    font-size:12px;resize:vertical}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--cool)}
  select{font-family:var(--disp);font-size:13px}
  label.lab{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}

  .drop{border:1px dashed var(--line);border-radius:4px;padding:20px 14px;text-align:center;
    color:var(--muted);font-size:12px;cursor:pointer;transition:.14s}
  .drop:hover,.drop.over{border-color:var(--signal);color:var(--signal)}

  /* ── onboarding ── */
  .onb{max-width:680px;margin:0 auto;padding:48px 22px 80px}
  .onb .lede{font-size:26px;line-height:1.25;margin:14px 0 10px;letter-spacing:-.02em}
  .onb .say{color:var(--muted);margin:0 0 26px;font-size:14px}
  .steps{display:flex;gap:0;margin-bottom:30px;border-bottom:1px solid var(--line)}
  .stp{flex:1;padding:0 0 9px;font-size:11.5px;color:var(--dim);border-bottom:2px solid transparent;
    font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
  .stp.on{color:var(--signal);border-bottom-color:var(--signal)}
  .stp.did{color:var(--good)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px;
    box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .card + .card{margin-top:12px}
  .kv{display:grid;grid-template-columns:132px 1fr;gap:8px 14px;font-size:13px}
  .kv .k{color:var(--muted);font-size:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11.5px;padding:3px 8px;border-radius:2px;background:var(--panel2);
    border:1px solid var(--line);color:var(--muted)}
  .chip.g{color:var(--good);border-color:#31513f}
  .chip.r{color:var(--warn);border-color:#4d3129}

  .trk{border:1px solid var(--line);border-radius:4px;padding:15px;cursor:pointer;
    transition:.14s;background:var(--panel);margin-bottom:10px}
  .trk:hover{border-color:var(--cool)}
  .trk.sel{border-color:var(--signal);background:var(--panel2)}
  .trk .tl{font-size:15px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:9px}
  .trk .tw{color:var(--muted);font-size:12.5px;margin:0}
  .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:2px 6px;
    border-radius:2px;background:var(--ink);color:var(--dim);text-transform:uppercase}
  .tag.easy{color:var(--good)} .tag.hard{color:var(--warn)} .tag.mid{color:var(--cool)}

  /* ── main app ── */
  .wrap{display:grid;grid-template-columns:288px 1fr}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}.main{order:1}.side{order:2}}
  .side{border-right:1px solid var(--line);padding:18px;background:var(--panel);
    min-height:calc(100vh - 60px)}
  @media(max-width:900px){.side{border-right:none;border-top:1px solid var(--line);min-height:0}}
  .main{padding:20px 22px 60px;min-width:0}
  .block{margin-bottom:22px}
  .block > .eyebrow{display:block;margin-bottom:9px}

  .plotwrap{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .plothead{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;flex-wrap:wrap}
  svg.plot{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
  .dot{cursor:pointer}
  .quadlabel{font-family:var(--mono);font-size:8px;fill:var(--dim);letter-spacing:.1em}

  .stats{display:flex;gap:20px;flex-wrap:wrap;margin:14px 0 22px}
  .stat .k{font-family:var(--mono);font-size:24px;color:var(--signal);line-height:1}
  .stat .l{font-size:11px;color:var(--muted);margin-top:3px}

  .job{border:1px solid var(--line);border-left:2px solid var(--dim);border-radius:3px;
    background:var(--panel);padding:13px 15px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .job.hi{border-left-color:var(--signal)}
  .job.ch-posted{border-left-color:var(--posted)}
  .job.ch-cold{border-left-color:var(--cold)}
  .job.ch-cold .jscore .big{color:var(--cold)}
  .job.st-live{border-left-color:var(--live);background:linear-gradient(90deg,rgba(127,169,232,.06),transparent 40%)}
  .job.st-due{border-left-color:var(--warn)}
  .stage{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 7px;border-radius:2px;border:1px solid var(--line);color:var(--muted)}
  .stage.s-new{color:var(--muted)}
  .stage.s-sent{color:var(--neutral);border-color:#3a464f}
  .stage.s-due{color:var(--warn);border-color:#4d3129}
  .stage.s-live{color:var(--live);border-color:#33445f}
  .stage.s-closed{color:var(--dim)}
  .chn{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 7px;border-radius:2px}
  .chn.posted{color:var(--posted);background:var(--posted-dim)}
  .chn.cold{color:var(--cold);background:var(--cold-dim)}
  .btn-cold{background:var(--cold);color:#0d1f1d;border-color:var(--cold);font-weight:700}
  .btn-cold:hover:not(:disabled){background:#63c7b8;color:#0d1f1d;border-color:#63c7b8}

  /* ── daily dashboard ── */
  .sect{margin-bottom:26px}
  .sect-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .sect-h h3{font-size:15px}
  .sect-h .ct{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .sect-sub{color:var(--muted);font-size:12px;margin:0 0 12px}
  .sect.live .sect-h h3{color:var(--live)}
  .sect.due .sect-h h3{color:var(--warn)}

  /* ── contacts ── */
  .ct-row{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
  .ct-row:first-of-type{border-top:none}
  .ct-nm{font-size:13px}
  .ct-meta{font-size:11px;color:var(--muted);font-family:var(--mono);word-break:break-all}
  .ct-none{color:var(--dim);font-size:12px;padding:8px 0}
  .log{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:7px 0}
  .log b{color:var(--text);font-weight:500}
  .log .when{font-family:var(--mono);font-size:10px;color:var(--dim)}
  .job.done{opacity:.42}
  .jrow{display:flex;gap:12px;align-items:flex-start}
  .jt{font-size:15px;font-weight:500;margin-bottom:2px}
  .jc{color:var(--muted);font-size:12px}
  .jscore{text-align:right;flex-shrink:0;font-family:var(--mono)}
  .jscore .big{font-size:19px;color:var(--signal);line-height:1}
  .jscore .sm{font-size:10px;color:var(--dim);margin-top:2px}
  .jreason{font-size:12px;color:var(--muted);margin:8px 0 0;font-style:italic}
  .flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .flag{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:2px;
    background:var(--panel2);color:var(--muted);letter-spacing:.04em}
  .flag.g{color:var(--good)} .flag.r{color:var(--warn)}
  .jacts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;align-items:center}
  a.lnk{color:var(--cool);text-decoration:none;font-size:12px;font-family:var(--mono)}
  a.lnk:hover{text-decoration:underline}
  .bar{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%}

  .empty{border:1px dashed var(--line);border-radius:4px;padding:34px 20px;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--text);font-size:15px;font-weight:500;margin-bottom:6px}
  .prog{height:2px;background:var(--panel2);border-radius:1px;overflow:hidden;margin-top:8px}
  .prog i{display:block;height:100%;background:var(--signal);transition:width .3s}

  .modal{position:fixed;inset:0;background:rgba(8,12,16,.82);display:flex;
    align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:5px;
    max-width:620px;width:100%;max-height:84vh;overflow:auto;padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}

  .tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--signal);border-bottom-color:var(--signal)}
  .tab:hover{color:var(--text)}
  @media(max-width:480px){
    .tabs{flex-wrap:wrap;row-gap:10px}
    .tabs .spacer{flex-basis:100%;height:0}
    .tab{padding:6px 10px 8px}
  }

  .hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.45}
  .err{color:var(--warn);font-size:12px;margin-top:8px;font-family:var(--mono)}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
    border-top-color:var(--signal);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"><div id="root"></div></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);

const COLS = ["title","company","location","url","description","status","date_applied",
  "follow_up_date","hr_contact","pitch_sent","notes","source","query",
  "ai_score","ai_reason","ai_flags","ai_confidence","ai_reachability","channel",
  "stage","last_touch","contacts","events"];

/* Pipeline stages. Deliberately few — every extra state is one more decision
   the person has to make about a row instead of acting on it.
     new    scored, untouched
     sent   applied or messaged, waiting
     live   they replied. the only state where a human is on the other end
     closed rejected, withdrawn, or given up on
   'due' is not stored. It is derived: sent, and the follow-up date has passed.
   Storing it would mean rewriting rows on a timer just to keep them honest. */
const STAGES = ["new","sent","live","closed"];
const FOLLOWUP_DAYS = 7;

/* ═══ state ═══
   Multi-profile. Each person who uses this gets their own entry:
   their parsed profile, their chosen track, their own job list. */
let DB = { profiles:{}, current:null };
let KEY  = '';           // LLM key (DeepSeek or Anthropic)
let PROV = 'deepseek';   // 'deepseek' | 'anthropic'
let APIFY= '';           // Apify token for live LinkedIn search
let CHFILT = 'all';      // 'all' | 'posted' | 'cold'
let VIEW = 'onb';        // 'onb' | 'app'
let ONB  = { step:0, raw:'', fileName:'', parsed:null, track:null, error:'',
             assessing:false, assessed:null, assessErr:'', wantText:'' };
let RANGE = null, TAB = 'map', busy = false;

const P = () => DB.profiles[DB.current] || null;

/* ═══ storage ═══
   Two homes. Inside Claude's artifact viewer window.storage exists and is the
   only thing that works. Opened as a downloaded file there is no window.storage,
   so fall back to localStorage, which works there and is blocked in the viewer.
   Use whichever is actually available. */
const HAS_WS = typeof window.storage !== 'undefined' && window.storage
               && typeof window.storage.get === 'function';
async function put(k,v){
  if(HAS_WS){ try{ await window.storage.set(k,v); return; }catch(e){} }
  try{ localStorage.setItem(k,v); }catch(e){ console.error('save failed',e); }
}
async function get(k){
  if(HAS_WS){ try{ const r=await window.storage.get(k); return r?r.value:null; }catch(e){ return null; } }
  try{ return localStorage.getItem(k); }catch(e){ return null; }
}
async function save(){ await put('triage:db', JSON.stringify(DB)); }
async function load(){
  try{
    const v = await get('triage:db');
    if(v){ const d=JSON.parse(v); DB.profiles=d.profiles||{}; DB.current=d.current||null; }
  }catch(e){}
  KEY   = (await get('triage:key'))   || '';
  PROV  = (await get('triage:prov'))  || 'deepseek';
  APIFY = (await get('triage:apify')) || '';
}

/* ═══ Apify: live LinkedIn search ═══
   Ported from the Python scanner, same actor and same confirmed input schema.
   Apify's REST API does send CORS headers, so this runs from the browser.
   The token is stored locally and sent only to Apify — but it is a real
   credential, so this file should not be shared with the token saved in it. */
const APIFY_ACTOR = "curious_coder~linkedin-jobs-scraper";
const APIFY_BASE  = "https://api.apify.com/v2";

function buildLiUrl(query){
  const parts = String(query).split("|");
  const kw = encodeURIComponent(parts[0].trim());
  const loc = (parts[1]||"").trim();
  if(loc.toLowerCase()==="remote"){
    // geoId 92000000 + Worldwide is LinkedIn's real "remote, any country" scope.
    // f_WT=2 on its own has no location context and silently resolves to
    // wherever the request appears to come from, which is why remote searches
    // used to come back US-only.
    return "https://www.linkedin.com/jobs/search?keywords="+kw+"&f_WT=2&geoId=92000000&location=Worldwide";
  }
  return "https://www.linkedin.com/jobs/search?keywords="+kw+"&location="+
         encodeURIComponent(loc+", India");
}
const pick = (item,keys,contains) => {
  const map={}; Object.keys(item).forEach(k=>map[k.toLowerCase()]=k);
  for(const c of keys){ const k=map[c.toLowerCase()]; if(k&&item[k]) return item[k]; }
  if(contains){ for(const lk in map){ if(lk.includes(contains)&&item[map[lk]]) return item[map[lk]]; } }
  return "";
};

/* ═══ ATS feeds ═══
   The best data source in the app, and the only one that costs nothing.

   Most companies' careers pages are a thin shell over one of a handful of
   applicant tracking systems, and those systems publish the underlying jobs as
   public JSON. No key, no token, no proxy, no Apify run. These are the same
   endpoints the careers page itself calls, so they are complete, live, and do
   not break when someone redesigns the site.

   They also solve the confidence problem: Google gives a two-line snippet, an
   ATS feed gives the entire job description. Every row pulled this way scores
   high-confidence instead of thin_data.

   CORS: these endpoints are built to be called from customer career sites, so
   they send permissive headers and work from the browser. If one is ever
   blocked, it will fail as a network error, not a 4xx. */

const ATS = {
  greenhouse:{
    label:"Greenhouse",
    host:/(?:job-)?boards\.greenhouse\.io\/([^/?#]+)/i,
    url:s=>`https://boards-api.greenhouse.io/v1/boards/${encodeURIComponent(s)}/jobs?content=true`,
    parse:(d,slug)=>(d.jobs||[]).map(x=>({
      title:x.title||"", location:(x.location&&x.location.name)||"",
      url:x.absolute_url||"", posted:(x.updated_at||"").slice(0,10),
      // Greenhouse returns the description HTML-encoded inside a JSON string.
      desc:decodeHTML(String(x.content||"")), dept:((x.departments||[])[0]||{}).name||""
    }))
  },
  lever:{
    label:"Lever",
    host:/jobs\.lever\.co\/([^/?#]+)/i,
    url:s=>`https://api.lever.co/v0/postings/${encodeURIComponent(s)}?mode=json`,
    parse:d=>(Array.isArray(d)?d:[]).map(x=>({
      title:x.text||"", location:(x.categories&&x.categories.location)||"",
      url:x.hostedUrl||x.applyUrl||"",
      posted:x.createdAt?new Date(x.createdAt).toISOString().slice(0,10):"",
      desc:stripTags(String(x.descriptionPlain||x.description||"")),
      dept:(x.categories&&(x.categories.team||x.categories.department))||""
    }))
  },
  ashby:{
    label:"Ashby",
    host:/jobs\.ashbyhq\.com\/([^/?#]+)/i,
    url:s=>`https://api.ashbyhq.com/posting-api/job-board/${encodeURIComponent(s)}?includeCompensation=true`,
    parse:d=>(d.jobs||[]).map(x=>({
      title:x.title||"", location:x.location||"",
      url:x.jobUrl||x.applyUrl||"", posted:(x.publishedAt||"").slice(0,10),
      desc:stripTags(String(x.descriptionPlain||x.descriptionHtml||"")),
      dept:x.department||"",
      // Ashby is the one feed with reliable pay data, so keep it when present.
      pay:x.compensation&&x.compensation.compensationTierSummary||""
    }))
  }
};

function decodeHTML(str){
  const t=document.createElement("textarea"); t.innerHTML=str;
  return stripTags(t.value);
}
const stripTags = h => String(h).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();

/* Turning a company NAME into an ATS slug is the whole difficulty of this
   feature. A URL is unambiguous; a name is not. "Deployment Inc" could be
   deploymentinc, deployment-inc, deployment, or something unrelated.

   Rather than make the person go and find each careers page by hand, try the
   handful of forms companies actually use. Each miss is a cheap 404, and we
   stop at the first hit. Anything still unfound falls through to a Google
   lookup afterwards, which is what a person would have done manually anyway. */
function slugVariants(name){
  const base=String(name).toLowerCase().trim()
    // Drop the corporate suffixes almost nobody puts in a board slug.
    .replace(/\b(inc|llc|ltd|limited|corp|corporation|co|gmbh|pvt|private|technologies|technology|labs|ai)\b\.?/g,' ')
    .replace(/[^a-z0-9 -]/g,' ').replace(/\s+/g,' ').trim();
  const squashed=base.replace(/[\s-]/g,'');
  const hyphen=base.replace(/\s+/g,'-');
  const firstWord=base.split(' ')[0]||'';
  // Keep the AI suffix version too: plenty of companies do use it (sarvamai).
  const withAi=String(name).toLowerCase().replace(/[^a-z0-9]/g,'');
  return [...new Set([squashed,hyphen,firstWord,withAi].filter(x=>x&&x.length>1))].slice(0,4);
}

/* Accepts a careers URL, "platform:slug", or a bare company name. */
function parseAtsTarget(line){
  const t=String(line).trim(); if(!t) return [];
  for(const k in ATS){
    const m=t.match(ATS[k].host);
    if(m) return [{platform:k,slug:m[1],exact:true}];
  }
  const explicit=t.match(/^(greenhouse|lever|ashby)\s*[:/]\s*(.+)$/i);
  if(explicit) return [{platform:explicit[1].toLowerCase(),slug:explicit[2].trim(),exact:true}];
  if(/^https?:\/\//i.test(t)) return [];        // some other careers page; Google will have to find it
  const out=[];
  slugVariants(t).forEach(sl=>Object.keys(ATS).forEach(k=>out.push({platform:k,slug:sl,name:t})));
  return out;
}

/* Last resort: ask Google where this company's board lives. This is exactly the
   manual step it saves — one search per company, and the slug falls out of the
   URL. Needs the Apify token; without it, unfound companies are just reported. */
async function findBoardsViaGoogle(names, onStatus){
  if(!APIFY || !APIFY.startsWith("apify_api_")) return {};
  const qs=names.slice(0,10).map(n=>
    `"${n}" (site:boards.greenhouse.io OR site:job-boards.greenhouse.io OR site:jobs.lever.co OR site:jobs.ashbyhq.com)`);
  if(!qs.length) return {};
  if(onStatus) onStatus(`looking up ${qs.length} careers page${qs.length>1?'s':''}\u2026`);
  const H={"Authorization":"Bearer "+APIFY,"Content-Type":"application/json"};
  const payload={queries:qs.join("\n"),languageCode:"en",maxPagesPerQuery:1,resultsPerPage:5,mobileResults:false};
  let r;
  try{ r=await fetch(APIFY_BASE+"/acts/"+APIFY_GOOGLE+"/runs",{method:"POST",headers:H,body:JSON.stringify(payload)}); }
  catch(e){ return {}; }
  if(!r.ok) return {};
  const d=(await r.json()).data||{};
  let status="RUNNING", waited=0;
  while(status==="RUNNING"||status==="READY"){
    await new Promise(z=>setTimeout(z,6000)); waited+=6;
    if(waited>300) return {};
    const pr=await fetch(APIFY_BASE+"/acts/"+APIFY_GOOGLE+"/runs/"+d.id,{headers:H});
    status=((await pr.json()).data||{}).status||"UNKNOWN";
    if(onStatus) onStatus(`looking up careers pages \u2014 ${status.toLowerCase()}, ${waited}s`);
    if(status==="SUCCEEDED") break;
    if(["FAILED","TIMED-OUT","ABORTED"].includes(status)) return {};
  }
  const dr=await fetch(APIFY_BASE+"/datasets/"+d.defaultDatasetId+"/items?clean=true&format=json",{headers:H});
  const items=await dr.json();
  const map={};
  (items||[]).forEach(item=>{
    const term=((item.searchQuery||{}).term)||"";
    const name=(term.match(/^"([^"]+)"/)||[])[1];
    if(!name || map[name]) return;
    for(const res of (item.organicResults||[])){
      for(const k in ATS){
        const m=String(res.url||"").match(ATS[k].host);
        if(m){ map[name]={platform:k,slug:m[1],exact:true}; return; }
      }
    }
  });
  return map;
}

async function atsPull(platform, slug){
  const cfg=ATS[platform]; if(!cfg) return null;
  let r;
  try{ r=await fetch(cfg.url(slug),{headers:{"Accept":"application/json"}}); }
  catch(e){ throw new Error("network"); }
  if(r.status===404||r.status===400) return null;   // wrong slug or wrong platform
  if(!r.ok) throw new Error(cfg.label+" returned "+r.status);
  let d; try{ d=await r.json(); }catch(e){ return null; }
  const rows=cfg.parse(d,slug)||[];
  if(!rows.length) return null;
  return {platform,slug,label:cfg.label,rows};
}

async function atsSearch(lines, onStatus){
  const found=[], unresolved=[];
  const tryCands=async(cands,label)=>{
    for(const c of cands){
      if(onStatus) onStatus(`checking ${c.slug} on ${ATS[c.platform].label}\u2026`);
      try{
        const res=await atsPull(c.platform,c.slug);
        if(res){ res.name=label||res.slug; return res; }
      }catch(e){
        if(e.message==="network") throw new Error(
          "The ATS feed was blocked by the browser. This normally works \u2014 try again, or add these by hand.");
      }
    }
    return null;
  };

  // Pass one: URLs resolve immediately; names get their likely slugs tried.
  for(const line of lines){
    const cands=parseAtsTarget(line);
    if(!cands.length){ unresolved.push(line); continue; }
    const hit=await tryCands(cands,line);
    if(hit) found.push(hit); else unresolved.push(line);
  }

  // Pass two: whatever is left, ask Google to locate. This is the step that
  // means nobody has to go hunting for careers URLs by hand.
  const misses=[];
  if(unresolved.length){
    let map={};
    try{ map=await findBoardsViaGoogle(unresolved,onStatus); }catch(e){ map={}; }
    for(const line of unresolved){
      const c=map[line];
      if(!c){ misses.push(line); continue; }
      const hit=await tryCands([c],line);
      if(hit){ hit.viaGoogle=true; found.push(hit); } else misses.push(line);
    }
  }
  return {found,misses};
}

/* Hiring velocity. Posting counts over time say more about whether a cold
   approach will land than any static company attribute: a team adding roles is
   building, a team that stopped is not. Snapshot on every pull so the delta is
   there next time. */
async function recordVelocity(slug, count){
  const p=P(); if(!p) return;
  p.velocity = p.velocity || {};
  const hist = p.velocity[slug] || [];
  if(!hist.length || hist[0].on !== today()) hist.unshift({on:today(),count});
  else hist[0].count = count;
  p.velocity[slug] = hist.slice(0,12);
}
function velocityNote(slug){
  const p=P(); const h=(p&&p.velocity&&p.velocity[slug])||[];
  if(h.length<2) return "";
  const d=h[0].count-h[1].count;
  if(d>0) return `+${d} since ${h[1].on} \u2014 they're building`;
  if(d<0) return `${d} since ${h[1].on}`;
  return `flat since ${h[1].on}`;
}

/* ═══ Apify: board search via Google ═══
   LinkedIn is one pipe, and for most careers it is the wrong one. Academic
   posts live on registries like linguistlist.org and academicjobsonline.org and
   are essentially never on LinkedIn; startup roles cluster on YC and Ashby;
   every field has its own. None of those have a dedicated scraper worth paying
   for, but the profile already knows which domains matter, so site: queries
   through the Google actor reach all of them with one component.

   Same actor, same polling shape as the Python backfill. The only difference is
   what we do with the results: each organic hit becomes a new row instead of
   patching an existing one. */
const APIFY_GOOGLE = "apify~google-search-scraper";

function buildBoardQueries(titles, boards, where){
  const qs=[];
  (boards||[]).slice(0,8).forEach(b=>{
    (titles||[]).slice(0,4).forEach(t=>{
      qs.push(`site:${b} "${t}"` + (where?` ${where}`:''));
    });
  });
  return qs.slice(0,32);
}

async function apifyBoardSearch(queries, countryCode, onStatus){
  if(!APIFY || !APIFY.startsWith("apify_api_")) throw new Error("NEEDAPIFY");
  const H={"Authorization":"Bearer "+APIFY,"Content-Type":"application/json"};
  // Schema confirmed against apify.com/apify/google-search-scraper:
  // queries is a newline-separated STRING, not an array.
  const payload={queries:queries.join("\n"),countryCode:countryCode||"",
    languageCode:"en",maxPagesPerQuery:1,resultsPerPage:10,mobileResults:false};
  let r;
  try{
    r=await fetch(APIFY_BASE+"/acts/"+APIFY_GOOGLE+"/runs",{method:"POST",headers:H,body:JSON.stringify(payload)});
  }catch(e){ throw new Error("Couldn't reach Apify."); }
  if(r.status===401||r.status===403) throw new Error("NEEDAPIFY");
  if(!r.ok) throw new Error("Apify returned "+r.status);
  const d=(await r.json()).data||{};
  const runId=d.id, dsId=d.defaultDatasetId;
  if(!runId) throw new Error("Apify wouldn't start the run.");

  let status="RUNNING", waited=0;
  while(status==="RUNNING"||status==="READY"){
    await new Promise(z=>setTimeout(z,6000)); waited+=6;
    if(waited>600) throw new Error("Apify timed out after 10 minutes.");
    const pr=await fetch(APIFY_BASE+"/acts/"+APIFY_GOOGLE+"/runs/"+runId,{headers:H});
    status=((await pr.json()).data||{}).status||"UNKNOWN";
    if(onStatus) onStatus(`searching ${queries.length} board queries — ${status.toLowerCase()}, ${waited}s`);
    if(status==="SUCCEEDED") break;
    if(["FAILED","TIMED-OUT","ABORTED"].includes(status)) throw new Error("Apify run "+status);
  }
  const dr=await fetch(APIFY_BASE+"/datasets/"+dsId+"/items?clean=true&format=json",{headers:H});
  const items=await dr.json();

  const out=[];
  (items||[]).forEach(item=>{
    const term=((item.searchQuery||{}).term)||"";
    (item.organicResults||[]).forEach(res=>{
      const u=String(res.url||"");
      if(!u) return;
      const j=blank();
      // Google's title is usually "Job Title - Employer - Board". Take the first
      // segment as the title and the second as the employer when it looks right;
      // the scorer sees the full snippet either way, so a bad split is survivable.
      const raw=String(res.title||"").trim();
      const bits=raw.split(/\s+[\u2013\u2014|-]\s+/);
      j.title = (bits[0]||raw).slice(0,180) || "[No Title]";
      j.company = (bits.length>1 ? bits[1] : "").slice(0,120) || "[from search — verify]";
      j.url = u;
      j.description = String(res.description||"").slice(0,900);
      j.source = "Board search"; j.query = term; j.status="New"; j.channel="posted";
      j.notes = "Found via "+ (u.replace(/^https?:\/\//,'').split('/')[0]);
      out.push(j);
    });
  });
  return out;
}

/* ═══ Apify: HR / recruiter contact finder ═══
   Job postings almost never link to the company's own site — LinkedIn and ATS
   pages point back to themselves — so this is two actor calls chained the same
   way atsSearch's Google fallback is: find the domain, then crawl it. The
   crawl only reads pages the company itself published (careers, about, team),
   never LinkedIn profiles directly, and costs a few cents per company on the
   same Apify account already paying for search. */
const RECRUITER_ACTOR = "scrapepilot~recruiter-lead-finder-hr-talent-acquisition-contacts";
const NOT_COMPANY_SITE = /linkedin\.com|indeed\.com|glassdoor\.com|wellfound\.com|angel\.co|crunchbase\.com|facebook\.com|twitter\.com|x\.com|instagram\.com|ycombinator\.com|builtin\.com|monster\.com|ziprecruiter\.com|ambitionbox\.com|ridewheel\.com/i;

async function findCompanyDomain(company, onStatus){
  if(!APIFY || !APIFY.startsWith("apify_api_")) throw new Error("NEEDAPIFY");
  const H={"Authorization":"Bearer "+APIFY,"Content-Type":"application/json"};
  const payload={queries:`"${company}" official website`,languageCode:"en",maxPagesPerQuery:1,resultsPerPage:8,mobileResults:false};
  let r;
  try{ r=await fetch(APIFY_BASE+"/acts/"+APIFY_GOOGLE+"/runs",{method:"POST",headers:H,body:JSON.stringify(payload)}); }
  catch(e){ throw new Error("Couldn't reach Apify."); }
  if(r.status===401||r.status===403) throw new Error("NEEDAPIFY");
  if(!r.ok) throw new Error("Apify returned "+r.status);
  const d=(await r.json()).data||{};
  let status="RUNNING", waited=0;
  while(status==="RUNNING"||status==="READY"){
    await new Promise(z=>setTimeout(z,4000)); waited+=4;
    if(waited>120) throw new Error("Timed out looking up "+company+"'s website.");
    const pr=await fetch(APIFY_BASE+"/acts/"+APIFY_GOOGLE+"/runs/"+d.id,{headers:H});
    status=((await pr.json()).data||{}).status||"UNKNOWN";
    if(onStatus) onStatus(`finding ${company}'s website — ${status.toLowerCase()}, ${waited}s`);
    if(status==="SUCCEEDED") break;
    if(["FAILED","TIMED-OUT","ABORTED"].includes(status)) throw new Error("Apify run "+status);
  }
  const dr=await fetch(APIFY_BASE+"/datasets/"+d.defaultDatasetId+"/items?clean=true&format=json",{headers:H});
  const items=await dr.json();
  for(const item of (items||[])){
    for(const res of (item.organicResults||[])){
      try{
        const host=new URL(res.url).hostname.replace(/^www\./,'');
        if(host && !NOT_COMPANY_SITE.test(host)) return host;
      }catch(e){}
    }
  }
  return null;
}

function slugToName(url){
  const m=String(url).match(/linkedin\.com\/in\/([a-z0-9\-]+)/i);
  if(!m) return '';
  return m[1].replace(/-[a-f0-9]{4,}$/i,'').split('-').filter(Boolean)
    .map(s=>s[0].toUpperCase()+s.slice(1)).join(' ');
}

async function findHrContacts(company, onStatus){
  if(!APIFY || !APIFY.startsWith("apify_api_")) throw new Error("NEEDAPIFY");
  const domain = await findCompanyDomain(company, onStatus);
  if(!domain) throw new Error("Couldn't work out "+company+"'s own website from a search.");
  if(onStatus) onStatus(`checking ${domain} for HR and recruiting contacts…`);
  const H={"Authorization":"Bearer "+APIFY,"Content-Type":"application/json"};
  const payload={startUrls:[{url:"https://"+domain}],maxPagesPerDomain:15,
    targetKeywords:["hr","human resources","recruiter","recruiting","talent acquisition","people team","hiring manager","careers","people ops"]};
  let r;
  try{ r=await fetch(APIFY_BASE+"/acts/"+RECRUITER_ACTOR+"/runs",{method:"POST",headers:H,body:JSON.stringify(payload)}); }
  catch(e){ throw new Error("Couldn't reach Apify."); }
  if(r.status===401||r.status===403) throw new Error("NEEDAPIFY");
  if(!r.ok) throw new Error("Apify returned "+r.status);
  const d=(await r.json()).data||{};
  const runId=d.id, dsId=d.defaultDatasetId;
  if(!runId) throw new Error("Apify wouldn't start the run.");
  let status="RUNNING", waited=0;
  while(status==="RUNNING"||status==="READY"){
    await new Promise(z=>setTimeout(z,5000)); waited+=5;
    if(waited>240) throw new Error("Apify timed out after 4 minutes.");
    const pr=await fetch(APIFY_BASE+"/acts/"+RECRUITER_ACTOR+"/runs/"+runId,{headers:H});
    status=((await pr.json()).data||{}).status||"UNKNOWN";
    if(onStatus) onStatus(`scanning ${domain} — ${status.toLowerCase()}, ${waited}s`);
    if(status==="SUCCEEDED") break;
    if(["FAILED","TIMED-OUT","ABORTED"].includes(status)) throw new Error("Apify run "+status);
  }
  const dr=await fetch(APIFY_BASE+"/datasets/"+dsId+"/items?clean=true&format=json",{headers:H});
  const items=await dr.json();

  // The actor's exact output keys aren't fixed anywhere public, so this reads
  // them the same tolerant way as every other Apify parser in this file (pick()
  // above): try the plausible names, don't crash if the shape is a little off.
  const seen=new Set(), out=[];
  (items||[]).forEach(it=>{
    const type=String(pick(it,["type","contactType"])||'').toLowerCase();
    const val=String(pick(it,["value","contactValue"])||'');
    let email=pick(it,["email","emailAddress"]) || (type==='email'?val:(val.includes('@')?val:''));
    let linkedin=pick(it,["linkedin","linkedinUrl","profileUrl"]) || (type==='linkedin'||val.includes('linkedin.com')?val:'');
    if(!email && !linkedin) return;
    const key=(email||linkedin).toLowerCase();
    if(seen.has(key)) return; seen.add(key);
    const titles=pick(it,["jobTitles","matchedKeywords","titles"]);
    out.push({
      name: linkedin ? slugToName(linkedin) : '',
      role: Array.isArray(titles) ? titles.slice(0,3).join(', ') : String(titles||''),
      email: email||'', linkedin: linkedin||''
    });
  });
  if(!out.length) throw new Error("Checked "+domain+" but found no public HR or recruiting contacts on it.");
  return out;
}

/* ═══ LLM ═══
   Two providers. DeepSeek is the default because it is roughly 20x cheaper per
   token than a frontier model and this workload — structured scoring against a
   fixed rubric — is exactly the kind of task where that trade is worth taking.
   Anthropic stays available as a fallback, and is the only one that works with
   no key at all when this file is opened inside Claude itself.

   One caveat that is not in our control: calling any LLM API straight from a
   browser depends on that provider sending permissive CORS headers. Anthropic
   documents a header for it. DeepSeek does not document browser use either way,
   so if DeepSeek fails with a network error and the key is definitely right,
   that is CORS, and the fix is to switch provider rather than to retry. */
const LLM = {
  deepseek: {
    url:"https://api.deepseek.com/chat/completions",
    label:"DeepSeek",
    keyPrefix:"sk-",
    where:"platform.deepseek.com → API keys",
    headers:k=>({"Content-Type":"application/json","Authorization":"Bearer "+k}),
    body:(prompt,mt)=>({model:"deepseek-chat",max_tokens:mt||1400,
      messages:[{role:"user",content:prompt}],temperature:0.2}),
    read:d=>((d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"").trim()
  },
  anthropic: {
    url:"https://api.anthropic.com/v1/messages",
    label:"Anthropic",
    keyPrefix:"sk-ant-",
    where:"console.anthropic.com → API keys",
    headers:k=>{const h={"Content-Type":"application/json"};
      if(k){h["x-api-key"]=k;h["anthropic-version"]="2023-06-01";
        h["anthropic-dangerous-direct-browser-access"]="true";} return h;},
    body:(prompt,mt)=>({model:"claude-sonnet-4-6",max_tokens:mt||1400,
      messages:[{role:"user",content:prompt}]}),
    read:d=>(d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("").trim()
  }
};

async function claude(prompt, maxTok){
  const cfg = LLM[PROV] || LLM.deepseek;
  // Anthropic inside the Claude viewer needs no key; DeepSeek always does.
  if(!KEY && PROV!=="anthropic") throw new Error("NEEDKEY");
  let res;
  try{
    res = await fetch(cfg.url,{method:"POST",headers:cfg.headers(KEY),
      body:JSON.stringify(cfg.body(prompt,maxTok))});
  }catch(e){
    throw new Error(KEY
      ? "Couldn't reach "+cfg.label+". If the key is right, this is the browser being blocked \u2014 try the other provider."
      : "NEEDKEY");
  }
  if(res.status===401||res.status===403) throw new Error("NEEDKEY");
  if(!res.ok){
    let d=''; try{const j=await res.json(); d=(j.error&&j.error.message)?': '+j.error.message:'';}catch(e){}
    throw new Error(cfg.label+" returned "+res.status+d);
  }
  const out = cfg.read(await res.json());
  if(!out) throw new Error(cfg.label+" returned an empty response.");
  return out;
}

function grabJSON(txt){
  let t = txt.replace(/^```(?:json)?/,'').replace(/```$/,'').trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a>=0 && b>a) t=t.slice(a,b+1);
  return JSON.parse(t);
}

/* ═══ profile extraction ═══
   This is what makes the tool work for anyone. It reads whatever CV-ish
   markdown a person drops in and turns it into the structured facts the
   scorer needs: where they are, what level they're at, what they can
   honestly claim, what they can't, and which directions are open. */
const EXTRACT_PROMPT = raw => `Read this person's career profile and extract a structured summary.

Return ONLY a JSON object, no preamble, no markdown fences:
{

 "country":"",

 "years_experience":0,
 "seniority":"junior|mid|senior|lead",
 "domains":["3-6 fields they have real experience in"],
 "strengths":["4-7 specific things they can actually do, concrete not generic"],
 "hard_skills":["6-12 named tools, systems or disciplines from the profile"],
 "unusual_combination":"one sentence on what makes this person's mix rare, or empty string",
 "gaps":["3-6 things they honestly CANNOT claim: missing credentials, missing experience"],
 "wrong_shapes":["3-6 kinds of role they should not apply to, and why in a few words"],
 "tracks":[
   {"id":"slug","label":"Job family name","difficulty":"easy|moderate|moonshot",
    "why":"one sentence: why this fits them specifically",
    "titles":["5-8 real job titles to search for"],
    "boards":["4-8 domains where THIS KIND of job is actually posted"]}
 ]
}

Rules for tracks: give 3 or 4. Order them from most obvious to most ambitious.
"easy" = they could get this now with what's on the page.
"moderate" = a real but winnable step across.
"moonshot" = plausible but they'd be an unusual hire, and would need to be argued for.
Base every track on evidence in the profile. Do not invent a direction the profile doesn't support.

Rules for gaps: be honest and specific. These stop the tool from recommending roles the person cannot win. If the profile states its own limitations, use them.

Rules for boards: this is the most important field to get right. For each track, list the domains where that specific kind of job is genuinely advertised - not generic job sites. Give bare domains, no protocol, no path. Think about where people in that field actually look:
- Academic and research posts are advertised on field-specific registries and university systems, almost never on general job sites. A linguistics post goes to linguistlist.org, academicjobsonline.org, jobs.ac.uk, apply.interfolio.com, higheredjobs.com, euraxess.ec.europa.eu, chroniclevitae.com - not to linkedin.com.
- Startup and tech roles cluster on ycombinator.com, wellfound.com, lever.co, greenhouse.io, ashbyhq.com, jobs.ashbyhq.com.
- Public sector, NGO and development roles have their own registries entirely.
- Medicine, law, teaching, trades, design, and creative fields each have their own.
Only include linkedin.com or indeed.com for a track where those genuinely are where the jobs are. If you are unsure for a field, prefer the specialist registry over the general one.

Rules generally: use ONLY what is in the profile below. Do not invent experience, employers, metrics or skills. If something isn't stated, leave it out.

PROFILE:
${String(raw).slice(0,16000)}`;

async function extractProfile(raw){
  const txt = await claude(EXTRACT_PROMPT(raw), 2000);
  const p = grabJSON(txt);
  p.name = p.name || 'Unnamed';
  p.tracks = Array.isArray(p.tracks) && p.tracks.length ? p.tracks : [{
    id:'general', label:'General search', difficulty:'moderate',
    why:'Broad search across everything in the profile.', titles:[]
  }];
  ['domains','strengths','hard_skills','gaps','wrong_shapes'].forEach(k=>{
    if(!Array.isArray(p[k])) p[k]=[];
  });
  p.tracks.forEach(t=>{
    if(!Array.isArray(t.titles)) t.titles=[];
    if(!Array.isArray(t.boards)) t.boards=[];
    // Strip protocol/path if the model returned a URL rather than a bare domain.
    t.boards = t.boards.map(b=>String(b).replace(/^https?:\/\//,'').replace(/\/.*$/,'').trim())
                       .filter(Boolean);
  });
  return p;
}

/* ═══ company discovery ═══
   The person should not have to already know who to approach. Naming the
   companies is the hardest part of a cold search and the part they are least
   equipped to do — they know their own work, not the shape of the market.

   Two steps, and the split matters. The model proposes companies where this
   specific background would be unusually valuable. Then the ATS layer checks
   which of them are actually hiring. A company with open roles becomes a normal
   application; a company with none becomes a cold approach. Same list, sorted
   by reality rather than by guesswork. */
async function suggestCompanies(prof, trk, extra){
  const txt = await claude(`Name companies a specific person should approach about work.

THE PERSON
Based in: ${prof.location||'unspecified'}${prof.country?', '+prof.country:''}
Level: ${prof.seniority||'unspecified'}${prof.years_experience?` (~${prof.years_experience} years)`:''}
In short: ${prof.headline||''}
Fields they know: ${(prof.domains||[]).join('; ')}
What they can actually do: ${(prof.strengths||[]).join('; ')}
Skills: ${(prof.hard_skills||[]).join(', ')}
${prof.unusual_combination?`What is rare about them: ${prof.unusual_combination}`:''}
Honest gaps: ${(prof.gaps||[]).join('; ')||'none stated'}

THE DIRECTION THEY ARE PURSUING: ${trk.label||'general'}${trk.why?` — ${trk.why}`:''}
${extra?`ADDITIONAL STEER FROM THEM: ${String(extra).slice(0,300)}`:''}

Return ONLY a JSON object, no preamble, no markdown fences:
{"companies":[{
  "name":"exact company name",
  "location":"city, country, or Remote",
  "stage":"seed|series-a|series-b|series-c|growth|public|agency|nonprofit|university|government",
  "why":"one sentence, max 22 words: why THIS person specifically, not a generic candidate",
  "overlap":"the single concrete thing in their background that this company would care about",
  "odds":"strong|fair|longshot"
}]}

Give 16 to 24 companies. Rules that matter:

1. Weight heavily toward the person's DOMAIN, not just their job title. Someone who has run operations in a particular industry is far more valuable to companies in that industry than to a generic employer, even when the role title is identical. Find the companies where their specific background is an advantage rather than a neutral.

2. Spread across reachability. Include some obvious large names, but the majority should be companies small or specific enough that a well-aimed message actually gets read. A list of famous companies is useless.

3. Favour their own region and genuinely remote-friendly employers. A company that will not hire someone in ${prof.location||'their location'} is not a real target.

4. Prefer companies that plausibly use Greenhouse, Lever or Ashby - startups and scale-ups - since their openings can be checked automatically. But include a few larger or regional ones if they are genuinely strong fits.

5. "odds" is about whether an approach from THIS person converts, considering their gaps, not about company quality.

6. Real companies only, named exactly. No placeholders, no invented names, no "various startups". If unsure a company exists, leave it out.`, 3000);
  const d = grabJSON(txt);
  const list = Array.isArray(d) ? d : (d.companies||[]);
  return list.filter(c=>c&&c.name).slice(0,24);
}

async function addSuggested(list, checkHiring){
  const p=P(); if(!p||!list.length) return;
  busy=true; render();

  // Everything starts as a cold target. The ATS check below promotes whichever
  // ones turn out to be hiring, so the default is never wrong.
  const cold=list.map(c=>{
    const j=blank();
    j.company=c.name; j.title='Cold approach'; j.location=c.location||'';
    j.description=[c.why,c.overlap?('Your overlap: '+c.overlap):'',c.stage?('Stage: '+c.stage):'']
      .filter(Boolean).join(' — ');
    j.source='Suggested'; j.channel='cold'; j.stage='new';
    j.notes=c.odds?('Odds: '+c.odds):'';
    return j;
  });
  let added=addJobs(cold);
  await save(); render();

  if(!checkHiring){ busy=false; render(); setSearchInfo(`Added ${added} cold targets. Score them next.`); return; }

  try{
    const {found,misses}=await atsSearch(list.map(c=>c.name), setSearchInfo);
    let roles=0;
    for(const hit of found){
      await recordVelocity(hit.slug,hit.rows.length);
      const vel=velocityNote(hit.slug);
      const jobs=hit.rows.map(x=>{
        const j=blank();
        j.title=x.title||'[No Title]'; j.company=hit.name||hit.slug;
        j.location=x.location||''; j.url=x.url||'';
        j.description=(x.desc||'').slice(0,4000);
        j.source=hit.label; j.query=hit.slug; j.channel='posted'; j.stage='new';
        j.notes=[x.dept?'Team: '+x.dept:'', x.pay?'Pay: '+x.pay:'', x.posted?'Posted '+x.posted:'', vel]
          .filter(Boolean).join(' · ');
        return j;
      });
      roles+=addJobs(jobs);
      // This company is advertising, so the placeholder cold row is redundant.
      const ci=p.jobs.findIndex(j=>j.channel==='cold'&&j.source==='Suggested'&&j.company===(hit.name||hit.slug));
      if(ci>=0 && jobs.length) p.jobs.splice(ci,1);
    }
    busy=false; await save(); render();
    setSearchInfo(`${found.length} of ${list.length} are hiring — ${roles} open roles pulled. `
      + `${misses.length} stay cold approaches. Score them all next.`);
  }catch(e){
    busy=false; await save(); render();
    setSearchInfo(`Added ${added} cold targets. Couldn't check hiring: ${e.message}`);
  }
}

/* ═══ assessing a direction the person names themselves ═══
   The generated tracks are the model's read on where someone could go. This is
   the inverse: the person says where they want to go, and gets an honest answer
   about what that would take. It is the more useful direction of the two,
   because ambition usually arrives before evidence, and the thing worth knowing
   is not "is this allowed" but "what specifically is missing". */
async function assessTrack(want, prof){
  const txt = await claude(`A person wants to know whether a particular kind of job is realistic for them.

THEIR PROFILE
Name: ${prof.name}
Based in: ${prof.location||'unspecified'}
Level: ${prof.seniority||'unspecified'}${prof.years_experience?` (~${prof.years_experience} years)`:''}
In short: ${prof.headline||''}
Fields: ${(prof.domains||[]).join('; ')}
Real strengths: ${(prof.strengths||[]).join('; ')}
Skills: ${(prof.hard_skills||[]).join(', ')}
${prof.unusual_combination?`What is rare about them: ${prof.unusual_combination}`:''}
Honest gaps: ${(prof.gaps||[]).join('; ')||'none stated'}

THE KIND OF JOB THEY ARE ASKING ABOUT: "${String(want).slice(0,200)}"

Return ONLY a JSON object, no preamble, no markdown fences:
{
 "id":"short-slug",
 "label":"the job family, named properly as the industry names it",
 "difficulty":"easy|moderate|moonshot",
 "why":"one sentence, max 20 words, on the fit",
 "verdict":"2-4 sentences. Straight assessment. What would actually happen if they applied for this tomorrow, and what the single biggest obstacle is.",
 "transfers":["3-6 things from their background that genuinely count toward this, stated concretely"],
 "missing":["2-5 things they would have to acquire, show, or work around - be specific about which, and say if any is a hard blocker"],
 "bridge":"one sentence: the shortest realistic path from where they are to this, or empty string if they are already there",
 "titles":["5-8 real job titles to search for"],
 "boards":["4-8 bare domains where this kind of job is actually posted"]
}

Difficulty means:
- "easy": they could get this now with what is already on their profile. Someone reading their CV would find it an unsurprising application.
- "moderate": a real step across. Winnable, but they would need to argue for it and would be competing against people with more direct experience.
- "moonshot": plausible but they would be an unusual hire. Worth a small number of well-aimed attempts, not a campaign.

Be honest rather than encouraging. If this is a bad idea for them, say so in the verdict and mark it moonshot - an inflated assessment wastes months of someone's life. If it is genuinely easy, say that too and do not manufacture obstacles.
If the request is vague, interpret it as the nearest real job family and name that in the label.
For boards: give the registries where this specific field posts, not general job sites. Bare domains, no protocol.
Use ONLY what is in the profile. Do not invent experience.`, 1600);
  const t = grabJSON(txt);
  t.id = (t.id||'custom')+'_'+Math.random().toString(36).slice(2,5);
  ['transfers','missing','titles','boards'].forEach(k=>{ if(!Array.isArray(t[k])) t[k]=[]; });
  t.boards = t.boards.map(b=>String(b).replace(/^https?:\/\//,'').replace(/\/.*$/,'').trim()).filter(Boolean);
  t.custom = true;
  return t;
}

function diffTag(d){
  return (d==='moonshot'||d==='stretch') ? 'hard' : d==='easy' ? 'easy' : 'mid';
}

/* Shown after an assessment. The verdict is the point — the lists are supporting

function trackVerdict(t){

    ? `<div class="chips" style="margin-top:8px">${arr.map(x=>`<span class="chip ${cls}">${esc(x)}</span>`).join('')}</div>` : '';
  return `<div class="card" style="margin-top:14px">
    <div class="tl" style="font-size:16px;font-weight:500;display:flex;align-items:center;gap:9px">

    ${t.missing&&t.missing.length?`<div class="eyebrow" style="margin-top:14px">What you'd have to close</div>${chips(t.missing,'r')}`:''}
    ${t.bridge?`<div class="eyebrow" style="margin-top:14px">Shortest path</div><p style="margin:7px 0 0;color:var(--muted);font-size:13px">${esc(t.bridge)}</p>`:''}
    ${t.titles&&t.titles.length?`<div class="eyebrow" style="margin-top:14px">Search these titles</div>${chips(t.titles.slice(0,8),'')}`:''}

/* ═══ scoring prompt, built from THIS person ═══ */
function sysPrompt(prof, track){
  const t = (prof.tracks||[]).find(x=>x.id===track) || prof.tracks[0] || {};
  return `You score job listings for one specific candidate. You will be given their profile and a batch of jobs.

CANDIDATE SNAPSHOT
Name: ${prof.name}
Based in: ${prof.location||'unspecified'}${prof.country?', '+prof.country:''}
Level: ${prof.seniority||'unspecified'}${prof.years_experience?` (~${prof.years_experience} years)`:''}
What they are: ${prof.headline||''}
Real strengths: ${(prof.strengths||[]).join('; ')}
${prof.unusual_combination?`What is rare about them: ${prof.unusual_combination}`:''}

THEY ARE TARGETING: ${t.label||'general roles'}${t.why?` — ${t.why}`:''}
Typical titles in this family: ${(t.titles||[]).join(', ')||'various'}

HONEST GAPS (they cannot claim these): ${(prof.gaps||[]).join('; ')||'none stated'}
ROLE SHAPES TO RULE OUT: ${(prof.wrong_shapes||[]).join('; ')||'none stated'}

Return ONLY a JSON object, no preamble, no markdown fences:
{"results":[{"id":"...","score":0,"reachability":0,"confidence":"high","reason":"...","flags":["..."]}]}

For EACH job:
- id: exactly as given
- score: 0-100 FIT ONLY. How well does the described WORK match what this candidate can do and is targeting? Judge the work, not the title, and NOT whether they would win the process.
- reachability: 0-100, SEPARATELY. How likely is an application from THIS candidate to actually convert? Consider company prestige and applicant volume, whether credentials this candidate lacks are demanded, the seniority bar versus their level, signals of openness to non-traditional candidates, and company stage. A perfect-fit role at a famous employer scores HIGH on fit and LOW here.
- confidence: "high" (real job description) | "medium" (short snippet) | "low" (title and company only)
- reason: ONE sentence, max 20 words, specific. If fit and reachability diverge sharply, say why.
- flags: from this set only: ["strong_fit","seniority_too_high","seniority_too_low","credential_gated","wrong_role_shape","location_ineligible","thin_data","high_competition","non_traditional_friendly","rare_combination_fit"]

Rules:
- The candidate is based in ${prof.location||'their stated location'}. A role requiring presence somewhere else with no remote allowance scores below 20 on FIT and gets "location_ineligible".
- Do NOT lower the FIT score because of the gaps listed above. Gaps are a REACHABILITY consideration. Keep the two axes strictly separate.
- Any job matching the ruled-out role shapes scores below 20 on FIT and gets "wrong_role_shape", however appealing its title.
- A job that needs the candidate's rare combination of skills should score higher — flag "rare_combination_fit".
- Do not invent details. Inferring from a title alone means confidence "low" and flag "thin_data".
- Do not inflate. Most jobs are mediocre. The distribution should be wide on both axes.
- One entry per input job. JSON object only.`;
}

/* ═══ jobs ═══ */
function blank(){ const o={}; COLS.forEach(c=>o[c]=''); o.status='New'; o.pitch_sent='No'; o.channel='posted'; o.stage='new'; o.contacts='[]'; o.events='[]'; return o; }
function keyOf(j){
  const u=String(j.url||'').trim();
  if(u && u!=='nan') return 'u:'+u.toLowerCase();
  return 't:'+[j.title,j.company,j.location].map(x=>String(x||'').trim().toLowerCase()).join('|');
}
function addJobs(list){
  const p=P(); if(!p) return 0;
  const seen=new Set(p.jobs.map(keyOf)); let n=0;
  list.forEach(j=>{ if(!String(j.title||'').trim()) return;
    const k=keyOf(j); if(seen.has(k)) return; seen.add(k); p.jobs.push(j); n++; });
  return n;
}
const isScored = j => String(j.ai_score||'').trim()!=='';
const fitOf   = j => { const v=parseFloat(j.ai_score); return isNaN(v)?0:Math.max(0,Math.min(100,v)); };
const reachOf = j => { const v=parseFloat(j.ai_reachability); return isNaN(v)?45:Math.max(0,Math.min(100,v)); };
function rankOf(j){
  const conf={high:1,medium:.9,low:.78}[String(j.ai_confidence||'low').toLowerCase()]||.78;
  return Math.pow(fitOf(j),0.65)*Math.pow(reachOf(j),0.35)*conf;
}
const isOpen = j => stOf(j)!=='closed';
const chOf   = j => String(j.channel||'posted').trim().toLowerCase()==='cold' ? 'cold' : 'posted';
const stOf   = j => { const v=String(j.stage||'').trim().toLowerCase();
  if(STAGES.includes(v)) return v;
  // Rows imported before stages existed, or from the Python tracker.
  const s=String(j.status||'').trim().toLowerCase();
  if(s==='applied'||s==='contacted') return 'sent';
  if(s==='skipped'||s==='rejected'||s==='closed') return 'closed';
  return 'new'; };
const dayDiff = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
function isDue(j){
  if(stOf(j)!=='sent') return false;
  if(j.follow_up_date) return j.follow_up_date <= today();
  const t=j.last_touch||j.date_applied;
  return t ? dayDiff(t,today())>=FOLLOWUP_DAYS : false;
}
const daysSilent = j => { const t=j.last_touch||j.date_applied; return t?dayDiff(t,today()):0; };
const listOf = (j,k) => { try{ const v=JSON.parse(j[k]||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } };
const setList = (j,k,v) => { j[k]=JSON.stringify(v); };
function logEvent(j,kind,text){
  const ev=listOf(j,'events');
  ev.unshift({on:today(),kind,text:String(text||'').slice(0,400)});
  setList(j,'events',ev.slice(0,40));
  j.last_touch=today();
}
function setStage(j,st){
  j.stage=st;
  j.status = st==='sent' ? (chOf(j)==='cold'?'Contacted':'Applied')
           : st==='live' ? 'In conversation'
           : st==='closed' ? 'Closed' : 'New';
  if(st==='sent'){
    if(!j.date_applied) j.date_applied=today();
    const d=new Date(); d.setDate(d.getDate()+FOLLOWUP_DAYS);
    j.follow_up_date=d.toISOString().slice(0,10);
  }
  j.last_touch=today();
}

/* ═══ CSV ═══ */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else { if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=''; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=c; } }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.length && r.some(v=>String(v).trim()!==''));
}
function toCSV(rows,cols){
  const q=v=>{const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  return [cols.join(',')].concat(rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\n');
}

/* ═══ scoring run ═══ */
async function scoreBatch(batch, prof, track){
  const jobs = batch.map(b=>({ id:String(b.i),
    title:String(b.j.title||''), company:String(b.j.company||''),
    location:String(b.j.location||''),
    description:String(b.j.description||'').slice(0,1100)||'(no description available)' }));
  const txt = await claude(sysPrompt(prof,track)+"\n\nJOBS TO SCORE:\n"+JSON.stringify(jobs), 1400);
  const parsed = grabJSON(txt);
  const items = Array.isArray(parsed)?parsed:(parsed.results||[]);
  const out={};
  items.forEach(it=>{ out[String(it.id)]={
    score:Math.max(0,Math.min(100,parseInt(it.score,10)||0)),
    reach:Math.max(0,Math.min(100,parseInt(it.reachability,10)||45)),
    conf:String(it.confidence||'low').toLowerCase(),
    reason:String(it.reason||'').slice(0,220),
    flags:(it.flags||[]).join(',') }; });
  return out;
}

async function runScoring(all){
  const p=P(); if(!p || busy) return;
  const targets = p.jobs.map((j,i)=>({j,i})).filter(b=> all || !isScored(b.j));
  if(!targets.length){ setInfo(all?'No jobs to score yet.':'Everything is already scored.'); return; }
  busy=true; render();
  const SIZE=6, total=targets.length; let done=0, failed=0;
  for(let i=0;i<targets.length;i+=SIZE){
    const batch=targets.slice(i,i+SIZE);
    try{
      const res=await scoreBatch(batch,p.profile,p.track);
      batch.forEach(b=>{ const r=res[String(b.i)]; if(!r) return;
        const j=p.jobs[b.i];
        j.ai_score=String(r.score); j.ai_reachability=String(r.reach);
        j.ai_confidence=r.conf; j.ai_reason=r.reason; j.ai_flags=r.flags; });
    }catch(e){
      if(e.message==='NEEDKEY'){
        busy=false; render(); keyDialog(()=>runScoring(all)); return;
      }
      failed+=batch.length; console.error(e);
    }
    done+=batch.length;
    const bar=$('#progBar'); if(bar) bar.style.width=Math.round(done/total*100)+'%';
    setInfo(`${done} of ${total} done${failed?` · ${failed} failed`:''}`);
    await save();
  }
  busy=false;
  setInfo(failed?`Scored ${total-failed}. ${failed} failed — run again to retry them.`:`Scored ${total}.`);
  await save(); render();
}
function setInfo(t){ const e=$('#scoreInfo'); if(e) e.textContent=t; }
function setSearchInfo(t){ const e=$('#searchInfo'); if(e) e.textContent=t; }

/* ═══ live search ═══ */
async function runSearch(queries){
  const p=P(); if(!p||busy) return;
  queries=(queries||[]).filter(q=>q&&q.trim());
  if(!queries.length){ setSearchInfo('Type a search first — title | location.'); return; }
  busy=true; render();
  let total=0, failed=0;
  for(const q of queries){
    try{
      const jobs=await apifySearch(q,15,setSearchInfo);
      const n=addJobs(jobs);
      total+=n; setSearchInfo(`${total} new so far…`);
      await save();
    }catch(e){
      if(e.message==='NEEDAPIFY'){ busy=false; render(); apifyDialog(()=>runSearch(queries)); return; }
      failed++; console.error(e); setSearchInfo(e.message);
    }
  }
  busy=false; await save(); render();
  setSearchInfo(failed
    ? `Added ${total}. ${failed} search${failed>1?'es':''} failed.`
    : `Added ${total} new. Now score them.`);
}

async function runBoards(trk, prof){
  const p=P(); if(!p||busy) return;
  const boards=(trk.boards||[]), titles=(trk.titles||[]);
  if(!boards.length){ setSearchInfo("This track has no specialist boards — use LinkedIn search instead."); return; }
  if(!titles.length){ setSearchInfo("This track has no titles to search."); return; }
  const qs=buildBoardQueries(titles,boards,'');
  busy=true; render();
  try{
    // No country code: academic and remote roles are frequently international,
    // and pinning Google to one country quietly hides them.
    const jobs=await apifyBoardSearch(qs,"",setSearchInfo);
    const n=addJobs(jobs);
    await save(); busy=false; render();
    setSearchInfo(n
      ? `Added ${n} from ${boards.length} boards. Score them next.`
      : `Searched ${boards.length} boards, nothing new came back.`);
  }catch(e){
    busy=false; render();
    if(e.message==='NEEDAPIFY'){ apifyDialog(()=>runBoards(trk,prof)); return; }
    setSearchInfo(e.message);
  }
}

async function runAts(lines){
  const p=P(); if(!p||busy) return;
  busy=true; render();
  try{
    const {found,misses}=await atsSearch(lines,setSearchInfo);
    let added=0; const notes=[];
    for(const hit of found){
      await recordVelocity(hit.slug,hit.rows.length);
      const vel=velocityNote(hit.slug);
      const jobs=hit.rows.map(x=>{
        const j=blank();
        j.title=x.title||'[No Title]';
        j.company=hit.name||hit.slug;
        j.location=x.location||'';
        j.url=x.url||'';
        j.description=(x.desc||'').slice(0,4000);
        j.source=hit.label; j.query=hit.slug; j.channel='posted'; j.stage='new';
        j.notes=[x.dept?'Team: '+x.dept:'', x.pay?'Pay: '+x.pay:'',
                 x.posted?'Posted '+x.posted:''].filter(Boolean).join(' \u00b7 ');
        return j;
      });
      added+=addJobs(jobs);
      notes.push(`${hit.name||hit.slug} \u2192 ${hit.label}${hit.viaGoogle?' (found via search)':''}: ${hit.rows.length} open${vel?' \u2014 '+vel:''}`);
    }
    await save(); busy=false; render();
    setSearchInfo(
      (added?`Added ${added} new. `:'Nothing new. ')
      + notes.join(' \u00b7 ')
      + (misses.length?` \u00b7 not found: ${misses.slice(0,4).join(', ')}`:''));
  }catch(e){
    busy=false; render(); setSearchInfo(e.message);
  }
}

async function onProfileFile(text,name){
  if(!String(text||'').trim()){ ONB.step=0; ONB.error="That file came through empty."; render(); return; }
  ONB.raw=text; ONB.fileName=name||'profile.md'; ONB.step=1; ONB.parsed=null; ONB.error='';
  render();
  try{ ONB.parsed=await extractProfile(text); render(); }
  catch(e){
    ONB.step=0;
    if(e.message==='NEEDKEY'){
      ONB.error="Your file loaded fine — but this needs an Anthropic key to read it.";
      render(); keyDialog(()=>onProfileFile(text,name)); return;
    }
    ONB.error="Your file loaded, but reading it failed. "+e.message;
    render();
  }
}

  if(RANGE){
    const a=plotXY(RANGE.f1,RANGE.r1), b=plotXY(RANGE.f0,RANGE.r0);
    g+=`<rect x="${Math.min(a.x,b.x)}" y="${Math.min(a.y,b.y)}" width="${Math.abs(b.x-a.x)}" height="${Math.abs(b.y-a.y)}" fill="#E8B04B" fill-opacity=".07" stroke="#E8B04B" stroke-width="1" stroke-dasharray="4 3"/>`;
  }
  scored.forEach(j=>{
    const f=fitOf(j), r=reachOf(j), pt=plotXY(f,r), open=isOpen(j);
    const inR=!RANGE||(f>=RANGE.f0&&f<=RANGE.f1&&r>=RANGE.r0&&r<=RANGE.r1);
    const col=!open?'#56656F':(inR?'#E8B04B':'#3F5260'), rad=!open?3:(inR?5.5:3.5);
    const tip=`<title>${esc(j.title)} — ${esc(j.company)}
fit ${f} · reach ${r} · ${chOf(j)}</title>`;
    // Posted roles are circles, cold targets squares. Same axes, different action:
    // one you apply to, the other you have to start the conversation yourself.
    g += chOf(j)==='cold'
      ? `<rect class="dot" data-idx="${p.jobs.indexOf(j)}" x="${(pt.x-rad).toFixed(1)}" y="${(pt.y-rad).toFixed(1)}" width="${(rad*2).toFixed(1)}" height="${(rad*2).toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.6" stroke-opacity="${inR&&open?.95:.5}">${tip}</rect>`
      : `<circle class="dot" data-idx="${p.jobs.indexOf(j)}" cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="${rad}" fill="${col}" fill-opacity="${inR&&open?.85:.5}" stroke="${col}" stroke-width="1">${tip}</circle>`;
  });
  if(!scored.length) g+=`<text x="${PL.x+PL.w/2}" y="${PL.y+PL.h/2}" text-anchor="middle" font-family="Space Grotesk" font-size="13" fill="#56656F">Nothing scored yet</text>`;
  return g;
}

function inRange(j){
  if(CHFILT!=='all' && chOf(j)!==CHFILT) return false;
  if(!RANGE) return true;
  const f=fitOf(j), r=reachOf(j);
  return f>=RANGE.f0&&f<=RANGE.f1&&r>=RANGE.r0&&r<=RANGE.r1;
}
function ranked(){ const p=P();
  return p.jobs.map((j,i)=>({j,i})).filter(x=>isScored(x.j)&&inRange(x.j)).sort((a,b)=>rankOf(b.j)-rankOf(a.j)); }

function flagHtml(s){
  const good=['strong_fit','non_traditional_friendly','rare_combination_fit'];
  const bad=['wrong_role_shape','location_ineligible','credential_gated','seniority_too_high','seniority_too_low','high_competition'];
  return String(s||'').split(',').filter(Boolean).map(f=>
    `<span class="flag ${good.includes(f)?'g':bad.includes(f)?'r':''}">${esc(f.replace(/_/g,' '))}</span>`).join('');
}
function jobCard(j,i,hi){
  const f=fitOf(j), r=reachOf(j), ch=chOf(j), st=stOf(j), due=isDue(j);
  const cls = st==='live' ? 'st-live' : due ? 'st-due' : 'ch-'+ch;
  const stLabel = st==='sent' && due ? 'due' : st;
  const cts=listOf(j,'contacts'), ev=listOf(j,'events');
  const silent = daysSilent(j);
  return `<div class="job ${cls} ${st==='closed'?'done':''}">
    <div class="jrow"><div style="flex:1;min-width:0">
      <div class="jt">${esc(j.title||'(untitled)')}</div>
      <div class="jc">${esc(j.company||'\u2014')}${j.location?' \u00b7 '+esc(j.location):''}</div>
      <div class="flags" style="margin-top:7px">
        <span class="chn ${ch}">${ch==='cold'?'cold approach':'posted role'}</span>
        <span class="stage s-${stLabel}">${esc(stLabel)}</span>
        ${st==='sent'&&silent?`<span class="stage s-sent">${silent}d silent</span>`:''}
        ${cts.length?`<span class="stage">${cts.length} contact${cts.length>1?'s':''}</span>`:''}
      </div></div>
      <div class="jscore"><div class="big">${Math.round(rankOf(j))}</div>
        <div class="sm">fit ${f}</div>
        <div class="sm" style="color:var(--neutral)">reach ${r}</div></div></div>
    <div class="bar"><i style="width:${f}%;background:var(--${ch})"></i></div>
    <div class="bar"><i style="width:${r}%;background:var(--neutral)"></i></div>
    ${j.ai_reason?`<p class="jreason">${esc(j.ai_reason)}</p>`:''}
    ${j.ai_flags?`<div class="flags">${flagHtml(j.ai_flags)}</div>`:''}
    ${ev.length?`<div class="log"><span class="when">${esc(ev[0].on)}</span> \u00b7 <b>${esc(ev[0].kind)}</b> ${esc(ev[0].text).slice(0,120)}</div>`:''}
    <div class="jacts">
      ${j.url?`<a class="lnk" href="${esc(j.url)}" target="_blank" rel="noopener">open \u2197</a>`:''}
      <div class="spacer"></div>
      <button class="btn-sm" data-act="open" data-i="${i}">Details</button>
      ${st==='new'
        ? `<button class="${ch==='cold'?'btn-cold btn-sm':'btn-go btn-sm'}" data-act="pitch" data-i="${i}">${ch==='cold'?'Write the DM':'Draft outreach'}</button>
           <button class="btn-sm" data-act="sent" data-i="${i}">${ch==='cold'?'Mark contacted':'Mark applied'}</button>`
        : ''}
      ${st==='sent'
        ? `${due?`<button class="btn-go btn-sm" data-act="chase" data-i="${i}">Write the chase</button>`:''}
           <button class="btn-sm" data-act="live" data-i="${i}">They replied</button>`
        : ''}
      ${st==='live'
        ? `<button class="btn-sm" data-act="note" data-i="${i}">Log a note</button>`
        : ''}
      ${st!=='closed'
        ? `<button class="btn-sm" data-act="close" data-i="${i}">Close</button>`
        : `<button class="btn-sm" data-act="reopen" data-i="${i}">Reopen</button>`}
    </div></div>`;
}

/* ═══ the daily view ═══
   Ordered by what is actually worth doing, not by score. A live conversation
   beats ten new applications, and a chase that is three days overdue beats a
   fresh application, because the cost of losing it is already sunk. New work
   comes last on purpose — it is the most tempting and the least urgent. */
function renderToday(){
  const p=P();
  const all=p.jobs.map((j,i)=>({j,i}));
  const live=all.filter(x=>stOf(x.j)==='live')
                .sort((a,b)=>daysSilent(b.j)-daysSilent(a.j));
  const due =all.filter(x=>isDue(x.j))
                .sort((a,b)=>daysSilent(b.j)-daysSilent(a.j));
  const fresh=all.filter(x=>stOf(x.j)==='new'&&isScored(x.j)&&inRange(x.j))
                 .sort((a,b)=>rankOf(b.j)-rankOf(a.j)).slice(0,10);
  const waiting=all.filter(x=>stOf(x.j)==='sent'&&!isDue(x.j)).length;
  const doneToday=all.filter(x=>x.j.last_touch===today()).length;

  const sect=(cls,title,sub,rows)=>rows.length?`<div class="sect ${cls}">
    <div class="sect-h"><h3>${title}</h3><span class="ct">${rows.length}</span></div>
    <p class="sect-sub">${sub}</p>
    ${rows.map(x=>jobCard(x.j,x.i)).join('')}</div>`:'';

  if(!live.length&&!due.length&&!fresh.length){
    return `<div class="empty"><b>${p.jobs.length?'Nothing needs you today':'No jobs yet'}</b>
      ${p.jobs.length
        ? (waiting?`${waiting} still waiting on a reply. Come back when one comes due.`:'Add and score some jobs to get started.')
        : 'Find jobs on the left, then score them.'}</div>`;
  }
  return `<div class="stats">
      <div class="stat"><div class="k num">${doneToday}</div><div class="l">touched today</div></div>
      <div class="stat"><div class="k num" style="color:var(--live)">${live.length}</div><div class="l">in conversation</div></div>
      <div class="stat"><div class="k num" style="color:var(--warn)">${due.length}</div><div class="l">need chasing</div></div>
      <div class="stat"><div class="k num" style="color:var(--neutral)">${waiting}</div><div class="l">waiting</div></div>
    </div>
    ${sect('live','Reply to these','Someone real is on the other end. This is worth more than any new application.',live)}
    ${sect('due','Chase these','Sent, and gone quiet past the follow-up date. One nudge, then let it go.',due)}
    ${sect('','Start these','Ranked by fit and reachability. Work down, don\'t browse.',fresh)}`;
}

/* Adding a direction after setup. Same assessor as onboarding — people work out
   what they actually want weeks in, not on day one. */
function addTrackDialog(){
  const prof=P().profile;
  const d=modal(`<div class="eyebrow">New direction</div>
    <h2 style="margin:6px 0 6px">What kind of work?</h2>
    <p style="color:var(--muted);font-size:12.5px;margin:0 0 12px">Name it and you'll get a straight read on where you stand against it \u2014 easy, moderate, or moonshot \u2014 plus the titles and boards to search.</p>
    <input type="text" id="tIn" placeholder="e.g. developer relations, agri-tech operations, technical writing">
    <div class="btn-row" style="margin-top:10px">
      <button class="btn-go btn-sm" id="tGo">Assess it</button>
      <button class="btn-sm" onclick="this.closest('.modal').remove()">Cancel</button></div>
    <div id="tOut"></div>`);
  const run=async()=>{
    const v=d.querySelector('#tIn').value.trim();
    if(v.length<3){ d.querySelector('#tOut').innerHTML='<p class="err">Say a bit more about the kind of work.</p>'; return; }
    d.querySelector('#tGo').disabled=true;
    d.querySelector('#tOut').innerHTML='<p style="color:var(--muted);margin-top:14px"><span class="spin"></span> Working it out\u2026</p>';
    try{
      const t=await assessTrack(v,prof);
      d.querySelector('#tOut').innerHTML=trackVerdict(t)+`
        <div class="btn-row" style="margin-top:12px">
          <button class="btn-go btn-sm" id="tAdd">Add and switch to it</button>
          <button class="btn-sm" id="tAgain">Try another</button></div>`;
      d.querySelector('#tAdd').onclick=async()=>{
        const p=P(); p.profile.tracks.push(t); p.track=t.id;
        await save(); d.remove(); render();
      };
      d.querySelector('#tAgain').onclick=()=>{
        d.querySelector('#tOut').innerHTML=''; d.querySelector('#tGo').disabled=false;
        d.querySelector('#tIn').value=''; d.querySelector('#tIn').focus();
      };
    }catch(e){
      d.querySelector('#tGo').disabled=false;
      if(e.message==='NEEDKEY'){ d.remove(); keyDialog(addTrackDialog); return; }
      d.querySelector('#tOut').innerHTML='<p class="err">'+esc(e.message)+'</p>';
    }
  };
  d.querySelector('#tGo').onclick=run;
  d.querySelector('#tIn').onkeydown=e=>{ if(e.key==='Enter') run(); };
  setTimeout(()=>d.querySelector('#tIn').focus(),50);
}

/* ═══ plot drag ═══ */
function bindPlot(){
  const svg=$('#plot'); if(!svg) return;
  let start=null;
  const toPlot=ev=>{ const pt=svg.createSVGPoint(); const t=ev.touches?ev.touches[0]:ev;
    pt.x=t.clientX; pt.y=t.clientY; const m=svg.getScreenCTM(); if(!m) return null;
    const q=pt.matrixTransform(m.inverse());
    return { r:Math.max(0,Math.min(100,(q.x-PL.x)/PL.w*100)), f:Math.max(0,Math.min(100,(1-(q.y-PL.y)/PL.h)*100)) }; };
  const down=ev=>{ if(ev.target.classList.contains('dot')) return;
    const p=toPlot(ev); if(!p) return; start=p; ev.preventDefault(); };
  const move=ev=>{ if(!start) return; const p=toPlot(ev); if(!p) return;
    RANGE={f0:Math.min(start.f,p.f),f1:Math.max(start.f,p.f),r0:Math.min(start.r,p.r),r1:Math.max(start.r,p.r)};
    svg.innerHTML=plotSVG(); };
  const up=()=>{ if(start&&RANGE&&(RANGE.f1-RANGE.f0<4||RANGE.r1-RANGE.r0<4)) RANGE=null;
    if(start){ start=null; render(); } start=null; };
  svg.addEventListener('mousedown',down); svg.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up); window.addEventListener('touchend',up);
  svg.addEventListener('click',ev=>{ if(ev.target.classList.contains('dot')) showJob(parseInt(ev.target.dataset.idx,10)); });
}

/* ═══ backup, restore, and sharing ═══
   Everything lives in this browser's storage, which is durable but not
   permanent — clearing site data wipes it, and there is no server copy. So a
   real export matters more here than it would in a hosted app.

   Keys are deliberately kept OUT of the data backup and given their own file.
   A data backup is the thing you keep and pass around; credentials are not, and
   bundling them together is how a key ends up somewhere it shouldn't be. */

function downloadFile(name, text, mime){
  const b=new Blob([text],{type:mime||'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

async function exportBackup(){
  const payload={
    kind:"triage-backup", version:3, exported:today(),
    profiles:DB.profiles, current:DB.current
  };
  downloadFile(`triage-backup-${today()}.json`, JSON.stringify(payload,null,1));
}

async function importBackup(text, mode){
  let d; try{ d=JSON.parse(text); }catch(e){ throw new Error("That isn't a valid backup file."); }
  if(d.kind!=="triage-backup"||!d.profiles) throw new Error("That JSON isn't a triage backup.");
  const incoming=Object.keys(d.profiles).length;
  if(mode==='replace'){ DB.profiles=d.profiles; DB.current=d.current||Object.keys(d.profiles)[0]||null; }
  else {
    // Merge: keep both sides. Colliding ids get a fresh one rather than
    // silently overwriting someone's work.
    Object.entries(d.profiles).forEach(([id,prof])=>{
      const key = DB.profiles[id] ? id+'_'+Math.random().toString(36).slice(2,6) : id;
      DB.profiles[key]=prof;
    });
    if(!DB.current) DB.current=Object.keys(DB.profiles)[0]||null;
  }
  await save();
  return incoming;
}
