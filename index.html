/* Mail that arrived, said out loud. The Worker files what it can and moves
   stages by itself, and that used to happen in silence: a job turned into
   "In conversation" and nothing said why, and a mail it could not place sat
   in a table nobody opened. So the app reads inbound_mail when it opens and
   whenever the tab comes back, says what is new, shows every mail in its
   job's history, and asks about the ones the Worker could not place.

   It only READS inbound_mail -- owner-read, service-role-write, so nobody can
   forge a reply into their own record. Filing a mail by hand is written on the
   JOB instead, as an event carrying the mail's id, through the ordinary save:
   that syncs to every device and stays the person's own edit. */
let MAIL=[], MAIL_TOKEN=null, MAIL_AT=0;
const KIND_SAYS = { human:'they replied', reject:'a rejection', ack:'an application receipt',
                    unclear:'a mail it could not read', noise:'an automated mail' };
const mailAcc = k => k==='human' ? 'go' : k==='reject' ? 'due' : k==='ack' ? 'awaiting' : '';
const mailSeenKey = pid => 'triage:mailseen:'+pid;
/* Which job a mail belongs to: what the Worker matched, else what the person
   filed it under. Unmatched and ambiguous mail has no job until someone says. */
function mailJobKey(m, jobs){
  if(m.applied_to) return m.applied_to;
  const d=m.decision||{};
  if(d.matched && d.action!=='store-unmatched') return d.matched;
  const j=(jobs||[]).find(x=>listOf(x,'events').some(e=>e.mail===m.id));
  return j ? keyOf(j) : null;
}
const mailDay = m => String(m.received_at||m.created_at||'').slice(0,10);

async function checkMail(force){
  if(!INBOX_LIVE || !cloudNow() || !USER) return;
  const p=P(), pid=PROFILE_IDS[DB.current]; if(!p||!pid) return;
  if(!force && Date.now()-MAIL_AT<60e3) return;
  MAIL_AT=Date.now();
  try{
    const [pr, r]=await Promise.all([
      SB.from('profiles').select('inbox_token').eq('id',pid).single(),
      SB.from('inbound_mail').select('id,subject,from_addr,excerpt,decision,applied_to,applied_stage,received_at,created_at')
        .eq('profile_id',pid).order('created_at',{ascending:false}).limit(60)]);
    if(r.error) throw new Error(r.error.message);
    MAIL_TOKEN=(pr.data && pr.data.inbox_token) || null;
    MAIL=(r.data||[]).filter(m=>m.decision && m.decision.action!=='show-code');
  }catch(e){ MAIL_AT=0; console.warn('mail check:', e && e.message); return; }
  if(PROFILE_IDS[DB.current]!==pid) return;          // switched profile mid-flight

  let seen=null; try{ seen=localStorage.getItem(mailSeenKey(pid)); }catch(e){}
  // Nothing yet still starts the clock, or the first mail ever would be history.
  const newest=MAIL.length ? MAIL[0].created_at : new Date().toISOString();
  try{ if(seen===null || newest>seen) localStorage.setItem(mailSeenKey(pid), newest); }catch(e){}
  /* First look from this browser: the history is shown in each job, but it is
     not replayed as news -- ten "new mail" toasts for last month is noise. */
  if(seen===null){ render(); return; }
  const fresh=MAIL.filter(m=>m.created_at>seen && m.decision.kind!=='noise');

  /* The Worker already changed these rows on the server. This copy of the job
     is older, and the next save would put the old stage back -- so the same
     change is made here first. Forward only: a stage the person moved since
     is theirs, and it wins. */
  const order={new:0, sent:1, live:2, closed:3};
  let moved=false;
  fresh.forEach(m=>{
    if(!m.applied_to || !m.applied_stage) return;
    const j=p.jobs.find(x=>keyOf(x)===m.applied_to);
    if(j && (order[stOf(j)]??0) < (order[m.applied_stage]??0)){ setStage(j,m.applied_stage); moved=true; }
  });
  if(moved) await save();
  render();

  if(fresh.length) track('mail_alert',{ n:fresh.length, placed:fresh.filter(m=>mailJobKey(m,p.jobs)).length });
  fresh.slice(0,3).forEach(m=>{
    const key=mailJobKey(m,p.jobs), i=key ? p.jobs.findIndex(x=>keyOf(x)===key) : -1, j=p.jobs[i];
    const said=KIND_SAYS[m.decision.kind]||'a mail';
    const what = m.applied_to && m.applied_stage==='sent' ? 'marked applied'
               : m.applied_stage==='live' ? 'moved to In conversation'
               : m.applied_stage==='closed' ? 'closed' : '';
    if(j) askToast(`New mail: ${said}`,
      [j.title,j.company].filter(Boolean).join(' · ')+(what?` — ${what}`:'')+(m.subject?` · “${m.subject}”`:''),
      [{label:'Open job', go:true, run:()=>showJob(i)}]);
    else askToast(`New mail: ${said}`,
      `Couldn't tell which job this is about.`+(m.subject?` · “${m.subject}”`:''),
      [{label:'Which job?', go:true, run:()=>fileMail(m.id)}]);
  });
  if(fresh.length>3) askToast(`${fresh.length-3} more new mails`, 'Each one is in its job’s history.',
    [{label:'See them all', run:()=>replyInboxDialog()}]);
}

/* The Worker could not place it -- no match, or two jobs equally likely.
   The person says which, and the job moves the way the mail says. */
function fileMail(id){
  const m=MAIL.find(x=>x.id===id), p=P(); if(!m||!p) return;
  const k=(m.decision&&m.decision.kind)||'unclear';
  const host=String(m.from_addr||'').replace(/^.*@/,'').replace(/>.*$/,'').split('.').slice(-2,-1)[0]||'';
  const d=modal(`<div class="eyebrow">Which job is this about?</div>
    <h2 style="margin:6px 0 4px;font-size:16px">${esc(m.subject||'(no subject)')}</h2>
    <p style="color:var(--muted);font-size:12px;margin:0 0 8px">${esc(m.from_addr||'')} · ${esc(KIND_SAYS[k]||k)}</p>
    ${m.excerpt?`<div class="qd-quote" style="max-height:120px;overflow:auto;margin-bottom:10px">${esc(m.excerpt)}</div>`:''}
    <input type="text" id="fmQ" placeholder="Search your jobs by company or title" value="${esc(host)}">
    <div id="fmList" style="margin-top:8px;max-height:260px;overflow:auto"></div>
    <div class="btn-row" style="margin-top:10px"><button class="btn-sm" onclick="this.closest('.modal').remove()">Cancel</button></div>`);
  const q=d.querySelector('#fmQ'), list=d.querySelector('#fmList');
  const draw=()=>{
    const t=q.value.trim().toLowerCase();
    const hits=p.jobs.map((j,i)=>({j,i})).filter(({j})=>!j.deleted &&
      (!t || `${j.company} ${j.title}`.toLowerCase().includes(t))).slice(0,40);
    list.innerHTML=hits.length ? hits.map(({j,i})=>`<div class="contact-row" style="cursor:pointer" data-fm="${i}">
        <span style="flex:1;min-width:0">${esc(j.title||'')} <span style="color:var(--dim)">· ${esc(j.company||'')}</span></span>
        <span class="pill2">${esc(j.status||stOf(j))}</span></div>`).join('')
      : `<p style="color:var(--muted);font-size:12px">No job matches. Clear the search to see them all.</p>`;
    list.querySelectorAll('[data-fm]').forEach(r=>r.onclick=async()=>{
      const j=p.jobs[+r.dataset.fm], st=stOf(j);
      track('mail_filed',{ kind:k });
      /* The same rules the Worker plays by: a person replying is the only
         thing that reaches In conversation, a rejection closes, a receipt
         marks an untouched job applied, and anything else just logs. */
      const to = k==='human' && st!=='live' && st!=='closed' ? 'live'
               : k==='reject' && st!=='closed' ? 'closed'
               : k==='ack' && st==='new' ? 'sent' : '';
      if(to) stageChange(j,to,{mail:m.id});
      else{ logEvent(j,'mail',`filed: ${m.subject||'a mail'}`); const ev=listOf(j,'events'); ev[0].mail=m.id; setList(j,'events',ev); }
      d.remove(); await save(); showJob(+r.dataset.fm);
    });
  };
  q.oninput=draw; draw(); q.focus();
}

/* People open the posting from here and apply on the company's site, and then
   nothing marks the job applied -- and a 'new' job is not something a reply
   can be matched to. The Apply button marks it as it opens; every other way
   out to a posting (the link in a job's detail, a dot on the plot) is
   remembered, and coming back to the tab asks. */
let ASK_APPLIED=null;
function remindApplied(j){ if(j && stOf(j)==='new') ASK_APPLIED={ key:keyOf(j), at:Date.now() }; }
function askApplied(){
  const a=ASK_APPLIED; if(!a) return;
  // Back within seconds is a glance, not an application.
  if(Date.now()-a.at < 20e3) return;
  ASK_APPLIED=null;
  const p=P(), i=p ? p.jobs.findIndex(x=>keyOf(x)===a.key) : -1, j=i>=0 && p.jobs[i];
  if(!j || stOf(j)!=='new') return;
  track('ask_applied');
  askToast('Did you apply?', [j.title,j.company].filter(Boolean).join(' · '),
    [{label:'Yes, mark applied', go:true, run:async()=>{ stageChange(j,'sent'); await save(); render(); }}],
    'Not yet');
}

/* Reply tracking only works for people who set up the forward, and nothing
   asked them to. Asked at the moment it pays off -- right after marking a job
   applied -- and at most every four days, so declining it is respected. */
function inboxNudge(){
  if(!INBOX_LIVE || !cloudNow() || !MAIL_AT || MAIL_TOKEN) return;
  const k='triage:inboxnudge';
  try{ if(Date.now()-(+localStorage.getItem(k)||0) < 4*864e5) return; localStorage.setItem(k, String(Date.now())); }catch(e){ return; }
  track('inbox_nudge');
  askToast('Let replies file themselves',
    'Forward recruiter mail here once, and replies, rejections and receipts land on the right job on their own.',
    [{label:'Set it up', go:true, run:()=>replyInboxDialog()}], 'Later');
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  // A return to the tab, at most every ten minutes: sessions, not every glance.
  if(Date.now()-TRACK_BACK>6e5){ TRACK_BACK=Date.now(); track('back'); }
  askApplied(); checkMail();
});
document.addEventListener('click',e=>{
  const a=e.target.closest && e.target.closest('a[data-applyask]'); if(!a) return;
  const p=P(); remindApplied(p && p.jobs[+a.dataset.applyask]);
});

      <div id="onbStrict">
        ${card('strict','1',String(st),'Show me everything','A longer list, including the near-misses.')}
        ${card('strict','2',String(st),'Balanced','What the app has always done.')}
        ${card('strict','3',String(st),'Only strong matches','A short list you could work through in a sitting.')}
      </div>

      <div class="eyebrow" style="margin-top:22px">How people get this work, per direction</div>
      <p class="say" style="margin:0 0 8px">We judged it from your field and where you are. It decides where we look for you, so correct it if you know better.</p>
      ${(p.tracks||[]).map((t,i)=>`<div class="pfact" style="align-items:center">

        <span style="flex:1;font-size:12.5px;color:var(--muted)">${esc(routeLine(t))}</span>

      <div class="eyebrow" style="margin-top:22px">Your red lines</div>
      <p class="say" style="margin:0 0 8px">These <b>remove</b> jobs from the list rather than scoring them lower. We will always say when something was removed, and you can see it anyway.</p>
      <label class="say" style="display:flex;gap:8px;align-items:center;cursor:pointer">
        <input type="checkbox" id="limRelocate" ${L.relocate?'checked':''}> I would move cities for the right job</label>
      <label class="say" style="display:flex;gap:8px;align-items:center;cursor:pointer;margin-top:6px">
        <input type="checkbox" id="limOnsite" ${L.onsite_ok?'checked':''}> I can work on-site</label>

  }

  /* Who stands in the band: the woman in pink waits beside the drop zone, the
     watcher looks over the directions, the newcomer asks the questions. The
     reading step keeps the cast until the man reading a sheet is drawn. */
  const strip = ONB.step===0 ? artSvg('woman','au-people au-solo')
              : ONB.step===2 ? artSvg('watch','au-people au-solo')
              : ONB.step===3 ? artSvg('boy','au-people au-solo') : AU_PEOPLE;
  $('#root').innerHTML=`<div class="ob-paper"><div class="topbar"><h1>Job Triage</h1>
      <span class="sub" style="color:var(--muted);font-size:12px">fit &times; reachability</span>
      ${CLOUD&&USER?`<div class="spacer"></div>
        <span class="sub" style="color:var(--dim);font-size:12px">${esc(userName())}</span>
        <button class="btn-sm" id="onbSignOut">Sign out</button>`:''}</div>

    <div class="onb">
      <div class="steps">${steps.map((s,i)=>
        `<div class="stp ${i===ONB.step?'on':''} ${i<ONB.step?'did':''}">${i+1} &nbsp;${s}</div>`).join('')}</div>

  if($('#onbSignOut')) $('#onbSignOut').onclick=async()=>{

    try{ await SB.auth.signOut(); }catch(e){}
    USER=null; DB={profiles:{},current:null}; VIEW='onb'; render();

  if(ONB.step===0){

  }
  if(ONB.step===2){
    document.querySelectorAll('[data-track]').forEach(el=>el.onclick=()=>{ ONB.track=el.dataset.track; render(); });
    $('#onbBack2').onclick=()=>{ ONB.step=1; render(); };
    // The finish button moved to step 3. Leaving the old line here threw
    // TypeError on null.onclick and took the whole of step 2 with it.
    $('#onbWant').onclick=()=>{ ONB.step=3; render(); };
    const goAssess=async()=>{
      const v=$('#wantIn').value.trim();
      if(v.length<3){ ONB.assessErr='Say a bit more about the kind of work.'; render(); return; }
      ONB.assessing=true; ONB.assessErr=''; ONB.assessed=null; ONB.wantText=v; render();
      try{ ONB.assessed=await assessTrack(v,ONB.parsed); }
      catch(e){
        if(e.message==='NEEDKEY'){ ONB.assessing=false; render(); keyDialog(goAssess); return; }
        ONB.assessErr=e.message;
      }
      ONB.assessing=false; render();
    };
    $('#wantGo').onclick=goAssess;
    $('#wantIn').onkeydown=e=>{ if(e.key==='Enter') goAssess(); };
    if(ONB.wantText) $('#wantIn').value=ONB.wantText;
    if($('#wantAdd')) $('#wantAdd').onclick=()=>{
      ONB.parsed.tracks.push(ONB.assessed);
      ONB.track=ONB.assessed.id;
      ONB.assessed=null; ONB.wantText=''; render();
    };
    if($('#wantDrop')) $('#wantDrop').onclick=()=>{ ONB.assessed=null; render(); };
  }
  if(ONB.step===3){
    const p=ONB.parsed;
    /* Read on CHANGE rather than only on submit, so a person who edits a field
       and then hits Back does not silently lose it -- render() rebuilds this
       screen from ONB.parsed, which is the only place the answers live until
       finishOnb writes the profile. */
    const commit=()=>{
      const sel=n=>{ const el=document.querySelector(`input[name="${n}"]:checked`); return el?el.value:null; };
      const i=sel('intent'); if(i) p.intent=i;
      const st=sel('strict'); if(st) p.strict=Number(st);
      document.querySelectorAll('[data-mode]').forEach(el=>{
        const t=(p.tracks||[]).find(x=>x.id===el.dataset.mode);
        if(t) t.mode=el.value;
      });
      /* Blank means NO limit, which is why this is parsed rather than
         Number()'d: Number('') is 0 and 0 is also what "no limit" is stored
         as, so the two agree -- but a junk value must not become 0 silently
         either, so anything unparseable keeps the previous number. */
      const payRaw=($('#limPay').value||'').replace(/[^0-9]/g,'');
      const pay=payRaw===''?0:Number(payRaw);
      p.limits={
        relocate:  $('#limRelocate').checked,
        onsite_ok: $('#limOnsite').checked,
        min_pay:   Number.isFinite(pay)?pay:0,
        avoid:     [...document.querySelectorAll('[data-avoid]')].filter(x=>x.checked).map(x=>x.dataset.avoid),
      };
      const ex=$('#onbExemplar'); if(ex) p.exemplar=ex.value.trim();
    };
    document.querySelectorAll('#onbIntent input, #onbStrict input').forEach(el=>el.onchange=()=>{ commit(); render(); });
    document.querySelectorAll('[data-mode],[data-avoid],#limRelocate,#limOnsite').forEach(el=>el.onchange=commit);
    $('#limPay').onblur=commit;
    if($('#onbExemplar')) $('#onbExemplar').onblur=commit;
    $('#onbBack3').onclick=()=>{ if(ONB.editing) return finishOnb(); commit(); ONB.step=2; render(); };
    $('#onbDone').onclick=()=>{ commit(); finishOnb(); };
  }
}

async function onProfileFile(text,name,readErr){
  if(!String(text||'').trim()){ ONB.step=0; ONB.error=readErr ? readErr.message : "That file came through empty."; render(); return; }
  ONB.raw=text; ONB.fileName=name||'profile.md'; ONB.step=1; ONB.parsed=null; ONB.error='';
  render();
  try{ ONB.parsed=await extractProfile(text); render(); }
  catch(e){
    ONB.step=0;
    if(e.message==='NEEDKEY'){
      ONB.error="Your file loaded fine — but reading it needs a "+(LLM[PROV]||LLM.deepseek).label+" key.";
      render(); keyDialog(()=>onProfileFile(text,name)); return;
    }
    ONB.error="Your file loaded, but reading it failed. "+e.message;
    render();
  }
}
function pasteProfileDialog(){

  d.querySelector('#ptGo').onclick=()=>{

/* The step-3 questions, asked of a profile that already exists. They arrived
   after most accounts were made, so those people were never asked and are on
   the defaults without having chosen them. ONB.parsed IS the stored profile
   here, so the screen's own commit() writes straight onto it.
   ponytail: "never asked" is not stored anywhere -- it is read as "every answer
   is still the default, and this browser has not shown the screen for this
   profile". So somebody who truly wants the defaults is asked once per device.
   A profiles.asked_at column is the upgrade if that ever grates. */
const wantsKey=()=>'triage:wants:'+DB.current;
function wantsDue(){
  const p=P(); if(!p) return false;
  try{ if(localStorage.getItem(wantsKey())) return false; }catch(e){ return false; }
  const f=p.profile, L=limitsOf(f);
  return intentOf(f)==='browsing' && strictOf(f)===STRICT_DEFAULT && !f.exemplar
      && L.relocate && L.onsite_ok && !L.min_pay && !L.avoid.length;
}
function askWants(){
  const p=P(); if(!p) return;
  ONB=Object.assign(blankOnb(), { step:3, parsed:p.profile, track:p.track, editing:DB.current });
  VIEW='onb'; render();
}
/* What opening the app does, once it is really in the app. Called from
   afterAuth and again when the one-time "what you want" screen (askWants)
   is closed: that screen takes the first render, so afterAuth finds the
   app not yet open and these were skipped -- every older account's first
   visit after it shipped went without its fill (found 2026-10-24). */
function openSteps(){
  const p=P(); if(VIEW!=='app' || !p) return;
  if(decideReady(p)<READY_MIN) TAB='you';
  // Then whatever an earlier visit left unscored (a search cut off when the
  // page closed): autoScore stands aside while a search is busy, and keeps its cap.
  if(!resumePending()) fillDirection().then(()=>autoScore()).catch(e=>console.warn('open fill:', e && e.message));
}
async function finishOnb(){
  if(ONB.editing){
    try{ localStorage.setItem(wantsKey(),'1'); }catch(e){}
    VIEW='app'; ONB=blankOnb();
    openSteps();
    await save(); render(); return;
  }
  /* A second tap on the button, before the first has finished saving and
     redrawn: ONB was already reset, so there is nothing to finish. Without
     this the second tap filed a record with no profile in it -- which is the
     broken record profileRow() has to cope with above. */
  if(!ONB.parsed) return;
  const id = 'p_'+Date.now().toString(36);
  DB.profiles[id]={ profile:ONB.parsed, raw:ONB.raw, track:ONB.track, jobs:[], created:today() };
  DB.current=id; VIEW='app'; TAB='you';      // an empty To decide is not a first screen
  ONB=blankOnb();
  await save(); render();
  fillDirection();                    // not awaited: it runs like a search the person can watch
}

/* ═══════════════ MAIN APP ═══════════════ */
let PL={x:56,y:20,w:544,h:340}, PLK=1, PLW=640;
/* The plot takes the shape of the room it is given. It used to be a fixed
   640x420 box capped at 58vh, so on a wide screen it filled about half the card
   and sat in the middle of empty margins. Widen the box to the card's aspect
   (never narrower than the old one) and, when it is squeezed onto a phone,
   grow the axis text so it still reads at about 9px. The width is estimated
   from the window because the card is not in the page yet when this runs. */
const PHONE = () => window.innerWidth<=900;
function sizePlot(){
  const vw=window.innerWidth, vh=window.innerHeight;
  // A phone opens on where the jobs actually are, not on the empty 0-100 grid
  // squeezed into a thumb's width (feedback #18).
  BASE = PHONE() ? fitFrame(mapItems(true).map(x=>x.j)) : FULL;
  const SIDE = vw>=1100;   // To decide's right-hand column (the map is only ever drawn there now)
  const avail = SIDE ? Math.max(380, Math.round((Math.min(vw-110,1320) - (SEL_JOB?400:0)) * 0.46))
                     : Math.max(300, Math.min(vw-(vw>900?110:44), 1320) - (KEYOPEN&&vw>900?262:0));
  // On a phone the plot is taller than it is wide (most of the screen), so the
  // box may be narrower than the desktop's 640.
  const room=PHONE() ? Math.min(.62*vh, avail*1.25) : SIDE ? Math.min(.66*vh, avail*1.05) : Math.min(.58*vh, avail*.66);
  PLW=Math.round(Math.max(PHONE()?340:SIDE?400:640, Math.min(1000, 420*avail/room)));
  PLK=Math.max(1, Math.min(1.8, PLW/avail));
  const left=Math.round(56*PLK), bottom=Math.round(60*PLK);
  PL={x:left, y:20, w:PLW-left-40, h:420-20-bottom};
}
const plotXY=(f,r)=>{ const D=DOMAIN(); return { x:PL.x+((r-D.r0)/(D.r1-D.r0))*PL.w, y:PL.y+(1-(f-D.f0)/(D.f1-D.f0))*PL.h }; };

function inRange(j){
  if(CHFILT!=='all' && chOf(j)!==CHFILT) return false;
  if(!RANGE) return true;
  const f=fitOf(j), r=reachOf(j);
  return f>=RANGE.f0&&f<=RANGE.f1&&r>=RANGE.r0&&r<=RANGE.r1;
}
function ranked(){ const p=P();
  return p.jobs.map((j,i)=>({j,i})).filter(x=>isScored(x.j)&&inRange(x.j)).sort((a,b)=>rankOf(b.j)-rankOf(a.j)); }

/* Newest first. Rows added before 'added' existed have no date, so index order
   stands in for it — the jobs array is append-only, so a higher index is always
   the later arrival. Dated rows sort above undated ones for the same reason. */
function byNewest(list){
  return list.slice().sort((a,b)=>{
    const da=a.j.added||'', db=b.j.added||'';
    if(da&&db&&da!==db) return db.localeCompare(da);
    if(da&&!db) return -1;
    if(!da&&db) return 1;
    return b.i-a.i;
  });
}
/* Freshest first. Rank says whether a job is worth doing; age says whether it
   is still there, and an eight-week-old posting is usually filled however well
   it scores. Undated rows sort last: not knowing when something was posted is
   not the same as it being old. */
function byPosted(list){
  return list.slice().sort((a,b)=>{
    const x=ageOf(a.j), y=ageOf(b.j);
    if(x===null&&y===null) return rankOf(b.j)-rankOf(a.j);
    if(x===null) return 1;
    if(y===null) return -1;
    return (x-y) || (rankOf(b.j)-rankOf(a.j));
  });
}
/* "Best" sorts by rankFor, not rankOf, so `intent` reaches the one place it is
   supposed to: the order of the list. The two explicit sorts above are
   unchanged -- someone who has asked for "recently posted" has already said
   what they want and does not need freshness applied twice. */
const sortList = rows => SORT==='new' ? byNewest(rows) : SORT==='posted' ? byPosted(rows)
  : [...rows].sort((a,b)=>rankFor(b.j, curProf()) - rankFor(a.j, curProf()));

/* ═══ the colour law, in code ═══
   Which of the four instructions a row carries. One at most, and the order
   below is the rule: a deadline beats an opportunity, the nearer deadline beats
   the further one, and a score on its own is never an instruction. */
const WORK_FIT=65, WORK_REACH=45, STRONG_FIT=75, STRONG_REACH=55;
/* ── how picky, by `strict` ────────────────────────────────────────────────
   The four constants above are the BASELINE and stay exactly as they were:
   strict 2 is what the app has always done, and they are declared once
   because scripts/pipeline-map.js reads each by name and fails if a
   declaration matches more than once.

   A shift rather than three tables of numbers, so there is one place to argue
   with and the relationship between the bands cannot drift. Reach moves less
   than fit because reachability is the noisier axis -- it is composed from
   four nouls rather than asked -- and shifting it as hard would make strict 3
   a filter on confidence rather than on quality.

   This moves the DISPLAY bands only. It deliberately does not touch MIN_FIT,
   which is applied at intake by scoreAndCut: raising that would DISCARD rows
   rather than hide them, and a strictness dial that permanently deletes work
   is not a dial. Lowering it for strict 1 would be safe but costs scoring
   credits on rows the person may never look at, so that is a separate
   decision about spend and not part of this. */
const STRICT_SHIFT = { 1: -10, 2: 0, 3: 10 };
const clamp100 = n => Math.max(0, Math.min(100, Math.round(n)));
function barsFor(prof){
  const d = STRICT_SHIFT[strictOf(prof)] || 0;
  return {
    workFit:     clamp100(WORK_FIT     + d),
    workReach:   clamp100(WORK_REACH   + d * 0.7),
    strongFit:   clamp100(STRONG_FIT   + d),
    strongReach: clamp100(STRONG_REACH + d * 0.7),
  };
}
const CLOSING_DAYS=21, STALE_DAYS=60;
const FLAGS_GOOD=['strong_fit','non_traditional_friendly','rare_combination_fit'];
/* `prof` is optional throughout: omitted, strictOf returns its default of 2
   and barsFor hands back the baseline, so every existing call site keeps its
   exact behaviour and only the ones that pass a profile become adjustable. */
const isStrong = (j, prof) => { const b=barsFor(prof); return fitOf(j)>=b.strongFit && reachOf(j)>=b.strongReach; };
const overBar  = (j, prof) => { const b=barsFor(prof); return fitOf(j)>=b.workFit   && reachOf(j)>=b.workReach; };
/* Old enough to be filled soon, not so old it probably already has been. Only
   for something worth doing -- a below-the-bar posting going stale asks nothing
   of anyone. */
function isClosing(j){
  if(chOf(j)==='deadline'){ const d=daysTo(j.deadline); return stOf(j)==='new' && d!==null && d>=0 && d<=CLOSING_DAYS; }
  const n=ageOf(j);
  return stOf(j)==='new' && isScored(j) && overBar(j, curProf()) && n!==null && n>=CLOSING_DAYS && n<=STALE_DAYS;
}
function accentOf(j){
  const st=stOf(j);
  if(st==='closed') return 'closed';
  if(isDue(j)) return 'due';
  if(st==='live') return 'go';
  if(st==='sent') return 'awaiting';
  if(isClosing(j)) return 'closing';
  if(isScored(j) && isStrong(j, curProf())) return 'go';
  return '';
}
/* When a sent row falls due: the later of the date stored on it and one window
   after the last time it was touched.
   The max is the point: logEvent advances last_touch and never
   follow_up_date, so reading the stored date alone left a row Overdue forever
   once its date had passed -- the chase would be sent, logged, and the row
   would still be asking for it while reporting "silent for 0 days". A date the
   user set further out still wins, because nothing touches the row to move it. */
function followUpOn(j){
  const on=[];
  if(j.follow_up_date) on.push(j.follow_up_date);
  const t=j.last_touch||j.date_applied;
  if(t){
    const d=new Date(t+'T00:00:00Z');
    if(!isNaN(d)){ d.setUTCDate(d.getUTCDate()+FOLLOWUP_DAYS); on.push(isoOf(d)); }
  }
  // ISO dates sort chronologically as strings.
  return on.length ? on.reduce((a,b)=>a>b?a:b) : '';
}
// Returns '' rather than echoing the input: this feeds markup, and a value
// that is not a date has no business being rendered as one.
const mmdd = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s||'')) ? String(s).slice(5) : '';
const ordinal = n => { const t=n%100; return n+((t>10&&t<14)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th')); };

/* One job, opened in place under its own row. Deliberately does not repeat the
   row's actions -- they are right above it. What it adds is everything the row
   has no room for: the four numbers, the reasoning, the history, the people. */
function jobDetail(j,i,acc){
  const cts=listOf(j,'contacts'), ev=listOf(j,'events'), st=stOf(j), ch=chOf(j);
  const age=ageOf(j), silent=daysSilent(j), scored=isScored(j), due=isDue(j);
  const btn=(act,label,cls)=>`<button class="btn-sm ${cls||''}" data-act="${act}" data-i="${i}">${label}</button>`;
  // CSV imports write a missing link as the literal text "nan".
  // httpUrl, like every other href here: esc() stops a quote breaking out of
  // the attribute but not a javascript: link, and this url can arrive from a
  // CSV import or a shared backup.
  const url=String(j.url||'').trim().toLowerCase()==='nan' ? '' : httpUrl(String(j.url||'').trim());

  const eyebrow =
      st==='closed'     ? 'closed'
    : due               ? `overdue — ${silent} days without a reply`
    : st==='live'       ? 'in conversation — they replied'
    : st==='sent'       ? `awaiting — sent ${silent?silent+'d ago':'today'}`
    : acc==='closing'   ? `closing — posted ${age} days ago`
    : acc==='go'        ? 'do this first'
    : !scored           ? 'not scored yet'
    : overBar(j, curProf()) ? 'worth a shot' : 'below the bar';

  const all=P().jobs.filter(isScored).sort((a,b)=>rankOf(b)-rankOf(a));
  const pos=all.indexOf(j)+1;
  const window_ = age===null ? 'posting date unknown'
    : acc==='closing' ? 'apply soon or drop it'
    : age<=14 ? 'fresh' : age>STALE_DAYS ? 'probably filled' : '';
  const stat=(k,v,c,cls)=>`<div class="qd-stat ${cls||''}"><div class="eyebrow">${k}</div>
      <div class="v">${v}</div><div class="c">${c||'&nbsp;'}</div></div>`;

  const flags=flagsOf(j);
  const longOf=f=>String(FLAG_CODES[f.code]||f.code);
  const pill=(f,cls)=>`<span class="pl ${cls}">${esc(longOf(f).replace(/_/g,' '))}</span>`;
  const forIt=flags.filter(f=>FLAGS_GOOD.includes(longOf(f))), against=flags.filter(f=>!FLAGS_GOOD.includes(longOf(f)));
  /* The flag is the claim, the fact is what makes it true here, the span is
     where that came from. A flag with no fact still shows -- it is a real
     judgement, just one nothing could be pointed at for. */
  const evidence=(list,cls)=>`<div class="ev">${list.map(f=>`<div class="ev-i">
      ${pill(f,cls)}
      ${f.fact?`<div class="ev-f">${esc(f.fact)}</div>`:''}
      ${f.span?`<div class="ev-s">\u201c${esc(f.span)}\u201d</div>`
        :f.fact?`<div class="ev-n">No line in the posting matches this closely enough to quote.</div>`:''}
    </div>`).join('')}</div>`;
  /* Jobs scored before the model stopped writing sentences have one, and no
     facts. Re-scoring them to fix that would be a paid rewrite of work already
     done, so the old sentence is shown for those rows and only those. */
  const legacy = !flags.some(f=>f.fact) && j.ai_reason
    ? `<p class="qd-p">${esc(j.ai_reason)}</p>` : '';

  // Who did what, coloured by the same law: a reply is your move, a send is theirs.
  const kindAcc = k => k==='reply' ? 'go' : k==='sent' ? 'awaiting' : k==='chase' ? 'due' : '';
  /* Mail about this job sits in its history beside what was logged, newest
     first. An event that filed a mail is shown as the mail, not twice. */
  const jk=keyOf(j), jobsNow=(P()||{}).jobs||[];
  const hist=MAIL.filter(m=>mailJobKey(m,jobsNow)===jk).map(m=>({ on:mailDay(m),
      html:`<div class="qh ${mailAcc(m.decision.kind)}"><i></i><span class="when">${esc(mailDay(m))}</span>
        <span class="what"><b>mail</b> · ${esc(KIND_SAYS[m.decision.kind]||'a mail')} · ${esc(m.from_addr||'')}
        <details><summary>${esc(m.subject||'(no subject)')}</summary>
          ${m.excerpt?`<div class="qd-quote">${esc(m.excerpt)}</div>`:''}</details></span></div>` }))
    .concat(ev.filter(e=>!e.mail).map(e=>({ on:e.on,
      html:`<div class="qh ${kindAcc(e.kind)}"><i></i><span class="when">${esc(e.on)}</span>
        <span class="what"><b>${esc(e.kind)}</b>${e.text?' · '+esc(e.text):''}</span></div>` })))
    .sort((a,b)=>String(b.on).localeCompare(String(a.on)));

  const advice =
      due              ? ['due', `Sent ${silent} days ago with no reply. One short nudge is worth sending; a second rarely is.`]
    : st==='live'      ? ['go', 'Someone is on the other end of this one. Keep it moving before anything else.']
    : st==='sent'      ? ['awaiting', `Nothing to do yet. If they stay silent, chase on ${followUpOn(j)||'the follow-up date'}.`]
    : acc==='closing'  ? ['closing', 'Postings this old are usually filled within a fortnight. Send it today, or close it honestly.']
    : acc==='go'       ? ['go', 'Strong on both axes. Worth a proper application, not a quick one.']
    : null;

  const src={feed:'stated by the source',page:'read from the listing',est:'estimated'}[String(j.posted_src||'')]||'';
  const rec=(k,v,cls)=>`<div class="rec"><span class="k">${k}</span><span class="v ${cls||''}">${v}</span></div>`;

  return `<div class="qd ${acc}">
    <div class="qd-main">
      <div class="qd-eb"><i></i><span class="eyebrow">${esc(eyebrow)}</span></div>
      <div class="qd-stats">
        ${stat('Rank', scored?Math.round(rankOf(j)):'—', pos?`${ordinal(pos)} of ${all.length}`:'')}
        ${stat('Fit', scored?fitOf(j):'—', 'what you can do')}
        ${stat('Reach', scored?reachOf(j):'—', 'whether they will look')}
        ${stat('Window', age===null?'—':spanTxt(age), window_, acc==='closing'?'closing':'')}
      </div>

      <div class="qd-two">
        <div><div class="qd-h">Why it scores this way</div>
          ${legacy}
          ${forIt.length ? evidence(forIt,'go')
            : legacy ? ''
            : scored ? `<p class="qd-p">Nothing counted in its favour beyond the two scores themselves.</p>`
            : `<p class="qd-p">Not scored yet — scoring reads it against your background.</p>`}</div>
        <div><div class="qd-h">Against it</div>
          ${against.length ? evidence(against,'')
            :`<p class="qd-p">Nothing flagged against it.</p>`}</div>
      </div>

      ${j.description?`<div class="qd-h">From the posting</div>
        <div class="qd-quote">${esc(j.description)}</div>`:''}

      <div class="qd-h">History</div>
      ${hist.length
        ? hist.map(h=>h.html).join('')
        : `<div class="qd-none">Nothing logged yet.</div>`}
      <div class="btn-row" style="margin-top:10px">${btn('logadd','Log something')}</div>
    </div>

    <div class="qd-rail">
      ${advice?`<div class="qd-callout ${advice[0]}">${esc(advice[1])}</div>`:''}
      ${(()=>{ const cv=cvOf(j); return `<div class="qd-cv"><div class="qd-h">Your CV for this job</div>
        ${cv ? `<p class="qd-p">Tailored ${esc(cv.on)}${cv.gaps&&cv.gaps.length?` · ${cv.gaps.length} thing${cv.gaps.length===1?'':'s'} it asks for that your CV does not show`:''}.</p>
          <div class="btn-row">${btn('cvopen','Open it')}${btn('cv','Tailor again')}</div>`
             : `<p class="qd-p">Your CV, reordered and reworded around what this job asks for. Nothing is added that your CV does not say.</p>
          <div class="btn-row">${btn('cv','Tailor my CV to this job')}</div>`}</div>`; })()}
      ${url
        ? `<a class="lnk" href="${esc(url)}" target="_blank" rel="noopener" data-applyask="${i}">open the original posting ↗</a>`
        : `<a class="lnk" href="https://www.google.com/search?q=${encodeURIComponent([j.title,j.company,j.location,'job'].filter(Boolean).join(' '))}" target="_blank" rel="noopener">no link saved — search Google for it ↗</a>`}

      <div><div class="qd-h">The record</div>
        ${rec('channel', ch==='cold'?'cold approach':ch==='posted'?'posted role':OPP[ch].one)}
        ${j.source?rec('source', esc(j.source)):''}
        ${rec('confidence', esc(j.ai_confidence||'unknown'))}
        ${rec('posted', age===null?'unknown':esc(ageLabel(j))+(src?` · ${src}`:''), acc==='closing'?'closing':'')}
        ${j.added?rec('added', esc(j.added)):''}
        ${rec('stage', due?'overdue':esc(st), acc)}
      </div>

      <div><div class="qd-h">People</div>
        ${cts.length
          ? cts.map((c,ci)=>`<div class="qp">
              <div class="qp-n">${esc(c.name||'(no name)')}</div>
              <div class="qp-r">${[c.role, c.tier==='recruiting'?'recruiting':c.tier?'hiring side':''].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</div>
              ${c.email?`<div class="qp-m">${esc(c.email)}</div>`:''}
              ${c.linkedin?`<div class="qp-m"><a class="lnk" href="${esc(c.linkedin)}" target="_blank" rel="noopener">${esc(c.linkedin.replace(/^https?:\/\//,'').slice(0,40))}</a></div>`:''}
              <div class="btn-row" style="margin-top:7px">
                ${c.linkedin?`<button class="btn-sm" data-act="inmail" data-i="${i}" data-ci="${ci}">Draft InMail</button>`:''}
                <button class="btn-sm" data-act="ctdel" data-i="${i}" data-ci="${ci}">Remove</button></div>
            </div>`).join('')
          : `<div class="qd-none">Nobody added yet.${ch==='cold'?' For a cold approach this is the whole job — find the person before writing the message.':''}</div>`}
        <div class="btn-row" style="margin-top:9px">
          ${btn('ctadd','Add a person')}${btn('hrfind','Find contacts')}</div>
      </div>

      <div><div class="qd-h">Stage</div>
        <div class="btn-row" style="margin-top:10px">
          ${STAGES.map(x=>`<button class="btn-sm ${st===x?'btn-go':''}" data-act="stage" data-to="${x}" data-i="${i}">${x}</button>`).join('')}
        </div></div>
    </div>
  </div>`;
}

/* One row. The edge says what to do, the rank says how good it is, and two
   facts say why now -- chosen by stage, because "posted 24 days ago" is the
   question for a new row and "silent for 11 days" is the question for a sent
   one. Actions: whatever advances the pipeline, then Details, then the one
   primary move furthest right. Close is not here: it is the one destructive
   move, and it lives in the stage row inside the panel. */
/* The rail's icons. One convention for all of them: 24x24, stroke only, in

const ic = n => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

const artSvg = (k, cls, label) => `<svg${cls?` class="${cls}"`:''} viewBox="${ART[k].vb}" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}>${ART[k].inner}</svg>`;
const CAST = artSvg('cast','r-cast','The three job seekers and their car');

/* Waiting.
   The car alone, lifted out of CAST, for the waiting scene (.wait, .road). */
const CAR_SVG = artSvg('car','car');
const searching = () => busy && STOP!==null;   // a board search, not scoring
let SEARCH_TXT = '';                             // survives render(); setSearchInfo writes it
function waitScene(head, sub, id, pal){
  /* The wait has company: someone stands at the end of the road and the car
     drives up to them. A board search (it has an id for its live line) is the
     long wait, so the girl waits. The boot splash passes the woman in sunglasses,
     who watches. Neither passed: the car alone. */
  const who = pal || (id ? 'girl' : '');
  return `<div class="wait${who?' co':''}" role="status"><div class="wait-h">${esc(head)}</div>
    <div class="wait-s"${id?` id="${id}"`:''}>${esc(sub||'')}</div>
    <div class="road">${CAR_SVG}${who?artSvg(who==='girl'?'girl':'watch','wait-pal'):''}</div></div>`;
}
/* Whether the rail is open. Remembered on a wide screen, where open is a
   layout; never on a phone, where open is a sheet over the page. */
let RAIL = false;
try{ RAIL = window.innerWidth>900 && localStorage.getItem('triage:rail')==='1'; }catch(e){}

/* Saved for later: a right swipe on the phone deck, or "Save for later" in a
   row's menu. Kept as an event in the job's own history rather than a new
   column, so it syncs with the row, shows in its timeline, undoes through
   snapRow like every other action, and counts as history -- a saved job is
   never cleared as untouched. */
const isSaved = j => listOf(j,'events').some(e=>e.kind==='saved');
function toggleSaved(j){
  if(isSaved(j)){ setList(j,'events', listOf(j,'events').filter(e=>e.kind!=='saved')); j.last_touch=today(); }
  else logEvent(j,'saved','saved for later');
}
/* Passed: a left swipe. Nothing about the job changes -- it only leaves the
   deck, and stays in every list -- so it is remembered on this device only,
   per profile, until "Go through them again" clears it. */
let PASSED = null;
const passedKey = () => 'triage:passed:'+(DB.current||'');
function passedSet(){
  if(!PASSED || PASSED.pid!==DB.current){
    let a=[]; try{ a=JSON.parse(localStorage.getItem(passedKey())||'[]'); }catch(e){}
    PASSED={ pid:DB.current, keys:new Set(Array.isArray(a)?a:[]), last:[] };
  }
  return PASSED;
}
function keepPassed(){ try{ localStorage.setItem(passedKey(), JSON.stringify([...passedSet().keys])); }catch(e){} }

/* The phone's Unapplied tab: one job at a time, in the queue's own order,
   swiped like a dating app. Right saves it, left passes it, and the filled
   button between the two still does the job's one action. */
function deckHTML(order){
  const p=P(), ps=passedSet();
  const left=order.filter(x=>!ps.keys.has(keyOf(x.j)));
  const back=ps.last.length ? p.jobs.findIndex(j=>keyOf(j)===ps.last[ps.last.length-1]) : -1;
  const backBtn=back>=0 ? `<button class="btn-sm" data-act="unpass" data-i="${back}">Back</button>` : '';
  if(!left.length) return `<div class="deck"><div class="empty"><b>You have been through all ${order.length}</b>
    The ones you saved are below.${ps.keys.size?`<div class="btn-row" style="margin-top:12px;justify-content:center">
      <button class="btn-sm" id="deckAgain">Go through the ${ps.keys.size} you passed again</button></div>`:''}</div></div>`;
  const card=(x,top)=>{ const j=x.j, f=fitOf(j), r=reachOf(j), age=ageOf(j);
    return `<article class="dcard ${accentOf(j)}${top?' top':''}"${top?' id="deckTop"':' aria-hidden="true"'}>
      <div class="dc-band">${x.band}</div>
      <h3>${esc(j.title||'(untitled)')}</h3>
      <p class="dc-co">${esc([j.company,j.location].filter(Boolean).join(' \u00b7 ')||'\u2014')}</p>
      <div class="dc-facts"><div><span class="eyebrow">fit / reach</span><b>${f} \u00b7 ${r}</b></div>
        <div><span class="eyebrow">posted</span><b>${age===null?'unknown':esc(ageLabel(j))}</b></div></div>
      <p class="dc-why">${esc(String(j.ai_reason||j.description||'').slice(0,240))}</p>
      ${top?`<button class="btn-sm" data-act="open" data-i="${x.i}">Read the whole posting</button>`:''}
    </article>`; };
  const top=left[0];
  return `<div class="deck">
    <div class="deck-meta"><span>${order.length-left.length+1} of ${order.length}</span>${backBtn}</div>
    <div class="deck-stack">${left[1]?card(left[1],false):''}${card(top,true)}</div>
    <div class="deck-btns">
      <button class="deck-b pass" data-act="pass" data-i="${top.i}" aria-label="Pass for now" title="Pass for now">${ic('x')}</button>
      ${primaryAct(top.j, top.i)}
      <button class="deck-b keep" data-act="save" data-i="${top.i}" aria-label="Save for later" title="Save for later">${ic('heart')}</button>
    </div>
    <p class="deck-hint">Swipe right to save, left to pass. Passing keeps the job; it only leaves this stack.</p>
  </div>`;
}

/* The one button a job's state calls for. The row leads with it, the selected
   row keeps nothing else, and the sheet on a small screen repeats it -- one
   source, so the three cannot disagree. Labels are escaped where they carry
   anything from a job record: follow_up_date arrives from CSV and backups. */
function primaryAct(j,i){
  const st=stOf(j);
  const b=(act,label,cls)=>`<button class="btn-sm act-primary ${cls}" data-act="${act}" data-i="${i}">${label}</button>`;
  if(st==='new' && OPP[chOf(j)].btn) return b(OPP[chOf(j)].act||'pitch',OPP[chOf(j)].btn,'btn-go');
  if(st==='new') return chOf(j)==='cold' ? b('pitch','Write the DM','btn-go')
    : httpUrl(String(j.url||'').trim()) ? b('apply','Apply \u2197','btn-go') : b('sent','Mark applied','btn-go');
  if(st==='sent'){
    const on=esc(mmdd(followUpOn(j)));
    return isDue(j) ? b('chase','Write the chase','btn-due') : b('chase', on?`Chase on ${on}`:'Chase', 'btn-await');
  }
  return st==='live' ? b('note','Log a note','btn-go') : b('reopen','Reopen','');
}

function jobCard(j,i){
  const f=fitOf(j), r=reachOf(j), ch=chOf(j), st=stOf(j), due=isDue(j), acc=accentOf(j);
  const cts=listOf(j,'contacts'), ev=listOf(j,'events');
  const age=ageOf(j), scored=isScored(j);
  const sel = SEL_JOB===keyOf(j);
  const btn=(act,label,cls)=>`<button class="btn-sm ${cls||''}" data-act="${act}" data-i="${i}">${label}</button>`;
  /* Opens the pane, not the row. The label no longer toggles to "Hide",
     because the row does not hold the detail any more -- closing is the pane's
     own job, and a button saying "Hide" about content sitting in another
     column would be lying about where that content is. */
  const details=btn('open','Read');
  const pri=primaryAct(j,i);
  /* The posting, in the slot the eye reaches first. Every other thing the app
     does -- two scores rather than one, the ranking, the sections -- exists to
     produce this one click, and it used to be a text link folded inside the
     detail panel while the filled button went to a writing task. Recording the
     application is bookkeeping: it happens as a consequence of applying, and
     the deliberate version of it sits in the menu with the rest.
     No link saved means there is nothing to open, so the row falls back to
     marking by hand rather than offering a button that cannot work. */
  const url = httpUrl(String(j.url||'').trim());
  const more = items => `<details class="rowmenu"><summary title="More actions">\u22ef</summary>
      <div class="rowmenu-pop">${items.filter(Boolean).join('')}</div></details>`;
  const acts =
      st==='new'  ? (ch==='cold'
                      /* A cold row has no posting to open, so the one thing to
                         do is write to a person. The accent stays on that. */
                      ? pri + details
                        + more([btn('save', isSaved(j)?'Take off saved':'Save for later'),
                                btn('sent','Mark contacted'),
                                btn('hrfind','Find contacts'),
                                btn('close','Not interested')])
                      : pri + details
                        + more([btn('save', isSaved(j)?'Take off saved':'Save for later'),
                                url?btn('sent','Mark applied without opening'):'',
                                btn('pitch','Draft outreach'),
                                btn('cv','Tailor my CV to this'),
                                btn('hrfind','Find contacts'),
                                btn('close','Not interested')]))
    : st==='sent' ? btn('live','They replied') + details + pri
    : details + pri;

  const fact=(k,v,cls)=>`<div class="qfact"><div class="eyebrow">${k}</div><div class="v ${cls||''}">${v}</div></div>`;
  /* Gone from the index it was found in -- public.job_checks saw it yesterday
     and not today. Only ever false when something actually looked: liveOf
     returns null for a posting nobody has checked, and null is not false.
     A rank on a posting that no longer exists is not a low score, it is a
     wrong one, so the number goes rather than shrinking. */
  const gone = liveOf(j) === false;
  const fitReach = gone ? fact('listing', 'gone from the board', 'quiet')
                 : scored ? fact('fit / reach', `${f} · ${r}`) : fact('score', 'not yet', 'quiet');
  const facts =
      st==='new'  ? fitReach + (ch==='deadline'
                      ? (d=>fact('closes', d===null?'check the page':d<0?'next cycle':esc(mmdd(j.deadline)), d!==null&&d>=0&&d<=CLOSING_DAYS?'closing':'quiet'))(daysTo(j.deadline))
                    : ch==='place'
                      ? fact('ask for', esc(((String(j.description||'').match(/^Ask about: (.+)$/m)||[])[1]||'a trial').replace(/^(.{34}).+$/,'$1\u2026')), 'quiet')
                    : ch==='pitch'||ch==='person'
                      ? fact(ch==='pitch'?'pitch to':'ask for', esc(((String(j.description||'').match(ch==='pitch'?/^Commissioned by: (.+)$/m:/^Ask: (.+)$/m)||[])[1]||(ch==='pitch'?'the commissioning editor':'advice')).replace(/^(.{34}).+$/,'$1\u2026')), 'quiet')
                    : ch==='cold'
                      ? fact('contacts', cts.length?`${cts.length} found`:'none yet', cts.length?'':'quiet')
                      : fact('posted', age===null?'unknown':esc(ageLabel(j)),
                          [acc==='closing'?'closing':'', age===null||age>STALE_DAYS?'quiet':'', String(j.posted_src)==='est'?'est':''].join(' ')))
    : st==='sent' ? (due ? fact('silent for', `${daysSilent(j)} days`, 'due') : fact('state', 'waiting', 'awaiting'))
                    + fact('sent', j.date_applied?esc(mmdd(j.date_applied)):'—', 'quiet')
    : st==='live' ? fact('state', 'in conversation', 'go') + fact('last', ev[0]?esc(mmdd(ev[0].on)):'—', 'quiet')
    : fact('state', 'closed', 'quiet') + (scored ? fact('fit / reach', `${f} · ${r}`, 'quiet') : fact('score','—','quiet'));

  const sub=dirMark(dirKey(j),dirLabel(dirKey(j)))+[j.company||'—', j.location, ch==='cold'?'cold approach':ch==='posted'?'posted role':OPP[ch].one].filter(Boolean).map(esc).join(' · ');
  /* Where it sits, without leaving the list: a thumbnail of the map with this
     one dot on it. Shown on hover only, so a row at rest stays a row. */
  const mini = scored && !gone ? `<svg class="qmini" width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><path d="M3 3V35H35" fill="none" stroke="var(--line)" stroke-width="1"/><path d="M19 3V35M3 19H35" stroke="var(--hair)" stroke-width="1"/><circle cx="${(3+r/100*32).toFixed(1)}" cy="${(35-f/100*32).toFixed(1)}" r="3.2" fill="${st==='new'&&ch!=='cold'?`var(--dir-${dirIdx(dirKey(j))})`:'var(--text)'}"/></svg>` : '';
  /* Applied rows: the last three things that happened, on hover. */
  const hist = st!=='new' && ev.length ? `<div class="qhist">${ev.slice(0,3).map(e=>`<div><span class="num">${esc(mmdd(e.on))}</span> ${esc(e.kind)}${e.text?` — ${esc(String(e.text).slice(0,70))}`:''}</div>`).join('')}</div>` : '';
  const rankCls = st!=='new' ? 'quiet' : '';

  return `<div class="qitem ${acc} ${gone?'closed':''} ${sel?'sel':''}" data-jobidx="${i}" data-st="${st}">
    <div class="qrow">
      <i class="qbar"></i>
      <span class="qrank ${rankCls}">${gone?'—':(scored?Math.round(rankOf(j)):'—')}</span>
      <div style="min-width:0"><div class="qt">${esc(j.title||'(untitled)')}</div><div class="qs">${sub}</div></div>
      <div class="qfacts">${facts}${mini}</div>
      <div class="qacts">${acts}</div>
    </div>${hist}
  </div>`;
}

/* ═══ the daily view ═══
   Ordered by what is actually worth doing, not by score. A live conversation
   beats ten new applications, and a chase that is three days overdue beats a
   fresh application, because the cost of losing it is already sunk. New work
   comes last on purpose — it is the most tempting and the least urgent. */
/* The single next action, worked out from state instead of left to the reader.
   Order matters: a person who owes someone a reply should be told that before
   they're told about a promising new listing. Returns null only when there is
   genuinely nothing to do. */
/* The picture beside a next-step banner, standing on tile, never inside it: the
   banner's edge carries an instruction colour. Only states that have art are
   listed. 'follow' (overdue: the man glancing at a watch) and 'live' (a reply:
   the cast, arms up) are left out until those poses are drawn, so those two
   banners stay as they were. */
const NEXT_ART = {
  score: () => artSvg('watch','next-fig'),
  clear: () => artSvg('juice','next-word') + artSvg('girl','next-fig'),
};
function nextStep(){
  const p=P(), jobs=p.jobs;
  // A search is finding and scoring: say so, and offer no button that would start the same work twice.
  if(searching()) return {cls:'',h:'Finding jobs for this direction',
    s:'They join the list below as they are found and take their place once scored. Start on any of them now.', art:'score'};
  if(!jobs.length) return {cls:'',h:'Nothing in the tracker yet',
    s:'Start with companies worth approaching — it works out who would want you, then checks which are hiring.',
    b:'Suggest companies for me', act:'suggest'};

  const unscored=jobs.filter(j=>!isScored(j)).length;
  if(unscored) return {cls:'',h:`${unscored} job${unscored>1?'s':''} not scored yet`,
    s:'Scoring reads each one against your background and rates fit and reachability separately.',
    b:'Score them', act:'score', art:'score'};

  const due=jobs.filter(isDue).length;
  if(due) return {cls:'warn',h:`${due} follow-up${due>1?'s':''} overdue`,
    s:'These were sent over a week ago with no reply. A short nudge beats starting somewhere new.',
    b:'Open follow-ups', act:'follow'};

  const live=jobs.filter(j=>stOf(j)==='live').length;
  if(live) return {cls:'calm',h:`${live} live conversation${live>1?'s':''}`,
    s:'Someone is actually on the other end of these. They are worth more than anything else on the board.',
    b:'Open follow-ups', act:'follow'};

  const fresh=ranked().filter(x=>stOf(x.j)==='new'&&isOpen(x.j));
  if(fresh.length){ const t=fresh[0];
    return {cls:'',h:`${fresh.length} scored and untouched`,
      s:`Best of them: ${t.j.title}${t.j.company?' at '+t.j.company:''} — fit ${fitOf(t.j)}, reachability ${reachOf(t.j)}.`,
      b:'Open it', act:'job:'+t.i};
  }
  return {cls:'calm',h:'Clear for today',
    s:'Everything scored has been actioned or closed. Pull in more roles when you want the next batch.',
    b:'Find more jobs', act:'suggest', art:'clear'};
}

/* Freshest first, which is the one ordering the rest of the app cannot give.
   Rank answers "is this worth doing", recency answers "is it still there" —
   an eight-week-old posting is usually filled or abandoned however well it
   scores. Undated rows are listed at the end rather than dropped: not knowing
   when something was posted is not the same as it being old. */
/* One section of the queue, headed and ruled in its accent. Every list view
   renders these. An empty accent is a plain section: nothing wanted of you. */
const sect=(acc,title,sub,rows)=>rows.length?`<div class="qsec ${acc}">
    <div class="qsec-h"><h3>${title}</h3><span class="ct">${rows.length}</span></div>
    <p class="qsec-sub">${sub}</p>
    <div class="qcar" data-car="${esc(title)}">${rows.map(x=>jobCard(x.j,x.i)).join('')}</div></div>`:'';

/* To decide's row and section, for things that are not jobs -- a company, a
   direction, a stage, a logged event -- so every view reads the same way: a
   ruled section, then rows of rank, name, one line under it, two facts as a
   label over a value, and the buttons on the right. The row's accent is its
   instruction, as on a job; st:'new' makes the extra buttons wait for hover. */
function rowCard({acc='', rank='', quiet=false, title, sub='', facts=[], acts='', st='info', pop=''}){
  const fact=([k,v,cls])=>`<div class="qfact"><div class="eyebrow">${k}</div><div class="v ${cls||''}">${v}</div></div>`;
  return `<div class="qitem ${acc}" data-st="${st}">
    <div class="qrow"><i class="qbar"></i><span class="qrank ${quiet?'quiet':''}">${rank}</span>
      <div style="min-width:0"><div class="qt">${title}</div><div class="qs">${sub}</div></div>
      <div class="qfacts">${facts.slice(0,2).map(fact).join('')}</div>
      <div class="qacts">${acts}</div></div>${pop?`<div class="qhist">${pop}</div>`:''}
  </div>`;
}
const sectOf=(acc,title,sub,n,inner)=>n?`<div class="qsec ${acc}">
    <div class="qsec-h"><h3>${title}</h3><span class="ct">${n}</span></div>
    ${sub?`<p class="qsec-sub">${sub}</p>`:''}<div style="margin-top:6px">${inner}</div></div>`:'';

/* The same section, folded away: rows that are real but not what you came for
   -- under the bar, not yet scored, already closed. Reachable without being
   scrolled past. Capped, because a fold can hold hundreds. */
const foldSect=(key,title,sub,rows)=>{
  if(!rows.length) return '';
  /* A fold holding the open job has to be open AND has to render it. Folds
     start closed and cap at LIST_CAP, so "Open" from the dashboard on a closed
     or far-down row used to switch tab and then do nothing at all: the row was
     display:none inside a shut <details>, or past the cap and never rendered,
     and scrollIntoView had nothing to find. */
  const holdsOpen = !!SEL_JOB && rows.some(x=>keyOf(x.j)===SEL_JOB);
  const shown = rows.slice(0,LIST_CAP);
  if(holdsOpen && !shown.some(x=>keyOf(x.j)===SEL_JOB)) shown.push(rows.find(x=>keyOf(x.j)===SEL_JOB));
  const hidden = rows.length - shown.length;
  return `<details class="fold" data-fold="${key}" ${(FOLDS[key]||holdsOpen)?'open':''} style="margin-bottom:26px">
    <summary>${title}<span class="num" style="font-size:12px;color:var(--dim);margin-left:7px">${rows.length}</span></summary>
    <div class="foldbody">
      <p class="qsec-sub" style="margin:0 0 4px">${sub}</p>
      <div class="qcar" data-car="${esc(key)}">${shown.map(x=>jobCard(x.j,x.i)).join('')}</div>
      ${hidden>0?`<p class="hint">${hidden} more not shown. Narrow with the channel filter, or sort to bring what you want to the top.</p>`:''}
    </div></details>`;
};

/* ═══ Unapplied ═══
   Everything still to decide on, in the order worth deciding it. Two bands
   above the bar, because "worth doing" and "worth doing first" are different
   answers and a flat list of forty gives neither. Under the bar and not-yet-
   scored both fold away rather than vanish: a low score is a judgement, and an
   unscored row has not been judged at all.

   Honours the channel filter, which is right there in the header. Ignores the
   map's drag-selection on purpose -- a box drawn yesterday quietly shortening
   this list tomorrow morning is the kind of invisible state that makes a tool
   untrustworthy. */

function renderUnapplied(){
  const p=P();
  const open=p.jobs.map((j,i)=>({j,i}))
    .filter(x=>isOpen(x.j) && stOf(x.j)==='new' && (CHFILT==='all'||chOf(x.j)===CHFILT));
  /* The map is a layer over this list (feedback #21): while it is zoomed or
     filtered to a Key line, the list is exactly the jobs in its view, from
     every direction -- the map's own lens replaces the direction lens -- and a
     line above the list says so and undoes it. */
  const narrow = ZOOM.length>0 || !!MAPSEL;
  const inMap = x => inDomain(x.j, DOMAIN()) && (!MAPSEL || MAPSEL.test(dotKeys(x.j)));
  const all = narrow ? open.filter(x=>isScored(x.j) && inMap(x)) : open.filter(x=>inDir(x.j,p));
  /* Another direction's jobs: not in this list (switching direction changes
     it), but the good ones are one fold away, named by their direction, since
     a strong role elsewhere can beat a middling one here. Its score was made
     against that direction, so it is labelled rather than ranked in. */
  const dirName=id=>((p.profile.tracks||[]).find(t=>t.id===id)||{}).label||'another direction';
  const elsewhere=narrow ? [] : sortList(open.filter(x=>!inDir(x.j,p) && isScored(x.j) && overBar(x.j,p.profile) && !redLine(x.j,p.profile)));
  const elseFold=foldSect('elsewhere','Strong in your other directions',
    `Over the bar for ${[...new Set(elsewhere.map(x=>dirName(x.j.dir)))].join(', ')}. Scored for that direction, not this one; switch direction to rank them.`,elsewhere);
  /* The red lines, applied HERE and nowhere else: at read time, over the list
     the queue is about to draw. Nothing is written, no score is altered, and
     unchecking a limit brings every one of these straight back on the next
     render -- which is the only safe way to run a filter that removes work. */
  all.forEach(x => { x.gated = redLine(x.j, p.profile); });
  const gated = all.filter(x => x.gated);
  const mine  = SHOW_GATED ? all : all.filter(x => !x.gated);
  /* Said separately from "nothing waiting", because the two mean opposite
     things: one is an empty pipeline, the other is a filter doing its job, and
     telling a person their search found nothing when their own red line
     removed it all is the worst version of this feature. */
  if(!mine.length && gated.length) return `<div class="empty"><b>Everything here is behind one of your red lines</b>
    ${gated.length} role${gated.length===1?'':'s'} matched your directions but ${gated.length===1?'was':'were'} removed by the limits you set.
    <div class="btn-row" style="margin-top:12px;justify-content:center">
      <button class="btn-sm" id="showGated">Show them anyway</button></div></div>`;
  if(!mine.length) return (searching() ? '' : `<div class="empty">${artSvg('woman','empty-art')}<b>Nothing waiting</b>
    Everything here has been actioned or closed. Pull in more roles when you want the next batch.</div>${elseFold}`)
    + (narrow ? '' : `<div id="approach">${renderCompanies()}</div>`);

  // Saved jobs move to the front, in their own section, and out of the bands.
  const saved=sortList(mine.filter(x=>isSaved(x.j)));
  /* Stories to pitch and people to ask have sections of their own, ahead of
     the postings when the direction leans on them more than on postings. */
  const routedCh=x=>chOf(x.j)!=='posted';
  const scored=mine.filter(x=>isScored(x.j)&&!isSaved(x.j)&&!routedCh(x));
  const unscored=mine.filter(x=>!isScored(x.j)&&!isSaved(x.j)&&!routedCh(x));
  const W=routesOf((p.profile.tracks||[]).find(t=>t.id===p.track));
  const routeSect=r=>{ const ch=ROUTE_CH[r], rows=sortList(mine.filter(x=>chOf(x.j)===ch&&!isSaved(x.j))), busyR=ROUTE_WORK.has(r);
    const doing={pitch:'outlets to pitch and what to pitch them', people:'who to ask', deadline:'the exams and deadlines for this work, and reading their official pages', local:'places near you (a places search, about a minute)'}[r];
    const more={pitch:'More stories to pitch', people:'More people to ask', deadline:'Look for more deadlines', local:'Search again \u2014 one board search'}[r];
    if(!rows.length) return busyR ? `<div class="mapnote"><span>Working out ${doing}\u2026</span></div>` : '';
    return sect('',OPP[ch].sect,OPP[ch].sub,rows)+`<div class="btn-row" style="margin:-4px 0 18px"><button class="btn-sm" data-moreroute="${r}" ${busyR?'disabled':''}>${
      busyR?'Finding more\u2026':more}</button></div>`; };
  /* People to ask and companies to approach are one route, "through people":
     what the Companies view held is drawn here, with them (2026-10-24). */
  const approach=r=>r==='people' ? `<div id="approach">${routeSect(r)}${renderCompanies()}</div>` : routeSect(r);
  const RT=['pitch','people','deadline','local'].sort((a,b)=>(W[b]||0)-(W[a]||0));
  const routesFirst=RT.filter(r=>(W[r]||0)>=(W.advertised||0)).map(approach).join('');
  const routesLast=RT.filter(r=>(W[r]||0)<(W.advertised||0)).map(approach).join('');
  const anyRouted=mine.some(routedCh);
  // While a search runs, what it just found is open, not folded: it is what there is to look at.
  const scoringNow=searching() && unscored.length>0;
  // Closing wins over strong: the nearer deadline beats the better opportunity.
  /* The bands the person asked for. `strict` shifts these and nothing else:
     every row above is still in the list, so turning the dial down brings them
     back into view rather than re-scoring or re-fetching anything. */
  const bars=barsFor(p.profile);
  const closing=sortList(scored.filter(x=>isClosing(x.j)));
  const strong =sortList(scored.filter(x=>!isClosing(x.j)&&isStrong(x.j,p.profile)));
  const worth  =sortList(scored.filter(x=>!isClosing(x.j)&&!isStrong(x.j,p.profile)&&overBar(x.j,p.profile)));
  const below  =sortList(scored.filter(x=>!overBar(x.j,p.profile)));

  const thin = THIN && THIN.from===p.track && THIN.how ? `<div class="mapnote thin"><span>Only <b>${THIN.n}</b> ${THIN.n===1?'posting':'postings'} for this direction, and that is expected: ${esc(THIN.how)}</span>
      <span class="btn-row" style="margin:0"><button class="btn-go btn-sm" data-gocompanies>Places to approach</button><button class="btn-sm" data-thinx>Not now</button></span></div>`
    : THIN && THIN.from===p.track ? `<div class="mapnote thin"><span>Only <b>${THIN.n}</b> ${THIN.n===1?'role':'roles'} for this direction right now. <b>${esc(THIN.label)}</b> has ${THIN.m}${THIN.m>=60?'+':''} in the index.</span>
      <span class="btn-row" style="margin:0"><button class="btn-go btn-sm" data-thinswitch="${esc(THIN.to)}">Look at ${esc(THIN.label)}</button><button class="btn-sm" data-thinx>Not now</button></span></div>` : '';
  const mapNote = narrow ? `<div class="mapnote"><span>Showing the <b>${all.length}</b> in the map's view${MAPSEL?` · ${esc(MAPSEL.l)}`:''}</span><button class="btn-sm" data-mapclear>Show all</button></div>` : '';
  return `${thin}${mapNote}<div class="listhead">
      <span style="color:var(--muted);font-size:12px">${mine.length} to decide on</span>
      <button class="btn-sm" data-findmore style="margin-left:10px" title="Search the boards for more">Find more work</button>
      ${gated.length?`<button class="btn-sm" id="showGated" style="margin-left:10px"
        title="${esc(gated.map(x=>x.gated).filter((v,i,a)=>a.indexOf(v)===i).slice(0,4).join(' · '))}">${
        SHOW_GATED?`hide the ${gated.length} your limits remove`:`${gated.length} removed by your limits`}</button>`:''}
      <div class="spacer"></div>
      <label class="hint" style="margin:0;display:flex;gap:6px;align-items:center">Sorted by
        <select id="sortSel" class="sel" style="width:auto">${[['rank','best'],['posted','recently posted'],['new','recently added']]
          .map(([v,l])=>`<option value="${v}" ${SORT===v?'selected':''}>${l}</option>`).join('')}</select></label>
    </div>
    ${deckHTML([...strong.map(x=>({...x,band:'Do these first'})), ...closing.map(x=>({...x,band:'Closing soon'})),
                ...worth.map(x=>({...x,band:'Worth a shot'})), ...below.map(x=>({...x,band:'Below the bar'})),
                ...(scoringNow?unscored.map(x=>({...x,band:'Scoring now'})):[])])}
    ${saved.length?`<div class="saved">${sect('','Saved for later','Swiped right, or saved from a row\u2019s menu. Still to do; just kept at the front.',saved)}</div>`:''}
    ${routesFirst}
    <div class="bands">
    ${sect('go','Do these first',`Fit ${bars.strongFit}+ and reachability ${bars.strongReach}+. Good work you have a real chance at \u2014 start at the top and go down.`,strong)}
    ${sect('closing','Closing soon',`Worth doing, but posted ${CLOSING_DAYS}+ days ago. Old postings get filled, not withdrawn \u2014 apply today or let it go.`,closing)}
    ${sect('','Worth a shot','Over the bar but not by much. Worth an application, not a whole morning each.',worth)}
    ${scoringNow?sect('','Scoring now','Just found. Open, save or apply to any of them now; each takes its place above once it is scored.',unscored):''}
    ${(!strong.length&&!worth.length&&!closing.length&&!scoringNow&&!anyRouted)?`<div class="empty"><b>Nothing clears the bar</b>
      ${scored.length?`${scored.length} scored here, none at fit ${bars.workFit}+ and reachability ${bars.workReach}+. Either this batch was weak or you have worked through it \u2014 pull in more roles.`:'None of these have been scored yet.'}</div>`:''}
    </div>
    ${routesLast}
    ${foldSect('below','Below the bar',`Scored under fit ${bars.workFit} or reachability ${bars.workReach}. Kept, because a score is a judgement rather than a fact.`,below)}
    ${scoringNow?'':foldSect('unscored','Not scored yet','Invisible to ranking until something reads them. Scoring runs on its own as they arrive.',unscored)}
    ${elseFold}`;
}

/* ═══ Applied — review ═══
   Everything already sent, which is a different question from what to do next.
   Cold approaches land here too: the app calls those contacted rather than
   applied, but the review is the same one. Ordered by how long it has been
   silent, because that is what decides whether to chase.

   Closed sits folded at the bottom. Anything that got this far carries history
   -- who you spoke to, what they said -- so it is never deleted, only tidied
   away. Rows closed without ever being sent never reach here: they carry
   nothing, and retention clears them on its own. */
function renderApplied(){
  const p=P();
  const all=p.jobs.map((j,i)=>({j,i})).filter(x=>CHFILT==='all'||chOf(x.j)===CHFILT);
  const bySilent=(a,b)=>daysSilent(b.j)-daysSilent(a.j);
  const due    =all.filter(x=>isDue(x.j)).sort(bySilent);
  const live   =all.filter(x=>stOf(x.j)==='live').sort(bySilent);
  const waiting=all.filter(x=>stOf(x.j)==='sent'&&!isDue(x.j)).sort(bySilent);
  const closed =all.filter(x=>stOf(x.j)==='closed').sort(bySilent);

  if(!due.length&&!live.length&&!waiting.length&&!closed.length){
    return `<div class="empty">${artSvg('girl','empty-art')}<b>Nothing sent yet</b>
      Anything you mark applied or contacted lands here, so you can chase it without hunting through the whole list.</div>`;
  }
  const oldest=[...due,...waiting,...live].reduce((m,x)=>Math.max(m,daysSilent(x.j)),0);
  return `<div class="stats">
      <div class="stat"><div class="k num" style="color:var(--due)">${due.length}</div><div class="l">overdue</div></div>
      <div class="stat"><div class="k num" style="color:var(--go)">${live.length}</div><div class="l">in conversation</div></div>
      <div class="stat"><div class="k num" style="color:var(--awaiting)">${waiting.length}</div><div class="l">awaiting them</div></div>
      <div class="stat"><div class="k num">${oldest}</div><div class="l">days, longest silence</div></div>
    </div>
    ${sect('due','Overdue — chase these',`Past the ${FOLLOWUP_DAYS}-day mark with no reply. One nudge is worth sending; a second rarely is.`,due)}
    ${sect('go','In conversation','Someone replied. Keep these moving before anything else.',live)}
    ${sect('awaiting','Awaiting them','Sent recently and not yet due. Nothing to do here yet.',waiting)}
    ${foldSect('closed','Closed','Ended, withdrawn or turned down. Kept for the record \u2014 reopening puts one back in Unapplied.',closed)}`;
}

/* ═══ Dashboard ═══
   The three things a list cannot show: the shape of the pipeline, how old the
   board has got, and what has actually been happening lately. The activity feed
   is built from the per-job event logs, which until now could only be read one
   job at a time -- every note, reply and application is already in there. */
/* The question the pipeline cannot answer: which direction is working? Per
   direction, what was found, what went out and what came back. A row is a way
   in -- click it and the map zooms to that direction. */
function byDirection(p){
  const tracks=p.profile.tracks||[]; if(tracks.length<2) return '';
  const R=tracks.map(t=>{
    const js=p.jobs.filter(j=>dirKey(j)===t.id);
    const sent=js.filter(j=>j.date_applied || ['sent','live'].includes(stOf(j)));
    const back=sent.filter(j=>stOf(j)==='live' || listOf(j,'events').some(e=>e.kind==='reply'));
    return { t, found:js.filter(isScored).length, sent:sent.length, back:back.length,
      rate: sent.length ? Math.round(back.length/sent.length*100) : null };
  });
  return sectOf('','By direction','Which direction is getting answers. Five sent with none back says more than fifty found.',tracks.length,
    R.map(x=>rowCard({ acc: x.back?'go':'', rank:x.found, title:esc(x.t.label)+(x.t.id===p.track?' <span style="color:var(--dim)">· picked</span>':''),
      sub: dirMark(x.t.id)+`${x.found} found · ${x.sent} sent · ${x.back} ${x.back===1?'reply':'replies'}`,
      facts:[['sent / back',`${x.sent} / ${x.back}`,''],['reply rate',x.rate===null?'—':x.rate+'%',x.rate===null?'quiet':'']],
      acts:`<button class="btn-sm" data-dashdir="${esc(x.t.id)}">Show on map</button>` })).join(''));
}

/* The list as a shutter over the map (below 1100px). Dragging moves the list
   with the finger; let go past 70px and it snaps open (or shut, pushing up).
   A pull on the list itself counts only from the top of the page and only when
   the finger moves mostly downward, so the swipe deck's sideways swipes and
   ordinary scrolling are left alone. */
let SHUT_DRAGGED = false;
function bindShutter(){
  const dc=document.querySelector('.decide'); if(!dc) return;
  const map=dc.querySelector('.dmap'), list=dc.querySelector('.dlist'), handle=dc.querySelector('.shutter');
  if(!map||!list||!handle) return;
  dc.style.setProperty('--maph', map.offsetHeight+'px');
  if(window.innerWidth>=1100) return;
  let y0=null, x0=0, dy=0, live=false;
  const start=(t,fromHandle)=>{ if(!fromHandle && (window.scrollY>2 || MAPON)) return; y0=t.clientY; x0=t.clientX; dy=0; live=fromHandle; };
  const move=(ev,t)=>{
    if(y0===null) return;
    dy=t.clientY-y0;
    if(!live){ if(Math.abs(dy)<8) return; if(dy<0 || Math.abs(t.clientX-x0)*1.5>Math.abs(dy)){ y0=null; return; } live=true; }
    ev.preventDefault();
    const max=map.offsetHeight+14, lo=MAPON?-max:0, hi=MAPON?0:max;
    list.classList.add('dragging');
    list.style.transform=`translateY(${Math.max(lo,Math.min(hi,dy))}px)`;
  };
  const end=()=>{
    if(y0===null) return; y0=null;
    list.classList.remove('dragging'); list.style.transform='';
    if(!live) return;
    if(Math.abs(dy)>6) SHUT_DRAGGED=true;           // a drag is not also a tap on the handle
    if(!MAPON && dy>70){ MAPON=true; track('map_toggle',{ on:true, by:'pull' }); render(); window.scrollTo(0,0); }
    else if(MAPON && dy<-70){ MAPON=false; track('map_toggle',{ on:false, by:'push' }); render(); }
    setTimeout(()=>{ SHUT_DRAGGED=false; },350);
  };
  handle.addEventListener('touchstart',ev=>start(ev.touches[0],true),{passive:true});
  list.addEventListener('touchstart',ev=>{ if(!ev.target.closest('.shutter')) start(ev.touches[0],false); },{passive:true});
  list.addEventListener('touchmove',ev=>move(ev,ev.touches[0]),{passive:false});
  list.addEventListener('touchend',end); list.addEventListener('touchcancel',end);
}

/* ═══ you ═══
   The person, said back (feedback #22): a figure they pick from the cast, who
   they are and the directions they are going in, the work model in full, and
   every CV -- the one they gave and each one tailored to a job. The analytics
   that were the Dashboard are one fixed button away (.youswitch). */
const AVATARS = [['watch','The watcher'],['woman','The calm one'],['girl','The new start'],['man','The patient one'],['boy','The newcomer']];
/* You is the first screen until To decide holds READY_MIN jobs over the bar
   for the picked direction: a short or unscored list is where people lost
   interest and left (2026-10-23). It is only the screen the app OPENS on;
   nobody is moved off To decide once they are there. */
const READY_MIN = 10;
const decideReady = p => p.jobs.filter(j=>isOpen(j)&&stOf(j)==='new'&&inDir(j,p)&&isScored(j)&&overBar(j,p.profile)).length;
function renderYou(){

    <div class="youinfo">

      <div class="youhead">${esc(prof.headline||'')}</div>
      <div class="youmeta">${[prof.location, prof.seniority, prof.years_experience?`~${prof.years_experience} years`:''].filter(Boolean).map(esc).join(' · ')}</div>
      ${tracks.length?`<div class="youdirs">${tracks.map(t=>`<span class="${t.id===p.track?'on':''}">${dirMark(t.id)}${esc(t.label)}${t.id===p.track?' <i>picked</i>':''}</span>`).join('')}</div>`:''}
      <div class="btn-row" style="margin-top:10px"><button class="btn-sm" data-showprof>Your full profile</button><button class="btn-sm" data-wants>What you want</button></div>
      <div class="youpick" aria-label="Pick your figure">${AVATARS.map(([k,l])=>`<button class="${k===av?'on':''}" data-avatar="${k}" title="${l}">${artSvg(k,'')}</button>`).join('')}</div>
    </div></div>`;

  const wm = workSet(prof)
    ? rowCard({ title:'What matters to you at work', sub:'It decides which companies are worth your time, and how each one is explained.',
        facts:[], acts:`<button class="btn-sm" data-workmodel>Change</button>`,
        pop:'' }) + `<ul class="youlist">${workSummary(prof).map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`
    : rowCard({ acc:'go', title:'What matters to you at work?', sub:'Two minutes. It decides which companies are worth your time, and how each one is explained.',
        acts:`<button class="btn-go btn-sm act-primary" data-workmodel>Build it</button>` });

  const tailored=p.jobs.map((j,i)=>({j,i,cv:cvOf(j)})).filter(x=>x.cv).sort((a,b)=>String(b.cv.on).localeCompare(String(a.cv.on)));
  const raw=String(p.raw||'');
  const base=rowCard({ title:'The CV you gave', sub: raw ? esc(raw.split('\n').map(l=>l.trim()).filter(Boolean).slice(0,2).join(' · ').slice(0,140)) : 'None yet',
    facts: raw ? [['length', `${raw.split(/\s+/).filter(Boolean).length} words`, 'quiet']] : [],
    acts: raw ? `<button class="btn-sm" data-readcv>Read it</button>` : '' });
  const rows=tailored.map(({j,i,cv})=>rowCard({ st:'new',
    title:`${esc(j.title||'(untitled)')} <span style="color:var(--muted)">· ${esc(j.company||'')}</span>`,
    sub: dirMark(dirKey(j),dirLabel(dirKey(j))) + (cv.gaps&&cv.gaps.length ? `Asks for, and your CV does not show: ${esc(cv.gaps.slice(0,3).join(' · '))}${cv.gaps.length>3?' …':''}` : 'Nothing it asks for is missing from your CV'),
    facts:[['tailored', esc(mmdd(cv.on)), 'quiet'],['gaps', String((cv.gaps||[]).length), (cv.gaps||[]).length?'':'quiet']],
    acts:`<button class="btn-go btn-sm act-primary" data-act="cvopen" data-i="${i}">Open</button><button class="btn-sm" data-act="cv" data-i="${i}">Tailor again</button>` })).join('');

  const ready=decideReady(p), found=p.jobs.filter(j=>isOpen(j)&&stOf(j)==='new'&&inDir(j,p)).length;
  const filling = ready<READY_MIN || searching()
    ? rowCard({ title: ready ? `${ready} job${ready===1?'':'s'} ready to decide on` : 'Your jobs are on their way',
        sub: searching() ? `Finding and scoring jobs for this direction now (${found} found so far). It is worth opening once ${READY_MIN} or so clear your bar; start on them any time.`
           : ready ? 'That is all that clears your bar for this direction so far. More arrive as the boards are read each night.'
           : 'Nothing clears your bar for this direction yet.',
        facts:[['ready', String(ready), ready?'':'quiet'],['found', String(found), 'quiet']],
        acts:`<button class="btn-sm" data-opendecide>Open To decide</button>` })
    : '';
  const dirRows=tracks.map(t=>rowCard({ title:`${dirMark(t.id)}${esc(t.label||'')}${t.id===p.track?' <span style="color:var(--dim);font-size:12px">picked</span>':''}`,
    sub: esc(t.how_hired || (t.routes?'':'Not judged yet: counted as all advertised for now.')),
    facts: Object.entries(routesOf(t)).filter(([,v])=>v>=0.1).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>[ROUTE_LABEL[k].toLowerCase(), Math.round(v*100)+'%', 'quiet']),
    acts:`<button class="btn-sm" data-routes="${esc(t.id)}">Change</button>` })).join('');
  return `${filling}${card}
    ${tracks.length?sectOf('','How people get this work','Per direction. It decides where we look for you.',tracks.length,dirRows):''}
