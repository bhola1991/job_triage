            unstated, so a fit of 82 and a fit of 20 are both guesses -- it is
            pulled toward the middle instead, symmetrically, because "we cannot
            tell" is the honest answer in either direction.

   `cred` deliberately does NOT gate, and that one is counter-intuitive enough
   to be worth the line: cred-degree carries cred at 0.96 and its label wants
   fit 55-95. A credential gate does not stop someone doing the work, it stops
   them clearing the filter -- which is reachability, where cred already carries
   -0.30. Gating fit on it would have broken a case that passes today.
   `shape` does not gate either, because it needs no help: Jev already answers
   targeting at 0.00 on both shape cases, so the composition handles it. */
const FIT_BLOCK = ['loc'];
/* How hard a noul gates, measured from FLAG_P rather than from zero. The first
   version scaled straight from p=0 and the eval caught what that does:
   rare-combination carries loc at 0.06 and thin at 0.14 -- neither is a signal,
   both are noise -- and together they took its fit from 88 to 73, out of a
   75-100 band it had been inside. A probability the app would not even raise as
   a flag must not move a score. So nothing below FLAG_P gates at all, and above
   it the strength is how far into the remaining range it reached. */
const gateStrength = p => (isNaN(p) || p <= FLAG_P) ? 0 : Math.min(1, (p - FLAG_P) / (1 - FLAG_P));
function fitFromJudgment(jv){
  if(!jv || !jv.scores) return null;
  let acc = 0, w = 0;
  Object.keys(FIT_W).forEach(d => {
    const v = scoreFromDist(jv.scores[d]);
    if(v === null) return;
    acc += v * FIT_W[d]; w += FIT_W[d];
  });
  if(!w) return null;
  let v = acc / w;
  const p = flagProbs(jv);
  FIT_BLOCK.forEach(c => { v *= (1 - gateStrength(p[c])); });
  const thin = gateStrength(p.thin);
  if(thin) v = 50 + (v - 50) * (1 - thin);
  return Math.max(0, Math.min(100, Math.round(v)));
}

/* Reachability is deliberately not asked. Asking for it would mean one question
   about competition, credential gates, the seniority bar and openness to
   outsiders all at once -- four things Jev is already being asked separately,
   whose probabilities were being thrown away at the flag threshold. So it is
   composed from those four instead: no extra question, no extra token, and a
   weighting that can be argued with later for free.

   Signs are the direction each pushes: crowding, a hard gate and a bar above
   the candidate all make a reply less likely; an employer open to unusual
   routes makes it more likely. */
/* rare and loc were added 2026-10-04, both from the eval rather than from
   taste. `rare` is the one the cases argued for most plainly: rare-combination
   composed to reach 35 against a label of 45-100, and the case is literally a
   role that rewards a combination few people have -- which is less competition
   FOR THIS CANDIDATE, so it belongs here as a positive and was being thrown
   away at the flag threshold like comp and open once were. `loc` is negative
   for the obvious reason: a posting the candidate is ineligible for is not one
   they are likely to hear back from, and loc-onsite-berlin was over its reach
   ceiling at 47 against 0-45 while carrying loc at 0.95. */
const REACH_W = {comp:-0.30, cred:-0.30, sen_hi:-0.25, open:0.15, rare:0.15, loc:-0.15};
const REACH_BASE = 55;
function reachFromJudgment(jv){
  if(!jv || !Array.isArray(jv.flags)) return null;
  const p = flagProbs(jv);
  let v = REACH_BASE, seen = 0;
  Object.keys(REACH_W).forEach(c => {
    if(isNaN(p[c])) return;
    seen++; v += REACH_W[c] * p[c] * 100;
  });
  return seen ? Math.max(0, Math.min(100, Math.round(v))) : null;
}

/* The candidate, in the same shape every time, carrying exactly what the
   questions ask about and no more -- Jev's accuracy falls as a state grows with
   detail unrelated to the decision, so this is a whitelist rather than the
   whole profile.

   Every field here answers a question that is actually asked. `targeting` and
   `target_titles` are what fit_targeting reads; without them that question has
   nothing to work from and can only answer from wrong_shapes, which makes it
   good at rejecting and blind to matching. `rare_combination` is the subject of
   the `rare` noul, which was being asked about a combination never supplied.
   sysPrompt has told DeepSeek all of this since the beginning; this had drifted
   behind it. */
const candidateOf = (prof, track) => {
  const ts = prof.tracks || [];
  const t = ts.find(x => x.id === track) || ts[0] || {};
  return {
    /* No name. TypeSafe's judgements are about the posting against the shape of
       a career, and a name moves none of them; it was being sent on every
       judged search for nothing. Their policy is the better of the two we use
       -- "We will not train or fine tune any artificial intelligence or machine
       learning models on your prompts or other Input" -- which is a reason to
       send less, not a reason to relax. */
    location: prof.location || '',
    seniority: prof.seniority || '', headline: prof.headline || '',
    targeting: t.label || '', target_titles: t.titles || [],
    rare_combination: prof.unusual_combination || '',
    strengths: prof.strengths || [], gaps: prof.gaps || [],
    wrong_shapes: prof.wrong_shapes || [],
  };
};

/* One job, judged. Returns null rather than throwing: a judgement is an
   improvement on the DeepSeek flags, not a precondition for having any, and a
   scoring run that already cost money must not be lost to it. Null is also
   what every local-only and own-key run gets, because the TypeSafe key lives
   on the server and deliberately never reaches the browser. */
// Unreferenced since runScoring moved to judgeMany -- see judgeJob above.
async function judgeInto(j, cand){
  if(!cloudNow()) return null;
  try{
    return await judgeJob({
      title: String(j.title||''), company: String(j.company||''),
      location: String(j.location||''),
      description: String(j.description||'').slice(0,4000),
    }, cand);
  }catch(e){ console.warn('judgment skipped:', e && e.message); return null; }
}

/* Jev decides which flags are true; DeepSeek says what in the posting makes
   each one true. A flag Jev raises that DeepSeek never mentioned still shows,
   with no fact and no quote -- which is the honest rendering of "we think so
   and cannot point at why", and better than borrowing a fact from a flag that
   happens to sit next to it. */
function mergeJudgment(dsFlags, judged){
  if(!judged || !Array.isArray(judged.flags)) return dsFlags;
  const fact = {};
  dsFlags.forEach(f => { fact[f.code] = f.fact; });
  const out = [];
  judged.flags.forEach(f => {
    if(!(Number(f.probability) >= FLAG_P)) return;
    const code = FLAG_SHORT[String(f.code||'')];
    if(!code) return;
    out.push({ code, fact: fact[code] || '' });
  });
  return out;
}

/* ── re-deciding old rows when the cut moves ──────────────────────────────
   ai_flags holds the flags that cleared FLAG_P at the moment the row was
   judged, so every row judged before a change to that number carries the old
   decision and nothing re-reads it. Moving the cut from 0.5 to 0.8 without
   this would leave the rows already in the account showing the seven-in-ten
   false chips the new cut exists to remove.

   Free, and that is the point: ai_judgment kept every probability, so this is
   the same evidence re-thresholded rather than a re-judgement. No Jev call, no
   credit, no DeepSeek call.

   Facts and quotes are carried across from the row rather than recomputed --
   the fact came from DeepSeek and is not reproducible from here, and re-running
   bestSentence would need the description, which this deliberately does not
   touch. A flag that reappears because the cut went DOWN keeps an empty fact,
   which is exactly what mergeJudgment gives a flag DeepSeek never mentioned.

   Rows with no ai_judgment are left alone: their flags are DeepSeek's own, and
   FLAG_P has no authority over those. */
function storedFlagList(j){
  const v = j && j.ai_flags;
  if(Array.isArray(v)) return v;
  const t = String(v||'').trim();
  if(t.charAt(0) === '['){ try{ const a = JSON.parse(t); return Array.isArray(a) ? a : []; }catch(e){} }
  /* A comma-joined legacy string predates judgements entirely, so it is only
     ever reached on a row this function has already declined to touch. */
  return [];
}
const codeOf = f => FLAG_SHORT[String((f && f.code) || '').trim()] || '';
function reflagJob(j){
  const jv = judgmentOf(j);
  if(!jv || !Array.isArray(jv.flags)) return false;
  /* Normalised the same way on both sides, so the comparison at the end is
     about which flags a row carries and not about how they were spelled. */
  const norm = f => ({ code: codeOf(f), fact: String((f && f.fact) || ''), span: String((f && f.span) || '') });
  const was = storedFlagList(j).map(norm).filter(f => f.code);
  const had = {}; was.forEach(f => { had[f.code] = f; });
  const out = [], kept = {};
  jv.flags.forEach(f => {
    const code = codeOf(f);
    if(!code || kept[code] || !(Number(f.probability) >= FLAG_P)) return;
    kept[code] = 1;
    out.push(had[code] || { code, fact: '', span: '' });
  });
  /* A stored flag the judgement has no answer for is kept rather than dropped:
     that is what a question removed from judge.ts would look like, and losing
     the row's flag to it would be a silent deletion. */
  was.forEach(f => {
    if(kept[f.code] || jv.flags.some(x => codeOf(x) === f.code)) return;
    kept[f.code] = 1;
    out.push(f);
  });
  if(JSON.stringify(out) === JSON.stringify(was)) return false;
  j.ai_flags = JSON.stringify(out);
  return true;
}

/* Runs once per value of FLAG_P rather than once ever: the key stores the cut
   it last applied, so tuning the number again re-runs this instead of needing
   somebody to remember that it exists. */
const FLAGCUT_KEY = 'triage:flagcut';
async function reflagJudged(){
  if((await get(FLAGCUT_KEY)) === String(FLAG_P)) return 0;
  let changed = 0, judged = 0;
  Object.keys(DB.profiles||{}).forEach(id => {
    const rec = DB.profiles[id];
    (((rec && rec.jobs) || [])).forEach(j => {
      if(!judgmentOf(j)) return;
      judged++;
      if(reflagJob(j)) changed++;
    });
  });
  if(changed) await save();
  /* Written after the save, so a save that could not reach the server leaves
     the key unset and the pass runs again next time. */
  await put(FLAGCUT_KEY, String(FLAG_P));
  if(changed) console.info(`re-decided ${changed} of ${judged} judged rows at FLAG_P ${FLAG_P}`);
  return changed;
}

/* Attach the quote to each flag. Runs over whatever the posting actually says,
   so a job with no description simply has no spans -- which is honest, and is
   what the thin_data flag is for. */
function addSpans(flags, desc){
  flags.forEach(f => { f.span = f.fact ? bestSentence(desc, f.fact) : ''; });
  return flags;
}

async function scoreBatch(batch, prof, track, maxTok, tier){
  const jobs = batch.map(b=>{
    const o={ id:String(b.i),
      title:String(b.j.title||''), company:String(b.j.company||''),
      location:String(b.j.location||''),
      description:String(b.j.description||'').slice(0,700)||'(no description available)' };
    // Anything a feed already dated is stated, not asked about — the model is
    // the last and least reliable source here, never a second opinion.
    if(saneDate(b.j.posted)) o.posted=b.j.posted;
    return o;
  });
  const txt = await claude(sysPrompt(prof,track)+"\n\nJOBS TO SCORE:\n"+JSON.stringify(jobs), maxTok||TOK_CAP, tier);
  const parsed = grabJSON(txt);
  // Short keys, with the old long names still read in case the model uses them.
  const items = Array.isArray(parsed)?parsed:(parsed.r||parsed.results||[]);
  const num = (v,dflt) => { const n=parseInt(v,10); return isNaN(n)?dflt:Math.max(0,Math.min(100,n)); };
  const out={};
  items.forEach(it=>{ const c=String(it.c??it.confidence??'l').toLowerCase(), p=it.p??it.posted;
    out[String(it.id)]={
    score:num(it.s??it.score,0),
    reach:num(it.re??it.reachability,45),
    conf:CONF_CODES[c]||c,
    flags:normFlags(it.f??it.flags),
    posted:p&&typeof p==='object'?p:null }; });
  // A score is a judgement against one direction, so the job remembers which:
  // the list shows a direction's own jobs, and the rest stay one fold away.
  if(track) batch.forEach(b=>{ if(out[String(b.i)]) b.j.dir=String(track); });
  return out;
}

async function runScoring(all, auto){
  const p=P(); if(!p || busy) return;
  const targets = p.jobs.map((j,i)=>({j,i})).filter(b=> all || !isScored(b.j));
  if(!targets.length){ setInfo(all?'No jobs to score yet.':'Everything is already scored.'); return; }
  busy=true; render();
  const SIZE=6, total=targets.length; let done=0, failed=0;
  /* Everything scored this run, judged ONCE after the loop instead of per job.
     It used to call judgeJob for each row, in parallel across each batch of
     SIZE, on the reasoning that a rescore is the small path and could carry it.
     The ledger disagreed: one run on 2026-10-03 logged 168 judge calls at
     COST.llm each, 168 credits, roughly 2.5 Starter packs for a single scoring
     pass. judge_batch takes MAX_JUDGE_BATCH postings for one credit -- the
     server still makes one Jev call per posting, since Jev takes one state per
     request, so what is batched is the round trip and the CHARGE -- which turns
     those 168 credits into 4. AUTO_MAX caps this path at 60 rows, so it was
     never going to be ruinous, but 60 credits against 2 is not a rounding
     error either, and the search path has judged this way since ecf0358. */
  const scoredRows=[];
  for(let i=0;i<targets.length;i+=SIZE){
    const batch=targets.slice(i,i+SIZE);
    try{
      /* flash, not the default pro, measured 2026-10-04 rather than assumed.
         Both tiers scored the same ten labelled postings through this very
         prompt (scripts/record-deepseek.js): calibration 0.9 each, flag recall
         0.867 each, and pro ahead only on flag precision, 0.765 to 0.684.
         That one advantage does not reach a user: mergeJudgment throws
         DeepSeek's flag set away whenever a judgement exists and keeps only its
         `fact` strings, so Jev's probabilities decide which flags appear on
         every judged row. Pro was being paid 2.8x for a field that is
         overwritten -- 0.475 INR a posting against 0.171 -- and for a score
         that measured identically. */
      const res=await scoreBatch(batch,p.profile,p.track,TOK_CAP,'flash');
      batch.forEach((b,k)=>{ const r=res[String(b.i)]; if(!r) return;
        const j=p.jobs[b.i];
        j.ai_score=String(r.score); j.ai_reachability=String(r.reach);
        if(globalThis.LAST_MODEL) j.ai_model=globalThis.LAST_MODEL;
        // DeepSeek's own reading for now. The judging pass after the loop
        // overwrites both from Jev where it answered; dropping confidence
        // entirely would move every unjudged job in the ranking.
        j.ai_confidence = r.conf;
        j.ai_flags = JSON.stringify(addSpans(r.flags, j.description));
        // Only ever fills a gap. A date from a feed outranks the model's
        // reading of the same posting, and re-scoring must not overwrite it.
        if(r.posted && !saneDate(j.posted)) setPosted(j, r.posted.from, 'est', r.posted.to);
        scoredRows.push({j, r}); });
    }catch(e){
      if(e.message==='NEEDKEY'){
        busy=false;
        // Asked for: ask for the key. Ran on its own: say so and stay put.
        if(auto){ setInfo('Scoring needs an API key. Set one up under Data.'); render(); return; }
        render(); keyDialog(()=>runScoring(all)); return;
      }
      failed+=batch.length; console.error(e);
    }
    done+=batch.length;
    const bar=$('#progBar'); if(bar) bar.style.width=Math.round(done/total*100)+'%';
    setInfo(`${done} of ${total} done${failed?` · ${failed} failed`:''}`);
    await save();
  }
  /* One judging pass for the whole run. Failing here costs the flags and never
     the scoring already paid for: the rows keep their scores and DeepSeek's own
     flags, which is exactly what they had a moment ago. Same shape as
     scoreAndCut, deliberately -- two paths that judge should not judge
     differently. */
  if(scoredRows.length && cloudNow()){
    setInfo(`Scored ${total-failed}. Judging…`);
    try{
      const cand=candidateOf(p.profile, p.track);
      const judged=await judgeMany(scoredRows.map(({j})=>({
        title:String(j.title||''), company:String(j.company||''),
        location:String(j.location||''),
        description:String(j.description||'').slice(0,4000),
      })), cand, exemplarOf(p.profile));
      scoredRows.forEach(({j, r}, k)=>{
        const jv=judged[k];
        if(!jv) return;
        j.ai_confidence = jv.confidence || r.conf;
        j.ai_flags = JSON.stringify(addSpans(mergeJudgment(r.flags, jv), j.description));
        /* The whole judgement, kept. Every number the app derives from it --
           the fit pair, reachability, the confidence weight in rankOf -- is
           computed from this in the browser, so changing any of those weights
           re-ranks what is already judged without paying to judge it again. */
        j.ai_judgment = JSON.stringify(jv);
      });
    }catch(e){ console.warn('judgement skipped for this run:', e && e.message); }
  }
  busy=false;
  setInfo(failed?`Scored ${total-failed}. ${failed} failed — run again to retry them.`:`Scored ${total}.`);
  await save(); render();
  fbMoment(failed?'error':'score');
}
/* ═══ auto-scoring ═══
   An unscored job is invisible to everything that matters here — it is not on
   the map, not in Work Today, not ranked. So the gap between pulling jobs in
   and scoring them was a step with no decision in it, which is the kind of
   step worth deleting.

   Three things stop it rather than surprising someone. It never opens the key
   dialog: a modal appearing on its own after a search is startling, and the
   message in the Score block says the same thing without seizing the page. It
   refuses above AUTO_MAX, because a 400-row CSV import should not silently
   start a long paid run — that is a decision, and the button is right there
   for it. And it can be turned off, since it does spend money, even if the
   amounts are small enough that most people will not care. */
const AUTO_MAX = 60;
async function autoScore(){
  if(!AUTO || busy) return;
  const p=P(); if(!p) return;
  const n=p.jobs.filter(j=>!isScored(j)).length;
  if(!n) return;
  // Anthropic works with no key inside the Claude viewer; DeepSeek never does.
  // Signed in, it runs on the server's key (free tier or credits) instead.
  if(!KEY && PROV!=='anthropic' && !cloudNow()){
    setInfo(`${n} unscored \u2014 add a key and they will be scored automatically.`);
    return;
  }
  if(n>AUTO_MAX){
    setInfo(`${n} unscored \u2014 too many to score automatically. Use "Score new jobs" when you are ready.`);
    return;
  }
  await runScoring(false, true);
}

function setInfo(t){ const e=$('#scoreInfo'); if(e) e.textContent=t; }
function setSearchInfo(t){ SEARCH_TXT=t; for(const e of document.querySelectorAll('#searchInfo,#waitInfo')) e.textContent=t; }

/* ═══ board search: every source's results, scored, 50+ kept ═══
   No cap on how many jobs a search adds. As each source's results land (liveBoard):
     1. boardFilter  - free: drop what is plainly not a new, recent, relevant posting
     2. fromAts      - free: company-feed hits get their full description, and
                       ones the company no longer lists are dropped as closed
     3. scoreAndCut  - full scoring against the CV; below MIN_FIT is dropped */
const MAX_AGE_DAYS = 30;

/* Postings already scored below MIN_FIT and dropped. p.jobs is the tracker,
   not a log, so a rejection used to leave no trace -- and the server floors
   the search window at a week, so the same rejected posting came back every
   day for seven days and was pulled from its ATS feed and re-scored each time:
   one verdict, paid for up to seven times by anyone who searches daily.

   Keyed by profile AND track, because a score is a verdict against a track and
   a role wrong for one may be right for another. Entries expire at
   MAX_AGE_DAYS: past that boardFilter drops the posting for age anyway.

   ponytail: this browser only, and not cleared when the CV is edited. A second
   device re-buys the verdicts once; an edited CV keeps its old rejections for
   up to 30 days. Move it to a profiles column if either starts to matter. */
/* Stopping a search. There was no way to, so a tester reloaded the page to
   stop one -- and lost what it had already found and been charged for.

   Stopping is not cancelling: nothing in flight is thrown away. It stops
   WAITING (the slow site scrapers are aborted at their next poll, which also
   stops them costing anything further) and stops STARTING (no new scoring
   batch), then the search finishes the ordinary way with whatever has been
   scored. So it takes a few seconds, and everything paid for is kept.

   null: no search running. false: one is. true: asked to stop. */
let STOP = null;
const stopped = () => STOP === true;

const dayNo = () => Math.floor(Date.now()/864e5);
const rejKey = p => 'triage:rejected:'+DB.current+':'+((p&&p.track)||'');
function rejectedOf(key){
  try{
    const r=JSON.parse(localStorage.getItem(key)||'{}'), cut=dayNo()-MAX_AGE_DAYS;
    for(const k in r) if(!(r[k]>cut)) delete r[k];
    return r;
  }catch(e){ return {}; }             // no storage, or not ours to parse: remember nothing
}
function rememberRejected(key, jobs){
  if(!jobs.length) return;
  const r=rejectedOf(key), d=dayNo();
  jobs.forEach(j=>{ r[keyOf(j)]=d; const tc=tcKey(j); if(tc) r[tc]=d; });
  try{ localStorage.setItem(key, JSON.stringify(r)); }catch(e){}
}
/* Everything this profile has already judged: what is in the list, by link and
   by title+company, and what was scored and dropped. */
function seenKeys(p){
  const s=new Set();
  ((p&&p.jobs)||[]).forEach(j=>{ s.add(keyOf(j)); const tc=tcKey(j); if(tc) s.add(tc); });
  let key=''; try{ key=rejKey(p); }catch(e){}
  if(key) Object.keys(rejectedOf(key)).forEach(k=>s.add(k));
  return s;
}

/* A normalized server result (API source or site scraper) as a job row.
   query holds the publisher (LinkedIn, Naukri, ...) for the live list. */
function jsearchRow(x){
  const j=blank();
  j.title=String(x.title||'').slice(0,180)||'[No Title]';
  j.company=String(x.company||'').slice(0,120)||'[from search — verify]';
  j.url=String(x.url||''); j.location=String(x.location||'');
  j.description=String(x.description||'');
  setPosted(j, x.posted, 'feed');
  j.source='Board search'; j.query=String(x.publisher||'JSearch'); j.origin=String(x.origin||'jsearch'); j.status='New'; j.channel='posted';
  j.notes='Found via '+j.query;
  return j;
}

/* A site: query returns search and category pages as well as postings, and
   those have no job in them to score.
   ponytail: URL shapes checked by eye, not against every board. A board whose
   real postings match SEARCHY loses its results here; add its posting shape
   to POSTING_SHAPE to let them through. */
const SEARCHY = /[?&](q|keywords?|query)=|\/search\b|\/q-[^/]*-jobs|-jobs(-SRCH[^/]*)?(\.html?|\/?$)|\/jobs\/?$|\/(role|roles|location|locations|l)\/|\/browse\b|\/categor/i;
const POSTING_SHAPE = {
  'linkedin.com':  /\/jobs\/view\//i,
  'glassdoor.':    /\/job-listing\//i,
  'indeed.com':    /viewjob|\/rc\/clk|\/pagead\/|[?&]jk=/i,
  'upwork.com':    /\/jobs\/|\/freelance-jobs\/apply\//i,
  // Covers news.ycombinator.com too: HN threads match site:ycombinator.com and are not jobs.
  'ycombinator.com': /ycombinator\.com\/companies\/[^/]+\/jobs\/[^/?#]+/i,
};
/* Discussion and content sites: a site: query on a registry can land on them,
   and they read like job talk without being a job. */
const NOT_JOB_HOST = /(^|\.)(reddit|quora|medium|youtube|twitter|x|facebook|instagram|stackoverflow|stackexchange|github|dev|substack|hashnode)\.(com|to|io)$/i;
function isPostingUrl(u){
  if(!httpUrl(u)) return false;
  let host=''; try{ host=new URL(u).hostname; }catch(e){ return false; }
  if(NOT_JOB_HOST.test(host)) return false;
  for(const h in POSTING_SHAPE) if(host.includes(h.replace(/\.$/,''))) return POSTING_SHAPE[h].test(u);
  return !SEARCHY.test(u);
}

/* seen: shared across calls when one search feeds in several batches, so a
   job found by two sources is only kept once. */
/* The second identity a posting has, after keyOf: title+company, so the same
   role syndicated to five boards is recognised once. ONE spelling, shared,
   because there were two and they disagreed -- boardFilter guarded only a
   bracketed company (a suggested-company placeholder) while idsOf guarded
   falsiness as well, so a posting whose company was the EMPTY STRING got the
   key "tc:<title>|" in boardFilter and no second key in idsOf.

   An empty company is not an identity: that key matches every unattributed
   posting sharing a title, and the first one through would drop the rest as
   duplicates. Latent rather than harmful so far -- 29 of 30,372 corpus rows
   carry a blank company and no two of them share a title -- but it is one
   syndicated blank-company posting away from silently eating real jobs.

   Returns '' when there is no usable company, and every caller must treat ''
   as "no second key" rather than as a key. */
function tcKey(j){
  const co = String((j && j.company) || '').trim();
  if(!co || co.startsWith('[')) return '';
  return 'tc:' + (String((j && j.title) || '').trim() + '|' + co).toLowerCase();
}

function boardFilter(jobs, trk, seen){
  seen=seen||seenKeys(P());
  const dropped={listing:0, old:0, dupe:0};
  const out=[];
  jobs.forEach(j=>{
    if(!isPostingUrl(j.url)){ dropped.listing++; return; }
    // No title-word filter: it threw away half of real searches (a "Workflow
    // Automation Specialist" shares no word with "No-Code Developer"). Every
    // job is scored against the CV now, and that decides relevance.
    const age=ageOf(j);                       // unknown age is kept: not the same as old
    if(age!==null && age>MAX_AGE_DAYS){ dropped.old++; return; }
    // The same role syndicated to several boards, already in the list, or
    // already scored below MIN_FIT by an earlier search and dropped.
    const tc=tcKey(j);
    if(seen.has(keyOf(j)) || (tc && seen.has(tc))){ dropped.dupe++; return; }
    seen.add(keyOf(j)); if(tc) seen.add(tc);
    out.push(j);
  });
  return {jobs:out, dropped};
}

/* Full scoring against the CV, the same scoring every job card shows, run on
   each source's results as they land. Jobs below MIN_FIT are dropped; the rest
   come back already scored. Batches of 12 (vs 6 for rescoring) because a search
   can return hundreds. If a batch's call fails, those results were already paid
   for, so they are kept unscored rather than lost: "Score new jobs" picks them up. */
const SCORE_BATCH = 12;
const MIN_FIT = 50;
async function scoreAndCut(jobs, prof, track){
  const kept=[], unscored=[], scored=[], rejected=[];
  for(let i=0;i<jobs.length;i+=SCORE_BATCH){
    if(stopped()) break;              // what is left was never judged; the next search finds it again
    const part=jobs.slice(i,i+SCORE_BATCH);
    try{
      // Not sized per batch any more: reasoning does not scale with the row count.
      // Flash, not pro: this is the only scoring path that runs in bulk (a search
      // of 300 jobs is 25 calls), and it is the one whose output is a number
      // against a fixed rubric rather than prose anyone reads. Rescoring from the
      // Score button stays on pro, so a list can hold scores from both -- see
      // MIN_FIT below, which is applied to these flash scores at intake.
      const res=await scoreBatch(part.map((j,k)=>({i:k, j})), prof, track, TOK_CAP, 'flash');
      part.forEach((j,k)=>{
        const r=res[String(k)];
        if(!r){ unscored.push(j); return; }          // the model skipped it: keep, unjudged
        j.ai_score=String(r.score); j.ai_reachability=String(r.reach);
        if(globalThis.LAST_MODEL) j.ai_model=globalThis.LAST_MODEL;
        j.ai_confidence=r.conf;
        j.ai_flags=JSON.stringify(addSpans(r.flags, j.description));
        if(r.posted && !saneDate(j.posted)) setPosted(j, r.posted.from, 'est', r.posted.to);
        scored.push({j, r});
      });
    }catch(e){
      console.warn('scoring failed for a batch, keeping it unscored:', e.message);
      unscored.push(...part);
    }
  }

  /* Judged after the scoring loop, not inside it: Jev is charged per batch of
     JUDGE_BATCH, and a whole search judged in one pass is a handful of calls
     where one per DeepSeek batch of twelve would be dozens. This used to be
     skipped entirely on the grounds that Jev was charged per row -- it is not,
     and a search whose flags nobody checked was the thing that cost most.

     Failing here costs the flags, not the search: the rows keep the scores and
     the DeepSeek flags they already have, which is what they had before. */
  if(scored.length && cloudNow()){
    try{
      const cand=candidateOf(prof, track);
      const judged=await judgeMany(scored.map(({j})=>({
        title:String(j.title||''), company:String(j.company||''),
        location:String(j.location||''),
        description:String(j.description||'').slice(0,4000),
      })), cand, exemplarOf(prof));
      scored.forEach(({j, r}, k)=>{
        const jv=judged[k];
        if(!jv) return;
        j.ai_confidence=jv.confidence||r.conf;
        j.ai_flags=JSON.stringify(addSpans(mergeJudgment(r.flags, jv), j.description));
        j.ai_judgment=JSON.stringify(jv);
      });
    }catch(e){ console.warn('judgement skipped for this search:', e && e.message); }
  }

  // The cut stays on the DeepSeek score until the eval set says the composed
  // one ranks at least as well — see PLAN.md 2e, which is the gate for that.
  scored.forEach(({j, r})=>{ if(r.score>=MIN_FIT) kept.push(j); else rejected.push(j); });
  // unscored is not rejected: the model never judged it, so nothing is known.
  return {kept, unscored, rejected, below:rejected.length};
}

/* The live results while a search runs. Each source's jobs go in through
   add(): free filter, then full postings from company feeds (dropping closed
   ones), then scoring, and what scores MIN_FIT+ joins the list. */
function liveBoard(trk, prof, track){
  const p=P(), seen=seenKeys(p);
  let rk=''; try{ rk=rejKey(p); }catch(e){}   // fixed now: the track can change mid-search
  const st={found:0, checking:0, kept:[], unscored:[], below:0, closed:0, added:0, dropped:{listing:0, old:0, dupe:0}};
  /* Yield per origin (the source that delivered a job), for the usage ledger.
     seenIn records every origin that returned each job, before any filtering,
     so "exclusive" means no other source in this search had it at all. A job
     returned by two sources counts as new for whichever arrived first. */
  const by={}, O=o=>by[o]||(by[o]={found:0, unique_new:0, kept_50:0, exclusive_50:0});
  const seenIn=new Map();
  const idsOf=j=>{ const tc=tcKey(j); return tc ? [keyOf(j), tc] : [keyOf(j)]; };
  const draw=(extra)=>{
    setSearchInfo((stopped()?'Stopping — ':'')+`${st.found} found · ${st.kept.length} score ${MIN_FIT}+ · ${st.below} below ${MIN_FIT}`
      + (st.checking?` · scoring ${st.checking} batch${st.checking===1?'':'es'}…`:'') + (extra?` — ${extra}`:''));
    const el=$('#searchLive'); if(!el) return;
    el.innerHTML=st.kept.slice(0,10).map(j=>
      `<li><b>${esc(j.ai_score)}</b> ${esc(j.title)} <span style="color:var(--dim)">· ${esc(j.company.startsWith('[')?'':j.company)} · ${esc(j.query||'')}</span></li>`).join('')
      + (st.kept.length>10?`<li style="list-style:none;color:var(--dim)">+ ${st.kept.length-10} more</li>`:'');
  };
  return {
    st, draw,
    async add(jobs){
      if(stopped()) return;
      st.found+=jobs.length;
      jobs.forEach(j=>{ const o=j.origin||'google'; O(o).found++;
        idsOf(j).forEach(k=>{ if(!seenIn.has(k)) seenIn.set(k,new Set()); seenIn.get(k).add(o); }); });
      const f=boardFilter(jobs, trk, seen);
      for(const k in f.dropped) st.dropped[k]+=f.dropped[k];
      f.jobs.forEach(j=>O(j.origin||'google').unique_new++);
      if(!f.jobs.length){ draw(); return; }
      /* Into the list now, not at the end (2026-10-23): a first search runs
         for minutes, and people left before anything appeared. Each scoring
         batch is in To decide the moment it is scored, so the first jobs can
         be opened, saved and applied to while the rest arrive. Per batch, not
         per add(): the index answers 60 jobs at once, and scoring all of them
         before showing any kept the first screen empty for four minutes.
         And before scoring, too: every job found is in the list at once, under
         "Scoring now", and the same objects are scored in place -- a job under
         the bar or closed at its source is taken back out when its batch lands. */
      const p=P(), mine=new Set();
      const shown=addJobs(f.jobs); if(shown){ f.jobs.forEach(j=>{ if(p.jobs.includes(j)) mine.add(j); }); renderSoon(); saveSoon(); }   // saved now: someone who leaves in the first minute keeps them, and autoScore finishes them next time
      for(let i=0;i<f.jobs.length && !stopped();i+=SCORE_BATCH){
        st.checking++; draw();
        const part=f.jobs.slice(i,i+SCORE_BATCH);
        const ats=await fromAts(part);
        st.closed+=ats.closed;
        const r=await scoreAndCut(ats.jobs, prof, track);
        st.checking--;
        if(rk) rememberRejected(rk, r.rejected);
        r.kept.forEach(j=>O(j.origin||'google').kept_50++);
        st.kept.push(...r.kept); st.unscored.push(...r.unscored); st.below+=r.below;
        st.kept.sort((a,b)=>rankOf(b)-rankOf(a));
        const out=new Set(r.rejected.concat(part.filter(j=>!ats.jobs.includes(j))).filter(j=>mine.has(j) && !isTouched(j) && !isSaved(j)));
        if(out.size){ const q=P(); if(q) for(let k=q.jobs.length-1;k>=0;k--) if(out.has(q.jobs[k])) q.jobs.splice(k,1); }
        const n=addJobs(r.kept.concat(r.unscored))+r.kept.concat(r.unscored).filter(j=>mine.has(j)).length;
        if(n){ st.added+=n; saveSoon(); }
        renderSoon(); draw();
      }
    },
    // Call once, after every source has landed.
    report(){
      st.kept.forEach(j=>{
        const origins=new Set(); idsOf(j).forEach(k=>(seenIn.get(k)||[]).forEach(o=>origins.add(o)));
        if(origins.size===1) O(j.origin||'google').exclusive_50++;
      });
      return by;
    },
  };
}

/* Board hits on an ATS carry only Google's snippet, but the company's feed has
   the whole posting. One feed pull per company covers all its hits. A feed
   that loads and doesn't list the posting means the posting is gone; a feed
   that fails to load proves nothing, so that hit is kept as it was. */
/* Which company feed a posting link belongs to, and the posting's own id: the
   last path segment after the company slug that isn't boilerplate (jobs, j, o,
   apply). Greenhouse's embedded boards carry it as ?gh_jid= instead. */
function atsOfUrl(u){
  for(const platform in ATS){
    const m=String(u).match(ATS[platform].host);
    if(!m) continue;
    const gh=String(u).match(/[?&]gh_jid=(\d+)/);
    const rest=String(u).slice(m.index+m[0].length).split(/[?#]/)[0].split('/')
      .filter(s=>s && !/^(jobs|j|o|apply|application)$/i.test(s));
    const id=gh ? gh[1] : rest[0];
    return id ? {platform, slug:m[1], id} : null;
  }
  return null;
}
async function fromAts(jobs, onStatus){
  const feeds=new Map(), out=[];
  let closed=0;
  for(const j of jobs){
    const hit=atsOfUrl(j.url);
    if(!hit){ out.push(j); continue; }
    const {platform, slug, id}=hit, key=platform+':'+slug;
    if(!feeds.has(key)){
      if(onStatus) onStatus(`reading ${slug}'s full postings on ${ATS[platform].label}…`);
      feeds.set(key, await atsPull(platform, slug).catch(()=>null));
    }
    const feed=feeds.get(key);
    if(!feed){ out.push(j); continue; }
    // Either direction: a link can carry a title suffix after the id (SmartRecruiters)
    // or the feed's url can wrap the id in a longer company-site link (Greenhouse).
    const row=feed.rows.find(r=>{ const u=String(r.url), last=u.split(/[?#]/)[0].split('/').filter(Boolean).pop()||'\0';
      return u.includes(id) || (last.length>=6 && id.startsWith(last)); });
    if(!row){ closed++; continue; }
    if(!row.desc && ATS[platform].detail) row.desc=await ATS[platform].detail(row).catch(()=>'');
    j.description=(row.desc||j.description).slice(0,4000);
    if(row.location) j.location=row.location;
    setPosted(j, row.posted, 'feed');        // the feed's date beats the snippet's
    out.push(j);
  }
  return {jobs:out, closed};
}

/* A search adds jobs batch by batch; these keep that from re-drawing the page
   or writing to the account on every batch. */
let RENDER_T=null, SAVE_T=null;
const renderSoon=()=>{ if(RENDER_T) return; RENDER_T=setTimeout(()=>{ RENDER_T=null; render(); },1200); };
const saveSoon=()=>{ clearTimeout(SAVE_T); SAVE_T=setTimeout(()=>save(),2500); };

/* Scrapes still running when the app closed. They are remembered on the
   profile (synced), and the next open collects them instead of losing them --
   a first search runs for minutes and people leave (shrabana, 2026-10-22). */
function clearPending(trk){ const p=P(); if(p && p.profile.pending && (!trk || p.profile.pending.track===trk.id)){ delete p.profile.pending; saveSoon(); } }
function resumePending(){
  const p=P(), pd=p && p.profile.pending;
  if(!pd || !(pd.runs||[]).length || busy || !cloudNow() || !USER) return false;
  if(Date.now()-pd.at > 3*864e5){ delete p.profile.pending; save(); return false; }   // Apify keeps results about a week; three days is plenty
  const trk=(p.profile.tracks||[]).find(t=>t.id===pd.track); if(!trk){ delete p.profile.pending; save(); return false; }
  busy=true; STOP=false; render();
  const live=liveBoard(trk, p.profile, trk.id), failed=[];
  setSearchInfo('Collecting what your last search found while you were away…');
  track('search_resume',{ runs:pd.runs.length });
  const work=pd.runs.map(run=>(run.google
      ? apifyBoardSearch(run.queries||[], pd.cc||'', null, run.id)
      : apifyRun('', {}, {every:8000, cap:120, runId:run.id, source:run.source, label:run.label}).then(items=>(items||[]).map(jsearchRow)))
    .then(jobs=>live.add(jobs||[]))
    .catch(e=>{ failed.push(`${run.label||'search'}: ${e.message}`); }));
  /* Then the open's own fill: runs that come back empty (expired, aborted)
     must not leave the direction empty until some later visit. */
  Promise.all(work).then(()=>finishSearch(trk, live, failed, false)).catch(e=>{ busy=false; render(); setSearchInfo(e.message); })
    .then(()=>fillDirection());
  return true;
}

/* What the corpus search left on the table, so the paid search can be a second
   click rather than the same click. Holds the track it belongs to: switching
   track must not leave an offer behind that would spend credits on the titles
   of a track nobody is looking at. Null whenever there is nothing to offer --
   no cloud session, an own Apify token, or the paid search already made. */
let PAID_OFFER = null;
/* Whether the first click reads the free corpus rather than the paid boards.
   renderApp words the button from this and the command palette words its entry
   from it, so the two cannot drift apart. */
/* What the live-board search costs, for the button that offers it. The server
   is the authority (COST.boardSearch) and hands the real figure over with the
   packs; this is the same number written down so the button can be drawn before
   anyone has opened the credits dialog. Refreshed from the server whenever that
   dialog does fetch them. */
let BOARD_COST = 25;

/* The shared tail of both phases: what was kept goes into the list, the search
   is reported if it was a metered one, and the person is told what happened.
   `paid` is what makes the two summaries differ -- a free corpus pass that
   found little is an invitation to spend, and needs to say so. */
async function finishSearch(trk, live, failed, paid){
  const p=P(); const st=live.st, d=st.dropped;
  const wasStopped=stopped(); STOP=null;
  const n=st.added+addJobs(st.kept.concat(st.unscored));   // most already went in as they arrived
  clearPending(trk);
  track('search_done',{ paid:!!paid, found:st.found, kept:st.kept.length, below:st.below, added:n, failed:failed.length, stopped:wasStopped });
  if(SEARCH_ID){
    hosted('search_report',{search_id:SEARCH_ID, sources:live.report()}).catch(e=>console.warn('usage report:', e.message));
    // Only a search on our keys moves the "new since" point; it's what that window is for.
    p.searchedAt=Object.assign(p.searchedAt||{}, {[trk.id]:new Date().toISOString()});
  }
  SEARCH_ID=null;
  /* save, then redraw, then say what happened -- in that order, because
     render() rebuilds #root and would wipe a summary written before it. */
  await save(); busy=false; render();
  const why=[st.below&&`${st.below} scored below ${MIN_FIT}`, d.listing&&`${d.listing} listing pages`,
    d.old&&`${d.old} older than ${MAX_AGE_DAYS} days`, d.dupe&&`${d.dupe} already seen`,
    st.closed&&`${st.closed} closed`].filter(Boolean).join(', ');
  if(failed.length) console.warn('sources failed:', failed);
  const found=(n
      ? `Added ${st.kept.length} jobs scoring ${MIN_FIT}+ from ${st.found} results.`
        + (st.unscored.length?` ${st.unscored.length} more couldn't be scored yet — use "Score new jobs".`:'')
      : `Searched ${st.found} results, none new scoring ${MIN_FIT}+.`);
  setSearchInfo((wasStopped?'Stopped. ':'') + found + (why?` Skipped: ${why}.`:'')
    + (failed.length?` (${failed.length} source${failed.length===1?'':'s'} failed: ${failed.map(f=>f.split(':')[0]).join(', ')})`:'')
    + (paid||wasStopped?'':' The live boards are a separate search, and a paid one.'));
  if(!wasStopped) fbMoment('search');
}

/* Phase one, and free.

   The corpus is hundreds of thousands of postings already acquired and already
   paid for, served to everyone, so reading it costs nothing and answers at
   once. It used to run here and then fall straight through into a board search
   in the same click, which meant nobody ever got the chance to look at the free
   answer and decide the paid one was unnecessary. Now it stops, shows what it
   has, and offers the paid search as its own action.

   The own-Apify-token path below is untouched: that person spends on their own
   account through their own key, there is no credit of ours to save them, and
   a second click in front of it would buy nothing. */
async function runBoards(trk, where){
  const p=P(); if(!p||busy) return;
  // Portals first, then any specialist registry the track named that is not
  // already one of them. A track with no registries of its own still searches.
  // Only the portals that suit this track's mode are queried; PORTALS stays the
  // full set below, because "is this a portal" is what decides whether a query
  // gets the location term, and that is true of all six however this track searches.
  // A profile extracted before the board catalogue existed picks it up here, on its first search.
  if(!trk.catalogued) addCatalogueBoards(trk, p.profile);
  const boards=portalsFor(trk.mode).concat((trk.boards||[]).filter(b=>!PORTALS.includes(b)));
  const titles=(trk.titles||[]);
  if(!titles.length){ setSearchInfo("This track has no titles to search."); return; }
  const qs=buildBoardQueries(titles,boards,where);
  busy=true; STOP=false; PAID_OFFER=null; render();
  try{
    // Pinned to the person's country so Google ranks for where they can
    // actually work. The location term in the query does the real narrowing;
    // this stops an Indian search coming back ordered for an American reader.
    // Empty on a profile extracted before country_code existed, which is the
    // old worldwide behaviour rather than a broken one.
    const cc=p.profile.country_code||"";
    const live=liveBoard(trk, p.profile, p.track), failed=[];
    if(!ownApify() && cloudNow()){
      // New jobs only: every site is asked for what was posted since this track
      // was last searched (rounded up, plus a day of overlap), 30 days the first time.
      const last=Date.parse((p.searchedAt||{})[trk.id]||'');
      const since_days=isNaN(last) ? 30 : Math.min(30, Math.ceil((Date.now()-last)/864e5)+1);
      setSearchInfo(since_days<30 ? `reading the index for jobs posted in the last ${since_days} day${since_days===1?'':'s'}…` : 'reading the index…');
      try{
        const ix=await hosted('index_search',{titles:titles.slice(0,4), since_days, limit:60});
        const rows=(ix&&ix.jobs)||[];
        if(rows.length) await live.add(rows.map(jsearchRow));
      }catch(e){ console.warn('index search skipped:', e.message); }
      /* One click searches everything: the index just read, then every live
         board, scored together. If the live half cannot run (out of credits,
         sources down) runPaidBoards finishes with the index alone and leaves
         the offer below so the person can retry it. */
      PAID_OFFER={trackId:trk.id, where, since_days};
      // Stopped while the index was being read: the live boards never start.
      if(stopped()){ await finishSearch(trk, live, failed, false); return; }
      await runPaidBoards(trk, where, since_days, {live, failed});
      return;
    } else {
      try{ await live.add(await apifyBoardSearch(qs,cc,setSearchInfo)); }
      catch(e){ if(!stopped()) throw e; }
      await finishSearch(trk, live, failed, true);
    }
  }catch(e){
    busy=false; STOP=null; SEARCH_ID=null; render();
    if(e.message==='NEEDAPIFY'){ keyDialog(()=>runBoards(trk,where)); return; }
    setSearchInfo(e.message); fbMoment('error');
  }
}

/* A new direction gets jobs before anyone searches it. The corpus only grows
   towards a kind of work after somebody asks for it, so the first person in a
   new field found the free index empty (a filmmaker, 2026-10-13). So the first
   time a direction is in use -- the end of onboarding, or switching to one --
   the server is asked once to fill it: free sources plus one scraper, into
   the shared corpus, scored here like a search. Free to the person; the
   server allows it once per direction and a few times a day (direction_fill).
   Remembered per device too, so this does not even ask twice. */
async function fillDirection(){
  const p=P(); if(!p || busy || !cloudNow() || !USER || ownApify()) return;
  const trk=(p.profile.tracks||[]).find(t=>t.id===p.track);
  if(!trk) return;
  routeFills(trk);                    // not awaited, once per route: its own work, beside the boards
  if(!(trk.titles||[]).length) return;
  const k='triage:filled:'+DB.current+':'+trk.id;
  let filled=false; try{ filled=!!localStorage.getItem(k); }catch(e){ return; }
  const waiting=p.jobs.some(j=>isOpen(j)&&stOf(j)==='new'&&inDir(j,p));
  if(filled && waiting) return;
  /* Before anyone presses anything (2026-10-23): the free index first, which
     answers in seconds, so the first screen has jobs on it; then, once per
     direction, the free fill in the background. Both stream into To decide
     batch by batch (liveBoard.add). */
  busy=true; STOP=false; render();
  const live=liveBoard(trk, p.profile, p.track), failed=[];
  setSearchInfo('Reading what we already have for this direction…');
  try{
    const ix=await hosted('index_search',{ titles:(trk.titles||[]).slice(0,4), since_days:30, limit:60 });
    if(ix && (ix.jobs||[]).length) await live.add(ix.jobs.map(jsearchRow));
  }catch(e){ console.warn('first index read skipped:', e.message); }
  /* The paid board fill is for work that is advertised. Where postings are a
     small part of how this work is got, the free index read above is all the
     boards get; the rest comes from the other routes. */
  if(filled || stopped() || routesOf(trk).advertised<0.2){ await finishSearch(trk, live, failed, false); thinCheck(trk); return; }
  try{ localStorage.setItem(k, today()); }catch(e){}
  track('direction_fill',{ mode:trk.mode||'' });
  setSearchInfo('Finding more jobs for this direction — free, and only this once. The first ones are already below.');
  const where = WHERE!==null ? WHERE : String(p.profile.location||'').split(',')[0].trim();
  await runPaidBoards(trk, where, 30, {live, failed}, 'direction_fill');
  thinCheck(trk);
}

/* A direction with almost nothing in it says so, and points at the best
   stocked of the person's other directions (shrabana, 2026-10-22: 3 reporter
   roles in India, 119 content ones). Free: it only reads the index. */
let THIN = null;
async function thinCheck(trk){
  const p=P(); if(!p || !cloudNow()) return;
  const n=p.jobs.filter(j=>isOpen(j)&&stOf(j)==='new'&&inDir(j,p)).length;
  const others=(p.profile.tracks||[]).filter(t=>t.id!==trk.id && (t.titles||[]).length);
  if(n>=5) return;
  /* Few postings is expected where postings are not how the work is got: say
     so, and point at the places to approach, not at another direction. */
  if(routesOf(trk).advertised<0.5){ THIN={ from:trk.id, n, how:trk.how_hired||'Most of this work is not advertised.' }; track('thin_direction',{ n, route:1 }); render(); return; }
  if(!others.length) return;
  let best=null;
  for(const t of others.slice(0,3)){
    try{ const ix=await hosted('index_search',{ titles:t.titles.slice(0,4), since_days:30, limit:60 });
      const m=((ix&&ix.jobs)||[]).length; if(!best || m>best.m) best={ t, m }; }catch(e){}
  }
  if(best && best.m>=10 && best.m>n*2){ THIN={ from:trk.id, n, to:best.t.id, label:best.t.label, m:best.m }; track('thin_direction',{ n, m:best.m }); render(); }
}

/* Phase two, and the one that costs credits: the live boards. Only ever reached
   from the button runBoards offers, never automatically.

   Our keys: the API sources answer at once; the Google run and the site
   scrapers (LinkedIn, Indeed, Naukri...) run on Apify and land later. Each
   batch is CV-checked the moment it arrives. One source failing loses only its
   own results. One charge for the lot. */
async function runPaidBoards(trk, where, since_days, pre, action){
  const p=P(); if(!p||(busy&&!pre)) return;
  // A profile extracted before the board catalogue existed picks it up here, on its first search.
  if(!trk.catalogued) addCatalogueBoards(trk, p.profile);
  const boards=portalsFor(trk.mode).concat((trk.boards||[]).filter(b=>!PORTALS.includes(b)));
  const titles=(trk.titles||[]);
  if(!titles.length){ setSearchInfo("This track has no titles to search."); return; }
  busy=true; if(!pre) STOP=false; PAID_OFFER=null; render();
  try{
    const cc=p.profile.country_code||"";
    const live=pre?pre.live:liveBoard(trk, p.profile, p.track), failed=pre?pre.failed:[];
    const registries=boards.filter(b=>!PORTALS.includes(b));
    const rq=registries.length ? buildBoardQueries(titles,registries,where) : [];
    setSearchInfo('searching the live boards…');
    // fallback: portal queries the server runs on Google if every API source comes back empty.
    let r;
    try{
      const body={titles:titles.slice(0,4), skills:(p.profile.hard_skills||[]).slice(0,6), since_days,
        where, country:cc, mode:trk.mode||'', queries:rq.join('\n'), track_key:DB.current+':'+trk.id,
        fallback:buildBoardQueries(titles,portalsFor(trk.mode),where).join('\n')};
      // Two literal calls rather than hosted(action), so each action has a call site of its own.
      r = action==='direction_fill' ? await hosted('direction_fill', body) : await hosted('board_search', body);
      // A fill the server declined (done before, or today's limit): nothing more
      // to fetch -- but what the index already gave is finished and reported.
      if(r && r.skipped){ if(pre){ await finishSearch(trk, live, failed, false); return; } busy=false; STOP=null; render(); return; }
    }catch(e){
      if(!pre||e.message==='NEEDAPIFY') throw e;
      PAID_OFFER={trackId:trk.id, where, since_days};
      await finishSearch(trk, live, failed, false);
      setSearchInfo(`Showing the index only. Live boards: ${e.message}`);
      return;
    }
    PAID_OFFER=null;
    SEARCH_ID=r.searchId||null;
    failed.push(...(r.sourceErrors||[]));
    { const runs=[...(r.scrapers||[]).map(sc=>({ id:sc.id, source:sc.source, label:sc.label })),
                  ...(r.runId ? [{ id:r.runId, google:true, label:'Google', queries:r.queries||rq }] : [])];
      if(runs.length){ p.profile.pending={ at:Date.now(), track:trk.id, cc, runs }; save(); } }
    const landed=id=>{ const pd=p.profile.pending; if(pd){ pd.runs=(pd.runs||[]).filter(x=>x.id!==id); if(!pd.runs.length) delete p.profile.pending; saveSoon(); } };
    let left=(r.scrapers||[]).length+(r.runId?1:0);
    const note=()=>left?`waiting on ${left} more source${left===1?'':'s'}`:'';
    const land=(label, promise)=>promise
      .then(jobs=>live.add(jobs||[]))
      .catch(e=>{ if(!stopped()) failed.push(`${label}: ${e.message}`); })
      .finally(()=>{ left--; live.draw(note()); });
    const work=[live.add((r.jobs||[]).map(jsearchRow))];
    (r.scrapers||[]).forEach(s=>work.push(land(s.label,
      apifyRun('', {}, {every:8000, cap:300, runId:s.id, source:s.source, label:s.label})
        .then(items=>{ landed(s.id); return (items||[]).map(jsearchRow); }))));
    if(r.runId) work.push(land('Google', apifyBoardSearch(r.queries||rq,cc,null,r.runId).then(js=>{ landed(r.runId); return js; })));
    live.draw(note());
    await Promise.all(work);
    await finishSearch(trk, live, failed, true);
  }catch(e){
    busy=false; STOP=null; SEARCH_ID=null; render();
    if(e.message==='NEEDAPIFY'){ keyDialog(()=>runPaidBoards(trk,where,since_days)); return; }
    setSearchInfo(e.message); fbMoment('error');
  }
}

async function runAts(lines){
  const p=P(); if(!p||busy) return;
  busy=true; render();
  try{
    const {found,misses}=await atsSearch(lines,setSearchInfo);
    let added=0; const notes=[];
    for(const hit of found){
      await recordVelocity(hit.slug,hit.rows.length);

      const jobs=rowsFromAts(hit);

  }

/* ═══ cold target ═══
   A company with no posting. Same two axes, but the action is a DM rather than
   an application — which is where most of these roles actually get filled. */
/* Beta feedback, with the state the app was in attached.

   A form that only carries prose gets "search was slow" and nobody can tell
   which search, on what model, with how many rows. So `context` records what is
   already in memory at the moment they send: the open track and tab, the
   counts, which model last scored, the two status lines, and what prompted the
   report if the app asked for it. None of it is typed by the user and none of
   it is a secret -- no keys, no CV text, no posting bodies, just the shape of
   the session.

   It is a corner button and a small card rather than a dialog, because a dialog
   covers the thing being reported and closes after one report. This stays open
   beside the work, keeps a half-written draft when shut, and clears itself
   after a send so the next one costs nothing to start.

   One credit is not charged and nothing is metered: this is the only write in
   the app that exists for us rather than for them. */
const FB_KINDS=[['bug','Broke','What you expected, and what happened instead.'],
                ['confusing','Confusing','What were you trying to do?'],
                ['idea','Idea','What should it do instead?'],
                ['other','Other','Go on.']];
/* Asked about the thing that just finished, never about the app in general: a
   question with an obvious subject gets answered, "any feedback?" does not. */
const FB_ASKS={
  search:'Were those results what you were looking for?',
  score:'Do these scores look right to you?',
  applied:'Was that easy to do from here?',
  contacts:'Were those contacts any use?',
  error:'That did not work. What were you trying to do?',
};
const FB_TAPS=[['Yes','other'],['Not really','confusing'],['Something broke','bug']];

/* When to ask. A moment, not a timer: the app only speaks when something the
   person can have an opinion on has just finished, and then only if enough
   time has passed since it last spoke. An ask that is waved away or left to
   expire doubles the wait, up to FB_MAX; any report at all, prompted or not,
   puts it back to FB_BASE. A failure is the exception -- it is the one moment
   that looks exactly like disuse from our side -- so it only ever waits
   FB_ERR, however far the rest has backed off.
   These four numbers are guesses. Tune them against what read-feedback.js
   shows: `context.trigger` says which ask produced a row, `context.tap` says
   it took one tap. */
const FB_BASE=8*6e4, FB_MAX=120*6e4, FB_ERR=2*6e4, FB_LINGER=25e3;
function fbDue(s, trigger, now){
  return now-s.last >= (trigger==='error' ? Math.min(s.gap,FB_ERR) : s.gap);
}
function fbNext(s, outcome, now){   // 'asked' | 'ignored' | 'gave'
  if(outcome==='ignored') return { last:s.last, gap:Math.min(s.gap*2,FB_MAX) };
  return { last:now, gap: outcome==='asked' ? s.gap : FB_BASE };
}
/* The corner button and the questions are a beta, shown on the live site only
   to accounts marked as testers: `credits.tester`, which changes nothing about
   what they are charged. Everyone else keeps a Feedback button in the top bar,
   which opens the same card and is never prompted. The flag arrives with the
   wallet, after the first paint, so fbGate runs again when it lands. */
const fbBeta=()=>!!(CLOUD && USER && TESTER);

/* What a tester did that leaves no other trace: that they came back, which
   screen they stopped on, which job they opened and left. Searches, scores,
   stages, mail and feedback record themselves already. Testers only, actions
   only -- a kind and a few small facts, never a CV, a posting or a message.
   Insert-only (public.activity has no select policy); scripts/insights.js is
   the one reader. Fire-and-forget: a lost event must never cost the person
   anything, so every failure here is swallowed.

   Whether this account is a tester is not known until the credits row has
   loaded, so what happens before that waits in TRACK_Q rather than being lost
   -- the first thing anyone does is exactly what is worth knowing. */
let TRACK_Q=[], TRACK_READY=false, TRACK_VIEW='', TRACK_ERRS=0, TRACK_BACK=0;
function trackSend(row){
  try{ SB.from('activity').insert(row).then(()=>{},()=>{}); }catch(e){}
}
function track(kind, detail){
  if(!CLOUD || !USER) return;
  const row={ kind:String(kind).slice(0,40), detail:detail||{} };
  if(!TRACK_READY){ if(TRACK_Q.length<50) TRACK_Q.push(row); return; }
  if(TESTER) trackSend(row);
}
function trackReady(){
  TRACK_READY=true;
  const q=TRACK_Q; TRACK_Q=[];
  if(CLOUD && USER && TESTER) q.forEach(trackSend);
}
/* Errors that only ever happen in somebody's browser. Capped per page load:
   one broken render can throw on every frame. */
function trackError(msg, where){
  if(TRACK_ERRS++<10) track('error',{ msg:String(msg||'').slice(0,200), where:String(where||'').slice(0,80) });
}
window.addEventListener('error', e=>trackError(e.message, `${e.lineno||0}:${e.colno||0}`));
window.addEventListener('unhandledrejection', e=>trackError(e.reason && (e.reason.message||e.reason), 'promise'));
function fbGate(){
  const f=$('#fbFab'), b=$('#btnFeedback');
  if(f) f.hidden=!fbBeta();
  if(b) b.hidden=fbBeta();
}
let FB_STATE={ last:0, gap:FB_BASE }, FB_KIND='bug', FB_TRIG=null, FB_TIMER=0, FB_SENT=0;
try{
  const s=JSON.parse(localStorage.getItem('triage:fb')||'null');
  if(s && s.last>=0 && s.gap>=FB_BASE) FB_STATE={ last:s.last, gap:s.gap };
}catch(e){}
function fbMark(outcome){
  FB_STATE=fbNext(FB_STATE,outcome,Date.now());
  try{ localStorage.setItem('triage:fb',JSON.stringify(FB_STATE)); }catch(e){}
}

async function fbSend(kind, message, extra){
  const p=P(), line=id=>{ const e=$(id); return e ? String(e.textContent||'').slice(0,200) : null; };
  const ctx=Object.assign({
    track: p&&p.track ? String(p.track).slice(0,80) : null,
    jobs: p&&p.jobs ? p.jobs.length : 0,
    scored: p&&p.jobs ? p.jobs.filter(isScored).length : 0,
    model: globalThis.LAST_MODEL||null,
    view: VIEW==='app' ? TAB : VIEW,
    search: line('#searchInfo'), score: line('#scoreInfo'),
    theme: THEME, busy: !!busy,
    agent: String(navigator.userAgent||'').slice(0,160),
    at: new Date().toISOString(),
  }, extra);
  /* No account is the COMMON case here, not an error: the README promises
     "no signup". Signed-in reports go straight to the table under RLS with a
     real auth.uid(); anonymous ones go through the Worker, which inserts
     with the service role because an anon-key insert policy would let anyone
     holding the public key fill the table. Two doors, one table. */
  if(!CLOUD || !USER){
    const r=await fetch('/api/feedback',{ method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ kind, message: message.slice(0,4000), context: ctx,
        reply_to: $('#fbReply').value.trim()||null, website: $('#fbHP').value }) });
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok) throw new Error(j.error||('HTTP '+r.status));
  }else{
    const { error }=await SB.from('feedback').insert({
      user_id: USER.id, kind, message: message.slice(0,4000), context: ctx, via:'app' });
    if(error) throw new Error(error.message);
  }
  FB_SENT++; fbMark('gave');
}

function fbPick(kind){
  FB_KIND=kind;
  document.querySelectorAll('#fbKinds button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.kind===kind)));
  $('#fbMsg').placeholder=FB_KINDS.find(k=>k[0]===kind)[2];
}
function fbOpen(kind, note){
  track('feedback_open',{ kind:kind||'' });
  fbAskHide();
  $('#fbAnon').hidden=!!(CLOUD&&USER);
  if(kind) fbPick(kind);
  $('#fbNote').textContent=note||'';
  $('#fbForm').hidden=false; $('#fbFab').setAttribute('aria-expanded','true');
  $('#fbMsg').focus();
}
function fbClose(){
  $('#fbForm').hidden=true; $('#fbFab').setAttribute('aria-expanded','false');
  FB_TRIG=null; (fbBeta() ? $('#fbFab') : $('#btnFeedback')||$('#fbFab')).focus();
}
function fbAskHide(outcome){
  clearTimeout(FB_TIMER);
  const a=$('#fbAsk'); if(a.hidden) return;
  a.hidden=true; if(outcome) fbMark(outcome);
}
/* Called where something finishes. Says nothing if it is too soon, if a card
   is already up, or if the person is mid-sentence somewhere -- and in that last
   case tries once more, because the moment is still fresh a few seconds on. */
function fbMoment(trigger, retried){
  const ask=$('#fbAsk');
  if(!fbBeta() || !ask || !ask.hidden || !$('#fbForm').hidden) return;
  if(!fbDue(FB_STATE,trigger,Date.now())) return;
  const a=document.activeElement;
  if($('.modal') || PAL || (a && a.closest && a.closest('input,textarea,select,[contenteditable]'))){
    if(!retried) setTimeout(()=>fbMoment(trigger,true),15e3);
    return;
  }
  FB_TRIG=trigger; fbMark('asked');
  $('#fbQ').textContent=FB_ASKS[trigger];
  const taps = trigger==='error' ? [['Tell you','bug']] : FB_TAPS;
  $('#fbTaps').innerHTML=taps.map(([l],i)=>`<button class="btn-sm" data-tap="${i}">${esc(l)}</button>`).join('');
  $('#fbTaps').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.tap, [label,kind]=taps[i];
    fbAskHide();
    // Nothing to record yet for a failure: the tap only says they will say.
    if(trigger==='error') return fbOpen('bug');
    /* The tap is the report. It is sent now, with its context, whether or not
       anything is typed after it -- most people stop here. */
    fbSend(kind, `${FB_ASKS[trigger]} — ${label}`, { trigger, tap:true })
      .catch(e=>console.warn('feedback tap not sent:', e.message));
    if(i){ fbOpen(kind,'Noted. Say more if you can.'); return; }
    FB_TRIG=null;
    const f=$('#fbFab'); f.textContent='Thanks'; setTimeout(()=>{ f.textContent='Feedback'; },1600);
  });
  ask.hidden=false;
  FB_TIMER=setTimeout(()=>{ fbAskHide('ignored'); FB_TRIG=null; },FB_LINGER);
}
/* Built once into #fb, which sits outside #root and holds #tasks too: render()
   replaces #root on every state change, and a draft that vanished mid-word
   would teach people not to start one. */
function fbMount(){
  const el=$('#fb'); if(!el) return;
  el.insertAdjacentHTML('beforeend',`<div class="fbcard" id="fbAsk" role="status" hidden>
      <div style="display:flex;gap:8px;align-items:flex-start">
        <div id="fbQ" style="flex:1;font-size:13px"></div>
        <button class="btn-sm" id="fbNo" title="Not now" aria-label="Not now">×</button></div>
      <div class="fbkinds" id="fbTaps" style="margin-bottom:0"></div>
    </div>
    <div class="fbcard" id="fbForm" role="dialog" aria-label="Send feedback" hidden>
      <div class="eyebrow">Beta feedback</div>
      <div class="fbkinds" id="fbKinds">${FB_KINDS.map(([v,l])=>
        `<button class="btn-sm" data-kind="${v}">${esc(l)}</button>`).join('')}</div>
      <textarea id="fbMsg" rows="4" aria-label="Your feedback"></textarea>
      <div id="fbAnon">
        <input type="email" id="fbReply" style="margin-top:8px" aria-label="Email, optional"
               placeholder="Email, only if you want an answer">
        <input type="text" id="fbHP" tabindex="-1" autocomplete="off"
               style="position:absolute;left:-9999px;width:1px;height:1px" aria-hidden="true">
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn-go btn-sm" id="fbSend" title="Ctrl+Enter">Send</button>
        <span id="fbNote" role="status" style="flex:1;font-size:11px;color:var(--muted)"></span></div>
      <div class="hint">Blunt is useful. Only what you type, the status line and the counts on screen are sent — never your CV or the postings.</div>
    </div>
    <button id="fbFab" title="Tell us what broke, or what should be different"
            aria-expanded="false" aria-controls="fbForm">Feedback</button>`);
  $('#fbFab').onclick=()=>$('#fbForm').hidden ? fbOpen() : fbClose();
  $('#fbNo').onclick=()=>{ fbAskHide('ignored'); FB_TRIG=null; };
  document.querySelectorAll('#fbKinds button').forEach(b=>b.onclick=()=>{ fbPick(b.dataset.kind); $('#fbMsg').focus(); });
  $('#fbSend').onclick=async()=>{
    const m=$('#fbMsg'), note=$('#fbNote'), btn=$('#fbSend'), msg=m.value.trim();
    if(!msg){ note.textContent='Say something first.'; m.focus(); return; }
    btn.disabled=true; note.textContent='Sending…';
    try{
      await fbSend(FB_KIND, msg, FB_TRIG ? { trigger:FB_TRIG } : {});
      // Sent means done: close the box and say so (feedback #15).
      m.value=''; note.textContent=''; btn.disabled=false; fbClose();
      askToast('Feedback sent — thank you', 'We read every one.', []);
      return;
    }catch(e){ note.textContent='Could not send: '+e.message; }
    btn.disabled=false; m.focus();
  };
  $('#fbMsg').onkeydown=e=>{
    if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) $('#fbSend').click();
    if(e.key==='Escape') fbClose();
  };
  $('#fbMsg').oninput=()=>{ $('#fbNote').textContent=''; };
  fbPick(FB_KIND); fbGate();
}

/* ═══ reply tracking: a forwarding address, not a mailbox ═══════════════════

   stage='live' is the only record that anybody ever answered an application,
   and until now it was written by the person remembering to press a button --
   which is why matcher_outcomes reads 0 replied against 402 jobs.

   The automation does NOT read anyone's mail. The alternative was Gmail's API
   with gmail.readonly, which is a restricted scope (capped at 100 users until
   a third-party security assessment) and means holding a credential that can
   read someone's whole inbox -- in an app whose CV parser runs in this browser
   specifically so that nothing is uploaded.

   So: one Gmail filter, set once, forwards recruiter mail to a per-profile
   address. We can read nothing that was not routed to us, and the token is the
   address AND the capability, so rotating it revokes access with no server
   state to clean up. src/reply-match.mjs decides; an ATS auto-acknowledgement
   is deliberately NOT a reply. */
const INBOX_DOMAIN = 'jobtriage.in';
/* On since 2026-10-09. It was off until the receiving end existed, so the
   panel never handed out an address that silently swallows mail; set it back
   to false if mail to the domain ever stops arriving. Seen working end to end
   on 2026-10-10: a reply to a token address moved its job to live. Three
   things it needed, all outside this repo:
     1. jobtriage.in on Cloudflare.
     2. Email Routing enabled, catch-all -> this Worker. Check for existing MX
        records FIRST: enabling it repoints the domain's mail.
     3. SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as Worker secrets, so
        src/index.js can resolve a token to a profile.
*/
const INBOX_LIVE = true;
/* One filter, set once, for every application they will ever make. It matches
   the platforms that send receipts for a living by sender, and everything else
   by the words such mail uses -- because most replies come from a company's
   own domain, which no sender list can know in advance. It is wide on purpose
   and forwards unrelated mail too; src/reply-match.mjs drops that unstored
   (action 'drop'), which is what makes wide affordable. Keep the two in step:
   a word added here that no cue there recognises only forwards more to drop. */
const GMAIL_FILTER = 'from:(greenhouse.io OR greenhouse-mail.io OR lever.co OR ashbyhq.com OR workable.com OR workablemail.com'
  + ' OR smartrecruiters.com OR recruitee.com OR myworkday.com OR icims.com OR successfactors.com OR taleo.net)'
  + ' OR "your application" OR "thank you for applying" OR "thanks for applying" OR "you applied" OR "application received"'
  + ' OR "application submitted" OR interview OR "next steps" OR "your availability" OR "notice period" OR "schedule a call"'
  + ' OR "moving forward" OR "other candidates" OR "regret to inform"';
const inboxAddr = t => `r.${t}@${INBOX_DOMAIN}`;
const newInboxToken = () =>
  Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2,'0')).join('');

async function replyInboxDialog(){
  const d=modal(`<div class="eyebrow">Reply tracking</div>
    <h2 style="margin:6px 0 6px">Let replies mark themselves</h2>
    <p style="color:var(--muted);font-size:12px;margin:0 0 12px">One Gmail filter, set once. After that a reply moves the job to <b>In conversation</b> on its own, so the pipeline is true without you maintaining it.</p>
    <div id="riBody" style="color:var(--muted);font-size:12px">Loading…</div>`);
  track('replies_open');
  const body=d.querySelector('#riBody');
  if(!CLOUD||!USER){ body.innerHTML='<span class="err">This needs you signed in — the address is tied to your account.</span>'; return; }
  const pid=PROFILE_IDS[DB.current];
  if(!pid){ body.innerHTML='<span class="err">Save this profile to your account first, then reopen this.</span>'; return; }
  /* Honest about not being on yet. Issuing a token here would hand out an
     address that accepts nothing, and the person would reasonably conclude
     their Gmail filter was wrong. */
  if(!INBOX_LIVE){
    body.innerHTML=`<p style="margin:0 0 10px">Not switched on yet — <b>${esc(INBOX_DOMAIN)}</b> is not receiving mail, so an address created now would quietly drop everything sent to it.</p>
      <p style="margin:0;font-size:11px">Nothing to do on your side. When it is on, this panel hands you an address and the Gmail filter to point at it, and replies start marking themselves.</p>`;
    return;
  }

  let token=null, mail=[];
  try{
    const { data, error }=await SB.from('profiles').select('inbox_token').eq('id',pid).single();
    if(error) throw new Error(error.message);
    token=data&&data.inbox_token||null;
    const r=await SB.from('inbound_mail').select('id,subject,from_addr,decision,applied_to,applied_stage,created_at')
      .eq('profile_id',pid).order('created_at',{ascending:false}).limit(12);
    if(!r.error) mail=r.data||[];

    body.innerHTML = !token

           <button class="btn-sm" id="riCopy">Copy</button></div>

         <label class="lab">Set it up in Gmail</label>

           <li>Settings → <b>Forwarding and POP/IMAP</b> → <b>Add a forwarding address</b> → paste the address above. Gmail mails a code or a confirmation link here; reopen this panel to get it.</li>
           <li>Settings → <b>Filters</b> → <b>Create a new filter</b>. Paste this into <i>Has the words</i>:<br>
             <textarea id="riFilter" readonly rows="4" style="font-family:var(--mono);font-size:11px;width:100%;margin-top:4px">${esc(GMAIL_FILTER)}</textarea>
             <button class="btn-sm" id="riFilterCopy" style="margin-top:4px">Copy filter</button></li>
           <li>Tick <b>Forward it to</b> and pick the address. That is the only filter you need, whatever you apply to next.</li>
         </ol>
         <p style="margin:0 0 12px;font-size:11px">The filter matches on words, so it will also forward some mail that is not about a job — a bank&rsquo;s &ldquo;your application&rdquo;, a newsletter about interviews. <b>That mail is discarded on arrival and never stored.</b> Only mail about a job in your list, or a reply, rejection or receipt you could place yourself, is kept. A short reply with none of those words, from a recruiter&rsquo;s own address, will not be forwarded — mark that one by hand.</p>
         <p style="margin:0 0 12px;font-size:11px">Only mail your filter sends is ever seen. A receipt (&ldquo;thank you for applying&rdquo;) marks the job applied if you had not — useful when you applied on the company&rsquo;s site — and only a message from a person moves a job to <b>In conversation</b>. Each mail shows up in its job&rsquo;s history.</p>
         ${rows.length?`<label class="lab">What it has concluded</label>
           <div style="margin-top:4px">${rows.map(m=>{
             const k=m.decision.kind||'?';

             return `<div class="contact-row" style="font-size:11px">

  async function setToken(t){
